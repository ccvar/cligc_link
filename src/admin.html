    <div class="dh"><div style="flex:1;min-width:0"><h2>A/B 分流</h2>
      <div class="hint">${esc(rule ? ruleText(rule) : link.targets.length ? '其他所有访问（默认地址）' : '所有访问')}按比例分到几个地址</div></div>
      <button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">
      <div class="abd-bar" id="abd-bar"></div>
      <div class="abd" id="abd"></div>
      <div class="abd-acts"><button type="button" class="btn sm" id="abd-add">${ic('plus', 14)}添加一个版本</button>
        <button type="button" class="btn sm ghost" id="abd-eq">平均分配</button><span class="hint">最多 5 个版本，比例填相对数值即可</span></div>
      <div class="tipbox" style="margin-top:18px">${ic('info', 16)}<div>
        <b>同一位访客总是去同一个版本</b>按访客 IP 分配，反复点击不会在几个页面之间来回跳。各版本的命中数在“跳转规则”里对比。
        ${link.utm ? '已开启转化追踪：跳转会带上 <code>utm_content=ab-a</code>、<code>ab-b</code>……，在 GA4 里按“会话手动广告内容”对比各版本的会话和关键事件。'
          : '在“编辑”里打开<b>转化追踪</b>后，跳转会带上 <code>utm_content=ab-a</code>、<code>ab-b</code>……，可以在 GA4 里对比各版本的转化。'}
      </div></div>
      <div class="err" role="alert"></div>
    </div>
    <div class="df">
      ${had ? '<button type="button" class="btn ghost danger-t" id="abd-off">取消分流</button>' : ''}<span class="sp"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary">${had ? '保存' : '开始分流'}</button>
    </div>`;
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && [...document.querySelectorAll('.drawer')].pop() === dr && !document.querySelector('.dialog')) close(); };
  document.addEventListener('keydown', onKey);
  // 有没保存的修改时，点遮罩不关（比例、地址都在 pw / arms 里）
  let abS0 = null;
  ov.onclick = () => { if (abS0 === null || JSON.stringify([pw, arms]) === abS0) return close(); unsavedNudge(dr); };
  dr._dismiss = close;
  dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
  document.body.append(ov, dr);

  const list = dr.querySelector('#abd'), bar = dr.querySelector('#abd-bar');
  const COLORS = ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--warn)', 'var(--rose)'];
  const drawBar = () => {
    const ws = [pw, ...arms.map((a) => Number(a.weight) || 0)], sum = ws.reduce((x, y) => x + y, 0) || 1;
    bar.innerHTML = ws.map((w, i) => `<i style="flex:${w || 0.001};background:${COLORS[i]}" data-tipf-always data-tipf="${ARM[i]} · ${Math.round((w / sum) * 100)}%"><b>${ARM[i]} ${Math.round((w / sum) * 100)}%</b></i>`).join('');
    list.querySelectorAll('[data-pct]').forEach((el) => (el.textContent = `${Math.round((ws[Number(el.dataset.pct)] / sum) * 100)}%`));
    dr.querySelector('#abd-add').disabled = arms.length >= 4;
  };
  const draw = () => {
    list.innerHTML = `
      <div class="abd-r"><span class="ab-k" style="--c:${COLORS[0]}">A</span>
        <div class="abd-u"><div class="abd-o" data-tipf="${esc(primary)}">${esc(primary)}</div><div class="hint">原地址${rule ? '（规则里设置）' : '（默认地址）'}</div></div>
        <label class="abd-w"><input class="input" type="number" min="1" max="100" value="${pw}" data-w="-1" aria-label="A 的比例"><span data-pct="0"></span></label><span class="abd-x"></span></div>
      ${arms.map((a, i) => `<div class="abd-r"><span class="ab-k" style="--c:${COLORS[i + 1]}">${ARM[i + 1]}</span>
        <div class="abd-u"><input class="input" placeholder="https://b.com/landing-${ARM[i + 1].toLowerCase()}" value="${esc(a.url)}" data-u="${i}" aria-label="${ARM[i + 1]} 的地址" required>
          <input class="input sm" placeholder="备注，如：新版落地页（可选）" value="${esc(a.note || '')}" data-n="${i}" aria-label="${ARM[i + 1]} 的备注"></div>
        <label class="abd-w"><input class="input" type="number" min="1" max="100" value="${a.weight}" data-w="${i}" aria-label="${ARM[i + 1]} 的比例"><span data-pct="${i + 1}"></span></label>
        <button type="button" class="btn ghost icon" data-rm="${i}" data-tip="删除这个版本" aria-label="删除 ${ARM[i + 1]}">${ic('trash')}</button></div>`).join('')}`;
    list.querySelectorAll('[data-w]').forEach((el) => (el.oninput = () => {
      const v = Math.max(0, Math.min(100, Number(el.value) || 0));
      if (el.dataset.w === '-1') pw = v; else arms[Number(el.dataset.w)].weight = v;
      drawBar();
    }));
    list.querySelectorAll('[data-u]').forEach((el) => (el.oninput = () => (arms[Number(el.dataset.u)].url = el.value)));
    list.querySelectorAll('[data-n]').forEach((el) => (el.oninput = () => (arms[Number(el.dataset.n)].note = el.value)));
    list.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { arms.splice(Number(b.dataset.rm), 1); if (!arms.length) arms.push({ url: '', weight: 50, note: '' }); draw(); }));
    drawBar();
  };
  dr.querySelector('#abd-add').onclick = () => { arms.push({ url: '', weight: Math.max(1, Math.round(100 / (arms.length + 2))), note: '' }); draw(); list.querySelector(`[data-u="${arms.length - 1}"]`).focus(); };
  dr.querySelector('#abd-eq').onclick = () => { pw = 50; arms.forEach((a) => (a.weight = 50)); draw(); };
  draw();
  abS0 = JSON.stringify([pw, arms]);
  setTimeout(() => list.querySelector('[data-u="0"]')?.focus(), 30);
  const save = async (body, msg) => {
    const btn = dr.querySelector('.df .primary'); btn.disabled = true;
    try { await api(`/links/${link.id}/split`, { method: 'PUT', body }); close(); toast(msg); route(); }
    catch (ex) { dr.querySelector('.err').textContent = ex.message; btn.disabled = false; }
  };
  const off = dr.querySelector('#abd-off');
  if (off) off.onclick = async () => {
    const ok = await confirmDialog({ title: '取消 A/B 分流？', text: '之后所有访问都去原地址（A）。各版本已有的访问记录会保留，可以在“修改记录”里撤销。', ok: '取消分流', danger: true });
    if (ok) save({ parent, weight: 0, arms: [] }, '已取消分流');
  };
  dr.onsubmit = (e) => {
    e.preventDefault();
    const body = { parent, weight: pw, arms: arms.map((a) => ({ ...a, url: withScheme(a.url) })) };
    if (body.arms.some((a) => httpTypo(a.url))) { dr.querySelector('.err').textContent = '有地址的 http / https 好像拼错了，请检查一下'; return; }
    if ([pw, ...arms.map((a) => a.weight)].some((w) => !(w >= 1 && w <= 100))) { dr.querySelector('.err').textContent = '每个版本的比例都要在 1–100 之间'; return; }
    save(body, had ? '分流已保存' : '已开始 A/B 分流');
  };
}

// ---------------------------------------------------------------- 站点（GA4 + Search Console）
// 站点列表最近一次显示的站点（按当时的筛选和排序），详情页的站点切换按这个顺序列出
let siteNav = null;
const gState = { days: store.get('g:days', 28), q: '', sort: store.get('g:sort', 'sessions'), dir: store.get('g:dir', ''), acct: '', link: '', tag: '', adv: false, se: store.get('g:se', 'google') };
// 站点表格默认从小到大排的列（域名按字母、排名越小越好），其余默认从大到小
const SORT_ASC = new Set(['host', 'pos']);
// 站点列表搜索列的数据来源：google / bing / all（合计）；Bing 没有按天的平均排名，合计时排名只看 Google
const SE_NAME = { google: 'Google', bing: 'Bing', all: '合计' };
function SE(x, k = 'cur') {
  const g = x[k]?.gsc, b = x[k]?.bing;
  if (gState.se === 'bing') return b ? { ...b, position: null } : null;
  if (gState.se === 'all') {
    if (!g && !b) return null;
    const c = (g?.clicks || 0) + (b?.clicks || 0), i = (g?.impressions || 0) + (b?.impressions || 0);
    return { clicks: c, impressions: i, ctr: i ? c / i : 0, position: g?.impressions ? g.position : null };
  }
  return g;
}
// 搜索数据来源切换：放在标题“站点 / 账号”后面
const seSeg = () => `<div class="seg g-se" id="g-se" data-tipf-always data-tipf="搜索点击、展示、点击率、排名和收录几列的数据来源">${Object.entries(SE_NAME).map(([k, l]) => `<button data-e="${k}" class="${k === gState.se ? 'on' : ''}">${l}</button>`).join('')}</div>`;
// 站点表格搜索几列的表头：前面带上数据来源的图标（跟着顶部 Google / Bing / 合计切换），鼠标移上去说明
// 排名：Bing 没有整站的平均排名，合计时只看 Google，Bing 时显示“—”
function seTh(label, rank = false) {
  const g = BRAND.gsc(12), b = BRAND.bing(12), se = gState.se;
  const [icons, tip] = rank
    ? (se === 'bing' ? [b, 'Bing 没有整站的平均排名'] : [g, se === 'all' ? '只看 Google：Bing 没有整站的平均排名' : '来自 Google Search Console（按展示加权的平均排名）'])
    : (se === 'bing' ? [b, '来自 Bing Webmaster'] : se === 'all' ? [g + b, 'Google Search Console 和 Bing Webmaster 相加'] : [g, '来自 Google Search Console']);
  return `<span class="se-th" data-tipf-always data-tipf="${esc(tip)}"><i class="se-i">${icons}</i><span class="sl">${label}${SORT_IC}</span></span>`;
}
// 表头的排序箭头：平时隐藏，鼠标移上去淡淡显示，当前排序列用主题色（倒序朝下、正序朝上）
// 排序箭头（类名别用 .sk：那是加载占位的骨架块）
const SORT_IC = '<svg class="sort-i" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1.5v7M2.2 5.8 5 8.6l2.8-2.8"/></svg>';
// 其他数据表（搜索词、页面、GA4 各标签、短链列表等）：点表头就在页面上按这一列排序，再点反过来。
// 只给第一列（名称）和右对齐的数字列加；数字取单元格的 data-v，没有就取第一行文字里的数；“—”等没数的永远排最后
{
  const NUM = (td) => {
    if (td.dataset.v !== undefined) return td.dataset.v === '' ? null : Number(td.dataset.v);
    const m = /-?\d[\d,]*(\.\d+)?/.exec((td.innerText || td.textContent || '').split('\n')[0]);
    return m ? Number(m[0].replace(/,/g, '')) : null;
  };
  const enhance = (t) => {
    if (t._sortable || t.matches('.gl, .vt, .ix-t, .ix-sm, .nosort') || !t.tHead || !t.tBodies[0] || t.tBodies[0].rows.length < 2) return;
    t._sortable = true;
    [...t.tHead.rows[0].cells].forEach((th, i) => {
      if (i && !th.classList.contains('r')) return;
      th.classList.add('sortable'); th.tabIndex = 0; th.dataset.col = i;
      if (!th.querySelector('.sort-i')) th.insertAdjacentHTML('beforeend', SORT_IC);
    });
  };
  const sortBy = (th) => {
    const t = th.closest('table'), i = Number(th.dataset.col), body = t.tBodies[0];
    const asc = th.getAttribute('aria-sort') === 'descending' || (!th.hasAttribute('aria-sort') && i === 0);
    t.tHead.querySelectorAll('th[aria-sort]').forEach((x) => x.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
    // 只排普通数据行（合计行、展开行等带 data-fixed 的不动）
    const rows = [...body.rows].filter((r) => !r.hasAttribute('data-fixed') && r.cells.length > i);
    const val = (r) => (i === 0 ? (r.cells[0].innerText || '').trim() : NUM(r.cells[i]));
    rows.sort((a, b) => {
      const va = val(a), vb = val(b);
      if (va == null || va === '' || vb == null || vb === '') return (va == null || va === '') ? ((vb == null || vb === '') ? 0 : 1) : -1;
      return (asc ? 1 : -1) * (i === 0 ? String(va).localeCompare(String(vb), 'zh-Hans-CN', { numeric: true }) : va - vb);
    });
    body.append(...rows);
  };
  document.addEventListener('click', (e) => { const th = e.target.closest('table.tbl th.sortable[data-col]'); if (th && !e.target.closest('a, button')) sortBy(th); });
  document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('table.tbl th.sortable[data-col]')) { e.preventDefault(); sortBy(e.target); } });
  new MutationObserver((muts) => {
    for (const m of muts) for (const n of m.addedNodes) {
      if (n.nodeType !== 1) continue;
      if (n.matches('table.tbl.gt')) enhance(n); else n.querySelectorAll?.('table.tbl.gt').forEach(enhance);
    }
  }).observe(document.getElementById('app'), { childList: true, subtree: true });
}
// “合计”时，鼠标移到搜索几列的数字上，分别显示 Google 和 Bing 的数（其他模式不加提示）
function seSplit(x, metric) {
  if (gState.se !== 'all') return '';
  const g = x.cur?.gsc, b = x.cur?.bing;
  const val = (d, isBing) => {
    if (!d) return '没有关联';
    if (metric === 'clicks') return num(d.clicks || 0);
    if (metric === 'impressions') return num(d.impressions || 0);
    if (metric === 'ctr') return d.impressions ? pct1((d.clicks || 0) / d.impressions) : '—';
    return isBing ? '没有整站的平均排名' : d.position != null && d.impressions ? d.position.toFixed(1) : '—';
  };
  return ` data-tipf-always data-tipf="${esc(`Google ${val(g, false)}\nBing ${val(b, true)}`)}"`;
}
// 汇总卡片下面一行前的来源图标（Google 时也显示，和用户、会话卡片的 GA4 图标一致）
const seIcons = () => (gState.se === 'bing' ? `<span class="se-ic" data-tipf-always data-tipf="来自 Bing Webmaster">${BRAND.bing(12)}</span>`
  : gState.se === 'all' ? `<span class="se-ic" data-tipf-always data-tipf="Google Search Console 和 Bing Webmaster 相加">${BRAND.gsc(12)}${BRAND.bing(12)}</span>`
  : `<span class="se-ic" data-tipf-always data-tipf="来自 Google Search Console">${BRAND.gsc(12)}</span>`);
const seDay = (p) => (gState.se === 'bing' ? [p.bc || 0, p.bi || 0] : gState.se === 'all' ? [(p.c || 0) + (p.bc || 0), (p.i || 0) + (p.bi || 0)] : [p.c || 0, p.i || 0]);
const pctD = (a, b) => (b ? (a - b) / b : null);
const gDelta = (a, b, inverse = false) => {
  const d = pctD(a, b);
  if (d === null || !isFinite(d)) return '';
  const up = d >= 0, good = inverse ? !up : up;
  return `<span class="gd ${Math.abs(d) < 0.005 ? '' : good ? 'up' : 'down'}">${up ? '↑' : '↓'}${Math.abs(d * 100) >= 100 ? Math.round(Math.abs(d * 100)) : Math.abs(d * 100).toFixed(1)}%</span>`;
};
const pct1 = (x) => `${(x * 100).toFixed(1)}%`;
// 各排名的大致点击率（和服务端 AI 报告用的一致），用来判断“点击率偏低”
const G_CTR = [0, 0.28, 0.15, 0.1, 0.07, 0.05, 0.04, 0.03, 0.025, 0.02, 0.018];
const gExpCtr = (pos) => (pos < 1 ? 0.28 : pos <= 10 ? G_CTR[Math.round(pos)] : pos <= 20 ? 0.01 : 0.003);

// GA4 媒体资源名和域名一样（忽略大小写、协议、www. 和结尾的 /）时不重复显示
const sameName = (name, host) => { const n = (v) => String(v || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, ''); return n(name) === n(host); };

// GA4 默认渠道分组的中文名（英文界面用 GA4 原名）
const GA_CH = { 'AI Assistant': 'AI 助手', 'Organic Search': '自然搜索', Direct: '直接访问', Referral: '引荐', 'Organic Social': '社交媒体', 'Paid Search': '付费搜索', Email: '邮件',
  Unassigned: '未归类', 'Organic Video': '视频', Display: '展示广告', 'Paid Social': '付费社交', Affiliates: '联盟推广', 'Cross-network': '跨网络广告',
  'Organic Shopping': '购物', 'Paid Shopping': '付费购物', 'Paid Video': '付费视频', 'Paid Other': '其他付费', SMS: '短信', Audio: '音频', 'Mobile Push Notifications': '推送通知' };
const gaChannel = (k) => (EN ? k : GA_CH[k] || k);

// 站点列表汇总里的“流量渠道”：当前筛选的站点按 GA4 渠道分组相加的会话占比
function chCard(rows) {
  const m = new Map();
  for (const x of rows) for (const [k, n] of Object.entries(x.cur.ga?.channels || {})) m.set(k, (m.get(k) || 0) + n);
  const items = [...m].map(([k, n]) => ({ k, n })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const sum = items.reduce((a, x) => a + x.n, 0);
  // 升级后渠道数据要由定时任务逐个站点补（每小时约 10 个），没补到时先说明进度
  const pending = rows.filter((x) => x.ga4 && !x.chReady).length;
  if (!sum) return pending ? `<div class="kc kc-ch"><div class="kc-h"><span class="l">流量渠道</span></div>
    <div class="kc-v"><b class="sm">同步中</b></div><div class="kc-d" data-tipf-always data-tipf="定时任务每小时补约 10 个站点；也可以点右上角的刷新按钮立即同步">还剩 ${pending} 个站点 · 约 ${Math.ceil(pending / 10)} 小时</div></div>` : '';
  const COL = ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--amber)', 'var(--faint)'];
  const top = items.length > 4 ? [...items.slice(0, 3), { k: '其他', n: sum - items.slice(0, 3).reduce((a, x) => a + x.n, 0), other: true }] : items;
  const r = 22, C = 2 * Math.PI * r;
  let off = 0;
  const segs = top.map((it, i) => { const len = (it.n / sum) * C; const c = `<circle cx="28" cy="28" r="${r}" stroke="${COL[i]}" stroke-dasharray="${Math.max(0, len - (top.length > 1 ? 1.5 : 0))} ${C}" stroke-dashoffset="${-off}"/>`; off += len; return c; }).join('');
  const name = (it) => (it.other ? '其他' : gaChannel(it.k));
  const missing = pending;
  const tip = items.map((it) => `${gaChannel(it.k)} ${pctText(it.n / sum)} · ${num(it.n)} 次会话`).join('\n') + (missing ? `\n\n还有 ${missing} 个站点的渠道数据在同步中` : '');
  return `<div class="kc kc-ch"><div class="kc-h"><span class="l" data-tipf-always data-tipf="${esc(tip)}">流量渠道</span></div>
    <div class="chm"><svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" stroke="var(--sunken)"/>${segs}</svg>
      <div class="chm-l">${top.map((it, i) => `<span><i style="background:${COL[i]}"></i><em>${esc(name(it))}</em><b>${pctText(it.n / sum)}</b></span>`).join('')}</div></div></div>`;
}

// 站点详情 · 搜索词：全部 / 排名 4–20 / 点击率偏低 / 下滑 / 新出现（筛选规则和 AI 报告一致）
const QF = [['all', '全部'], ['near', '排名 4–20'], ['low', '点击率偏低'], ['down', '下滑'], ['new', '新出现']];
const QF_HINT = {
  near: '排名 4–20、展示较多的词：优化标题和内容后，最容易进入前三',
  low: '点击率不到该排名常见水平一半的词：多半是标题或描述不够吸引人',
  down: '点击比上一周期少 3 次以上的词（包括这期跌出前 250 的）',
  new: '上一周期不在前 250、这期展示 20 次以上的词',
};
function queryLists(sc) {
  const qs = sc?.queries || [];
  return {
    all: [...qs].sort((a, b) => b.clicks - a.clicks || b.impressions - a.impressions).slice(0, 25),
    near: qs.filter((x) => x.position >= 4 && x.position <= 20 && x.impressions >= 10).sort((a, b) => b.impressions - a.impressions).slice(0, 25),
    low: qs.filter((x) => x.impressions >= 30 && x.ctr < gExpCtr(x.position) * 0.5)
      .map((x) => ({ ...x, lost: Math.round(x.impressions * (gExpCtr(x.position) - x.ctr)) })).sort((a, b) => b.lost - a.lost).slice(0, 25),
    down: (sc?.declining || []).slice(0, 25),
    new: sc?.hasPrev ? qs.filter((x) => x.prevPosition == null && x.impressions >= 20).slice(0, 25) : [],
  };
}
// 排名和上一周期比：数字变小是上升
function rankChange(x, hasPrev) {
  if (!hasPrev) return '';
  // 上期前 250 里没有、本期展示又不多的词，不一定是新词，不标
  if (x.prevPosition == null) return x.impressions >= 20 ? '<span class="qn" data-tipf-always data-tipf="上一周期不在前 250">新</span>' : '';
  const d = x.prevPosition - x.position;
  if (Math.abs(d) < 0.1) return '';
  return `<span class="gd ${d > 0 ? 'up' : 'down'}" data-tipf-always data-tipf="${esc(`上一周期排名 ${x.prevPosition.toFixed(1)}`)}">${d > 0 ? '↑' : '↓'}${Math.abs(d).toFixed(1)}</span>`;
}
function queryView(sc, f) {
  const lists = queryLists(sc);
  if (!sc?.hasPrev && (f === 'down' || f === 'new')) f = 'all';
  const rows = lists[f];
  const kc = (k) => `<div class="ell" data-tipf="${esc(k)}">${esc(k)}</div>`;
  const chips = `<div class="qf">${QF.map(([k, l]) => {
    const off = !sc?.hasPrev && (k === 'down' || k === 'new');
    return `<button type="button" class="${k === f ? 'on' : ''}" data-qf="${k}" ${off ? 'disabled data-tipf-always data-tipf="时间范围太长，没有上一周期可比"' : ''}>${l}${k !== 'all' ? `<small>${lists[k].length}</small>` : ''}</button>`;
  }).join('')}</div>${QF_HINT[f] ? `<div class="hint qf-h">${QF_HINT[f]}</div>` : ''}`;
  if (!rows.length) return `${chips}<div class="empty">${ic('inbox')}${f === 'all' ? '该时间段内暂无数据' : '没有符合条件的搜索词'}</div>`;
  const hp = sc.hasPrev;
  let head, row;
  if (f === 'low') {
    head = ['搜索词', '展示', '点击率', '常见', '少拿的点击'];
    row = (x) => [kc(x.k), num(x.impressions), pct1(x.ctr), `<span class="sm">${pct1(gExpCtr(x.position))}</span>`, `<b data-tipf-always data-tipf="按该排名常见点击率估算">${num(x.lost)}</b>`];
  } else if (f === 'down') {
    head = ['搜索词', '点击', '排名'];
    row = (x) => [kc(x.k), `<span class="sm">${num(x.prevClicks)} →</span> ${num(x.clicks)} <span class="gd down">${num(x.clicks - x.prevClicks)}</span>`,
      x.gone ? '<span class="sm">跌出前 250</span>' : `<span class="sm">${x.prevPosition.toFixed(1)} →</span> ${x.position.toFixed(1)}`];
  } else {
    head = ['搜索词', '点击', '展示', '点击率', '排名'];
    row = (x) => [kc(x.k), num(x.clicks), num(x.impressions), pct1(x.ctr), `${x.position.toFixed(1)}${rankChange(x, hp)}`];
  }
  return `${chips}<div class="g-scr"><table class="tbl gt qt${head.length === 3 ? ' q3' : ''}"><thead><tr>${head.map((h, i) => `<th class="${i ? 'r' : ''}">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((x) => `<tr>${row(x).map((c, i) => `<td class="${i ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

// 一批一批同步，直到同步完；stopped() 返回 true 时在当前这批完成后停下
async function googleSyncAll(onProgress, stopped) {
  const before = Date.now();
  let first = true, r;
  do {
    r = await api('/google/sync', { method: 'POST', body: { before, discover: first } });
    first = false;
    onProgress && onProgress(r);
  } while (r.left > 0 && r.done > 0 && !(stopped && stopped()));
  return r;
}

// 按短链筛选：只看某个短链跳转到的站点（默认地址和各条地区规则的域名）
function googleLinkFilter(root, items, onFilter) {
  const by = new Map();
  // 站点上放了这个短链（来源）或短链跳转到这个站点（去向）都算
  for (const x of items) {
    const seen = new Set();
    for (const l of [...x.linksFrom, ...x.links]) {
      if (!by.has(String(l.id))) by.set(String(l.id), { id: l.id, slug: l.slug, title: l.title, sites: 0, total: 0 });
      const e = by.get(String(l.id));
      if (!seen.has(l.id)) { e.sites++; seen.add(l.id); }
    }
    for (const l of x.linksFrom) by.get(String(l.id)).total += l.human;
  }
  const ids = [...by.keys()].sort((a, b) => by.get(b).total - by.get(a).total);
  if (gState.link && gState.link !== 'any' && !by.has(gState.link)) { gState.link = ''; onFilter(); }
  const anyN = items.filter((x) => x.linksFrom.length + x.links.length).length;
  dropdown(root, {
    value: gState.link, aria: '按短链筛选', search: ids.length > 8 ? '搜索短链或标题' : '', empty: '没有匹配的短链', minWidth: 260, maxWidth: 340,
    groups: (q) => {
      const hit = ids.filter((v) => !q || by.get(v).slug.toLowerCase().includes(q) || (by.get(v).title || '').toLowerCase().includes(q));
      return q ? [['', hit]] : [['', ['', 'any']], ...(ids.length ? [[`短链 · 按${G_LABEL()}从站点点出的真人点击`, hit]] : [])];
    },
    button: (v) => `${ic('link', 14)}<span class="nm">${!v ? '全部短链' : v === 'any' ? '有短链的站点' : '/' + esc(by.get(v)?.slug || '')}</span>`,
    option: (v, q) => !v ? '<span class="ot">全部站点<small>不按短链筛选</small></span>'
      : v === 'any' ? `<span class="ot">有短链的站点<small>${anyN} 个</small></span>`
      : `<span class="ot"><span class="mono">/${hl(by.get(v).slug, q)}</span>${by.get(v).title ? `<small>${hl(by.get(v).title, q)}</small>` : ''}</span><span class="hint">${by.get(v).sites} 个站点 · ${num(by.get(v).total)}</span>`,
    onChange: (v) => { gState.link = v; onFilter(); },
  });
}

          <input class="input ai-label" id="ai-label" maxlength="100" placeholder="备注（可选），如：10 月 SEO 复盘" autocomplete="off" aria-label="备注">
        </div>
      </div>
      <div class="err" role="alert"></div>
      <div class="row"><button type="button" class="btn" data-no>取消</button><button type="button" class="btn primary" data-ok>${ic('link', 15)}生成链接</button></div>`;

    d.querySelectorAll('.ai-site input').forEach((c) => (c.onchange = () => {
      if (c.checked && sel.size >= MAX) { c.checked = false; toast(`一个链接最多包含 ${MAX} 个站点`, 'bad'); return; }
      c.checked ? sel.add(c.value) : sel.delete(c.value); count();
    }));
    // 有选中的就清空（搜索时只清空搜索结果里的），一个都没选就全选（最多 30 个）
    d.querySelector('[data-all]').onclick = () => {
      const any = list.some((x) => sel.has(x.host));
      for (const x of list) { if (any) sel.delete(x.host); else if (sel.size < MAX) sel.add(x.host); }
      form();
    };
    const qi = d.querySelector('.ai-q input');
    if (qi) qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; form(); const n = d.querySelector('.ai-q input'); n.focus(); n.setSelectionRange(pos, pos); };
    for (const [id, key] of [['ai-days', 'days'], ['ai-exp', 'exp']]) {
      const seg = d.querySelector('#' + id);
      segThumb(seg);
      seg.querySelectorAll('button').forEach((b) => (b.onclick = () => {

    d.querySelectorAll('[data-sec]').forEach((c) => (c.onchange = () => { c.checked ? opt.sections.add(c.dataset.sec) : opt.sections.delete(c.dataset.sec); }));

    const li = d.querySelector('#ai-label');

    d.querySelector('[data-ok]').onclick = async (e) => {

      if (!opt.sections.size) { err.textContent = '请至少选择一项内容'; return; }
      btn.disabled = true; err.textContent = '';
      try {
        const s = await api('/shares', { method: 'POST', body: { hosts: [...sel], days: opt.days, sections: [...opt.sections], expires: opt.exp, hide: opt.hide, label: opt.label.trim() } });
        done(s);
      } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
    };
  };

  // 生成后：链接 + 复制提示词 / 下载 / 预览
  const done = (s) => {
    d.innerHTML = `<h3>${ic('check', 18)}链接已生成</h3>
      <p>${esc(shareName(s))} · ${SHARE_RANGES.find(([v]) => v === s.days)?.[1]} · ${shareExpText(s)}。拿到链接的人都能查看这份报告，可随时在 设置 → AI 分析链接 撤销。</p>
      <div class="ai-url"><input class="input mono" readonly value="${esc(s.url)}" aria-label="分析链接">${copyBtn(s.url, 'btn icon', '')}</div>
      <div class="ai-acts">
        <button type="button" class="btn primary" data-prompt>${ic('copy', 15)}复制给 AI 的提示词</button>
        <a class="btn" href="${esc(s.url)}?download=1">${ic('dl', 15)}下载 Markdown</a>
        <a class="btn ghost" href="${esc(s.url)}" target="_blank" rel="noopener">${ic('ext', 15)}预览</a></div>
      <div class="ai-warm" id="ai-warm">${ic('refresh', 14)}<span>正在生成报告，完成后 AI 打开链接会更快…</span></div>
      <div class="tipbox sm" style="margin-top:14px">${ic('info', 15)}<div>提示词里已经带上链接，粘贴给 AI 即可。有些 AI 不能打开链接（如免费版或没有联网功能时），可以下载 Markdown 文件后上传给它。</div></div>
      <div class="row"><button type="button" class="btn" data-no>完成</button></div>`;
    d.querySelector('[data-no]').onclick = close;
    d.querySelector('[data-prompt]').onclick = (e) => copy(sharePrompt(s), '提示词已复制', e.currentTarget);
    d.querySelector('.ai-url input').onclick = (e) => e.target.select();
    const w = d.querySelector('#ai-warm');
    api(`/shares/${s.token}/warm`, { method: 'POST' })
      .then(() => { w.classList.add('ok'); w.innerHTML = `${ic('check', 14)}<span>报告已生成，可以发给 AI 了</span>`; })
      .catch(() => { w.classList.add('bad'); w.innerHTML = `${ic('alert', 14)}<span>报告生成失败，AI 打开链接时会重新生成</span>`; });
  };

  form();
  document.body.append(ov, d);
}

// 分析链接包含的站点：最多列 3 个，其余折叠成 +N（鼠标停留看全部）
function shareHosts(s) {
  const hs = s.hosts || [];
  if (!s.label && hs.length === 1) return '';
  const MAX = 3, shown = hs.slice(0, MAX), rest = hs.length - shown.length;
  return `<span class="ai-hs">${shown.map((h) => `<i class="mono">${esc(h)}</i>`).join('')}${rest > 0
    ? `<i class="more" data-tipf-always data-tipf="${esc(`共 ${hs.length} 个站点：\n${hs.join('\n')}`)}">+${rest}</i>` : ''}</span>`;
}
// ---------------------------------------------------------------- GA4 管理：新建站点统计、统计代码、事件（接口见 src/ga4admin.js）
// 表单里的下拉（替代原生 select，和后台其他下拉一致）。list：[{ v, l, g?（分组标题）, h?（右侧灰字） }]；返回的对象 .value 是当前值
function selectDd(root, list, value, { aria = '', search = '', onChange } = {}) {
  root.classList.add('combo', 'f-dd');
  const by = new Map(list.map((x) => [x.v, x]));
  return dropdown(root, {
    value: by.has(value) ? value : list[0]?.v, aria, search, onChange, minWidth: 200, maxWidth: 420,
    groups: (q) => {
      const hit = list.filter((x) => !q || `${x.l} ${x.v} ${x.h || ''}`.toLowerCase().includes(q));
      const gs = [];
      for (const x of hit) { const g = gs.find((y) => y[0] === (x.g || '')); g ? g[1].push(x.v) : gs.push([x.g || '', [x.v]]); }
      return gs.map(([t, vs]) => [t ? esc(t) : '', vs]);
    },
    button: (v) => `<span class="nm">${esc(by.get(v)?.l ?? '')}</span>`,
    option: (v, q) => `<span class="ell">${hl(by.get(v)?.l ?? '', q)}</span>${by.get(v)?.h ? `<small class="oi-h">${esc(by.get(v).h)}</small>` : ''}`,
  });
}

// 简单的对话框：返回对话框元素和关闭函数
function gaDlg(cls = '') {
  const ov = document.createElement('div'); ov.className = 'ov';
  const d = document.createElement('div'); d.className = `dialog ga-d ${cls}`; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  const close = () => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); removeEventListener('hashchange', close); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  ov.onclick = close;
  document.addEventListener('keydown', onKey);
  addEventListener('hashchange', close);
  document.body.append(ov, d);
  return { d, close };
}

// 小下拉菜单（样式和账号菜单一样）：items = [{ icon, label, run }]
function popMenu(btn, items) {
  const open = document.querySelector('.menu');
  if (open) { open.remove(); if (open._btn === btn) { btn.setAttribute('aria-expanded', 'false'); return; } }
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu'); m._btn = btn;
  m.innerHTML = items.map((x, i) => `<button role="menuitem" data-i="${i}">${ic(x.icon, 16)}${x.label}</button>`).join('');
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), w = m.offsetWidth;
  m.style.top = `${r.bottom + 6}px`; m.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
  btn.setAttribute('aria-expanded', 'true');
  m.querySelector('button').focus();
  const close = () => { m.remove(); btn.setAttribute('aria-expanded', 'false'); document.removeEventListener('mousedown', onDoc, true); document.removeEventListener('keydown', onKey); removeEventListener('scroll', close, true); };
  const onDoc = (e) => { if (!m.contains(e.target) && !btn.contains(e.target)) close(); };
  const onKey = (e) => { if (e.key === 'Escape') { close(); btn.focus(); } };
  document.addEventListener('mousedown', onDoc, true);
  document.addEventListener('keydown', onKey);
  addEventListener('scroll', close, true);
  m.onclick = (e) => { const b = e.target.closest('[data-i]'); if (!b) return; close(); items[Number(b.dataset.i)].run(); };
}

// 站点列表“热门搜索词”：当前筛选的站点在 Google / Bing 上的搜索词合在一起，按热度（展示次数）排序
async function hotQueriesDialog(hosts) {
  const { d, close } = gaDlg('hq-d');
  const days = gState.days;
  d.innerHTML = `<div id="hq"><div class="dlg-h"><h3>${ic('flame', 18)}热门搜索词</h3><span class="sp"></span><button type="button" class="btn ghost icon" id="hq-csv" data-tipf-always data-tipf="导出当前列表（按当前筛选和排序）" aria-label="导出" aria-haspopup="menu" aria-expanded="false" disabled>${ic('dl', 17)}</button><button type="button" class="btn ghost icon" data-x aria-label="关闭">${ic('x', 18)}</button></div>
    <div class="hint hq-sub">${hosts.length} 个站点 · 最近 ${days} 天 · 热度 = 搜索结果里的展示次数，同一个词在各站点的数据加在一起</div>
    <div class="hq-b">${skel(260)}</div></div>`;
  d.querySelector('[data-x]').onclick = close;
  const body = d.querySelector('.hq-b');
  let r, sort = 'all', kw = '';
  const load = async () => {
    try { r = await api(`/google/queries?days=${days}`, { method: 'POST', body: { hosts } }); }
    catch (e) {
      if (!document.body.contains(d)) return;
      body.innerHTML = `<div class="empty">${ic('alert')}${esc(e.message)}<button type="button" class="btn sm" id="hq-retry" style="margin-top:10px">重试</button></div>`;
      body.querySelector('#hq-retry').onclick = () => { body.innerHTML = skel(260); load(); };
      return;
    }
    if (document.body.contains(d)) draw();
  };
  const heat = (x) => (x.g?.i || 0) + (x.b?.i || 0);
  const SORT = { all: heat, g: (x) => x.g?.i || 0, b: (x) => x.b?.i || 0, c: (x) => (x.g?.c || 0) + (x.b?.c || 0) };
  // 选了 Google / Bing 时只列这个搜索引擎有数据的词（否则没数据的会排在最后，看着像多出来的）
  const shownRows = () => { const k = kw.trim().toLowerCase(); return r.items.filter((x) => (!k || x.q.toLowerCase().includes(k)) && (sort === 'g' || sort === 'b' ? x[sort] : true)).sort((a, b) => SORT[sort](b) - SORT[sort](a) || heat(b) - heat(a)); };
  // 导出：当前筛选和排序下的搜索词（最多 500 个）。可以导出带数据的列表（CSV），也可以只要搜索词（一行一个）
  const save = (text, name, type) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const csvBtn = d.querySelector('#hq-csv');
  // 导出面板：范围就是弹窗里的筛选和排序，这里只选数量（前 100 / 前 200 / 全部），再选格式
  let xTop = 0;
  const exportRows = () => (xTop ? shownRows().slice(0, xTop) : shownRows());
  const exportTxt = (rows) => {
    save(rows.map((x) => x.q).join('\n') + '\n', `search-queries-${r.from}_${r.to}.txt`, 'text/plain;charset=utf-8');
    toast(`已导出 ${rows.length} 个搜索词`);
  };
  csvBtn.onclick = () => {
    const open = document.querySelector('.hq-x');
    if (open) { open._close(); return; }
    const m = document.createElement('div');
    m.className = 'menu hq-x'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-label', '导出');
    const chip = (k, v, l, on) => `<button type="button" class="${on ? 'on' : ''}" data-${k}="${v}">${l}</button>`;
    const paint = () => {
      const all = shownRows(), n = exportRows().length;
      m.innerHTML = `<div class="hq-xl">数量</div><div class="qf">${[100, 200].filter((v) => v < all.length).map((v) => chip('xt', v, `前 ${v} 个`, xTop === v)).join('')}${chip('xt', 0, `全部 ${num(all.length)} 个`, !xTop || xTop >= all.length)}</div>
        <div class="hq-xn">按弹窗里的筛选和排序，导出 <b>${num(n)}</b> 个搜索词</div>
        <hr><button role="menuitem" data-xf="csv" ${n ? '' : 'disabled'}>${ic('dl', 16)}导出列表数据（CSV）</button>
        <button role="menuitem" data-xf="txt" ${n ? '' : 'disabled'}>${ic('dl', 16)}只导出搜索词（TXT）</button>
        <button role="menuitem" data-xf="copy" ${n ? '' : 'disabled'}>${ic('copy', 16)}复制搜索词</button>`;
    };
    paint();
    document.body.appendChild(m);
    const place = () => { const rc = csvBtn.getBoundingClientRect(); m.style.top = `${rc.bottom + 6}px`; m.style.left = `${Math.max(8, Math.min(rc.right - m.offsetWidth, innerWidth - m.offsetWidth - 8))}px`; };
    place();
    csvBtn.setAttribute('aria-expanded', 'true');
    const close = m._close = () => { m.remove(); csvBtn.setAttribute('aria-expanded', 'false'); document.removeEventListener('mousedown', onDoc, true); document.removeEventListener('keydown', onKey, true); removeEventListener('hashchange', close); };
    const onDoc = (e) => { if (!m.contains(e.target) && !csvBtn.contains(e.target)) close(); };
    // Esc 只关面板，不关弹窗
    const onKey = (e) => { if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); csvBtn.focus(); } };
    document.addEventListener('mousedown', onDoc, true);
    document.addEventListener('keydown', onKey, true);
    addEventListener('hashchange', close);
    m.onclick = (e) => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      if (b.dataset.xt != null) { xTop = Number(b.dataset.xt); paint(); place(); return; }
      const rows = exportRows();
      close();
      if (b.dataset.xf === 'csv') exportCsv(rows);
      else if (b.dataset.xf === 'txt') exportTxt(rows);
      else copy(rows.map((x) => x.q).join('\n'), `已复制 ${rows.length} 个搜索词`);
    };
  };
  const exportCsv = (rows) => {
    const cell = (v) => { const t = v == null ? '' : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
    const r2 = (v) => Math.round(v * 100) / 100;
    const eng = (e) => (e ? [e.i, e.c, e.i ? r2((e.c / e.i) * 100) + '%' : '', e.p ?? ''] : ['', '', '', '']);
    const head = ['搜索词', '热度合计（展示）', 'Google 展示', 'Google 点击', 'Google 点击率', 'Google 平均排名', 'Bing 展示', 'Bing 点击', 'Bing 点击率', 'Bing 平均排名', '站点数', '站点'].map(T);
    const lines = [head.map(cell).join(','), ...rows.map((x) => [x.q, heat(x), ...eng(x.g), ...eng(x.b), x.n, x.hosts.map(([h]) => h).join(' / ') + (x.n > x.hosts.length ? ' …' : '')].map(cell).join(','))];
    save('\ufeff' + lines.join('\n'), `search-queries-${r.from}_${r.to}.csv`, 'text/csv;charset=utf-8');
    toast(`已导出 ${rows.length} 个搜索词`);
  };
  const draw = () => {
    const hasG = r.g.sites > 0, hasB = r.b.sites > 0;
    const rows = shownRows();
    csvBtn.disabled = !rows.length;
    const maxG = Math.max(1, ...r.items.map((x) => x.g?.i || 0)), maxB = Math.max(1, ...r.items.map((x) => x.b?.i || 0));
    const cell = (e, max, src) => (e ? `<td class="hq-c"><div class="hq-h ${src}" data-tipf-always data-tipf="${esc(`展示 ${num(e.i)} 次 · 点击 ${num(e.c)} 次 · 点击率 ${pct1(e.i ? e.c / e.i : 0)}${e.p ? ` · 平均排名 ${e.p.toFixed(1)}` : ''}`)}">
        <b>${num(e.i)}</b><i style="--w:${Math.max(3, Math.round(Math.sqrt(e.i / max) * 100))}%"></i><small>${e.c ? `点击 ${num(e.c)}` : '没有点击'}${e.p ? ` · 排名 ${e.p.toFixed(1)}` : ''}</small></div></td>`
      : '<td class="hq-c"><span class="hq-no">—</span></td>');
    const siteTip = (x) => x.hosts.map(([h, g, b]) => `${h}${EN ? ': ' : '：'}${[hasG && g ? `Google ${num(g)}` : '', hasB && b ? `Bing ${num(b)}` : ''].filter(Boolean).join(' · ')}`).join('\n') + (x.n > x.hosts.length ? `\n…还有 ${x.n - x.hosts.length} 个站点` : '');
    const row = (x) => `<tr><td><div class="hq-q"><span class="ell" translate="no" data-tipf="${esc(x.q)}">${esc(x.q)}</span>
        <a class="hq-s" href="#/site/${encodeURIComponent(x.hosts[0][0])}" data-tipf-always data-tipf="${esc(siteTip(x))}">${esc(x.hosts[0][0])}${x.n > 1 ? ` <em>+${x.n - 1}</em>` : ''}</a></div></td>
      ${hasG ? cell(x.g, maxG, 'g') : ''}${hasB ? cell(x.b, maxB, 'b') : ''}</tr>`;
    const loadedAll = r.g.loaded >= r.g.sites && r.b.loaded >= r.b.sites;
    const chips = [['all', '综合'], hasG && hasB && ['g', 'Google'], hasG && hasB && ['b', 'Bing'], ['c', '点击']].filter(Boolean);
    // 没加载全：一次查不完（还有站点没查）或者有站点读取失败；失败原因放在浮动提示里
    const errTip = r.errors.slice(0, 20).map((e) => `${e.host}（${e.src === 'g' ? 'Google' : 'Bing'}）：${e.error}`).join('\n') + (r.errors.length > 20 ? `\n…还有 ${r.errors.length - 20} 个` : '');
    body.innerHTML = `${!loadedAll ? `<div class="hq-more">${ic('info', 15)}<span>${[r.pending ? `还有 ${r.pending} 个站点的搜索词没加载（一次最多查 60 个）` : '',
        r.errors.length ? `<span class="hq-err" data-tipf-always data-tipf="${esc(errTip)}">${r.errors.length} 个站点读取失败</span>` : ''].filter(Boolean).join('，')}</span><span class="sp"></span>
        <button type="button" class="btn sm" id="hq-go">${r.pending ? '继续加载' : '重试'}</button></div>` : ''}
      ${r.items.length ? `<div class="hq-tb"><div class="qf">${chips.map(([v, l]) => `<button type="button" class="${sort === v ? 'on' : ''}" data-hqs="${v}">${l}</button>`).join('')}</div><span class="sp"></span>
        <input class="input sm hq-kw" id="hq-kw" type="search" placeholder="筛选搜索词" value="${esc(kw)}" autocomplete="off"></div>
      <div class="ev-w hq-w"><table class="tbl gt hq-t"><thead><tr><th>搜索词 <small>${num(r.total)}${r.total > r.items.length ? `（显示前 ${num(r.items.length)} 个）` : ''}</small></th>
        ${hasG ? `<th class="r">${BRAND.gsc(13)} Google 热度</th>` : ''}${hasB ? `<th class="r">${BRAND.bing(13)} Bing 热度</th>` : ''}</tr></thead>
        <tbody>${rows.map(row).join('') || `<tr><td colspan="3"><div class="empty">${ic('search')}${kw.trim() ? `没有包含“${esc(kw)}”的搜索词` : '没有符合条件的搜索词'}</div></td></tr>`}</tbody></table></div>`
      : `<div class="empty">${ic('inbox')}${hasG || hasB ? '这段时间还没有搜索数据' : '这些站点都没有关联 Search Console 或 Bing'}</div>`}`;
    body.querySelectorAll('[data-hqs]').forEach((b) => (b.onclick = () => { sort = b.dataset.hqs; draw(); }));
    const inp = body.querySelector('#hq-kw');
    if (inp) inp.oninput = () => {
      kw = inp.value; const pos = inp.selectionStart;
      draw();
      const n = body.querySelector('#hq-kw'); n.focus(); n.setSelectionRange(pos, pos);
    };
    const go = body.querySelector('#hq-go');
    if (go) go.onclick = () => { go.disabled = true; go.textContent = '加载中…'; load(); };
  };
  load();
}

// 事件规则的条件写成一句话
const GA_MATCH = [['CONTAINS', '包含'], ['EQUALS', '等于'], ['STARTS_WITH', '开头是'], ['ENDS_WITH', '结尾是'], ['REGULAR_EXPRESSION', '符合正则'],
  ['CONTAINS_CASE_INSENSITIVE', '包含（不分大小写）'], ['EQUALS_CASE_INSENSITIVE', '等于（不分大小写）']];
const GA_FIELD = [['page_location', '页面网址'], ['page_title', '页面标题'], ['page_referrer', '来源网址'], ['link_url', '点击的链接']];
const gaMatchName = (m) => GA_MATCH.find(([k]) => k === m)?.[1] || m;
const gaFieldName = (f) => GA_FIELD.find(([k]) => k === f)?.[1] || f;
const gaRuleText = (r) => (r.conditions.length
  ? `当 ${r.source || '任意事件'} 的「${gaFieldName(r.conditions[0].field)}」${gaMatchName(r.conditions[0].match)} “${r.conditions[0].value}” 时，记为 ${r.event}${r.conditions.length > 1 ? `（另有 ${r.conditions.length - 1} 个条件）` : ''}`
  : `收到 ${r.source || '任意事件'} 时，记为 ${r.event}`);

// 事件类型的标签（类型由服务端按事件名判断，见 ga4admin.js eventType）
const EV_TAG = {
  auto: ['自动', 'GA4 自动收集的事件：装了 GA4 就有'],
  enhanced: ['自动', '增强型衡量：GA4 自动收集，在 GA4 网站数据流设置里默认开启，可以关掉'],
  recommended: ['推荐', 'Google 推荐的事件名，需要网站代码自己发送'],
  custom: ['自定义', '自定义事件：网站代码发送的、你自己起名的事件'],
};
// 站点详情的“事件”卡片：最近 28 天收到的事件、关键事件开关、事件规则（新建 / 删除）
async function mountEvents(host) {
  const el = document.getElementById('g-ev');
  if (!el) return;
  const body = el.querySelector('.card-b');
  let d, formOpen = false, kind = 'all';
  const load = async () => {
    try { d = await api(`/google/ga4/events?host=${encodeURIComponent(host)}`); }
    catch (e) {
      if (!document.body.contains(el)) return;
      body.innerHTML = `<div class="empty">${ic('alert')}${esc(e.message)}<button type="button" class="btn sm" id="ev-retry" style="margin-top:10px">重试</button></div>`;
      body.querySelector('#ev-retry').onclick = () => { body.innerHTML = skel(160); load(); };
      return;
    }
    if (document.body.contains(el)) draw();
  };
  const draw = () => {
    const ro = !d.canEdit;
    // 按类型筛选：自动收集（含增强型衡量）/ 推荐 / 自定义；通过规则新建的算自定义
    const kindOf = (e) => (e.rules.length ? 'custom' : e.type === 'enhanced' ? 'auto' : e.type || 'custom');
    const cnt = { all: d.events.length, auto: 0, recommended: 0, custom: 0 };
    for (const e of d.events) cnt[kindOf(e)]++;
    if (kind !== 'all' && !cnt[kind]) kind = 'all';
    const shown = kind === 'all' ? d.events : d.events.filter((e) => kindOf(e) === kind);
    const list = shown;   // 弹窗里表格自己滚动，全部列出
    const row = (e) => `<tr>
      <td><div class="ev-n"><code class="ell" data-tipf="${esc(e.name)}">${esc(e.name)}</code>${e.rules.length ? `<i class="ix-tag" data-tipf-always data-tipf="${esc(e.rules.map(gaRuleText).join('\n'))}">规则</i>` : EV_TAG[e.type] ? `<i class="ev-tag ${e.type}" data-tipf-always data-tipf="${esc(EV_TAG[e.type][1])}">${EV_TAG[e.type][0]}</i>` : ''}</div></td>
      <td class="num">${e.count ? num(e.count) : '<span class="sm" data-tipf-always data-tipf="最近 28 天还没收到这个事件">还没收到</span>'}</td>
      <td class="ev-k"><label class="switch" ${ro ? 'data-tipf-always data-tipf="需要先重新授权 GA4 编辑权限"' : e.key && !e.deletable ? 'data-tipf-always data-tipf="GA4 默认的关键事件，不能取消"' : ''}><input type="checkbox" data-key="${esc(e.name)}" ${e.key ? 'checked' : ''} ${ro || (e.key && !e.deletable) ? 'disabled' : ''} aria-label="${esc(e.name)} 设为关键事件"><span class="t"></span></label></td>
      <td class="ev-a">${e.rules.map((r) => `<button type="button" class="btn sm ghost icon" data-del="${esc(r.id)}" ${ro ? 'disabled' : ''} aria-label="删除规则" data-tipf-always data-tipf="${esc(`删除规则：${gaRuleText(r)}`)}">${ic('trash', 14)}</button>`).join('')}</td></tr>`;
    const srcs = [...new Set(['page_view', ...d.events.filter((e) => e.count).map((e) => e.name)])].slice(0, 30);
    body.innerHTML = `${ro ? gaReauthBar('当前 Google 账号只有只读权限，重新授权后才能设置关键事件、新建和删除事件') : ''}
      <div class="ev-f" id="ev-f" ${formOpen ? '' : 'hidden'}>
        <div class="ev-fl">当 <div id="ev-src"></div> 的
          <div id="ev-fld"></div>
          <div id="ev-m"></div>
          <input class="input" id="ev-v" placeholder="/thank-you"> 时，记为 <input class="input ev-name" id="ev-name" placeholder="purchase" autocomplete="off"></div>
        <div class="ev-fb"><label class="switch"><input type="checkbox" id="ev-key" checked><span class="t"></span>同时设为关键事件</label><span class="sp"></span>
          <button type="button" class="btn sm" id="ev-cancel">取消</button><button type="button" class="btn sm primary" id="ev-save">保存</button></div>
        <div class="err" role="alert"></div>
        <p class="hint">新事件从保存后开始统计，GA4 里大约几小时后能看到；已经收集的历史数据不会补算。</p>
      </div>
      ${d.rulesError ? `<p class="hint ix-err">${ic('alert', 13)}<span>读取事件规则失败：${esc(d.rulesError)}</span></p>` : ''}
      ${d.events.length ? `<div class="qf ev-qf">${[['all', '全部'], ['auto', '自动收集'], ['recommended', '推荐'], ['custom', '自定义']].filter(([k]) => k === 'all' || cnt[k])
        .map(([k, l]) => `<button type="button" class="${kind === k ? 'on' : ''}" data-evk="${k}">${l}<small>${cnt[k]}</small></button>`).join('')}</div>` : ''}
      ${d.events.length ? `<div class="ev-w"><table class="tbl gt ev-t"><thead><tr><th>事件</th><th class="r"><span class="th-l">近 28 天</span><span class="th-s">28 天</span></th><th class="r"><span class="th-l">关键事件</span><span class="th-s">关键</span></th><th></th></tr></thead>
        <tbody>${list.map(row).join('')}</tbody></table></div>
`
        : `<div class="empty">${ic('inbox')}最近 28 天还没收到事件：确认统计代码已经贴到网站上</div>`}`;
    body.querySelector('[data-ga-re]')?.addEventListener('click', (e) => googleConnect(e.currentTarget));
    body.querySelectorAll('[data-evk]').forEach((b) => (b.onclick = () => { kind = b.dataset.evk; draw(); }));
    const f = body.querySelector('#ev-f');
    const ddSrc = selectDd(f.querySelector('#ev-src'), srcs.map((x) => ({ v: x, l: x })), 'page_view', { aria: '来源事件', search: srcs.length > 8 ? '搜索事件' : '' });
    const ddFld = selectDd(f.querySelector('#ev-fld'), GA_FIELD.map(([v, l]) => ({ v, l })), 'page_location', { aria: '条件' });
    const ddM = selectDd(f.querySelector('#ev-m'), GA_MATCH.slice(0, 5).map(([v, l]) => ({ v, l })), 'CONTAINS', { aria: '匹配方式' });
    body.querySelector('#ev-cancel').onclick = () => { formOpen = false; f.hidden = true; };
    body.querySelector('#ev-save').onclick = async (e) => {
      const btn = e.currentTarget, err = f.querySelector('.err');
      const event = f.querySelector('#ev-name').value.trim();
      if (!/^[A-Za-z][A-Za-z0-9_]{0,39}$/.test(event)) { err.textContent = '事件名只能用字母、数字、下划线，字母开头，最长 40 个字符'; f.querySelector('#ev-name').focus(); return; }
      btn.disabled = true; err.textContent = '';
      try {
        await api('/google/ga4/event-rules', { method: 'POST', body: { host, event, source: ddSrc.value, field: ddFld.value,
          match: ddM.value, value: f.querySelector('#ev-v').value.trim(), key: f.querySelector('#ev-key').checked } });
        toast(`已新建事件 ${event}`); formOpen = false; await load();
      } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
    };
    body.querySelectorAll('[data-key]').forEach((cb) => (cb.onchange = async () => {
      cb.disabled = true;
      try { await api('/google/ga4/key-events', { method: 'POST', body: { host, event: cb.dataset.key, on: cb.checked } }); toast(cb.checked ? `${cb.dataset.key} 已设为关键事件` : `${cb.dataset.key} 已取消关键事件`); await load(); }
      catch (ex) { cb.checked = !cb.checked; cb.disabled = false; toast(ex.message, 'bad'); }
    }));
    body.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
      const ok = await confirmDialog({ title: '删除这条事件规则？', text: '删除后不再生成这个事件；已经收集到的历史数据不会删除。', ok: '删除', danger: true });
      if (!ok) return;
      b.disabled = true;
      try { await api(`/google/ga4/event-rules?host=${encodeURIComponent(host)}&id=${encodeURIComponent(b.dataset.del)}`, { method: 'DELETE' }); toast('已删除规则'); await load(); }
      catch (ex) { b.disabled = false; toast(ex.message, 'bad'); }
    }));
  };
  el.querySelector('#ev-new').onclick = () => {
    if (!d) return;
    if (!d.canEdit) { toast('需要先重新授权 GA4 编辑权限', 'warn'); return; }
    formOpen = true;
    const f = body.querySelector('#ev-f');
    f.hidden = false;
    f.querySelector('#ev-v').focus();
  };
  el.querySelector('#ev-code')?.addEventListener('click', () => gaCodeDialog(host));
  load();
}

// ---------------------------------------------------------------- 设置 → AI 接口（接口见 src/aiapi.js）
const AI_PERMS = [['create', '新建站点统计'], ['events', '管理事件'], ['delete', '删除不用确认']];
const AI_HOURS = [[1, '1 小时'], [24, '1 天'], [168, '7 天']];
const aiPending = (a) => (a.ops || []).filter((o) => o.status === 'pending').length;
const aiLive = (a) => (a.tokens || []).filter((t) => !t.revoked && !t.expired).length;
const aiPill = (a) => (aiPending(a) ? `<span class="pill exp">${aiPending(a)} 条待确认</span>` : `<span class="pill ${aiLive(a) ? 'on' : 'off'}">${aiLive(a) ? `${aiLive(a)} 个有效` : '无'}</span>`);
const aiSummary = (a) => (aiPending(a) ? `AI 提交了 ${aiPending(a)} 个删除操作，等你确认` : aiLive(a) ? `${aiLive(a)} 个有效令牌，可随时吊销` : '让 AI 帮你新建站点统计、管理 GA4 事件');
const aiOpText = (o, names) => `${names[o.action] || o.action}${o.host ? ` · ${o.host}` : ''}${o.params?.event ? ` · ${o.params.event}` : ''}${o.params?.url ? ` · ${o.params.url}` : ''}${o.action === 'key_event' ? (o.params?.on ? '（设为关键事件）' : '（取消关键事件）') : ''}${o.action === 'delete_rule' ? ` · 规则 ${o.params?.id}` : ''}`;
const AI_ST = { pending: ['exp', '待你确认'], done: ['on', '完成'], failed: ['bad-p', '失败'], rejected: ['off', '已拒绝'] };
const aiPrompt = (doc, token, exp) => `请帮我管理网站统计（GA4）。先读接口说明：${doc}
调用接口时在请求头加上：Authorization: Bearer ${token}
（令牌 ${fmtTime(exp)} 失效）
读完说明后告诉我你能做什么，然后按我的要求操作；动手前先说明要做的事。`;

    ${pend.length ? `<div class="ai-pend"><h4 class="set-h" style="margin-top:0">${ic('alert', 15)}待你确认</h4>${pend.map((o) => `<div class="ai-op"><span class="ell">${esc(aiOpText(o, a.actions))}</span><span class="sm">${ago(o.at)}</span>
      <button type="button" class="btn sm" data-op-no="${o.id}">拒绝</button><button type="button" class="btn sm primary" data-op-ok="${o.id}">确认执行</button></div>`).join('')}</div>` : ''}

    ${(a.ops || []).length ? `<h4 class="set-h">操作记录</h4><div class="ai-log">${a.ops.slice(0, 30).map((o) => `<div class="ai-op">
      <span class="ell" data-tipf-always data-tipf="${esc(`${aiOpText(o, a.actions)}\n${fmtTime(o.at)}${o.tokenLabel ? ` · ${o.tokenLabel}` : o.tokenTail ? ` · 令牌 ••••${o.tokenTail}` : ''}${typeof o.result === 'string' && o.result ? `\n${o.result}` : ''}`)}">${esc(aiOpText(o, a.actions))}</span>

  box.querySelectorAll('[data-revoke]').forEach((b) => (b.onclick = async () => {
    const ok = await confirmDialog({ title: '吊销这个令牌？', text: '吊销后 AI 立即不能再用它；它提交的待确认操作也会作废。', ok: '吊销', danger: true });

      reload();
    } catch (ex) { b.disabled = false; toast(ex.message, 'bad'); }
  };
  box.querySelectorAll('[data-op-ok]').forEach((b) => (b.onclick = () => decide(b.dataset.opOk, true, b)));
  box.querySelectorAll('[data-op-no]').forEach((b) => (b.onclick = () => decide(b.dataset.opNo, false, b)));
}

// 输入分组名的对话框：可以点已有分组快速选择
function tagDialog({ title, text, tags = [], ok = '确定', value = '' }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'ov';
    const d = document.createElement('form'); d.className = 'dialog tag-d'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = `<h3>${esc(title)}</h3>${text ? `<p>${text}</p>` : ''}
      <input class="input" id="tg-in" maxlength="40" placeholder="分组名，如：交易所、新闻站、主力站" value="${esc(value)}" autocomplete="off" required>
      ${tags.length ? `<div class="tg-sug">${tags.map((t) => `<button type="button" class="gtg" data-t="${esc(t.tag)}">${esc(t.tag)}<small>${t.n}</small></button>`).join('')}</div>` : ''}
      <div class="row"><button type="button" class="btn" data-no>取消</button><button class="btn primary">${esc(ok)}</button></div>`;
    const done = (v) => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(null); };
    ov.onclick = () => done(null);
    d.querySelector('[data-no]').onclick = () => done(null);
    d.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { d.querySelector('#tg-in').value = b.dataset.t; d.querySelector('#tg-in').focus(); }));
    d.onsubmit = (e) => { e.preventDefault(); const v = d.querySelector('#tg-in').value.trim(); if (v) done(v); };
    document.addEventListener('keydown', onKey);
    document.body.append(ov, d);
    setTimeout(() => d.querySelector('#tg-in').select(), 30);
  });
}

async function tagManageDialog(onDone, src = SITE_TAGS) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const d = document.createElement('div'); d.className = 'dialog tag-d'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  const close = () => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); onDone(); };
  d._dismiss = () => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); };   // 换页时只关掉，不刷新列表
  const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dialog:not(.tag-d)')) close(); };
  ov.onclick = close;

  document.body.append(ov, d);

    if (!tags) { d._dismiss(); return; }   // 读取失败：只关掉对话框，不重新渲染列表（用户可能已经换到别的页面）
    d.innerHTML = `<h3>管理分组</h3><p>改名时如果填了已有的分组名，两个分组会合并。删除分组不会删除${src.noun}。</p>
      <div class="tg-list">${tags.map((t) => `<div class="tg-r"><span class="gtg">${esc(t.tag)}</span><span class="hint">${t.n} 个${src.noun}</span><span class="sp"></span>
        <button type="button" class="btn sm ghost" data-ren="${esc(t.tag)}">${ic('edit', 14)}改名</button>
        <button type="button" class="btn sm ghost danger-t" data-drop="${esc(t.tag)}">${ic('trash', 14)}删除</button></div>`).join('') || '<div class="hint">还没有分组</div>'}</div>
      <div class="row"><button type="button" class="btn" data-no>完成</button></div>`;
    d.querySelector('[data-no]').onclick = close;
    d.querySelectorAll('[data-ren]').forEach((b) => (b.onclick = async () => {
      const to = await tagDialog({ title: `把“${b.dataset.ren}”改名为`, value: b.dataset.ren, ok: '改名' });
      if (!to || to === b.dataset.ren) return;
      try { await src.rename(b.dataset.ren, to); toast('已改名'); draw(); } catch (ex) { toast(ex.message, 'bad'); }
    }));
    d.querySelectorAll('[data-drop]').forEach((b) => (b.onclick = async () => {
      const ok = await confirmDialog({ title: `删除分组“${b.dataset.drop}”？`, text: `只删除分组，${src.noun}本身不受影响。`, ok: '删除', danger: true });
      if (!ok) return;
      try { await src.drop(b.dataset.drop); toast('已删除分组'); draw(); } catch (ex) { toast(ex.message, 'bad'); }
    }));
  };
  draw();
}

// 列表上方的分组筛选；底部是“给当前筛选的站点加分组”和“管理分组”
function googleTagFilter(root, items, onFilter, getRows) {
  const count = new Map();
  for (const x of items) for (const t of x.tags) count.set(t, (count.get(t) || 0) + 1);
  const tags = [...count.keys()].sort();
  const none = items.filter((x) => !x.tags.length).length;
  // 选中的分组已经不存在（被删除或改名）：恢复成全部，并重新筛选
  if (gState.tag && (gState.tag === '+none' ? false : !count.has(gState.tag))) { gState.tag = ''; onFilter(); }
  const ADD = '+add', MANAGE = '+manage';
  const init = () => dropdown(root, {
    value: gState.tag, aria: '按分组筛选', search: tags.length > 8 ? '搜索分组' : '', empty: '没有匹配的分组', minWidth: 240, maxWidth: 320,
    groups: (q) => q ? [['', tags.filter((t) => t.toLowerCase().includes(q))]]
      : [['', ['']], ...(tags.length ? [['分组', [...tags, '+none']]] : []), ['', [ADD, ...(tags.length ? [MANAGE] : [])]]],
    button: (v) => `${ic('tag', 14)}<span class="nm">${!v ? '全部分组' : v === '+none' ? '未分组' : esc(v)}</span>`,
    option: (v, q) => v === ADD ? `<span class="ot g-op g-sep">${ic('plus', 14)}给当前筛选的 ${getRows().length} 个站点加分组…</span>`
      : v === MANAGE ? `<span class="ot g-op">${ic('edit', 14)}管理分组…</span>`
      : !v ? `<span class="ot">全部分组<small>${items.length} 个站点</small></span>`
      : v === '+none' ? `<span class="ot">未分组<small>${none} 个</small></span>`
      : `<span class="ot">${hl(v, q)}<small>${count.get(v)} 个</small></span>`,
    onChange: async (v) => {
      if (v === ADD || v === MANAGE) {
        init();
        if (v === MANAGE) return tagManageDialog(() => renderSites(routeToken));
        const rows = getRows();
        if (!rows.length) return toast('当前筛选没有站点', 'bad');
        const tag = await tagDialog({ title: '加到分组', text: `把当前筛选的 <b>${rows.length}</b> 个站点加到分组（已在分组里的不受影响）。可以先搜索或用其他筛选条件选出站点。`,
          tags: tags.map((t) => ({ tag: t, n: count.get(t) })), ok: '加入分组' });
        if (!tag) return;
        try {
          await api('/google/tags', { method: 'PUT', body: { tag, hosts: rows.map((x) => x.host) } });
          toast(`已把 ${rows.length} 个站点加到“${tag}”`); renderSites(routeToken);
        } catch (ex) { toast(ex.message, 'bad'); }
        return;
      }
      gState.tag = v; onFilter();
    },
  });
  init();
}

// 导出站点列表（当前的筛选和排序），带 BOM 方便 Excel 打开中文
function exportSitesCsv(rows, d) {
  const cell = (v) => { const t = v == null ? '' : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const r2 = (v) => (v == null ? '' : Math.round(v * 100) / 100);
  const head = ['站点', 'GA4 媒体资源', 'Search Console', '用户', '上期用户', '会话', '上期会话', '关键事件', '互动率',
    '搜索点击', '上期搜索点击', '展示', '上期展示', '点击率', '平均排名', '短链点击（真人）', '短链访客', '点出率', '已编入', '已检查网址', '网址数', 'Bing 点击', '上期 Bing 点击', 'Bing 展示', 'Bing 已收录', 'Bing 索引中网页'].map(T);
  const lines = [head.map(cell).join(',')];
  for (const x of rows) {
    const ga = x.cur.ga, pg = x.prev.ga, sc = x.cur.gsc, ps = x.prev.gsc;
    const lh = x.linksFrom.reduce((a, l) => a + l.human, 0);
    lines.push([x.host, x.ga4?.name || '', x.gsc || '', x.users, x.prevUsers, ga?.sessions, pg?.sessions, ga?.keyEvents, ga ? r2(ga.engagement * 100) + '%' : '',
      sc?.clicks, ps?.clicks, sc?.impressions, ps?.impressions, sc ? r2(sc.ctr * 100) + '%' : '', sc?.impressions ? r2(sc.position) : '',
      lh || '', x.linksFromVisitors ?? '', ga?.sessions && lh ? r2((lh / ga.sessions) * 100) + '%' : '',
      x.index?.done ? x.index.yes : '', x.index?.done ?? '', x.index?.urls ?? '',
      x.cur.bing?.clicks ?? '', x.prev.bing?.clicks ?? '', x.cur.bing?.impressions ?? '', x.index?.bdone ? x.index.byes : '', x.bing ? x.bingInIndex : ''].map(cell).join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sites-${d.ranges.from}_${d.ranges.to}.csv`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`已导出 ${rows.length} 个站点`);
}

// ---------------------------------------------------------------- 系统状态
// 每一项：ok / warn / bad + 说明；定时任务超过 3 小时没跑算异常
// 定时任务各步骤的中文名
const CRON_NAME = { schema: '建表', aggregate: '访问汇总', backfill: '访客回填', prune: '清理明细', cleanup: '清理缓存', google: 'Google 同步', bing: 'Bing 同步', links: '外链与权重', gindex: '网页索引检查', health: '目标页检查', update: '检查更新', notify: '推送通知', usage: '用量预警' };
function sysChecks(st) {
  const H = 3600000, now = st.now, c = st.cron;
  const out = [];
  const steps = c?.steps || {};
  const failed = Object.entries(steps).filter(([, v]) => !v.ok);
  out.push(!c ? { lv: 'warn', t: '定时任务', d: '还没有运行记录（部署后每小时整点运行一次）' }
    : now - c.at > 3 * H ? { lv: 'bad', t: '定时任务', d: `上次运行在 ${ago(c.at)}，超过 3 小时没有运行，请检查 wrangler.toml 里的 [triggers] crons` }
    : failed.length ? { lv: 'bad', t: '定时任务', d: `${ago(c.at)}运行，${failed.map(([k, v]) => `${CRON_NAME[k] || k}失败：${v.error}`).join('；')}` }
    : { lv: 'ok', t: '定时任务', d: `${ago(c.at)}运行，耗时 ${(c.ms / 1000).toFixed(1)} 秒，${Object.keys(steps).length} 个步骤都正常` });
  out[out.length - 1].act = `<button type="button" class="btn sm ghost" id="sys-run" data-tipf-always data-tipf="按定时任务的步骤立即跑一遍：访问汇总、Google / Bing 同步、网页索引检查、目标页检查。不发推送通知、不自动提交网址和站点地图，每步比整点那次少做一些。请求从你当前访问的 Cloudflare 节点发出">${ic('refresh', 13)}立即运行一次</button>`;
  out.push(!st.aggMark ? { lv: 'warn', t: '访问汇总', d: '还没有汇总过（有访问后自动开始）' }
    : now - st.aggMark > 3 * H ? { lv: 'warn', t: '访问汇总', d: `汇总到 ${fmtTime(st.aggMark)}，落后 ${Math.round((now - st.aggMark) / H)} 小时（之后的访问实时读取，统计不受影响）` }
    : { lv: 'ok', t: '访问汇总', d: `已汇总到 ${fmtTime(st.aggMark)}，之后的访问实时读取` });
  const g = st.google;
  if (g.accounts) {
    out.push(g.accountErrors.length ? { lv: 'bad', t: 'Google 账号', d: g.accountErrors.map((a) => `${maskEmail(a.email)}：${a.error}`).join('；') }
      : { lv: 'ok', t: 'Google 账号', d: `${g.accounts} 个账号授权正常` });
    out.push(g.pending ? { lv: 'warn', t: 'Google 同步', d: `${g.sites} 个站点，还有 ${g.pending} 个在同步中（每小时同步 10 个，也可以在“站点”页立即同步）` }
      : g.siteErrors ? { lv: 'warn', t: 'Google 同步', d: `${g.siteErrors} 个站点上次同步出错，到“站点”页查看` }
      : { lv: 'ok', t: 'Google 同步', d: `${g.sites} 个站点，最近同步于 ${g.lastSync ? ago(g.lastSync) : '—'}` });
  }
  const n = st.notify;
  out.push(!n.channels.length ? { lv: 'warn', t: '推送通知', d: '没有开启推送渠道，报告和提醒不会发送' }
    : n.last && !n.last.ok ? { lv: 'bad', t: '推送通知', d: `上次推送失败：${n.last.error}` }
    : { lv: 'ok', t: '推送通知', d: `渠道：${n.channels.join('、')}${n.last ? `，上次推送 ${ago(n.last.at)}` : ''}` });
  if (st.health) out.push(!st.health.urls ? { lv: 'warn', t: '目标页检查', d: '还没有检查过（定时任务每小时检查一批）' }
    : st.health.down ? { lv: 'bad', t: '目标页检查', d: `${st.health.down} 个目标地址打不开，到“短链”页查看标红的短链` }
    : { lv: 'ok', t: '目标页检查', d: `${st.health.urls} 个目标地址都能打开，最近检查于 ${ago(st.health.last)}` });
  out.push(st.usage.configured ? { lv: 'ok', t: 'Cloudflare 用量', d: st.usage.alert ? '已配置，用量预警已开启' : '已配置（用量预警未开启，可以在“通知”页开启）' }
    : { lv: 'warn', t: 'Cloudflare 用量', d: '没有填写凭据，看不到账户用量' });
  if (!st.backfillDone && st.aggMark) out.push({ lv: 'warn', t: '访客回填', d: '按来源的独立访客正在回填旧数据，几个小时内完成' });
  // Bing Webmaster（配置了才显示）：限流是临时的（黄色），Key 无效等需要处理（红色）
  const bg = st.bing;
  if (bg?.configured) out.push(!bg.error ? { lv: 'ok', t: 'Bing', d: `${bg.sites} 个站点${bg.lastSync ? `，最近同步于 ${ago(bg.lastSync)}` : '，等待首次同步'}${bg.proxy ? '，经代理' : ''}` }
    : { lv: bingThrottled(bg) ? 'warn' : 'bad', t: 'Bing', d: bingThrottled(bg) ? `${bg.error}，定时任务每小时会自动重试${bg.proxy ? '' : '；一直这样的话请在“Bing Webmaster”里设置代理地址'}` : bg.error });
  // 版本：每天查一次上游的最新 Release
  const u = st.update, v = st.version || APP_VERSION;
  out.push(!u ? { lv: 'ok', t: '版本', d: `v${v}（还没检查过更新，定时任务每天检查一次）` }
    : u.newer ? { lv: 'warn', t: '版本', d: `当前 v${v}，有新版本 v${u.latest}`, links: [[u.url, '查看更新说明'], [UPGRADE_DOC, '怎么升级']] }
    : u.error ? { lv: 'ok', t: '版本', d: `v${v} · 检查更新失败：${u.error}` }
    : { lv: 'ok', t: '版本', d: `v${v} · 已是最新${u.latest ? '' : '（上游还没有发布版本）'}，${ago(u.at)}检查` });
  out[out.length - 1].act = `<button type="button" class="btn sm ghost" id="sys-upd" data-tipf-always data-tipf="立即到 GitHub 查一次最新版本（只读取版本号，不上报任何数据）">${ic('refresh', 13)}检查更新</button>`;
  return out;
}
// 升级说明（README 里的“升级”一节）
const UPGRADE_DOC = 'https://github.com/ccvar/cligc_link#升级';
const sysLevel = (st) => { const c = sysChecks(st); return c.some((x) => x.lv === 'bad') ? 'bad' : c.some((x) => x.lv === 'warn') ? 'warn' : 'ok'; };
const sysPill = (st) => ({ ok: '<span class="pill on">正常</span>', warn: '<span class="pill exp">注意</span>', bad: '<span class="pill bad-p">异常</span>' }[sysLevel(st)]);
const sysSummary = (st) => {
  const c = sysChecks(st), bad = c.filter((x) => x.lv === 'bad'), warn = c.filter((x) => x.lv === 'warn');
  return bad.length ? `${bad.map((x) => x.t).join('、')}异常` : warn.length ? `${warn.length} 项需要注意：${warn.map((x) => x.t).join('、')}` : `定时任务、汇总${st.google.accounts ? '、Google 同步' : ''}都正常`;
};
const sysBody = (st) => `<div class="sys-l">${sysChecks(st).map((x) => `<div class="sys-r ${x.lv}${x.act ? ' has-act' : ''}"><span class="sys-i">${ic(x.lv === 'ok' ? 'check' : 'alert', 13)}</span><b>${x.t}</b><span class="sys-d">${esc(x.d)}${(x.links || []).filter(([h]) => h).map(([h, l]) => ` · <a href="${esc(h)}" target="_blank" rel="noopener">${l}</a>`).join('')}</span>${x.act ? `<span class="sys-a">${x.act}</span>` : ''}</div>`).join('')}</div>
  ${st.cron ? `<details class="wz-more" style="margin-top:12px"><summary>上次定时任务的各个步骤</summary>${cronSteps(st.cron)}</details>` : ''}
  ${st.cronManual ? `<details class="wz-more" style="margin-top:8px"><summary>最近一次手动运行（${ago(st.cronManual.at)}，耗时 ${(st.cronManual.ms / 1000).toFixed(1)} 秒）</summary>${cronSteps(st.cronManual)}</details>` : ''}
`;
// 定时任务各步骤的耗时 / 错误
const cronSteps = (c) => `<div class="sys-steps">${Object.entries(c.steps).map(([k, v]) => `<span class="${v.ok ? '' : 'bad'}">${esc(CRON_NAME[k] || k)} · ${v.ok ? `${(v.ms / 1000).toFixed(1)} 秒` : esc(v.error)}</span>`).join('')}</div>`;

    const VAL = {
      users: (x) => x.users, sessions: (x) => x.cur.ga?.sessions, share: shareOf,

      // 权重 / 外链：开了 Open PageRank 按分数排，只开 Bing 外链时按外链数排
      ...(BL.opr || BL.bing ? { bl: (x) => (BL.opr ? x.opr?.s ?? null : x.bl?.n ?? null) } : {}),
    };
    // 排序的那一列不在了（比如关掉了外链与权重）：回到默认排序，免得记着的方向和表头点击对不上
    if (!VAL[gState.sort] && gState.sort !== 'host') { gState.sort = 'sessions'; gState.dir = ''; store.set('g:sort', 'sessions'); store.set('g:dir', ''); }
    const sk = gState.sort;

    // 表头：可以点着排序，当前排序列带箭头

      <tbody>${rows.map((x) => {
        const ga = x.cur.ga, pg = x.prev.ga, sc = SE(x), ps = SE(x, 'prev');
        return `<tr data-host="${esc(x.host)}" tabindex="0">
          <td><div class="gh">${esc(x.host.startsWith('ga4-') ? x.ga4?.name || x.host : x.host)}${x.host.includes('.') ? `<a class="row-ext" href="https://${esc(x.host)}" target="_blank" rel="noopener" data-tip="打开网站" aria-label="打开网站">${ic('ext', 13)}</a>` : ''}</div>
            <div class="sm gm">${x.ga4
              ? `<span class="gico" data-tipf-always data-tipf="${esc(`Google Analytics 4：${x.ga4.account} / ${x.ga4.name}（${x.ga4.property}）${many ? ` · 来自 ${x.ga4.email}` : ''}`)}">${BRAND.ga(14)}</span>`
              : `<span class="gico off" data-tipf-always data-tipf="未关联 Google Analytics 4">${BRAND.ga(14)}</span>`}${x.gsc
              ? `<span class="gico" data-tipf-always data-tipf="${esc(`Search Console：${x.gsc}${many ? ` · 来自 ${x.gscEmail}` : ''}`)}">${BRAND.gsc(14)}</span>`
              : `<span class="gico off" data-tipf-always data-tipf="未关联 Search Console">${BRAND.gsc(14)}</span>`}${hasBing ? (x.bing
              ? `<span class="gico" data-tipf-always data-tipf="${esc(`Bing Webmaster：${x.bing}${x.bingError ? `\n同步出错：${x.bingError}` : ''}`)}">${BRAND.bing(14)}</span>`
              : `<span class="gico off" data-tipf-always data-tipf="未关联 Bing Webmaster">${BRAND.bing(14)}</span>`) : ''}${x.linksFrom.length ? (() => {
              const h = x.linksFrom.reduce((a, l) => a + l.human, 0), ses = x.cur.ga?.sessions;
              const tip = `${G_LABEL()}从这个站点点出 ${x.linksFrom.length} 个短链，真人点击 ${num(h)}${x.linksFromVisitors ? `（${num(x.linksFromVisitors)} 位访客）` : ''}${ses ? `，点出率 ${pct1(h / ses)}` : ''}：${x.linksFrom.slice(0, 3).map((l) => `/${l.slug} ${num(l.human)}`).join('、')}${x.linksFrom.length > 3 ? ' …' : ''}`;
              return `<span class="gsl" data-tipf-always data-tipf="${esc(tip)}">${ic('link', 12)}${num(h)}</span>`;
            })() : ''}${x.ga4?.created ? `<span class="gage" data-tipf-always data-tipf="${esc(`GA4 接入于 ${ymd(new Date(x.ga4.created))}，大致是网站上线时间`)}">${ic('history', 11)}${siteAge(x.ga4.created)}</span>` : ''}${x.content?.at ? `<span class="gage${contentDays(x.content.at) >= C_STALE ? ' old' : ''}" data-tipf-always data-tipf="${esc(contentTip(x.content))}">${ic('edit', 11)}${contentDays(x.content.at) < 1 ? '今天' : siteAge(x.content.at)}</span>` : ''}${advOf(x.host).length ? `<span class="gadv lv-${advOf(x.host)[0].level}" data-tipf-always data-tipf="${esc(`${advOf(x.host).length} 条优化建议\n${advTip(advOf(x.host))}`)}">${ic(ADV_LV_IC[advOf(x.host)[0].level], 11)}${advOf(x.host).length}</span>` : ''}${x.error ? `<span class="gtag bad" data-tipf-always data-tipf="${esc(x.error)}">同步出错</span>` : ''}${x.ga4?.created > Date.now() - 7 * 86400000 && !x.cur.ga?.sessions ? '<span class="gtag off" data-tipf-always data-tipf="GA4 还没收到数据：确认统计代码已经贴到网站上（贴好后约 30 分钟有数据）">待接入</span>' : !x.syncedAt ? '<span class="gtag off">待同步</span>' : ''}</div>${x.tags.length ? `<div class="sm gm gtl">${x.tags.slice(0, 3).map((t) => `<span class="gtg sm-t">${esc(t)}</span>`).join('')}${x.tags.length > 3 ? `<span class="gtg sm-t" data-tipf-always data-tipf="${esc(x.tags.join(LIST_SEP))}">+${x.tags.length - 3}</span>` : ''}</div>` : ''}</td>
          <td class="num">${x.users != null ? num(x.users) : '—'}${x.prevUsers != null ? gDelta(x.users, x.prevUsers) : ''}</td>
          <td class="num">${ga ? num(ga.sessions) : '—'}${ga && pg ? gDelta(ga.sessions, pg.sessions) : ''}${ga?.keyEvents ? `<div class="gd ix-pg" data-tipf-always data-tipf="GA4 关键事件（标记为转化的事件）">关键事件 ${num(ga.keyEvents)}</div>` : ''}</td>
          <td class="gsh-c c-share">${shareSum && shareOf(x) ? `<div class="gsh"><i style="width:${(shareOf(x) / shareSum) * 100}%"></i></div><span>${pctText(shareOf(x) / shareSum)}</span>` : '<span class="sm">—</span>'}</td>
          <td class="num"${seSplit(x, 'clicks')}>${sc ? num(sc.clicks) : '—'}${sc && ps ? gDelta(sc.clicks, ps.clicks) : ''}</td>
          <td class="num"${seSplit(x, 'impressions')}>${sc ? num(sc.impressions) : '—'}</td>
          <td class="num c-ctr"${seSplit(x, 'ctr')}>${sc ? pct1(sc.ctr) : '—'}</td>
          <td class="num"${seSplit(x, 'position')}>${sc?.position != null ? sc.position.toFixed(1) : '—'}${sc?.position != null && ps?.position != null ? gDelta(sc.position, ps.position, true) : ''}</td>
          <td class="num">${idxCell(x)}</td>${BL.opr || BL.bing ? `<td class="num">${blCell(x, BL)}</td>` : ''}
          <td class="gsp c-spark">${x.spark.length ? sparkOf(x) : ''}</td></tr>`;
      }).join('')}</tbody></table></div>`
      : `<div class="empty" style="padding:48px">${ic('inbox')}${d.items.length ? '没有匹配的站点' : '账号下还没有找到 GA4 媒体资源或 Search Console 站点'}</div>`;
    fitSiteCols(list);
    sumStrip(rows);
    lastRows = rows;
    const navItem = (x) => ({ host: x.host, name: x.ga4?.name || '', s: x.cur.ga?.sessions ?? null });
    siteNav = { rows: rows.map(navItem), all: d.items.map(navItem) };
    const cnt = document.getElementById('g-cnt');
    if (cnt) cnt.textContent = rows.length === d.items.length ? `${d.items.length} 个站点` : `${rows.length} / ${d.items.length} 个站点`;
    list.querySelectorAll('tr[data-host]').forEach((tr) => {
      const go = () => { location.hash = '#/site/' + encodeURIComponent(tr.dataset.host); };
      tr.onclick = (e) => { if (!e.target.closest('a')) go(); };
      tr.onkeydown = (e) => { if (e.key === 'Enter' && e.target === tr) go(); };
    });
  };
  draw();
  // 宽度变了（窗口、侧栏收起 / 展开）重新量
  let fitW = list.clientWidth;
  new ResizeObserver(() => { if (list.clientWidth !== fitW) { fitW = list.clientWidth; fitSiteCols(list); } }).observe(list);
  const advf = document.getElementById('g-advf');
  if (advf) advf.onclick = () => { gState.adv = !gState.adv; advf.classList.toggle('on', gState.adv); advf.setAttribute('aria-pressed', gState.adv); draw(); };
  const qi = document.getElementById('g-q');
  const qx = document.getElementById('g-qx');
  let t; qi.oninput = () => { qx.hidden = !qi.value; clearTimeout(t); t = setTimeout(() => { gState.q = qi.value.trim(); draw(); }, 150); };
  qx.onclick = () => { qi.value = ''; qx.hidden = true; gState.q = ''; draw(); qi.focus(); };
  qi.onkeydown = (e) => { if (e.key === 'Escape' && qi.value) { e.stopPropagation(); qx.click(); } };
  const seEl = document.getElementById('g-se');
  if (seEl) {
    seEl.querySelectorAll('button').forEach((b) => (b.onclick = () => {
      gState.se = b.dataset.e; store.set('g:se', gState.se);
      seEl.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      segThumb(seEl); draw();
    }));
    setTimeout(() => segThumb(seEl), 0);
  }
  // 点表头排序：再点同一列反过来；记住上次的排序
  list.addEventListener('click', (e) => {
    const th = e.target.closest('th[data-sk]');
    if (!th || e.target.closest('a, button')) return;
    const k = th.dataset.sk;
    gState.dir = gState.sort === k ? (gState.dir === 'asc' ? 'desc' : 'asc') : SORT_ASC.has(k) ? 'asc' : 'desc';
    gState.sort = k; store.set('g:sort', k); store.set('g:dir', gState.dir);
    draw();
    list.querySelector(`th[data-sk="${k}"]`)?.focus({ preventScroll: true });
  });
  list.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('th[data-sk]')) { e.preventDefault(); e.target.click(); } });
  const prog = document.getElementById('g-prog');
  const syncBtn = document.getElementById('g-sync');
  const idleTip = syncBtn.dataset.tip;
  // 同步中：按钮变成“停止”，点了以后等当前这批（十几个站点）完成再停
  let running = false, stop = false;
  const setRunning = (on) => {
    running = on; stop = false;
    syncBtn.innerHTML = ic(on ? 'stop' : 'refresh', 17);
    syncBtn.dataset.tip = on ? '停止同步' : idleTip;
    syncBtn.setAttribute('aria-label', on ? '停止同步' : '立即同步');
    syncBtn.classList.toggle('stopping', false);
  };
  // what：all = Google 和 Bing，google / bing = 只同步一个
  const sync = async (what = 'all') => {
    if (running) return;
    // 进度：已完成 / 总数 + 细进度条；列表在全部同步完后才刷新一次
    const say = (name, done, total, msg) => {
      if (!stop) prog.querySelector('span').innerHTML = msg || `${name} 同步中 <b>${num(done)}</b> / ${num(total)}`;
      prog.querySelector('i').style.width = `${total ? Math.min(100, (done / total) * 100) : 0}%`;
    };
    // Google 同步会把列表里所有站点（包括只在 Bing 的）都过一遍
    const gTotal = d.items.length, bTotal = d.items.filter((x) => x.bing).length;
    const doG = what !== 'bing', doB = hasBing && what !== 'google';
    const stopped = () => stop || token !== routeToken;
    setRunning(true);
    prog.hidden = false;
    try {
      if (doG) {
        say('Google', 0, gTotal);
        await googleSyncAll((r) => say('Google', Math.max(0, gTotal - r.left), gTotal), stopped);
      }
      // 接了 Bing 的，接着同步 Bing（每次 20 个站点，直到同步完；被限流时停下，交给定时任务）
      if (doB && !stopped()) {
        say('Bing', 0, bTotal);
        for (let i = 0; i < 10 && !stopped(); i++) {
          const r = await api('/bing/sync', { method: 'POST', body: {} });
          if (r.error) { toast(`Bing：${r.error}`, 'bad'); break; }
          say('Bing', Math.max(0, bTotal - r.left), bTotal);
          if (!r.left || !r.done) break;
        }
      }
      const wasStopped = stop;
      setRunning(false);
      if (token !== routeToken) return;
      toast(wasStopped ? '已停止同步。已同步的站点会保留，剩下的由定时任务每小时继续' : '同步完成，列表已更新', wasStopped ? 'warn' : 'ok');
      gFresh = true;
      renderSites(routeToken);
    } catch (err) { toast(err.message, 'bad'); prog.hidden = true; setRunning(false); }
  };
  // 点按钮：同步中 → 停止；接了 Bing → 先选同步哪个；否则直接同步
  syncBtn.onclick = (e) => {
    e.stopPropagation();
    if (running) {
      if (stop) return;
      stop = true;
      syncBtn.classList.add('stopping');
      syncBtn.dataset.tip = '正在停止…';
      prog.querySelector('span').innerHTML = '正在停止，等这一批同步完…';
      return;
    }
    if (!hasBing) return sync('google');
    if (document.querySelector('.menu')) return document.querySelector('.menu').remove();
    const m = document.createElement('div');
    m.className = 'menu'; m.setAttribute('role', 'menu');
    m.innerHTML = `<div class="menu-h">立即同步</div>
      <button role="menuitem" data-w="all">${ic('refresh', 16)}Google 和 Bing</button>
      <button role="menuitem" data-w="google">${BRAND.google(16)}只同步 Google</button>
      <button role="menuitem" data-w="bing">${BRAND.bing(16)}只同步 Bing</button>`;
    const r = syncBtn.getBoundingClientRect();
    m.style.top = r.bottom + 8 + 'px'; m.style.right = Math.max(8, innerWidth - r.right) + 'px';
    document.body.appendChild(m);
    syncBtn.setAttribute('aria-expanded', 'true');
    m.querySelector('button').focus();
    const close = () => { m.remove(); syncBtn.setAttribute('aria-expanded', 'false'); document.removeEventListener('click', close); document.removeEventListener('keydown', onKey); };
    const onKey = (ev) => {
      if (ev.key === 'Escape') { close(); syncBtn.focus(); }
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        const bs = [...m.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
        bs[(i + (ev.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus();
      }
    };
    document.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    m.onclick = (ev) => { const b = ev.target.closest('button'); if (b) { close(); sync(b.dataset.w); } };
  };
  document.getElementById('g-csv').onclick = () => exportSitesCsv(lastRows, d);
  googleAcctPicker(document.getElementById('g-acct'), accts, d.items, draw);
  googleLinkFilter(document.getElementById('g-lf'), d.items, draw);
  googleTagFilter(document.getElementById('g-tf'), d.items, draw, () => lastRows);
  // AI 分析：默认勾选当前筛选的站点（按会话从多到少）
  const siteItems = (rows) => rows.map((x) => ({ host: x.host, sessions: x.cur.ga?.sessions || 0 }))
    .sort((a, b) => b.sessions - a.sessions);
  document.getElementById('g-ai').onclick = () => shareDialog(siteItems(d.items), siteItems(lastRows).map((x) => x.host));
  document.getElementById('g-new').onclick = () => newSiteDialog(() => { gFresh = true; route(); });
  document.getElementById('g-aik').onclick = aiApiDialog;
  document.getElementById('g-hq').onclick = () => hotQueriesDialog(lastRows.map((x) => x.host));
  api('/ai-tokens').then(aiBadge).catch(() => {});   // AI 提交了删除操作等确认时，按钮上显示数字
  const re = document.getElementById('g-re');
  if (re) re.onclick = () => googleConnect(re);

  // 首次连接或有待同步的站点：自动继续同步
  if (st.pending) sync();
}

async function mountSiteIndex(host) {

  if (!sc) return out;
  const pages = (sc.pages || []).filter((x) => x.impressions >= 100 && x.position <= 20 && x.ctr < gExpCtr(x.position) * 0.5)
    .map((x) => ({ ...x, lost: Math.round(x.impressions * (gExpCtr(x.position) - x.ctr)) })).filter((x) => x.lost >= 5).sort((a, b) => b.lost - a.lost).slice(0, 3);

const ADV_LV_IC = { high: 'alert', mid: 'info', low: 'help' };

async function mountAdvice(host, d, open = false) {
  const box = document.getElementById('g-adv');
  if (!box) return;
  let r;
  try { r = await api(`/google/advice?host=${encodeURIComponent(host)}`); } catch { box.remove(); return; }
  if (!box.isConnected) return;
  const ignored = new Map((r.ignored || []).map((x) => [x.rule, x.until]));
  const order = { high: 3, mid: 2, low: 1 };
  const items = [...r.items, ...advLocal(d).filter((a) => !ignored.has(a.rule))].sort((a, b) => order[b.level] - order[a.level] || b.impact - a.impact);
  if (!items.length && !ignored.size) { box.remove(); return; }
  box.hidden = false;
  // 默认收起：标题行列出每条的名称，点开看详情
  box.innerHTML = `<button type="button" class="card-h adv-hd" aria-expanded="${open}"><h3>优化建议</h3><span class="hint">${items.length ? `${items.length} 条` : '暂时没有需要处理的'}</span>
      <span class="adv-sum">${items.map((a) => `<span class="adv-c lv-${a.level}">${esc(ADV_NAME[a.rule] || a.rule)}</span>`).join('')}</span><span class="sp"></span>${ic('chev', 16)}</button>
    <div class="card-b"${open ? '' : ' hidden'}>${items.length ? `<div class="adv-l">${items.map((a) => {
      const v = advView(a);
      return `<div class="adv-i lv-${a.level}" data-rule="${a.rule}"><span class="adv-ic">${ic(ADV_LV_IC[a.level], 15)}</span>
        <div class="adv-t"><div class="adv-h"><b>${esc(v.t)}</b><span class="adv-lv">${ADV_LV[a.level]}</span></div>${advBody(v)}</div>
        <div class="adv-a">${v.go ? `<button type="button" class="btn sm" data-go="${v.go}">${esc(v.gl)}</button>` : ''}<button type="button" class="btn sm ghost" data-ign>忽略</button></div></div>`;
    }).join('')}</div>` : ''}
    ${ignored.size ? `<div class="adv-ig hint">已忽略：${[...ignored].map(([rule, until]) => `<span>${esc(ADV_NAME[rule] || rule)}<small>${until > 9e14 ? '（不再提醒）' : `（到 ${ymd(new Date(until))}）`}</small><button type="button" class="lnk" data-restore="${rule}">恢复</button></span>`).join('')}</div>` : ''}</div>`;
  const set = async (rule, days) => {
    try { await api('/google/advice/ignore', { method: 'POST', body: { host, rule, days } }); toast(days < 0 ? '已恢复提醒' : days ? '已忽略 30 天' : '以后不再提醒这一条'); mountAdvice(host, d, true); }
    catch (ex) { toast(ex.message, 'bad'); }
  };
  box.onclick = (e) => {
    const hd = e.target.closest('.adv-hd');
    if (hd) { const on = hd.getAttribute('aria-expanded') !== 'true'; hd.setAttribute('aria-expanded', on); box.querySelector('.card-b').hidden = !on; return; }
    const go = e.target.closest('[data-go]');
    if (go) return advGo(go.dataset.go);
    const rs = e.target.closest('[data-restore]');
    if (rs) return set(rs.dataset.restore, -1);
    const it = e.target.closest('.adv-i');
    if (!it) return;
    if (e.target.closest('[data-ign]')) {
      it.querySelector('.adv-a').innerHTML = `<button type="button" class="btn sm" data-ig="30">忽略 30 天</button><button type="button" class="btn sm" data-ig="0">不再提醒</button><button type="button" class="btn sm ghost" data-ig="x">取消</button>`;
      return;
    }
    const ig = e.target.closest('[data-ig]');
    if (!ig) return;
    if (ig.dataset.ig === 'x') { mountAdvice(host, d, true); return; }
    set(it.dataset.rule, Number(ig.dataset.ig));
  };
}
