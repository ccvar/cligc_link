// 概览页：站点（GA4 + Search Console）摘要，区间跟随概览换算到最接近的站点区间。
// dataP 和概览主数据并行请求；连过 Google 时首屏先放一个占位，数据回来后原地替换（或去掉），不把下面的内容往下推
const homeSitesDays = () => (state.days <= 7 ? 7 : state.days);
async function homeSitesCard(root, token, dataP) {
  const ph = root.querySelector('#home-sites');
  const d = await dataP;
  if (token !== routeToken) return;
  if (!d?.items?.length) { ph?.remove(); return; }
  const days = homeSitesDays();
  const S = (f) => d.items.reduce((a, x) => a + (f(x) || 0), 0);
  const ses = S((x) => x.cur.ga?.sessions), pses = S((x) => x.prev.ga?.sessions);
  // 搜索点击 / 展示跟着“站点”页的 Google / Bing / 合计 选择（SE），和那边的数字一致
  const clk = S((x) => SE(x)?.clicks), pclk = S((x) => SE(x, 'prev')?.clicks);
  const imp = S((x) => SE(x)?.impressions), pimp = S((x) => SE(x, 'prev')?.impressions);
  const lk = S((x) => x.linksFrom.reduce((a, l) => a + l.human, 0)), plk = S((x) => x.linksFrom.reduce((a, l) => a + l.prevHuman, 0));
  const hasP = days !== 365;
  const top = d.items.filter((x) => x.cur.ga?.sessions).sort((a, b) => b.cur.ga.sessions - a.cur.ga.sessions).slice(0, 3);
  const label = G_RANGES.find(([v]) => v === days)?.[1] || '';
  // 每个指标前面带上数据来源的图标，鼠标移上去说明
  const kc = (l, v, dl, icons, tip) => `<div class="hs-k"><span class="hs-l" data-tipf-always data-tipf="${esc(tip)}">${icons}${l}</span><div><b>${num(v)}</b>${hasP ? dl : ''}</div></div>`;
  const seIc = gState.se === 'bing' ? BRAND.bing(12) : gState.se === 'all' ? BRAND.gsc(12) + BRAND.bing(12) : BRAND.gsc(12);
  const seTip = `${gState.se === 'bing' ? '来自 Bing Webmaster' : gState.se === 'all' ? 'Google Search Console 和 Bing Webmaster 相加' : '来自 Google Search Console'}（跟着“站点”页的 Google / Bing / 合计 选择）`;
  const el = document.createElement('section');
  el.className = 'card rv home-sites';
  el.innerHTML = `<div class="card-h"><h3>站点</h3><span class="sub">${d.items.length} 个站点 · ${label}（截至 ${d.ranges.to}）</span><span class="sp"></span><a class="kc-a" href="#/sites">查看全部站点 →</a></div>
    <div class="hs-b">
      <div class="hs-ks">${kc('会话', ses, gDelta(ses, pses), BRAND.ga(12), '来自 Google Analytics 4，各站点相加')}${kc('搜索点击', clk, gDelta(clk, pclk), seIc, seTip)}${kc('搜索展示', imp, gDelta(imp, pimp), seIc, seTip)}${kc('短链点击', lk, gDelta(lk, plk), ic('link', 12), '从这些站点点出短链的真人点击（本系统记录）')}</div>
      <div class="hs-top"><div class="hs-h"><span>会话最多的站点</span><span></span><span class="hs-l" data-tipf-always data-tipf="来自 Google Analytics 4">${BRAND.ga(11)}会话</span><span></span></div>${top.map((x) => `<a class="hs-r" href="#/site/${encodeURIComponent(x.host)}"><span class="mono">${esc(x.host)}</span>
        <span class="hs-sp">${kpiSpark(downsample(x.spark.map((p) => p.n)), 'var(--accent)')}</span><b>${num(x.cur.ga.sessions)}</b>${x.prev.ga ? gDelta(x.cur.ga.sessions, x.prev.ga.sessions) : '<span></span>'}</a>`).join('')}</div>
    </div>`;
  // 放在指标卡片下面（有占位就替换占位）
  const strip = root.querySelector('.kstrip');
  ph ? ph.replaceWith(el) : strip ? strip.after(el) : root.prepend(el);
}

// 概览页“开始使用”清单和定时任务提醒的数据（/setup，只读设置，很轻）：和主数据一起请求、一起渲染，
// 免得首屏出来后再被插到顶部的卡片往下推。切换范围、短链时 5 分钟内复用；任何修改操作（非 GET 请求）后作废，见 api()
const setupData = () => {
  if (!setupMemo || Date.now() - setupMemo.at > 300000) {
    const memo = { at: Date.now() };
    memo.p = api('/setup').catch(() => { if (setupMemo === memo) setupMemo = null; return null; });
    setupMemo = memo;
  }
  return setupMemo.p;
};

// 概览页：定时任务超过 3 小时没运行（汇总、同步、通知都会停）时在顶部提示
const cronLate = (now, at) => !!at && now - at > 3 * 3600000;
const cronBannerHtml = (at) => `<div class="nstat bad rv">${ic('alert', 15)}<span>定时任务已经 ${ago(at).replace('前', '')}没有运行了：访问汇总、Google 同步和通知都会暂停。</span><span class="sp" style="flex:1"></span><a class="btn sm" href="#/settings" data-acc="sys">查看系统状态</a></div>`;
// 服务端的 /setup 还没带 cronAt 时（旧版本）：退回到单独读 /status
async function cronBanner(root, token) {
  const st = await api('/status').catch(() => null);
  if (!st?.cron || token !== routeToken || !cronLate(st.now, st.cron.at)) return;
  const box = document.createElement('div');
  box.innerHTML = cronBannerHtml(st.cron.at);
  const el = box.firstElementChild;
  el.querySelector('a').onclick = () => store.set('set:open', 'sys');
  root.prepend(el);
}

// 概览页顶部的“开始使用”清单：全部完成或点了“不再显示”后不再出现
function setupCardHtml(st) {
  if (!st || store.get('setup:hide', false)) return '';
  const steps = [
    ['link', '创建第一个短链', '把推广链接变成短链，统计每次访问', '#/links?new'],
    ['mfa', '开启两步验证', '密码泄露也登不进后台', '#/settings', 'mfa'],
    ['google', st.googleClient ? '连接 Google 账号' : '接入 Google Analytics / Search Console', '看清每个站点的访问和搜索表现', st.googleClient ? '#/sites' : '#/settings', st.googleClient ? '' : 'goo'],
    ['notify', '配置推送渠道', '日报、每周 SEO 变化和用量预警推送到 Telegram 或邮箱', '#/notify'],
    ['cloudflare', '填写 Cloudflare 凭据', '在后台看账户用量，快超出时提醒', '#/settings', 'use'],
  ];
  const done = steps.filter(([k]) => st[k]).length;
  if (done === steps.length) return '';
  // 只给没完成的步骤卡片；完成的收成标题里的一行“✓ …”
  const todo = steps.filter(([k]) => !st[k]), ok = steps.filter(([k]) => st[k]);
  return `<section class="card rv setup"><div class="card-h"><h3>开始使用</h3><span class="sub">已完成 ${done} / ${steps.length}</span>
      ${ok.length ? `<span class="setup-ok">${ok.map(([, t]) => `<i>${ic('check', 11)}${t}</i>`).join('')}</span>` : ''}<span class="sp"></span>
      <div class="setup-p"><i style="width:${(done / steps.length) * 100}%"></i></div>
      <button type="button" class="hr-more" data-hide>不再显示</button></div>
    <div class="setup-l" style="--n:${todo.length}">${todo.map(([k, t, d, href, acc]) => `<a class="setup-i" href="${href}"${acc ? ` data-acc="${acc}"` : ''}>
      <span class="setup-c"></span><div><b>${t}</b><span>${d}</span></div>${ic('chev', 14)}</a>`).join('')}</div></section>`;
}
// “开始使用”和定时任务提醒里的按钮：去设置页时展开对应的那一项
function bindSetupCard(root) {
  const el = root.querySelector('.setup');
  if (el) el.querySelector('[data-hide]').onclick = () => { store.set('setup:hide', true); el.remove(); };
  root.querySelectorAll('.setup [data-acc], .nstat [data-acc]').forEach((a) => (a.onclick = () => store.set('set:open', a.dataset.acc)));
}

let linksSeq = 0;
async function renderLinks(token, opts = {}) {
  const page = document.getElementById('lpage');
  if (!page) {
    shell('links', `<header class="ph"><div><div class="kicker">链接管理</div><h1>短链</h1><div class="sub">先创建短链，再设置默认推广地址和按国家 / 地区跳转的规则</div></div></header>
      <div class="stack">
        <section class="rv">
          <form class="quick" id="quick">
            <div class="slug"><span>${esc(HOST)}/</span><input name="slug" placeholder="后缀（留空自动生成）" data-ph-m="自定义后缀" autocomplete="off" aria-label="短链后缀"></div>
            <input class="input" name="target_url" placeholder="默认推广地址（可选，之后也能设置）" data-ph-m="推广地址（可选）" autocomplete="off" aria-label="默认推广地址">

          </form>
          <div id="qres"></div>
        </section>
        <section class="card rv" id="lpage">
          <div class="lh">
            <div class="search">${ic('search')}<input class="input" id="q" placeholder="搜索短链、目标地址、标题" value="${esc(listState.q)}" aria-label="搜索"><span class="kbd" ${listState.q ? 'hidden' : ''}>/</span><button type="button" class="s-clear" id="qx" aria-label="清除搜索" ${listState.q ? '' : 'hidden'}>${ic('x', 14)}</button></div>
            <div class="combo g-lf" id="ltag"></div>
            <span class="sp"></span>
            <div class="seg" id="sort">${[['created', '最新创建'], ['clicks', '访问最多'], ['last_click', '最近访问']]
              .map(([k, l]) => `<button data-s="${k}" class="${k === listState.sort ? 'on' : ''}">${l}</button>`).join('')}</div>
            <button class="btn" id="bulk" aria-label="批量替换目标地址">${ic('swap')}<span class="hide-m">批量替换</span></button>
            <button class="btn" id="add" aria-label="高级创建" data-tip="高级创建（标题、备注、有效期等）">${ic('plus')}<span class="hide-m">高级创建</span></button>
          </div>
          <div id="lbody">${skel(280)}</div>
          <div class="lbulk" id="lbulk" hidden></div>
        </section>
      </div>`);
    reveal(document.getElementById('page'));
    bindLinksChrome();
  }
  // 搜索、排序、筛选、翻页都用同一个 routeToken：再按请求序号丢掉比后发请求更晚回来的旧结果
  const my = ++linksSeq;
  const d = await api(`/links?q=${encodeURIComponent(listState.q)}&page=${listState.page}&size=20&sort=${listState.sort}&tz=${TZ}&tag=${encodeURIComponent(listState.tag)}`);
  if (token !== routeToken || my !== linksSeq) return;
  // 选中的分组被删除 / 改名后不存在了：恢复成全部
  if (listState.tag && listState.tag !== '+none' && !(d.tags || []).some((t) => t.tag === listState.tag)) { listState.tag = ''; return renderLinks(token, opts); }
  linkTagFilter(document.getElementById('ltag'), d.tags || []);
  // 选择只针对当前页
  const pageIds = new Set(d.items.map((l) => l.id));
  for (const id of [...listState.sel]) if (!pageIds.has(id)) listState.sel.delete(id);
  const pages = Math.max(1, Math.ceil(d.total / d.size));
  const body = document.getElementById('lbody');
  body.innerHTML = d.items.length ? `
    <div class="lrow hd"><span class="c-main"><label class="lck" aria-label="全选本页"><input type="checkbox" id="lall" ${d.items.length && d.items.every((l) => listState.sel.has(l.id)) ? 'checked' : ''}></label>短链 / 目标地址</span><span class="c-spark">近 14 天</span><span style="text-align:right" data-tipf-always data-tipf="自创建以来的真人访问；爬虫和可疑访问不算，鼠标移到数字上可以看含机器访问的总数">真人访问</span><span class="c-last">最后访问</span><span>状态</span><span></span></div>
    ${d.items.map((l) => `
    <div class="lrow ${listState.flash === l.id ? 'flash' : ''}${listState.sel.has(l.id) ? ' sel-r' : ''}" data-go="${l.id}" tabindex="0">
      <div class="c-main"><label class="lck" aria-label="选择 ${esc(l.slug)}"><input type="checkbox" data-sel="${l.id}" ${listState.sel.has(l.id) ? 'checked' : ''}></label><div style="min-width:0">
        <div class="su"><span><span class="su-h">${esc(HOST)}</span>${esc('/' + l.slug)}</span>${l.title ? `<span class="tt">· ${esc(l.title)}</span>` : ''}<a class="row-ext" href="${esc(shortUrl(l.slug))}" target="_blank" rel="noopener" data-tip="打开短链（会记录一次访问）" aria-label="打开短链">${ic('ext', 13)}</a>${(l.tags || []).map((t) => `<span class="gtg sm-t">${esc(t)}</span>`).join('')}</div>
        <div class="tg">${l.rules ? `<span class="rb has-pop" tabindex="0">${ic('route')}${l.rules} 条跳转规则${rulePop(l)}</span>` : ''}${l.arms ? `<span class="rb ab-rb" data-tipf-always data-tipf="${esc(`按比例分到 ${l.arms} 个额外版本（A/B 测试）`)}">${ic('split')}A/B</span>` : ''}<span>${l.target_url ? esc(l.target_url) : `<span class="warn">${l.rules ? '未设置默认地址' : '未设置推广地址'}</span>`}</span></div>
      </div></div>
      <div class="c-spark">${sparkline(l.spark)}</div>
      <div class="num c-clicks"${l.clicks !== l.human ? ` data-tipf-always data-tipf="${esc(clickTip(l))}"` : ''}>${num(l.human)}</div>
      <div class="tm c-last" title="${esc(fmtTime(l.last_click))}">${ago(l.last_click)}</div>
      <div class="c-status">${statusPill(l)}${l.down?.length ? `<span class="pill bad-p hc-p" data-tipf-always data-tipf="${esc(l.down.map((x) => `${x.url}：${x.error}`).join('\n'))}">目标异常</span>` : ''}</div>
      <div class="acts">
        ${copyBtn(shortUrl(l.slug))}
        <button class="btn ghost icon" data-tip="生成副本" aria-label="生成副本" data-dup="${l.id}">${ic('dup')}</button>
        <button class="btn ghost icon" data-tip="编辑" aria-label="编辑" data-edit="${l.id}">${ic('edit')}</button>
        <a class="btn ghost icon" data-tip="访问统计" aria-label="访问统计" href="#/link/${l.id}">${ic('chart')}</a>
        <button class="btn ghost icon" data-tip="二维码（手机扫码打开）" aria-label="二维码" data-qr="${esc(l.slug)}">${ic('qr')}</button>
      </div>
    </div>`).join('')}
    ${d.total > 0 ? `<div class="pager"><span>共 ${num(d.total)} 条</span>
      ${pages > 1 ? `<div class="g"><button class="btn sm" id="prev" ${listState.page <= 1 ? 'disabled' : ''}>上一页</button>
      <span class="tnum">${listState.page} / ${pages}</span>
      <button class="btn sm" id="next" ${listState.page >= pages ? 'disabled' : ''}>下一页</button></div>` : ''}</div>` : ''}`
    : `<div class="empty" style="padding:56px">${ic(listState.q || listState.tag ? 'search' : 'link')}${listState.q ? `没有找到包含 “${esc(listState.q)}” 的短链` : listState.tag ? '这个分组里没有短链' : '还没有短链，在上方粘贴一个推广链接试试'}${listState.q || listState.tag ? `<div style="margin-top:12px"><button type="button" class="btn sm" data-reset>${listState.q ? '清除搜索' : '查看全部分组'}</button></div>` : ''}</div>`;
  listState.flash = null;
  // 搜索词和分组筛选离开页面后还会保留：空结果时给一个一键恢复成全部的入口，免得以为短链丢了
  body.querySelector('[data-reset]')?.addEventListener('click', () => {
    listState.q = ''; listState.tag = ''; listState.page = 1;
    const q = document.getElementById('q');
    if (q) { q.value = ''; syncLinkSearch(); }
    renderLinks(routeToken);
  });

  // 勾选 / 全选 / 批量操作栏
  body.querySelectorAll('[data-sel]').forEach((c) => (c.onchange = () => {
    const id = Number(c.dataset.sel);
    c.checked ? listState.sel.add(id) : listState.sel.delete(id);
    c.closest('.lrow').classList.toggle('sel-r', c.checked);
    const all = document.getElementById('lall');
    if (all) all.checked = d.items.every((l) => listState.sel.has(l.id));
    bulkBar(d);
  }));
  const lall = document.getElementById('lall');
  if (lall) lall.onchange = () => {
    for (const l of d.items) lall.checked ? listState.sel.add(l.id) : listState.sel.delete(l.id);
    body.querySelectorAll('[data-sel]').forEach((c) => { c.checked = lall.checked; c.closest('.lrow').classList.toggle('sel-r', lall.checked); });
    bulkBar(d);
  };
  bulkBar(d);
  body.querySelectorAll('[data-go]').forEach((r) => {
    r.onclick = (e) => { if (!e.target.closest('button, a, label')) location.hash = '#/link/' + r.dataset.go; };
    r.onkeydown = (e) => { if (e.key === 'Enter' && e.target === r) location.hash = '#/link/' + r.dataset.go; };
  });
  body.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = (e) => {
    e.stopPropagation();
    openDrawer(d.items.find((l) => l.id == b.dataset.edit), () => renderLinks(routeToken));
  }));
  body.querySelectorAll('[data-dup]').forEach((b) => (b.onclick = (e) => {
    e.stopPropagation();
    duplicateDialog(d.items.find((l) => l.id == b.dataset.dup), (link) => {
      listState.flash = link.id; listState.page = 1;
      renderLinks(routeToken);
    });
  }));
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (prev) prev.onclick = () => { listState.page--; renderLinks(routeToken); };
  if (next) next.onclick = () => { listState.page++; renderLinks(routeToken); };
  if (opts.openNew) openDrawer(null, () => renderLinks(routeToken));
}

// 短链列表的分组筛选
function linkTagFilter(root, tags) {
  if (!root) return;
  const MANAGE = '+manage';
  dropdown(root, {
    value: listState.tag, aria: '按分组筛选', search: tags.length > 8 ? '搜索分组' : '', empty: '没有匹配的分组', minWidth: 220, maxWidth: 300,
    groups: (q) => q ? [['', tags.map((t) => t.tag).filter((t) => t.toLowerCase().includes(q))]]
      : [['', ['']], ...(tags.length ? [['分组', [...tags.map((t) => t.tag), '+none']], ['', [MANAGE]]] : [])],
    button: (v) => `${ic('tag', 14)}<span class="nm">${!v ? '全部分组' : v === '+none' ? '未分组' : esc(v)}</span>`,
    option: (v, q) => v === MANAGE ? `<span class="ot g-op g-sep">${ic('edit', 14)}管理分组…</span>`
      : !v ? '<span class="ot">全部分组</span>' : v === '+none' ? '<span class="ot">未分组</span>'
      : `<span class="ot">${hl(v, q)}<small>${tags.find((t) => t.tag === v)?.n || 0} 个</small></span>`,
    onChange: (v) => {
      if (v === MANAGE) { linkTagFilter(root, tags); return tagManageDialog(() => renderLinks(routeToken), LINK_TAGS); }
      listState.tag = v; listState.page = 1; listState.sel.clear(); renderLinks(routeToken);
    },
  });
}

// 批量操作栏：选中短链后出现
function bulkBar(d) {
  const bar = document.getElementById('lbulk');
  if (!bar) return;
  const ids = [...listState.sel];
  bar.hidden = !ids.length;
  if (!ids.length) { bar.innerHTML = ''; return; }
  const chosen = d.items.filter((l) => listState.sel.has(l.id));
  const run = async (action, extra = {}, msg = '已完成') => {
    try { await api('/links/bulk', { method: 'POST', body: { ids, action, ...extra } }); toast(msg); listState.sel.clear(); renderLinks(routeToken); }
    catch (ex) { toast(ex.message, 'bad'); }
  };
  bar.innerHTML = `<b>已选 ${ids.length} 个</b><span class="sp"></span>
    <button type="button" class="btn sm ghost" data-a="enable">启用</button>
    <button type="button" class="btn sm ghost" data-a="disable">停用</button>
    <button type="button" class="btn sm ghost" data-a="tag">${ic('tag', 14)}加到分组</button>
    ${chosen.some((l) => l.tags?.length) ? `<button type="button" class="btn sm ghost" data-a="untag">移出分组</button>` : ''}
    <button type="button" class="btn sm ghost danger-t" data-a="delete">${ic('trash', 14)}删除</button>
    <button type="button" class="btn sm" data-a="clear">取消选择</button>`;
  bar.querySelectorAll('[data-a]').forEach((b) => (b.onclick = async () => {
    const a = b.dataset.a;
    if (a === 'clear') { listState.sel.clear(); return renderLinks(routeToken); }
    if (a === 'enable') return run('enable', {}, `已启用 ${ids.length} 个短链`);
    if (a === 'disable') {
      const ok = await confirmDialog({ title: `停用 ${ids.length} 个短链？`, text: '停用后访问这些短链会返回 404，可以随时重新启用。', ok: '停用' });
      return ok && run('disable', {}, `已停用 ${ids.length} 个短链`);
    }
    if (a === 'tag') {
      const tag = await tagDialog({ title: `把 ${ids.length} 个短链加到分组`, tags: d.tags || [], ok: '加入分组' });
      return tag && run('tag', { tag }, `已加到“${tag}”`);
    }
    if (a === 'untag') {
      const own = [...new Set(chosen.flatMap((l) => l.tags || []))].map((t) => ({ tag: t, n: chosen.filter((l) => l.tags?.includes(t)).length }));
      const tag = await tagDialog({ title: `把 ${ids.length} 个短链移出分组`, text: '点下面的分组名，或输入要移出的分组。', tags: own, ok: '移出', value: own.length === 1 ? own[0].tag : '' });
      return tag && run('untag', { tag }, `已移出“${tag}”`);
    }
    if (a === 'delete') {
      const clicks = chosen.reduce((s2, l) => s2 + (l.clicks || 0) - (l.flood || 0), 0);
      const ok = await confirmDialog({ title: `删除 ${ids.length} 个短链？`, text: `会同时删除它们的跳转规则和 ${num(clicks)} 条访问记录，无法恢复。`, ok: '删除', danger: true });
      return ok && run('delete', {}, `已删除 ${ids.length} 个短链`);
    }
  }));
}

// 短链搜索框右侧：有内容时显示清除按钮，没内容时显示 "/" 快捷键提示
function syncLinkSearch() {
  const q = document.getElementById('q'), qx = document.getElementById('qx');
  if (!q || !qx) return;
  qx.hidden = !q.value;
  q.parentElement.querySelector('.kbd').hidden = !!q.value;
}

function bindLinksChrome() {
  const q = document.getElementById('q'), qx = document.getElementById('qx');
  let t;
  q.oninput = () => { syncLinkSearch(); clearTimeout(t); t = setTimeout(() => { listState.q = q.value.trim(); listState.page = 1; renderLinks(routeToken); }, 250); };
  qx.onclick = () => { clearTimeout(t); q.value = ''; syncLinkSearch(); listState.q = ''; listState.page = 1; renderLinks(routeToken); q.focus(); };
  q.onkeydown = (e) => { if (e.key === 'Escape' && q.value) { e.stopPropagation(); qx.click(); } };
  const sort = document.getElementById('sort');
  segThumb(sort);
  sort.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    listState.sort = b.dataset.s; store.set('sort', listState.sort); listState.page = 1;
    sort.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    segThumb(sort);
    renderLinks(routeToken);
  }));
  document.getElementById('add').onclick = () => openDrawer(null, () => renderLinks(routeToken));
  document.getElementById('bulk').onclick = () => openBulkReplace(() => renderLinks(routeToken));

  const form = document.getElementById('quick');
  const qSlug = form.querySelector('[name=slug]'), qTarget = form.querySelector('[name=target_url]'), qBtn = form.querySelector('button');
  // 后缀和默认地址至少填一个才能创建。按钮不禁用：触屏上看不到 title，灰掉的按钮没有任何说明；
  // 都没填时点一下，提交里会弹出提示并把光标放到后缀框
  const syncQuick = () => {
    const empty = !qSlug.value.trim() && !qTarget.value.trim();
    qBtn.title = empty ? '请填写短链后缀或默认推广地址' : '';
  };
  qSlug.oninput = qTarget.oninput = syncQuick;
  syncQuick();
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!qSlug.value.trim() && !qTarget.value.trim()) { toast('请填写短链后缀或默认推广地址', 'bad'); qSlug.focus(); return; }
    const f = new FormData(form);
    const target = withScheme(String(f.get('target_url')).trim());
    if (httpTypo(target)) { toast('网址的 http / https 好像拼错了，请检查一下', 'bad'); qTarget.focus(); return; }
    const btn = qBtn; btn.disabled = true;
    try {
      const link = await api('/links', { method: 'POST', body: { target_url: target, slug: String(f.get('slug')).trim() } });
      form.reset(); syncQuick();
      await copy(shortUrl(link.slug), '短链已创建并复制');
      // 没填地址：直接进入详情页设置跳转规则
      if (!link.target_url) { location.hash = '#/link/' + link.id; return; }
      document.getElementById('qres').innerHTML = `<div class="result">${ic('check')}
        <span class="u">${esc(shortDisp(link.slug))}</span><span class="hint" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">→ ${esc(link.target_url)}</span>
        ${copyBtn(shortUrl(link.slug), 'btn sm', '复制')}
        <button class="btn sm" id="qedit">${ic('edit', 14)}补充标题</button></div>`;
      document.getElementById('qedit').onclick = () => openDrawer(link, () => renderLinks(routeToken));
      listState.flash = link.id; listState.q = ''; listState.page = 1; q.value = ''; syncLinkSearch();
      if (listState.sort !== 'created') {

        sort.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.s === 'created'));
        segThumb(sort);

// 列表里“N 条地区规则”的悬停浮层：每条规则的国家和跳转地址

// 批量替换目标地址：先预览影响范围，确认后一次性替换
function openBulkReplace(onDone) {
  let mode = store.get('bulk:mode', 'exact'), last = null, timer, seq = 0;
  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('form'); dr.className = 'drawer bulk'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  dr.innerHTML = `
    <div class="dh"><h2>批量替换目标地址</h2><button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">
      <div class="field"><label>匹配方式</label>
        <div class="seg" id="b-mode">${[['exact', '完全匹配'], ['contains', '包含替换']].map(([k, l]) => `<button type="button" data-m="${k}" class="${k === mode ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="hint" id="b-hint"></div></div>
      <div class="field"><label for="b-find">原始链接</label>
        <input class="input" id="b-find" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="b-to">替换为</label>
        <input class="input" id="b-to" autocomplete="off" spellcheck="false"></div>
      <div class="bulk-res" id="b-res"><div class="bulk-empty">${ic('search', 18)}填写原始链接后，这里会列出会被替换的地址</div></div>
    </div>
    <div class="df">
      <span class="hint" id="b-sum"></span><span class="sp"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary" id="b-go" disabled>替换</button>
    </div>`;
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dialog')) close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = close;
  dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
  document.body.append(ov, dr);

  const $ = (q) => dr.querySelector(q);
  const fi = $('#b-find'), ti = $('#b-to'), res = $('#b-res'), sum = $('#b-sum'), go = $('#b-go');
  const hint = () => {
    $('#b-hint').textContent = mode === 'exact'
      ? '地址与原始链接完全一致时，整条换成新链接。'
      : '把地址中出现的这一段换掉，其余部分不变。适合换域名、换推广码（如 ref=OLD → ref=NEW）。';
    fi.placeholder = mode === 'exact' ? 'https://old.example.com/register?ref=OLD' : '例如 ref=OLD 或 old.example.com';
    ti.placeholder = mode === 'exact' ? 'https://new.example.com/register?ref=NEW' : '例如 ref=NEW 或 new.example.com';
  };
  segThumb($('#b-mode'));
  $('#b-mode').querySelectorAll('button').forEach((b) => (b.onclick = () => {
    mode = b.dataset.m; store.set('bulk:mode', mode);
    $('#b-mode').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    segThumb($('#b-mode')); hint(); preview();
  }));
  hint();

  // 把原地址里匹配的部分 / 新地址里替换进去的部分标出来
  const mark = (u, part, cls) => {
    if (!part || mode === 'exact') return esc(u);
    return u.split(part).map(esc).join(`<mark class="${cls}">${esc(part)}</mark>`);
  };
  const render = (d) => {
    last = d;
    if (!d.total) {
      res.innerHTML = `<div class="bulk-empty">${ic('inbox', 18)}没有找到${mode === 'exact' ? '完全一致的' : '包含这段内容的'}地址</div>`;
      sum.textContent = ''; go.disabled = true; go.textContent = '替换'; return;
    }
    sum.innerHTML = `共 <b>${num(d.total)}</b> 处 · ${d.affected} 个短链`;
    go.textContent = `替换 ${num(d.total)} 处`;
    go.disabled = !ti.value.trim() || !!d.invalid;
    res.innerHTML = `
      <div class="bulk-stat"><div><b>${num(d.links)}</b><span>个默认地址</span></div><div><b>${num(d.rules)}</b><span>条规则 / 分流地址</span></div>${d.webs ? `<div><b>${num(d.webs)}</b><span>个备用网页</span></div>` : ''}<div><b>${num(d.affected)}</b><span>个短链受影响</span></div></div>
      ${d.invalid ? `<div class="bulk-bad">${ic('info', 15)}替换后 /${esc(d.invalid.slug)} 的地址不合法：<code>${esc(d.invalid.to)}</code></div>` : ''}
      <div class="bulk-list">${d.items.map((x) => `<div class="bi">
        <div class="bi-h"><span class="mono">/${esc(x.slug)}</span><span class="bi-t">${x.type === 'link' ? '默认地址' : x.type === 'app_web' ? '打不开 App 时去的网页' : esc(ruleText(x))}</span></div>
        <div class="bi-u from" title="${esc(x.from)}">${mark(x.from, fi.value.trim(), 'del')}</div>
        <div class="bi-u to" title="${esc(x.to)}">${ic('arrow', 12)}<span>${ti.value.trim() ? mark(x.to, ti.value.trim(), 'add') : '<em>填写“替换为”后显示</em>'}</span></div>
      </div>`).join('')}</div>
      ${d.total > d.items.length ? `<div class="hint" style="margin-top:8px">只显示前 ${d.items.length} 处，执行时会全部替换。</div>` : ''}`;
  };
  const preview = () => {
    clearTimeout(timer);
    const find = fi.value.trim();
    if (!find) { res.innerHTML = `<div class="bulk-empty">${ic('search', 18)}填写原始链接后，这里会列出会被替换的地址</div>`; sum.textContent = ''; go.disabled = true; return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        let to = ti.value.trim();
        if (mode === 'exact') to = withScheme(to);
        if (mode === 'exact' && to && httpTypo(to)) { res.innerHTML = `<div class="bulk-bad">${ic('info', 15)}网址的 http / https 好像拼错了，请检查一下</div>`; go.disabled = true; return; }
        const d = await api('/links/replace', { method: 'POST', body: { mode, find, replace: to || (mode === 'exact' ? 'https://placeholder.invalid/' : find), dry: true } });
        if (my === seq) render(d);
      } catch (err) {
        if (my === seq) { res.innerHTML = `<div class="bulk-bad">${ic('info', 15)}${esc(err.message)}</div>`; go.disabled = true; }
      }
    }, 350);
  };
  fi.oninput = preview; ti.oninput = preview;
  fi.focus();

  dr.onsubmit = async (e) => {
    e.preventDefault();
    if (!last || !last.total) return;
    let to = ti.value.trim();
    if (mode === 'exact') to = withScheme(to);
    if (mode === 'exact' && httpTypo(to)) { toast('网址的 http / https 好像拼错了，请检查一下', 'bad'); return; }
    const ok = await confirmDialog({
      title: `替换 ${num(last.total)} 处地址？`,
      text: `会修改 ${last.affected} 个短链：${last.links} 个默认地址、${last.rules} 条规则 / 分流地址${last.webs ? `、${last.webs} 个备用网页` : ''}。替换后立即生效，之后的访问都会跳到新地址。`,
      ok: '确认替换',
    });
    if (!ok) return;
    go.disabled = true;
    try {
      const d = await api('/links/replace', { method: 'POST', body: { mode, find: fi.value.trim(), replace: to, dry: false } });
      close(); toast(`已替换 ${num(d.total)} 处地址`); onDone();
    } catch (err) { toast(err.message, 'bad'); go.disabled = false; }
  };
}

function statusPill(l) {
  if (!l.enabled) return '<span class="pill off">已停用</span>';
  if (l.expires_at && l.expires_at < Date.now()) return '<span class="pill exp">已过期</span>';
  return '<span class="pill on">生效中</span>';

function toLocalInput(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 表单抽屉：点遮罩时如果有没保存的修改，不直接关掉（免得一下子丢了填好的内容），轻轻晃一下并提示；Esc、取消、× 照常关闭
// 搜索框和按搜索过滤出来的列表不算修改（已选的国家等由 extra 记录）
const formSnap = (root, extra = () => '') => JSON.stringify([...root.querySelectorAll('input, textarea, select')].filter((e) => !e.closest('.psearch, .plist, .pop'))
  .map((e) => (e.type === 'checkbox' || e.type === 'radio' ? e.checked : e.value))) + extra();
const unsavedNudge = (dr) => {
  dr.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }], { duration: 260 });
  toast(`有没保存的修改：点“${dr.querySelector('.df .primary')?.textContent.trim() || '保存'}”，或点“取消”放弃`, 'warn');
};
function guardOverlay(ov, dr, close, extra) {

  ov.onclick = () => {
    if (formSnap(dr, extra) === s0) return close();
    unsavedNudge(dr);
  };
}

  if (del) del.onclick = async () => {
    // 访问记录多时提醒：删除明细每条都算 D1 写入；只是不想再跳转的话停用就行
    const many = (link.clicks || 0) - (link.flood || 0) > 2000;
    const ok = await confirmDialog({ title: `删除 /${link.slug}？`, text: many
      ? `短链和它的 ${num(link.clicks - (link.flood || 0))} 条访问记录都会被删除，无法恢复。每删一条约占 4 行 D1 写入，免费版每天 10 万行，用完后当天所有短链都会暂时打不开；只是不想让它再跳转的话，可以改为停用。`
      : '短链和它的全部访问记录都会被删除，无法恢复。', ok: '删除', danger: true });
    if (!ok) return;
    // 删除失败（网络、会话过期等）要提示出来，不然点了确认像是没反应
    del.disabled = true;
    try { await api('/links/' + link.id, { method: 'DELETE' }); }
    catch (ex) { toast(ex.message, 'bad'); del.disabled = false; return; }
    close(); toast('已删除');
    if (location.hash.startsWith('#/link/')) location.hash = '#/links'; else onDone();
  };

  dr.onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(dr);
    const target = dKind.value();
    const terr = dKind.check();
    if (terr) { dr.querySelector('.err').textContent = terr; return; }
    const aw = withScheme(f.get('app_web') || '');
    if (aw && (httpTypo(aw) || isAppUrl(aw))) { dr.querySelector('.err').textContent = '“打不开 App 时去的网页”要填网址（https://…），而且 http / https 不能拼错'; dr.querySelector('#f-aw').focus(); return; }
    const body = {
      target_url: target, app_web: aw, slug: String(f.get('slug')).trim(), title: f.get('title'), note: f.get('note'),
      enabled: f.get('enabled') === 'on', pass_query: f.get('pass_query') === 'on', utm: f.get('utm') === 'on',
      expires_at: f.get('expires_at') ? new Date(f.get('expires_at')).getTime() : null,
    };
    if (isNew && bothEmpty()) { dr.querySelector('.err').textContent = '请填写短链后缀或默认推广地址'; dSlug.focus(); return; }
    if (!isNew && !body.slug) delete body.slug;
    // 改后缀：旧短链和已经印出去的二维码会立即 404（服务端不保留旧后缀），保存前确认一次。
    // 后缀格式不对时不弹，直接交给服务端报错
    if (!isNew && body.slug && body.slug !== link.slug && /^[A-Za-z0-9_-]{1,64}$/.test(body.slug)
      && !(await confirmDialog({ title: `把 /${link.slug} 改成 /${body.slug}？`, text: '旧短链和已经发出去、印出去的二维码会立即打不开（返回 404）。', ok: '确认修改', danger: true }))) {
      dSlug.focus();
      return;
    }
    const btn = dBtn; btn.disabled = true;
    try {
      const saved = await api(isNew ? '/links' : '/links/' + link.id, { method: isNew ? 'POST' : 'PUT', body });
      close();
      if (isNew) { listState.flash = saved.id; await copy(shortUrl(saved.slug), '短链已创建并复制'); } else toast('已保存');
      onDone(saved);
    } catch (err) { dr.querySelector('.err').textContent = err.message; btn.disabled = false; syncDrawer(); }
  };
}

      d.sources.map((x) => { const l = x.linksFrom[0], ses = x.cur.ga?.sessions;
        return `<tr data-href="#/site/${encodeURIComponent(x.host)}" tabindex="0">${site(x)}

    + (d.targets?.length ? card('目标站点', `这个短链跳转到的站点 · 最近 28 天`,
      `<th>站点</th><th>跳转去向</th><th class="r"><span data-tipf-always data-tipf="这个短链跳转到该站点的真人访问次数">短链点击</span></th>${d.utm
        ? '<th class="r"><span data-tipf-always data-tipf="GA4 里来源为 cligc、广告系列为这个短链后缀的会话">到站会话</span></th><th class="r"><span data-tipf-always data-tipf="到站会话 ÷ 短链真人点击；访客没加载完页面就离开、或屏蔽了 GA4 时不会计入">到达率</span></th><th class="r">关键事件</th>' : ''}<th class="r">站点会话</th><th class="r">搜索点击</th>`,

      d.utm ? '' : `<div class="g-empty sm-e"><span class="g-empty-i">${ic('chart', 16)}</span><div><b>想看这个短链带来了多少到站会话和转化？</b>

            <div class="heat-ax"><span>0 时</span><span>6 时</span><span>12 时</span><span>18 时</span></div>
            <div class="hint" style="margin-top:14px">访问最多的时段：${(() => { const t = [...s.hourly].sort((a, b) => b.n - a.n)[0]; return `${t.k}:00 – ${t.k + 1}:00（${num(t.n)} 次）`; })()}</div>`
            : `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`}
          </div></section>
        ${tabCard('t-dev', '设备', [
          { label: '设备', html: rankList(s.devices, { head: ['设备类型', '访问'], fmt: devName }) },
          { label: '系统', html: rankList(s.oses, { head: ['操作系统', '访问'] }) },
          { label: '浏览器', html: rankList(s.browsers, { head: ['浏览器', '访问'] }) },
          { label: '访客类型', html: (kindMix(s.kinds) || `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`)
            + (s.reasons?.length ? `<div class="kmix-r">${rankList(s.reasons, { head: ['爬虫 / 可疑原因', '访问'] })}</div>` : '') },
        ], 'rv')}
        </div>
      </div>

      <div class="grid2">
        ${tabCard('t-src', '来源', [
          { label: '来源', html: rankList(s.sources, { head: ['来源站点', '访问'] }) },
          { label: 'Referer', html: rankList(s.refererHosts, { head: ['Referer 域名', '访问'], fmt: (k) => k || '(无 Referer)' })
            + (s.refererHosts.some((x) => !x.k) ? `<div class="tipbox sm">${ic('info', 15)}<div><b>为什么有“无 Referer”？</b>
              对方链接加了 <code>rel="noreferrer"</code>、页面设置了不发送来源、从微信等 App 内打开，或从 https 跳到 http 时，浏览器都不会带上来源。
              投放时用顶部“投放链接”生成的 <code>?src=</code> 链接，就能准确区分来源。</div></div>` : '') },
          { label: 'utm_source', html: rankList((s.utmSources || []).filter((x) => x.k), { head: ['utm_source', '访问'] }) },
          { label: 'Campaign', html: rankList(campaigns, { head: ['utm_campaign', '访问'] }) },
        ], 'rv')}
        ${tabCard('t-geo', '地区', [
          { label: '国家', html: rankList(s.countries, { head: ['国家 / 地区', '访问'], fmt: country }) },
          { label: '城市', html: rankList(s.cities, { head: ['城市', '访问'], fmt: (k) => k || '未知' }) },
        ], 'rv')}
      </div>


      <div id="lk-gs"></div>
      ${clicksHtml(c)}
    </div>`;

  const page = document.getElementById('page');
  reveal(page);
  countUp(page);
  bindRange(route);
  linkSitesCard(token, id);
  mountChart(document.getElementById('ch-link'), series, [
    { id: 'n', key: 'n', label: '访问次数', color: 'var(--accent)', type: 'area' },
    { id: 'u', key: 'u', label: '独立访客', color: 'var(--violet)', type: 'line' },
    { id: 'p', key: 'p', label: `上一个 ${rangeLabel()}`, type: 'dash' },
  ], document.getElementById('lg'));
  document.getElementById('edit').onclick = () => openDrawer(link, (saved) => saved ? route() : null);
  bindRules(link);
  let clickSeq = 0;
  const bindPager = () => {
    const go = async (dp) => {
      const my = ++clickSeq, want = clickState.page + dp;
      const btns = [...document.querySelectorAll('#lk-clicks .pager button')], was = btns.map((b) => b.disabled);
      btns.forEach((b) => (b.disabled = true));
      try {
        const c2 = await api(`/links/${id}/clicks?page=${want}&size=30&bots=${state.bots ? 1 : 0}`);
        if (my !== clickSeq || token !== routeToken) return;
        // 这一页没数据了（期间有记录被清理）：留在当前页
        if (!c2.items.length && c2.total && want > 1) { btns.forEach((b, i) => (b.disabled = was[i])); return; }
        clickState.page = want;
        const sec = document.getElementById('lk-clicks');
        if (!sec) return;
        sec.outerHTML = clicksHtml(c2, false);
        bindPager();
        // 换页后让明细的开头在视野里（只在它跑到屏幕上方时才滚）
        const el = document.getElementById('lk-clicks');
        if (el && el.getBoundingClientRect().top < 0) el.scrollIntoView({ block: 'start' });
      } catch (ex) { toast(ex.message, 'bad'); btns.forEach((b, i) => (b.disabled = was[i])); }
    };
    const prev = document.getElementById('prev'), next = document.getElementById('next');
    if (prev) prev.onclick = () => go(-1);
    if (next) next.onclick = () => go(1);
  };
  bindPager();

  // 顶部按钮打开侧边面板；面板已打开时（如刚保存了规则）用新数据刷新
  document.querySelectorAll('[data-panel-open]').forEach((b) => (b.onclick = () => openLinkPanel(b.dataset.panelOpen, link, s)));
  const cur = document.querySelector('.drawer[data-panel]');
  if (cur) fillLinkPanel(cur, cur.dataset.panel, link, s);
}

// ---------------------------------------------------------------- 详情页侧边面板：跳转规则 / 投放链接
function openLinkPanel(kind, link, s) {
  document.querySelectorAll('.drawer[data-panel]').forEach((d) => d._close());
  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('div'); dr.className = 'drawer panel'; dr.dataset.panel = kind;
  dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  dr._dismiss = close;
  // 规则编辑抽屉、确认框叠在上面时，Esc 先关上层
  const onKey = (e) => { if (e.key === 'Escape' && [...document.querySelectorAll('.drawer')].pop() === dr && !document.querySelector('.dialog')) close(); };
  dr._close = close;
  document.addEventListener('keydown', onKey);
  ov.onclick = close;
  document.body.append(ov, dr);
  fillLinkPanel(dr, kind, link, s);
}

function fillLinkPanel(dr, kind, link, s) {
  if (kind === 'log') return fillLogPanel(dr, link);
  const isRules = kind === 'rules';
  dr.innerHTML = `
    <div class="dh"><div style="flex:1;min-width:0"><h2>${isRules ? '跳转规则' : '按站点生成投放链接'}</h2>
      <div class="hint">${isRules ? `按访问者所在国家 / 地区或设备跳到不同地址 · 命中数为最近 ${rangeLabel()}` : '每个站点用不同链接，来源统计更准'}</div></div>
      <button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">${isRules ? rulesCard(link, s) : `<div class="builder">
      <div>
        <div class="combo b-pick" id="b-pick" hidden></div>
        <textarea class="textarea" id="sites" rows="5" placeholder="每行一个站点名，例如：&#10;zhihu&#10;weibo&#10;forum-a" aria-label="站点名"></textarea>
        <div class="hint" style="margin-top:8px">会生成 <code>?src=站点名</code> 的链接，统计里“来源”会按它归类，不受对方网站设置影响。用站点域名（如 gaterar.com）时，“站点”页能自动把点击算到这个站点。</div>
      </div>
      <div class="blist" id="blist"></div>
      <div class="tipbox wide">${ic('info', 16)}<div>
        <b>放到网页上时，不要给链接加 <code>rel="noreferrer"</code></b>
        加了之后浏览器不会告诉我们访客从哪个网站来，“Referer”统计会记成直接访问。点 ${ic('code', 13)} 可以复制写法正确的 HTML：
        <code class="snip">&lt;a href="…?src=站点名" target="_blank" rel="noopener"&gt;…&lt;/a&gt;</code>
      </div></div></div>`}</div>`;
  dr.querySelector('[data-close]').onclick = dr._close;
  if (isRules) { bindRules(link); return; }
  const url = shortUrl(link.slug);
  // 投放链接生成
  const sites = document.getElementById('sites'), blist = document.getElementById('blist');
  const key = 'sites:' + link.id;
  sites.value = store.get(key, '');
  const build = () => {
    store.set(key, sites.value);
    const names = [...new Set(sites.value.split(/[\n,，]/).map((s) => s.trim()).filter(Boolean))];
    if (!names.length) { blist.innerHTML = `<div class="empty" style="padding:24px;border:1px dashed var(--line);border-radius:12px">在上方输入站点名，这里会生成对应的投放链接</div>`; return; }
    const urls = names.map((n) => `${url}?src=${encodeURIComponent(n)}`);
    const text = link.title || '点击访问';
    // noopener 保证安全，但不加 noreferrer，以便统计 Referer
    const html = (u) => `<a href="${u}" target="_blank" rel="noopener">${text}</a>`;
    blist.innerHTML = urls.map((u) => `<div class="b"><code title="${esc(u)}">${esc(u.replace(/^https?:\/\//, ''))}</code>
      <button class="btn sm ghost icon" data-tip="复制 HTML 代码" aria-label="复制 HTML 代码（不含 noreferrer）" data-copy="${esc(html(u))}"><span class="sw"><span class="no">${ic('code', 15)}</span><span class="ok">${ic('check', 15)}</span></span></button>
      ${copyBtn(u, 'btn sm ghost icon')}</div>`).join('')
      + (urls.length > 1 ? `<div style="margin-top:4px">${copyBtn(urls.join('\n'), 'btn sm', `复制全部 ${urls.length} 条`)}</div>` : '');
  };
  sites.oninput = build;
  build();
  setTimeout(() => sites.focus(), 250);
  // 从 Google 站点列表添加（连接了 Google 时才显示）
  const pick = document.getElementById('b-pick');
  api('/google/hosts').then((d) => {
    if (!d.items?.length || !pick.isConnected) return;
    pick.hidden = false;
    const hosts = d.items.map((x) => x.host), names = new Map(d.items.map((x) => [x.host, x.name]));
    const has = () => new Set(sites.value.split(/[\n,，]/).map((v) => v.trim()).filter(Boolean));
    dropdown(pick, {
      value: null, aria: '从站点列表添加', search: '搜索站点', empty: '没有匹配的站点', minWidth: 280, maxWidth: 360,
      groups: (q) => [[q ? '' : `站点 · 共 ${hosts.length} 个`, hosts.filter((h) => !q || h.includes(q) || (names.get(h) || '').toLowerCase().includes(q))]],
      button: () => `${ic('plus', 14)}<span class="nm">从站点列表添加</span>`,
      option: (h, q) => `<span class="ot"><span class="mono">${hl(h, q)}</span>${has().has(h) ? '<small>已添加</small>' : ''}</span>`,
      onChange: (h) => {
        if (!has().has(h)) sites.value = (sites.value.trim() ? sites.value.trim() + '\n' : '') + h;
        build();
      },
    });
  }).catch(() => {});
}


// ---------------------------------------------------------------- 跳转规则
// 搜索关键字高亮
function hl(text, q) {
  const i = q ? text.toLowerCase().indexOf(q) : -1;
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + q.length))}</mark>` + esc(text.slice(i + q.length));
}

/**
 * 通用下拉框（替代原生 select）
 * o.value       当前值
 * o.groups(q)   返回 [[分组标题, 值数组], ...]；q 为搜索词（无搜索框时为空）
 * o.button(v)   按钮里显示的内容（HTML）
 * o.option(v,q) 选项内容（HTML）
 * o.search      搜索框占位文字；不传则不显示搜索框
 * o.onChange(v) 选中后回调
 * 键盘：↑ ↓ 移动，Enter 选择，Esc 关闭
 */
function dropdown(root, o) {
  let value = o.value;
  root.innerHTML = `<button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(o.aria || '')}"></button>`;
  const btn = root.firstElementChild;
  const paint = () => { btn.innerHTML = o.button(value) + ic('chev', 14); };
  paint();

  let pop = null, input = null, opts, items = [], act = 0;
  const place = () => {
    const r = btn.getBoundingClientRect(), h = pop.offsetHeight;
    const w = Math.min(o.maxWidth || 260, Math.max(r.width, o.minWidth || 220), innerWidth - 16);
    pop.style.width = w + 'px';
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    const up = innerHeight - r.bottom < h + 12 && r.top > innerHeight - r.bottom;
    pop.classList.toggle('up', up);
    pop.style.top = (up ? r.top - h - 6 : r.bottom + 6) + 'px';
  };
  const mark = (scroll) => {
    const els = opts.querySelectorAll('.oi');
    els.forEach((el, i) => { el.classList.toggle('act', i === act); if (i === act) opts.setAttribute('aria-activedescendant', el.id); });
    if (scroll && els[act]) els[act].scrollIntoView({ block: 'nearest' });
  };
  const render = () => {
    const q = input ? input.value.trim().toLowerCase() : '';
    const groups = o.groups(q);
    items = groups.flatMap((g) => g[1]);
    act = q ? 0 : Math.max(0, items.indexOf(value));
    let n = 0;
    opts.innerHTML = items.length
      ? groups.map(([t, vs]) => (t ? `<div class="og">${t}</div>` : '') + vs.map((v) => {
        const i = n++;
        return `<div class="oi ${v === value ? 'sel' : ''}" id="oi-${i}" role="option" aria-selected="${v === value}" data-i="${i}">${o.option(v, q)}${v === value ? ic('check', 14) : ''}</div>`;
      }).join('')).join('')
      : `<div class="empty" style="padding:24px 12px">${o.empty || '没有匹配的选项'}</div>`;
    mark(true);
  };
  const choose = (v) => {
    close();
    btn.focus();
    if (v === value && !o.repeat) return;
    value = v; paint(); o.onChange && o.onChange(v);
  };
  const onKey = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (items.length) { act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; mark(true); }
    } else if (e.key === 'Enter' || (!input && e.key === ' ')) { e.preventDefault(); if (items.length) choose(items[act]); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); btn.focus(); }
    // Tab：收起选项，焦点回到下拉按钮，浏览器再从按钮往后移（选项框被移除后焦点不会丢到页面开头）
    else if (e.key === 'Tab') { close(); btn.focus(); }
  };
  const outside = (e) => { if (pop && !pop.contains(e.target) && !root.contains(e.target)) close(); };
  const onScroll = (e) => { if (pop && !pop.contains(e.target)) place(); };
  function close() {
    if (!pop) return;
    pop.remove(); pop = null; input = null;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', outside, true);
    document.removeEventListener('scroll', onScroll, true);
    removeEventListener('resize', close);
  }
  const open = () => {
    document.querySelectorAll('.pop').forEach((x) => x.remove());
    pop = document.createElement('div');
    pop.className = 'pop' + (o.search ? '' : ' plain');
    pop.innerHTML = (o.search ? `<div class="ps">${ic('search', 15)}<input placeholder="${esc(o.search)}" autocomplete="off" aria-label="${esc(o.search)}"></div>` : '')
      + '<div class="opts" role="listbox" tabindex="-1"></div>';
    document.body.appendChild(pop);
    input = pop.querySelector('input'); opts = pop.querySelector('.opts');
    btn.setAttribute('aria-expanded', 'true');
    render(); place();
    (input || opts).focus();
    if (input) input.oninput = () => { render(); place(); };
    (input || opts).onkeydown = onKey;
    opts.onmousemove = (e) => {
      const el = e.target.closest('.oi');
      if (!el) return;
      const i = Number(el.dataset.i);
      if (i !== act) { act = i; mark(false); }
    };
    opts.onclick = (e) => { const el = e.target.closest('.oi'); if (el) choose(items[Number(el.dataset.i)]); };
    document.addEventListener('mousedown', outside, true);
    document.addEventListener('scroll', onScroll, true);
    addEventListener('resize', close);
  };
  btn.onclick = () => (pop ? close() : open());
  btn.onkeydown = (e) => { if ((e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') && !pop) { e.preventDefault(); open(); } };
  return { get value() { return value; } };
}

// 国家 / 地区下拉框（可搜索中文名或代码）
function countryCombo(root, value, onChange) {
  const rest = ISO.filter((c) => !COMMON.includes(c)).sort((a, b) => cname(a).localeCompare(cname(b), EN ? 'en' : 'zh'));
  return dropdown(root, {
    value, onChange, aria: '选择国家或地区', search: '搜索国家或代码', empty: '没有匹配的国家 / 地区',
    groups: (q) => (q ? [['', ISO.filter((c) => c.toLowerCase().includes(q) || cname(c).toLowerCase().includes(q))]] : [['常用', COMMON], ['全部', rest]]),
    button: (c) => `<span class="f">${flag(c)}</span><span class="nm">${esc(cname(c))}</span><code>${c}</code>`,
    option: (c, q) => `<span class="f">${flag(c)}</span><span class="ot">${hl(cname(c), q)}</span><code>${hl(c, q)}</code>`,
  });
}

function rulesCard(link, s) {
  const hits = new Map((s.targets || []).map((x) => [x.k, x.n]));
  const total = Math.max(1, s.summary.total);
  const max = Math.max(1, ...(s.targets || []).map((x) => x.n));
  const hitCell = (id, fallbacks, parent) => {
    // 有 A/B 分流时，这个去向的命中数是各版本之和
    const n = (splitOf(link, parent) || [{ id }]).reduce((a, x) => a + (hits.get(x.id) || 0), 0);
    return `<div class="rh"><b>${num(n)}</b>次 · ${Math.round((n / total) * 100)}%<div class="bar"><i style="width:${(n / max) * 100}%"></i></div>${
      fallbacks != null ? `<div class="fbn ${fallbacks ? 'has' : ''}" title="累计回退到默认地址的次数">已回退 ${num(fallbacks)} 次</div>` : ''}</div>`;
  };
  // A/B 各版本：比例、地址、实际命中
  const abRows = (parent) => {
    const sp = splitOf(link, parent);
    const sum = sp.reduce((a, x) => a + (hits.get(x.id) || 0), 0);
    return `<div class="ab">${sp.map((x) => {
      const n = hits.get(x.id) || 0;
      return `<div class="ab-r"><span class="ab-k">${x.k}</span><span class="ab-w" data-tipf-always data-tipf="设定比例">${x.pct}%</span>
        <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" data-tipf="${esc(x.url)}">${esc(bareUrl(x.url))}</a>${healthDot(link.health?.[x.url])}
        <span class="ab-n" data-tipf-always data-tipf="实际分到的访问（最近 ${esc(rangeLabel())}）"><b>${num(n)}</b>${sum ? ` · ${Math.round((n / sum) * 100)}%` : ''}</span></div>`;
    }).join('')}</div>`;
  };
  const rows = link.targets.map((t) => `
    <div class="rule">
      <span class="ri">${t.devices?.length ? ic(t.devices.includes('desktop') && t.devices.length === 1 ? 'desk' : 'phone', 18) : (t.countries.length === 1 && flag(t.countries[0])) || ic('globe', 18)}</span>
      <div style="min-width:0">
        <div class="rc">${(t.devices || []).map((d) => `<span class="chip dev">${ic(d === 'desktop' ? 'desk' : 'phone', 12)}${DEVN[d]}</span>`).join('')}${t.countries.length ? countryChips(t.countries) : t.devices?.length ? '<span class="chip def">所有地区</span>' : ''}${t.note ? `<span class="rn" title="备注">${esc(t.note)}</span>` : ''}${t.fallback
          ? `<span class="tag-fb" title="访客打不开这个地址时，自动改去默认地址">${ic('undo', 12)}打不开时回退</span>` : ''}</div>
        ${splitOf(link, t.id) ? abRows(t.id) : `<div class="ru">${ic('arrow', 13)}<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" title="${esc(t.url)}">${esc(t.url)}</a></div>`}
      </div>
      ${hitCell(t.id, t.fallback ? t.fallbacks : null, t.id)}
      <div class="acts"><button class="btn ghost icon${t.arms?.length ? ' on' : ''}" data-tip="A/B 分流" aria-label="A/B 分流" data-split="${t.id}">${ic('split')}</button>
        <button class="btn ghost icon" data-tip="编辑规则" aria-label="编辑规则" data-rule="${t.id}">${ic('edit')}</button>
        <button class="btn ghost icon" data-tip="删除规则" aria-label="删除规则" data-rdel="${t.id}">${ic('trash')}</button></div>
    </div>`).join('');
  const def = `
    <div class="rule def">
      <span class="ri">${ic('globe', 18)}</span>
      <div style="min-width:0">
        <div class="rc"><span class="chip def">${link.targets.length ? '其他所有访问' : '所有访问'}</span><span class="tag-def">默认</span></div>
        ${splitOf(link, 0) ? abRows(0) : `<div class="ru">${ic('arrow', 13)}${link.target_url
          ? `<a href="${esc(link.target_url)}" target="_blank" rel="noopener noreferrer" title="${esc(link.target_url)}">${esc(link.target_url)}</a>`
          : `<span class="warn">未设置，${link.targets.length ? '未命中规则的' : '所有'}访问会显示“链接暂不可用”</span>`}</div>`}
      </div>
      ${hitCell(0, null, 0)}
      <div class="acts">${link.target_url ? `<button class="btn ghost icon${link.arms?.length ? ' on' : ''}" data-tip="A/B 分流" aria-label="A/B 分流" data-split="0">${ic('split')}</button>` : ''}<button class="btn ${link.target_url ? 'ghost icon' : 'sm'}" ${link.target_url ? 'data-tip="设置默认地址" aria-label="设置默认地址"' : ''} data-rdef>${link.target_url ? ic('edit') : `${ic('plus', 14)}设置`}</button></div>
    </div>`;
  return `<div id="rules">
    <div class="rules-bar"><span class="sub">按访问者所在国家 / 地区或设备跳到不同地址 · 命中数为最近 ${rangeLabel()}</span><span class="sp"></span>
      <button class="btn sm primary" id="radd">${ic('plus', 14)}添加跳转规则</button></div>
    <div class="rules">${rows || `<div class="none">${ic('route', 18)}还没有跳转规则，所有访问都会跳到默认地址。可以为中国、港澳台、北美等地区分别设置推广地址，或让 iOS / Android / 电脑访客去不同的地址（如 App Store、Google Play）。</div>`}${def}</div>
    ${link.arms?.length || link.targets.some((t) => t.arms?.length) ? '' : `<div class="hint rp-pr">${ic('split', 13)}<span>想比较几个落地页的效果？点 ${ic('split', 13)} 按比例把访问分到几个地址（A/B 测试）。</span></div>`}
    ${link.targets.length > 1 && link.targets.some((t) => t.devices?.length) ? `<div class="hint rp-pr">${ic('info', 13)}同时命中多条时：同时指定国家和设备的规则优先，其次只按设备的，再次只按国家的。</div>` : ''}
    <div class="sim"><span>如果访客来自</span>
      <div class="combo" id="sim"></div><span>，用</span>
      <div class="seg sm" id="simd">${[['desktop', '电脑'], ['ios', 'iOS'], ['android', 'Android']].map(([k, l]) => `<button type="button" data-d="${k}">${l}</button>`).join('')}</div>
      <span class="res" id="simres"></span></div>
  </div>`;
}


// 顶部信息卡：地区规则 + 默认地址，一行一条
function heroRoutes(link) {
  const MAX = 4;
  // 地址和检查状态点包在一起，占网格里的同一格
  const url = (u, parent) => u ? `<span class="hr-a"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">${esc(u)}</a>${healthDot(link.health?.[u])}${appPill(link, u)}${abChip(link, parent)}</span>` : '<span class="warn">未设置，会显示“链接暂不可用”</span>';
  const rows = link.targets.slice(0, MAX).map((t) => `<div class="hr-r"><span class="hr-c" title="${esc(t.countries.map(cname).join("、"))}">${esc(ruleText(t))}</span>${ic('arrow', 13)}${url(t.url, t.id)}</div>`).join('');
  const more = link.targets.length > MAX ? `<button type="button" class="hr-more" data-panel-open="rules">还有 ${link.targets.length - MAX} 条规则 ${ic('chev', 12)}</button>` : '';
  return `<div class="hroutes">${rows}${more}<div class="hr-r def"><span class="hr-c">其他地区</span>${ic('arrow', 13)}<span class="hr-u">${url(link.target_url, 0)}<button type="button" class="hr-more" data-panel-open="rules">管理规则 ${ic('chev', 12)}</button></span></div></div>`;
}

function bindRules(link) {
  const card = document.getElementById('rules');
  if (!card) return;

  const res = card.querySelector('#simres');
  let simDev = store.get('simd', 'desktop'), simC = store.get('sim', 'CN');
  const simulate = (c) => {
    simC = c;
    const t = pickRuleJs(link.targets, c, simDev);
    const url = t ? t.url : link.target_url;
    const sp = url && splitOf(link, t ? t.id : 0);
    res.innerHTML = sp
      ? `<span>会按比例分到</span><b data-tipf="${esc(sp.map((x) => `${x.k} ${x.pct}% → ${x.url}`).join('\n'))}">${sp.length} 个地址</b><span class="tag">（A/B 分流 · ${esc(splitText(sp))}）</span>`
      : url
      ? `<span>会跳到</span><b title="${esc(url)}">${esc(url)}</b><span class="tag">${!t ? '（默认地址）' : t.fallback && link.target_url ? '（命中跳转规则，打不开时回退到默认地址）' : '（命中跳转规则）'}</span>`
      : '<span>会看到</span><b class="warn">“链接暂不可用”</b><span class="tag">（未设置默认地址）</span>';
  };
  const start = store.get('sim', 'CN');
  countryCombo(card.querySelector('#sim'), start, (c) => { store.set('sim', c); simulate(c); });
  const sd = card.querySelector('#simd');
  sd.querySelectorAll('button').forEach((b) => {
    b.classList.toggle('on', b.dataset.d === simDev);
    b.onclick = () => { simDev = b.dataset.d; store.set('simd', simDev); sd.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); segThumb(sd); simulate(simC); };
  });
  segThumb(sd);
  simulate(start);
  card.querySelector('#radd').onclick = () => openRuleDrawer(link, null);
  card.querySelector('[data-rdef]').onclick = () => openDrawer(link, (saved) => saved ? route() : null);
  card.querySelectorAll('[data-rule]').forEach((b) => (b.onclick = () => openRuleDrawer(link, link.targets.find((t) => t.id == b.dataset.rule))));
  card.querySelectorAll('[data-split]').forEach((b) => (b.onclick = () => openSplitDrawer(link, Number(b.dataset.split))));
  card.querySelectorAll('[data-rdel]').forEach((b) => (b.onclick = async () => {
    const t = link.targets.find((x) => x.id == b.dataset.rdel);
    const ok = await confirmDialog({ title: '删除这条规则？', text: `${ruleText(t)} 的访问之后会跳到默认地址${t.arms?.length ? '，这条规则的 A/B 分流也会一起删除' : ''}。已有的访问记录会保留，可以在“修改记录”里撤销。`, ok: '删除', danger: true });
    if (!ok) return;
    try { await api(`/links/${link.id}/targets/${t.id}`, { method: 'DELETE' }); }
    catch (ex) { toast(ex.message, 'bad'); return; }
    toast('规则已删除');
    route();
  }));
}

function openRuleDrawer(link, rule) {
  const isNew = !rule;
  const selected = new Set(rule ? rule.countries : []);
  const devs = new Set(rule ? rule.devices || [] : []);
  // 其他规则已占用的国家：只和同一类规则冲突（只按国家 / 国家 + 设备），设备也有交集时才算占用
  const taken = new Map();
  const calcTaken = () => {
    taken.clear();
    link.targets.forEach((t, i) => {
      if (rule && t.id === rule.id) return;
      const sameKind = !!(t.devices || []).length === !!devs.size;
      const devOver = !devs.size || (t.devices || []).some((d) => devs.has(d));
      if (sameKind && devOver && t.countries.length) t.countries.forEach((c) => taken.set(c, `规则 ${i + 1}`));
    });
  };
  calcTaken();

  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('form'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  dr.innerHTML = `
    <div class="dh"><h2>${isNew ? '添加跳转规则' : '编辑跳转规则'}</h2><button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">
      <div class="field"><label>设备 <span class="hint" style="font-weight:400">可选，不选表示所有设备</span></label>
        <div class="devs" id="devs">${[['ios', 'iOS', 'phone', 'iPhone / iPad'], ['android', 'Android', 'phone', '安卓手机和平板'], ['desktop', '电脑', 'desk', 'Windows / macOS / Linux']].map(([k, l, i, d]) =>
          `<button type="button" class="dv${devs.has(k) ? ' on' : ''}" data-dv="${k}">${ic(i, 16)}<b>${l}</b><span>${d}</span></button>`).join('')}</div></div>
      <div class="field"><label>国家 / 地区 <span class="hint" style="font-weight:400" id="c-opt">${devs.size ? '可选，不选表示所有地区' : ''}</span></label>
        <div class="sel" id="sel"></div>
        <div class="groups" style="margin-top:10px">${GROUPS.map(([n, cs], i) => `<button type="button" data-g="${i}">+ ${n}</button>`).join('')}</div>
        <div class="psearch">${ic('search')}<input class="input" id="ps" placeholder="搜索国家、地区或代码，如 日本 / JP" autocomplete="off"></div>
        <div class="plist" id="pl"></div>
        <div class="hint" style="margin-top:6px">按访问者 IP 所在的国家 / 地区匹配。同一类规则里，一个国家只能属于一条。</div></div>
      <div class="field"><label for="r-u">跳转到</label>
        ${targetField({ id: 'r-u', name: 'url', value: rule ? rule.url : '', placeholder: 'https://b.com/promo-cn', required: true, backup: '短链“编辑”里设置的“打不开 App 时去的网页”，没设置就去默认推广地址' })}</div>
      <div class="field"><label for="r-n">备注 <span class="hint" style="font-weight:400">可选</span></label>
        <input class="input" id="r-n" name="note" placeholder="例如：国内渠道落地页" value="${esc(rule ? rule.note : '')}"></div>
      <label class="opt" id="r-fb-w"><div class="tx"><b>打不开时回退到默认地址</b>
        <span class="hint">跳转前先在访客的网络里检测这个地址能否打开，打不开就改去默认地址。能打开时只多约 0.2–1 秒，打不开时最多等 2.5 秒。仅支持 https 地址。</span>
        ${(link.target_url && !isAppUrl(link.target_url) ? link.target_url : link.app_web) ? '' : `<span class="hint warn" style="display:block;margin-top:4px">${link.target_url ? '默认地址是 App，且没有设置“打不开 App 时去的网页”，这个开关不会生效。' : '当前短链还没有默认地址，设置后这个开关才会生效。'}</span>`}</div>
        <span class="switch"><input type="checkbox" id="r-fb" ${rule ? (rule.fallback ? 'checked' : '') : 'checked'}><span class="t"></span></span></label>
      <div class="err" role="alert"></div>
    </div>
    <div class="df">
      <span class="hint" id="cnt"></span><span class="sp"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary">${isNew ? '添加' : '保存'}</button>
    </div>`;
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dialog')) close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = close;   // 下面绑定好地址类型后再换成 guardOverlay
  dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
  document.body.append(ov, dr);

  const sel = dr.querySelector('#sel'), pl = dr.querySelector('#pl'), ps = dr.querySelector('#ps'), cnt = dr.querySelector('#cnt');
  const renderSel = () => {
    sel.innerHTML = selected.size ? [...selected].map((c) => `<span class="chip">${`${flag(c)} ${esc(cname(c))}`.trim()}<button type="button" data-rm="${c}" aria-label="移除 ${esc(cname(c))}">${ic('x')}</button></span>`).join('')
      : '<span class="ph0">从下方选择，或点击快捷分组</span>';
    cnt.textContent = selected.size ? `已选 ${selected.size} 个国家 / 地区` : '';
    sel.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { selected.delete(b.dataset.rm); renderSel(); renderList(); }));
  };
  const row = (c) => {
    const t = taken.get(c);
    return `<label class="${t ? 'dis' : ''}"><input type="checkbox" value="${c}" ${selected.has(c) ? 'checked' : ''} ${t ? 'disabled' : ''}>
      <span class="f">${flag(c)}</span><span>${esc(cname(c))}</span>${t ? `<em>已在${t}</em>` : ''}<code>${c}</code></label>`;
  };
  const renderList = () => {
    const q = ps.value.trim().toLowerCase();
    if (q) {
      const hit = ISO.filter((c) => c.toLowerCase().includes(q) || cname(c).toLowerCase().includes(q));
      pl.innerHTML = hit.length ? hit.map(row).join('') : '<div class="empty" style="padding:20px">没有匹配的国家 / 地区</div>';
    } else {
      const rest = ISO.filter((c) => !COMMON.includes(c)).sort((a, b) => cname(a).localeCompare(cname(b), EN ? 'en' : 'zh'));
      pl.innerHTML = `<div class="grp">常用</div>${COMMON.map(row).join('')}<div class="grp">全部</div>${rest.map(row).join('')}`;
    }
    pl.querySelectorAll('input').forEach((i) => (i.onchange = () => { i.checked ? selected.add(i.value) : selected.delete(i.value); renderSel(); }));
  };
  dr.querySelectorAll('[data-dv]').forEach((b) => (b.onclick = () => {
    devs.has(b.dataset.dv) ? devs.delete(b.dataset.dv) : devs.add(b.dataset.dv);
    b.classList.toggle('on', devs.has(b.dataset.dv));
    dr.querySelector('#c-opt').textContent = devs.size ? '可选，不选表示所有地区' : '';
    calcTaken(); renderList();
  }));
  dr.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => {
    const skipped = GROUPS[b.dataset.g][1].filter((c) => taken.has(c));
    GROUPS[b.dataset.g][1].forEach((c) => { if (!taken.has(c)) selected.add(c); });
    if (skipped.length) toast(`已跳过其他规则中的：${skipped.map(cname).join(LIST_SEP)}`);
    renderSel(); renderList();
  }));
  ps.oninput = renderList;
  renderSel(); renderList();
  // App 地址不走网页探测，“打不开时回退”对它不起作用，App 模式下先藏起来
  const rKind = bindTarget(dr, 'r-u', (k) => { dr.querySelector('#r-fb-w').hidden = k === 'app'; });
  guardOverlay(ov, dr, close, () => [...selected].sort().join() + '|' + [...devs].sort().join());
  (isNew ? ps : dr.querySelector('#r-u')).focus();

  dr.onsubmit = async (e) => {
    e.preventDefault();
    const err = dr.querySelector('.err');
    if (!selected.size && !devs.size) { err.textContent = '请至少选择一个国家 / 地区或设备'; return; }
    const url = rKind.value();
    const terr = rKind.check();
    if (terr) { err.textContent = terr; return; }
    const btn = dr.querySelector('.df .primary'); btn.disabled = true;
    try {
      await api(`/links/${link.id}/targets${isNew ? '' : '/' + rule.id}`, {
        method: isNew ? 'POST' : 'PUT', body: { countries: [...selected], devices: [...devs], url, note: dr.querySelector('#r-n').value, fallback: rKind.kind() !== 'app' && dr.querySelector('#r-fb').checked },
      });
      close(); toast(isNew ? '规则已添加' : '规则已保存');
      route();
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
  };
}

// ---------------------------------------------------------------- 修改记录
const LOG_FIELD = { slug: '后缀', target_url: '默认地址', title: '标题', note: '备注', enabled: '状态', pass_query: '透传参数', utm: '转化追踪', expires_at: '过期时间', app_web: '打不开 App 时去的网页' };
const logVal = (f, v) => {
  if (f === 'enabled') return v ? '启用' : '停用';
  if (f === 'pass_query' || f === 'utm') return v ? '开' : '关';
  if (f === 'expires_at') return v ? fmtTime(v) : '永久';
  if (f === 'slug') return v ? '/' + v : '—';
  return v === '' || v == null ? '（空）' : String(v);
};
const logPair = (label, a, b) => `<div class="lg-c"><span class="lg-f">${esc(label)}</span><span class="lg-o" data-tipf="${esc(a)}">${esc(a)}</span>${ic('arrow', 12)}<span class="lg-n" data-tipf="${esc(b)}">${esc(b)}</span></div>`;
function logEntry(e, link) {
  const d = e.data || {};
  const ruleName = (snap) => {
    const cur = snap && link.targets.find((t) => t.id === snap.id);
    return snap?.countries || snap?.devices ? ruleText({ countries: snap.countries || [], devices: snap.devices || [] }) : cur ? ruleText(cur) : '跳转规则';
  };
  const splitTxt = (st, url) => (st.arms?.length ? splitText([{ weight: st.weight }, ...st.arms].map((x, i, all) => ({ k: ARM[i], pct: Math.round((x.weight / (all.reduce((a, y) => a + y.weight, 0) || 1)) * 100) }))) : '不分流');
  let icon = 'edit', title = '', body = '';
  if (e.action === 'create') { icon = 'plus'; title = d.from ? `从 /${esc(d.from)} 复制创建` : '创建短链'; body = d.target_url ? `<div class="lg-c"><span class="lg-f">默认地址</span><span class="lg-n" data-tipf="${esc(d.target_url)}">${esc(d.target_url)}</span></div>` : ''; }
  else if (e.action === 'update') {
    const ch = Object.entries(d.changes || {});
    title = ch.length === 1 && ch[0][0] === 'enabled' ? (ch[0][1][1] ? '启用短链' : '停用短链') : `修改${ch.map(([f]) => LOG_FIELD[f] || f).join('、')}`;
    if (ch.length === 1 && ch[0][0] === 'enabled') icon = ch[0][1][1] ? 'check' : 'x';
    body = ch.filter(([f]) => f !== 'enabled' || ch.length > 1).map(([f, [a, b]]) => logPair(LOG_FIELD[f] || f, logVal(f, a), logVal(f, b))).join('');
  } else if (e.action === 'rule.add') { icon = 'route'; title = `添加跳转规则：${esc(ruleName(d.after))}`; body = `<div class="lg-c"><span class="lg-f">跳到</span><span class="lg-n" data-tipf="${esc(d.after.url)}">${esc(d.after.url)}</span></div>`; }
  else if (e.action === 'rule.del') { icon = 'trash'; title = `删除跳转规则：${esc(ruleName(d.before))}`; body = `<div class="lg-c"><span class="lg-f">原来跳到</span><span class="lg-o" data-tipf="${esc(d.before.url)}">${esc(d.before.url)}</span></div>`; }
  else if (e.action === 'rule.edit') {
    icon = 'route'; title = `修改跳转规则：${esc(ruleName(d.after))}`;
    const b = d.before, a = d.after, rows = [];
    if (b.url !== a.url) rows.push(logPair('地址', b.url, a.url));
    if (b.countries && JSON.stringify(b.countries) !== JSON.stringify(a.countries)) rows.push(logPair('国家 / 地区', b.countries.map(cname).join(LIST_SEP) || '所有地区', a.countries.map(cname).join(LIST_SEP) || '所有地区'));
    if (b.devices && JSON.stringify(b.devices) !== JSON.stringify(a.devices)) rows.push(logPair('设备', devText(b.devices) || '所有设备', devText(a.devices) || '所有设备'));
    if (b.note !== undefined && b.note !== a.note) rows.push(logPair('备注', b.note || '（空）', a.note || '（空）'));
    if (b.fallback !== undefined && b.fallback !== a.fallback) rows.push(logPair('打不开时回退', b.fallback ? '开' : '关', a.fallback ? '开' : '关'));
    body = rows.join('');
  } else if (e.action === 'split') {
    icon = 'split';
    const where = d.parent ? ruleName(link.targets.find((t) => t.id === d.parent) || { id: d.parent }) : '默认地址';
    title = `${!d.before.arms?.length ? '开始' : !d.after.arms?.length ? '取消' : '调整'} A/B 分流：${esc(where)}`;
    body = logPair('比例', splitTxt(d.before), splitTxt(d.after))
      + (d.after.arms || []).filter((x) => !(d.before.arms || []).some((y) => y.id === x.id && y.url === x.url)).map((x) => `<div class="lg-c"><span class="lg-f">新版本</span><span class="lg-n" data-tipf="${esc(x.url)}">${esc(x.url)}</span></div>`).join('');
  }
  const via = d.revertOf ? `<span class="lg-t">撤销操作</span>` : d.via === 'replace' ? '<span class="lg-t">批量替换</span>' : d.via === 'bulk' ? '<span class="lg-t">批量操作</span>' : '';
  const who = [e.browser, e.os].filter((x) => x && x !== 'Other' && x !== 'Unknown').join(' · ') + (e.ip ? ` · ${e.ip}` : '');
  const canUndo = !e.reverted && !d.revertOf && e.action !== 'create';
  return `<div class="lg-e${e.reverted ? ' rv-d' : ''}"><span class="lg-i">${ic(icon, 14)}</span>
    <div class="lg-b"><div class="lg-h"><b>${title}</b>${via}${e.reverted ? '<span class="lg-t">已撤销</span>' : ''}</div>${body}
      <div class="lg-m"><span data-tipf-always data-tipf="${esc(fmtTime(e.at))}">${ago(e.at)}</span>${who ? ` · <span>${esc(who)}</span>` : ''}</div></div>
    ${canUndo ? `<button type="button" class="btn sm ghost" data-undo="${e.id}">${ic('undo', 13)}撤销</button>` : ''}</div>`;
}
async function fillLogPanel(dr, link) {
  dr.innerHTML = `
    <div class="dh"><div style="flex:1;min-width:0"><h2>修改记录</h2><div class="hint">谁在什么时候改了地址、规则和设置，保留一年；可以撤销之后没有再被改过的修改</div></div>
      <button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db"><div class="lg" id="lg-list">${skel(64, 4)}</div><div id="lg-more"></div></div>`;
  dr.querySelector('[data-close]').onclick = dr._close;
  const box = dr.querySelector('#lg-list'), more = dr.querySelector('#lg-more');
  let items = [];
  const load = async (before) => {
    const r = await api(`/links/${link.id}/log${before ? '?before=' + before : ''}`);
    if (!dr.isConnected) return;
    items = before ? [...items, ...r.items] : r.items;
    box.innerHTML = items.length ? items.map((e) => logEntry(e, link)).join('') : `<div class="empty">${ic('history')}还没有修改记录。之后修改地址、规则或设置都会记在这里。</div>`;
    more.innerHTML = r.more ? `<button type="button" class="btn sm" id="lg-next">加载更早的记录</button>` : '';
    if (r.more) more.querySelector('#lg-next').onclick = () => load(items.at(-1).id);
    box.querySelectorAll('[data-undo]').forEach((b) => (b.onclick = async () => {
      const ok = await confirmDialog({ title: '撤销这条修改？', text: '会改回修改前的内容，撤销本身也会记一条记录。', ok: '撤销' });
      if (!ok) return;
      b.disabled = true;
      try { await api(`/links/${link.id}/log/${b.dataset.undo}/revert`, { method: 'POST', body: {} }); toast('已撤销'); route(); }
      catch (ex) { toast(ex.message, 'bad'); b.disabled = false; }
    }));
  };
  load().catch((ex) => { box.innerHTML = `<div class="empty">${ic('alert')}${esc(ex.message)}</div>`; });
}

// ---------------------------------------------------------------- A/B 分流
function openSplitDrawer(link, parent) {
  const rule = parent ? link.targets.find((t) => t.id === parent) : null;
  const primary = rule ? rule.url : link.target_url;
  const had = armsOf(link, parent).length > 0;
  let pw = (rule ? rule.weight : link.ab_weight) || 50;
  const arms = had ? armsOf(link, parent).map((a) => ({ id: a.id, url: a.url, weight: a.weight, note: a.note })) : [{ url: '', weight: 50, note: '' }];
  const ov = document.createElement('div'); ov.className = 'ov';
