// 搜索关键字高亮
function hl(text, q) {
  const i = q ? text.toLowerCase().indexOf(q) : -1;
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + q.length))}</mark>` + esc(text.slice(i + q.length));
}

/**
 * 通用下拉框（替代原生 select）
 * o.value       当前值
 * o.groups(q)   返回 [[分组标题, 值数组], ...]；q 为搜索词（无搜索框时为空）
 * o.button(v)   按钮里显示的内容（HTML）
 * o.option(v,q) 选项内容（HTML）
 * o.search      搜索框占位文字；不传则不显示搜索框
 * o.onChange(v) 选中后回调
 * 键盘：↑ ↓ 移动，Enter 选择，Esc 关闭
 */
function dropdown(root, o) {
  let value = o.value;
  root.innerHTML = `<button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(o.aria || '')}"></button>`;
  const btn = root.firstElementChild;
  const paint = () => { btn.innerHTML = o.button(value) + ic('chev', 14); };
  paint();

  let pop = null, input = null, opts, items = [], act = 0;
  const place = () => {
    const r = btn.getBoundingClientRect(), h = pop.offsetHeight;
    const w = Math.min(o.maxWidth || 260, Math.max(r.width, o.minWidth || 220), innerWidth - 16);
    pop.style.width = w + 'px';
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    const up = innerHeight - r.bottom < h + 12 && r.top > innerHeight - r.bottom;
    pop.classList.toggle('up', up);
    pop.style.top = (up ? r.top - h - 6 : r.bottom + 6) + 'px';
  };
  const mark = (scroll) => {
    const els = opts.querySelectorAll('.oi');
    els.forEach((el, i) => { el.classList.toggle('act', i === act); if (i === act) opts.setAttribute('aria-activedescendant', el.id); });
    if (scroll && els[act]) els[act].scrollIntoView({ block: 'nearest' });
  };
  const render = () => {
    const q = input ? input.value.trim().toLowerCase() : '';
    const groups = o.groups(q);
    items = groups.flatMap((g) => g[1]);
    act = q ? 0 : Math.max(0, items.indexOf(value));
    let n = 0;
    opts.innerHTML = items.length
      ? groups.map(([t, vs]) => (t ? `<div class="og">${t}</div>` : '') + vs.map((v) => {
        const i = n++;
        return `<div class="oi ${v === value ? 'sel' : ''}" id="oi-${i}" role="option" aria-selected="${v === value}" data-i="${i}">${o.option(v, q)}${v === value ? ic('check', 14) : ''}</div>`;
      }).join('')).join('')
      : `<div class="empty" style="padding:24px 12px">${o.empty || '没有匹配的选项'}</div>`;
    mark(true);
  };
  const choose = (v) => {
    close();
    btn.focus();
    if (v === value) return;
    value = v; paint(); o.onChange && o.onChange(v);
  };
  const onKey = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (items.length) { act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; mark(true); }
    } else if (e.key === 'Enter' || (!input && e.key === ' ')) { e.preventDefault(); if (items.length) choose(items[act]); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); btn.focus(); }
    else if (e.key === 'Tab') close();
  };
  const outside = (e) => { if (pop && !pop.contains(e.target) && !root.contains(e.target)) close(); };
  const onScroll = (e) => { if (pop && !pop.contains(e.target)) place(); };
  function close() {
    if (!pop) return;
    pop.remove(); pop = null; input = null;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', outside, true);
    document.removeEventListener('scroll', onScroll, true);
    removeEventListener('resize', close);
  }
  const open = () => {
    document.querySelectorAll('.pop').forEach((x) => x.remove());
    pop = document.createElement('div');
    pop.className = 'pop' + (o.search ? '' : ' plain');
    pop.innerHTML = (o.search ? `<div class="ps">${ic('search', 15)}<input placeholder="${esc(o.search)}" autocomplete="off" aria-label="${esc(o.search)}"></div>` : '')
      + '<div class="opts" role="listbox" tabindex="-1"></div>';
    document.body.appendChild(pop);
    input = pop.querySelector('input'); opts = pop.querySelector('.opts');
    btn.setAttribute('aria-expanded', 'true');
    render(); place();
    (input || opts).focus();
    if (input) input.oninput = () => { render(); place(); };
    (input || opts).onkeydown = onKey;
    opts.onmousemove = (e) => {
      const el = e.target.closest('.oi');
      if (!el) return;
      const i = Number(el.dataset.i);
      if (i !== act) { act = i; mark(false); }
    };
    opts.onclick = (e) => { const el = e.target.closest('.oi'); if (el) choose(items[Number(el.dataset.i)]); };
    document.addEventListener('mousedown', outside, true);
    document.addEventListener('scroll', onScroll, true);
    addEventListener('resize', close);
  };
  btn.onclick = () => (pop ? close() : open());
  btn.onkeydown = (e) => { if ((e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') && !pop) { e.preventDefault(); open(); } };
  return { get value() { return value; } };
}

// 国家 / 地区下拉框（可搜索中文名或代码）
function countryCombo(root, value, onChange) {
  const rest = ISO.filter((c) => !COMMON.includes(c)).sort((a, b) => cname(a).localeCompare(cname(b), EN ? 'en' : 'zh'));
  return dropdown(root, {
    value, onChange, aria: '选择国家或地区', search: '搜索国家或代码', empty: '没有匹配的国家 / 地区',
    groups: (q) => (q ? [['', ISO.filter((c) => c.toLowerCase().includes(q) || cname(c).toLowerCase().includes(q))]] : [['常用', COMMON], ['全部', rest]]),
    button: (c) => `<span class="f">${flag(c)}</span><span class="nm">${esc(cname(c))}</span><code>${c}</code>`,
    option: (c, q) => `<span class="f">${flag(c)}</span><span class="ot">${hl(cname(c), q)}</span><code>${hl(c, q)}</code>`,
  });
}

function rulesCard(link, s) {
  const hits = new Map((s.targets || []).map((x) => [x.k, x.n]));
  const total = Math.max(1, s.summary.total);
  const max = Math.max(1, ...(s.targets || []).map((x) => x.n));
  const hitCell = (id, fallbacks, parent) => {
    // 有 A/B 分流时，这个去向的命中数是各版本之和
    const n = (splitOf(link, parent) || [{ id }]).reduce((a, x) => a + (hits.get(x.id) || 0), 0);
    return `<div class="rh"><b>${num(n)}</b>次 · ${Math.round((n / total) * 100)}%<div class="bar"><i style="width:${(n / max) * 100}%"></i></div>${
      fallbacks != null ? `<div class="fbn ${fallbacks ? 'has' : ''}" title="累计回退到默认地址的次数">已回退 ${num(fallbacks)} 次</div>` : ''}</div>`;
  };
  // A/B 各版本：比例、地址、实际命中
  const abRows = (parent) => {
    const sp = splitOf(link, parent);
    const sum = sp.reduce((a, x) => a + (hits.get(x.id) || 0), 0);
    return `<div class="ab">${sp.map((x) => {
      const n = hits.get(x.id) || 0;
      return `<div class="ab-r"><span class="ab-k">${x.k}</span><span class="ab-w" data-tipf-always data-tipf="设定比例">${x.pct}%</span>
        <a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" data-tipf="${esc(x.url)}">${esc(bareUrl(x.url))}</a>${healthDot(link.health?.[x.url])}
        <span class="ab-n" data-tipf-always data-tipf="实际分到的访问（最近 ${esc(rangeLabel())}）"><b>${num(n)}</b>${sum ? ` · ${Math.round((n / sum) * 100)}%` : ''}</span></div>`;
    }).join('')}</div>`;
  };
  const rows = link.targets.map((t) => `
    <div class="rule">
      <span class="ri">${t.devices?.length ? ic(t.devices.includes('desktop') && t.devices.length === 1 ? 'desk' : 'phone', 18) : (t.countries.length === 1 && flag(t.countries[0])) || ic('globe', 18)}</span>
      <div style="min-width:0">
        <div class="rc">${(t.devices || []).map((d) => `<span class="chip dev">${ic(d === 'desktop' ? 'desk' : 'phone', 12)}${DEVN[d]}</span>`).join('')}${t.countries.length ? countryChips(t.countries) : t.devices?.length ? '<span class="chip def">所有地区</span>' : ''}${t.note ? `<span class="rn" title="备注">${esc(t.note)}</span>` : ''}${t.fallback
          ? `<span class="tag-fb" title="访客打不开这个地址时，自动改去默认地址">${ic('undo', 12)}打不开时回退</span>` : ''}</div>
        ${splitOf(link, t.id) ? abRows(t.id) : `<div class="ru">${ic('arrow', 13)}<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" title="${esc(t.url)}">${esc(t.url)}</a></div>`}
      </div>
      ${hitCell(t.id, t.fallback ? t.fallbacks : null, t.id)}
      <div class="acts"><button class="btn ghost icon${t.arms?.length ? ' on' : ''}" data-tip="A/B 分流" aria-label="A/B 分流" data-split="${t.id}">${ic('split')}</button>
        <button class="btn ghost icon" data-tip="编辑规则" aria-label="编辑规则" data-rule="${t.id}">${ic('edit')}</button>
        <button class="btn ghost icon" data-tip="删除规则" aria-label="删除规则" data-rdel="${t.id}">${ic('trash')}</button></div>
    </div>`).join('');
  const def = `
    <div class="rule def">
      <span class="ri">${ic('globe', 18)}</span>
      <div style="min-width:0">
        <div class="rc"><span class="chip def">${link.targets.length ? '其他所有访问' : '所有访问'}</span><span class="tag-def">默认</span></div>
        ${splitOf(link, 0) ? abRows(0) : `<div class="ru">${ic('arrow', 13)}${link.target_url
          ? `<a href="${esc(link.target_url)}" target="_blank" rel="noopener noreferrer" title="${esc(link.target_url)}">${esc(link.target_url)}</a>`
          : `<span class="warn">未设置，${link.targets.length ? '未命中规则的' : '所有'}访问会显示“链接暂不可用”</span>`}</div>`}
      </div>
      ${hitCell(0, null, 0)}
      <div class="acts">${link.target_url ? `<button class="btn ghost icon${link.arms?.length ? ' on' : ''}" data-tip="A/B 分流" aria-label="A/B 分流" data-split="0">${ic('split')}</button>` : ''}<button class="btn ${link.target_url ? 'ghost icon' : 'sm'}" ${link.target_url ? 'data-tip="设置默认地址" aria-label="设置默认地址"' : ''} data-rdef>${link.target_url ? ic('edit') : `${ic('plus', 14)}设置`}</button></div>
    </div>`;
  return `<div id="rules">
    <div class="rules-bar"><span class="sub">按访问者所在国家 / 地区或设备跳到不同地址 · 命中数为最近 ${rangeLabel()}</span><span class="sp"></span>
      <button class="btn sm primary" id="radd">${ic('plus', 14)}添加跳转规则</button></div>
    <div class="rules">${rows || `<div class="none">${ic('route', 18)}还没有跳转规则，所有访问都会跳到默认地址。可以为中国、港澳台、北美等地区分别设置推广地址，或让 iOS / Android / 电脑访客去不同的地址（如 App Store、Google Play）。</div>`}${def}</div>
    ${link.arms?.length || link.targets.some((t) => t.arms?.length) ? '' : `<div class="hint rp-pr">${ic('split', 13)}想比较几个落地页的效果？点 ${ic('split', 13)} 按比例把访问分到几个地址（A/B 测试）。</div>`}
    ${link.targets.length > 1 && link.targets.some((t) => t.devices?.length) ? `<div class="hint rp-pr">${ic('info', 13)}同时命中多条时：同时指定国家和设备的规则优先，其次只按设备的，再次只按国家的。</div>` : ''}
    <div class="sim"><span>如果访客来自</span>
      <div class="combo" id="sim"></div><span>，用</span>
      <div class="seg sm" id="simd">${[['desktop', '电脑'], ['ios', 'iOS'], ['android', 'Android']].map(([k, l]) => `<button type="button" data-d="${k}">${l}</button>`).join('')}</div>
      <span class="res" id="simres"></span></div>
  </div>`;
}

// 折叠卡片：展开动画结束后取消裁剪，让悬停提示和浮层能超出卡片
function bindFold(fold, key, onOpen) {
  const fh = fold.querySelector('.fold-h');
  fh.onclick = () => {
    const open = !fold.classList.contains('open');
    fold.classList.toggle('open', open); fh.setAttribute('aria-expanded', open);
    store.set(key, open);
    clearTimeout(fold._t);
    if (open) { fold._t = setTimeout(() => fold.classList.add('settled'), 380); onOpen && onOpen(); }
    else fold.classList.remove('settled');
  };
}

// 顶部信息卡：地区规则 + 默认地址，一行一条
function heroRoutes(link) {
  const MAX = 4;
  // 地址和检查状态点包在一起，占网格里的同一格
  const url = (u, parent) => u ? `<span class="hr-a"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${esc(u)}">${esc(u)}</a>${healthDot(link.health?.[u])}${abChip(link, parent)}</span>` : '<span class="warn">未设置，会显示“链接暂不可用”</span>';
  const rows = link.targets.slice(0, MAX).map((t) => `<div class="hr-r"><span class="hr-c" title="${esc(t.countries.map(cname).join("、"))}">${esc(ruleText(t))}</span>${ic('arrow', 13)}${url(t.url, t.id)}</div>`).join('');
  const more = link.targets.length > MAX ? `<button type="button" class="hr-more" data-panel-open="rules">还有 ${link.targets.length - MAX} 条规则 ${ic('chev', 12)}</button>` : '';
  return `<div class="hroutes">${rows}${more}<div class="hr-r def"><span class="hr-c">其他地区</span>${ic('arrow', 13)}<span class="hr-u">${url(link.target_url, 0)}<button type="button" class="hr-more" data-panel-open="rules">管理规则 ${ic('chev', 12)}</button></span></div></div>`;
}

function bindRules(link) {
  const card = document.getElementById('rules');
  if (!card) return;

  const res = card.querySelector('#simres');
  let simDev = store.get('simd', 'desktop'), simC = store.get('sim', 'CN');
  const simulate = (c) => {
    simC = c;
    const t = pickRuleJs(link.targets, c, simDev);
    const url = t ? t.url : link.target_url;
    const sp = url && splitOf(link, t ? t.id : 0);
    res.innerHTML = sp
      ? `<span>会按比例分到</span><b data-tipf="${esc(sp.map((x) => `${x.k} ${x.pct}% → ${x.url}`).join('\n'))}">${sp.length} 个地址</b><span class="tag">（A/B 分流 · ${esc(splitText(sp))}）</span>`
      : url
      ? `<span>会跳到</span><b title="${esc(url)}">${esc(url)}</b><span class="tag">${!t ? '（默认地址）' : t.fallback && link.target_url ? '（命中跳转规则，打不开时回退到默认地址）' : '（命中跳转规则）'}</span>`
      : '<span>会看到</span><b class="warn">“链接暂不可用”</b><span class="tag">（未设置默认地址）</span>';
  };
  const start = store.get('sim', 'CN');
  countryCombo(card.querySelector('#sim'), start, (c) => { store.set('sim', c); simulate(c); });
  const sd = card.querySelector('#simd');
  sd.querySelectorAll('button').forEach((b) => {
    b.classList.toggle('on', b.dataset.d === simDev);
    b.onclick = () => { simDev = b.dataset.d; store.set('simd', simDev); sd.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); segThumb(sd); simulate(simC); };
  });
  segThumb(sd);
  simulate(start);
  card.querySelector('#radd').onclick = () => openRuleDrawer(link, null);
  card.querySelector('[data-rdef]').onclick = () => openDrawer(link, (saved) => saved ? route() : null);
  card.querySelectorAll('[data-rule]').forEach((b) => (b.onclick = () => openRuleDrawer(link, link.targets.find((t) => t.id == b.dataset.rule))));
  card.querySelectorAll('[data-split]').forEach((b) => (b.onclick = () => openSplitDrawer(link, Number(b.dataset.split))));
  card.querySelectorAll('[data-rdel]').forEach((b) => (b.onclick = async () => {
    const t = link.targets.find((x) => x.id == b.dataset.rdel);
    const ok = await confirmDialog({ title: '删除这条规则？', text: `${ruleText(t)} 的访问之后会跳到默认地址${t.arms?.length ? '，这条规则的 A/B 分流也会一起删除' : ''}。已有的访问记录会保留，可以在“修改记录”里撤销。`, ok: '删除', danger: true });
    if (!ok) return;
    await api(`/links/${link.id}/targets/${t.id}`, { method: 'DELETE' });
    toast('规则已删除');
    route();
  }));
}

function openRuleDrawer(link, rule) {
  const isNew = !rule;
  const selected = new Set(rule ? rule.countries : []);
  const devs = new Set(rule ? rule.devices || [] : []);
  // 其他规则已占用的国家：只和同一类规则冲突（只按国家 / 国家 + 设备），设备也有交集时才算占用
  const taken = new Map();
  const calcTaken = () => {
    taken.clear();
    link.targets.forEach((t, i) => {
      if (rule && t.id === rule.id) return;
      const sameKind = !!(t.devices || []).length === !!devs.size;
      const devOver = !devs.size || (t.devices || []).some((d) => devs.has(d));
      if (sameKind && devOver && t.countries.length) t.countries.forEach((c) => taken.set(c, `规则 ${i + 1}`));
    });
  };
  calcTaken();

  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('form'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  dr.innerHTML = `
    <div class="dh"><h2>${isNew ? '添加跳转规则' : '编辑跳转规则'}</h2><button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">
      <div class="field"><label>设备 <span class="hint" style="font-weight:400">可选，不选表示所有设备</span></label>
        <div class="devs" id="devs">${[['ios', 'iOS', 'phone', 'iPhone / iPad'], ['android', 'Android', 'phone', '安卓手机和平板'], ['desktop', '电脑', 'desk', 'Windows / macOS / Linux']].map(([k, l, i, d]) =>
          `<button type="button" class="dv${devs.has(k) ? ' on' : ''}" data-dv="${k}">${ic(i, 16)}<b>${l}</b><span>${d}</span></button>`).join('')}</div></div>
      <div class="field"><label>国家 / 地区 <span class="hint" style="font-weight:400" id="c-opt">${devs.size ? '可选，不选表示所有地区' : ''}</span></label>
        <div class="sel" id="sel"></div>
        <div class="groups" style="margin-top:10px">${GROUPS.map(([n, cs], i) => `<button type="button" data-g="${i}">+ ${n}</button>`).join('')}</div>
        <div class="psearch">${ic('search')}<input class="input" id="ps" placeholder="搜索国家、地区或代码，如 日本 / JP" autocomplete="off"></div>
        <div class="plist" id="pl"></div>
        <div class="hint" style="margin-top:6px">按访问者 IP 所在的国家 / 地区匹配。同一类规则里，一个国家只能属于一条。</div></div>
      <div class="field"><label for="r-u">跳转到</label>
        <input class="input" id="r-u" name="url" required placeholder="https://b.com/promo-cn" value="${esc(rule ? rule.url : '')}"></div>
      <div class="field"><label for="r-n">备注 <span class="hint" style="font-weight:400">可选</span></label>
        <input class="input" id="r-n" name="note" placeholder="例如：国内渠道落地页" value="${esc(rule ? rule.note : '')}"></div>
      <label class="opt"><div class="tx"><b>打不开时回退到默认地址</b>
        <span class="hint">跳转前先在访客的网络里检测这个地址能否打开，打不开就改去默认地址。能打开时只多约 0.2–1 秒，打不开时最多等 2.5 秒。仅支持 https 地址。</span>
        ${link.target_url ? '' : '<span class="hint warn" style="display:block;margin-top:4px">当前短链还没有默认地址，设置后这个开关才会生效。</span>'}</div>
        <span class="switch"><input type="checkbox" id="r-fb" ${rule ? (rule.fallback ? 'checked' : '') : 'checked'}><span class="t"></span></span></label>
      <div class="err" role="alert"></div>
    </div>
    <div class="df">
      <span class="hint" id="cnt"></span><span class="sp"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary">${isNew ? '添加' : '保存'}</button>
    </div>`;
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dialog')) close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = close;
  dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
  document.body.append(ov, dr);

  const sel = dr.querySelector('#sel'), pl = dr.querySelector('#pl'), ps = dr.querySelector('#ps'), cnt = dr.querySelector('#cnt');
  const renderSel = () => {
    sel.innerHTML = selected.size ? [...selected].map((c) => `<span class="chip">${`${flag(c)} ${esc(cname(c))}`.trim()}<button type="button" data-rm="${c}" aria-label="移除 ${esc(cname(c))}">${ic('x')}</button></span>`).join('')
      : '<span class="ph0">从下方选择，或点击快捷分组</span>';
    cnt.textContent = selected.size ? `已选 ${selected.size} 个国家 / 地区` : '';
    sel.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { selected.delete(b.dataset.rm); renderSel(); renderList(); }));
  };
  const row = (c) => {
    const t = taken.get(c);
    return `<label class="${t ? 'dis' : ''}"><input type="checkbox" value="${c}" ${selected.has(c) ? 'checked' : ''} ${t ? 'disabled' : ''}>
      <span class="f">${flag(c)}</span><span>${esc(cname(c))}</span>${t ? `<em>已在${t}</em>` : ''}<code>${c}</code></label>`;
  };
  const renderList = () => {
    const q = ps.value.trim().toLowerCase();
    if (q) {
      const hit = ISO.filter((c) => c.toLowerCase().includes(q) || cname(c).toLowerCase().includes(q));
      pl.innerHTML = hit.length ? hit.map(row).join('') : '<div class="empty" style="padding:20px">没有匹配的国家 / 地区</div>';
    } else {
      const rest = ISO.filter((c) => !COMMON.includes(c)).sort((a, b) => cname(a).localeCompare(cname(b), EN ? 'en' : 'zh'));
      pl.innerHTML = `<div class="grp">常用</div>${COMMON.map(row).join('')}<div class="grp">全部</div>${rest.map(row).join('')}`;
    }
    pl.querySelectorAll('input').forEach((i) => (i.onchange = () => { i.checked ? selected.add(i.value) : selected.delete(i.value); renderSel(); }));
  };
  dr.querySelectorAll('[data-dv]').forEach((b) => (b.onclick = () => {
    devs.has(b.dataset.dv) ? devs.delete(b.dataset.dv) : devs.add(b.dataset.dv);
    b.classList.toggle('on', devs.has(b.dataset.dv));
    dr.querySelector('#c-opt').textContent = devs.size ? '可选，不选表示所有地区' : '';
    calcTaken(); renderList();
  }));
  dr.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => {
    const skipped = GROUPS[b.dataset.g][1].filter((c) => taken.has(c));
    GROUPS[b.dataset.g][1].forEach((c) => { if (!taken.has(c)) selected.add(c); });
    if (skipped.length) toast(`已跳过其他规则中的：${skipped.map(cname).join('、')}`);
    renderSel(); renderList();
  }));
  ps.oninput = renderList;
  renderSel(); renderList();
  (isNew ? ps : dr.querySelector('#r-u')).focus();

  dr.onsubmit = async (e) => {
    e.preventDefault();
    const err = dr.querySelector('.err');
    if (!selected.size && !devs.size) { err.textContent = '请至少选择一个国家 / 地区或设备'; return; }
    let url = dr.querySelector('#r-u').value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    const btn = dr.querySelector('.df .primary'); btn.disabled = true;
    try {
      await api(`/links/${link.id}/targets${isNew ? '' : '/' + rule.id}`, {
        method: isNew ? 'POST' : 'PUT', body: { countries: [...selected], devices: [...devs], url, note: dr.querySelector('#r-n').value, fallback: dr.querySelector('#r-fb').checked },
      });
      close(); toast(isNew ? '规则已添加' : '规则已保存');
      route();
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
  };
}

// ---------------------------------------------------------------- 修改记录
const LOG_FIELD = { slug: '后缀', target_url: '默认地址', title: '标题', note: '备注', enabled: '状态', pass_query: '透传参数', utm: '转化追踪', expires_at: '过期时间' };
const logVal = (f, v) => {
  if (f === 'enabled') return v ? '启用' : '停用';
  if (f === 'pass_query' || f === 'utm') return v ? '开' : '关';
  if (f === 'expires_at') return v ? fmtTime(v) : '永久';
  if (f === 'slug') return v ? '/' + v : '—';

// 站点列表汇总里的“流量渠道”：当前筛选的站点按 GA4 渠道分组相加的会话占比
function chCard(rows) {
  const m = new Map();
  for (const x of rows) for (const [k, n] of Object.entries(x.cur.ga?.channels || {})) m.set(k, (m.get(k) || 0) + n);
  const items = [...m].map(([k, n]) => ({ k, n })).filter((x) => x.n > 0).sort((a, b) => b.n - a.n);
  const sum = items.reduce((a, x) => a + x.n, 0);
  // 升级后渠道数据要由定时任务逐个站点补（每小时约 10 个），没补到时先说明进度
  const pending = rows.filter((x) => x.ga4 && !x.chReady).length;
  if (!sum) return pending ? `<div class="kc kc-ch"><div class="kc-h"><span class="l">流量渠道</span></div>
    <div class="kc-v"><b class="sm">同步中</b></div><div class="kc-d" data-tipf-always data-tipf="定时任务每小时补约 10 个站点；也可以点右上角的刷新按钮立即同步">还剩 ${pending} 个站点 · 约 ${Math.ceil(pending / 10)} 小时</div></div>` : '';
  const COL = ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--amber)', 'var(--faint)'];
  const top = items.length > 4 ? [...items.slice(0, 3), { k: '其他', n: sum - items.slice(0, 3).reduce((a, x) => a + x.n, 0), other: true }] : items;
  const r = 22, C = 2 * Math.PI * r;
  let off = 0;
  const segs = top.map((it, i) => { const len = (it.n / sum) * C; const c = `<circle cx="28" cy="28" r="${r}" stroke="${COL[i]}" stroke-dasharray="${Math.max(0, len - (top.length > 1 ? 1.5 : 0))} ${C}" stroke-dashoffset="${-off}"/>`; off += len; return c; }).join('');
  const name = (it) => (it.other ? '其他' : gaChannel(it.k));
  const missing = pending;
  const tip = items.map((it) => `${gaChannel(it.k)} ${pctText(it.n / sum)} · ${num(it.n)} 次会话`).join('\n') + (missing ? `\n\n还有 ${missing} 个站点的渠道数据在同步中` : '');
  return `<div class="kc kc-ch"><div class="kc-h"><span class="l" data-tipf-always data-tipf="${esc(tip)}">流量渠道</span></div>
    <div class="chm"><svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" stroke="var(--sunken)"/>${segs}</svg>
      <div class="chm-l">${top.map((it, i) => `<span><i style="background:${COL[i]}"></i><em>${esc(name(it))}</em><b>${pctText(it.n / sum)}</b></span>`).join('')}</div></div></div>`;
}

const QF = [['all', '全部'], ['near', '排名 4–20'], ['low', '点击率偏低'], ['down', '下滑'], ['new', '新出现']];
const QF_HINT = {
  near: '排名 4–20、展示较多的词：优化标题和内容后，最容易进入前三',
  low: '点击率不到该排名常见水平一半的词：多半是标题或描述不够吸引人',
  down: '点击比上一周期少 3 次以上的词（包括这期跌出前 250 的）',
  new: '上一周期不在前 250、这期展示 20 次以上的词',
};
function queryLists(sc) {
  const qs = sc?.queries || [];
  return {
    all: [...qs].sort((a, b) => b.clicks - a.clicks || b.impressions - a.impressions).slice(0, 25),
    near: qs.filter((x) => x.position >= 4 && x.position <= 20 && x.impressions >= 10).sort((a, b) => b.impressions - a.impressions).slice(0, 25),
    low: qs.filter((x) => x.impressions >= 30 && x.ctr < gExpCtr(x.position) * 0.5)
      .map((x) => ({ ...x, lost: Math.round(x.impressions * (gExpCtr(x.position) - x.ctr)) })).sort((a, b) => b.lost - a.lost).slice(0, 25),
    down: (sc?.declining || []).slice(0, 25),
    new: sc?.hasPrev ? qs.filter((x) => x.prevPosition == null && x.impressions >= 20).slice(0, 25) : [],
  };
}
// 排名和上一周期比：数字变小是上升
function rankChange(x, hasPrev) {
  if (!hasPrev) return '';
  // 上期前 250 里没有、本期展示又不多的词，不一定是新词，不标
  if (x.prevPosition == null) return x.impressions >= 20 ? '<span class="qn" data-tipf-always data-tipf="上一周期不在前 250">新</span>' : '';
  const d = x.prevPosition - x.position;
  if (Math.abs(d) < 0.1) return '';
  return `<span class="gd ${d > 0 ? 'up' : 'down'}" data-tipf-always data-tipf="${esc(`上一周期排名 ${x.prevPosition.toFixed(1)}`)}">${d > 0 ? '↑' : '↓'}${Math.abs(d).toFixed(1)}</span>`;
}
function queryView(sc, f) {
  const lists = queryLists(sc);
  if (!sc?.hasPrev && (f === 'down' || f === 'new')) f = 'all';
  const rows = lists[f];
  const kc = (k) => `<div class="ell" data-tipf="${esc(k)}">${esc(k)}</div>`;
  const chips = `<div class="qf">${QF.map(([k, l]) => {
    const off = !sc?.hasPrev && (k === 'down' || k === 'new');
    return `<button type="button" class="${k === f ? 'on' : ''}" data-qf="${k}" ${off ? 'disabled data-tipf-always data-tipf="时间范围太长，没有上一周期可比"' : ''}>${l}${k !== 'all' ? `<small>${lists[k].length}</small>` : ''}</button>`;
  }).join('')}</div>${QF_HINT[f] ? `<div class="hint qf-h">${QF_HINT[f]}</div>` : ''}`;
  if (!rows.length) return `${chips}<div class="empty">${ic('inbox')}${f === 'all' ? '该时间段内暂无数据' : '没有符合条件的搜索词'}</div>`;
  const hp = sc.hasPrev;
  let head, row;
  if (f === 'low') {
    head = ['搜索词', '展示', '点击率', '常见', '少拿的点击'];
    row = (x) => [kc(x.k), num(x.impressions), pct1(x.ctr), `<span class="sm">${pct1(gExpCtr(x.position))}</span>`, `<b data-tipf-always data-tipf="按该排名常见点击率估算">${num(x.lost)}</b>`];
  } else if (f === 'down') {
    head = ['搜索词', '点击', '排名'];
    row = (x) => [kc(x.k), `<span class="sm">${num(x.prevClicks)} →</span> ${num(x.clicks)} <span class="gd down">${num(x.clicks - x.prevClicks)}</span>`,
      x.gone ? '<span class="sm">跌出前 250</span>' : `<span class="sm">${x.prevPosition.toFixed(1)} →</span> ${x.position.toFixed(1)}`];
  } else {
    head = ['搜索词', '点击', '展示', '点击率', '排名'];
    row = (x) => [kc(x.k), num(x.clicks), num(x.impressions), pct1(x.ctr), `${x.position.toFixed(1)}${rankChange(x, hp)}`];
  }
  return `${chips}<div class="g-scr"><table class="tbl gt qt${head.length === 3 ? ' q3' : ''}"><thead><tr>${head.map((h, i) => `<th class="${i ? 'r' : ''}">${h}</th>`).join('')}</tr></thead>

}

async function googleSyncAll(btn, onProgress) {

  try {
    do {
      r = await api('/google/sync', { method: 'POST', body: { before, discover: first } });

// 按短链筛选：只看某个短链跳转到的站点（默认地址和各条地区规则的域名）
function googleLinkFilter(root, items, onFilter) {
  const by = new Map();
  // 站点上放了这个短链（来源）或短链跳转到这个站点（去向）都算
  for (const x of items) {
    const seen = new Set();
    for (const l of [...x.linksFrom, ...x.links]) {
      if (!by.has(String(l.id))) by.set(String(l.id), { id: l.id, slug: l.slug, title: l.title, sites: 0, total: 0 });
      const e = by.get(String(l.id));
      if (!seen.has(l.id)) { e.sites++; seen.add(l.id); }
    }
    for (const l of x.linksFrom) by.get(String(l.id)).total += l.human;
  }
  const ids = [...by.keys()].sort((a, b) => by.get(b).total - by.get(a).total);
  if (gState.link && gState.link !== 'any' && !by.has(gState.link)) { gState.link = ''; onFilter(); }
  const anyN = items.filter((x) => x.linksFrom.length + x.links.length).length;
  dropdown(root, {
    value: gState.link, aria: '按短链筛选', search: ids.length > 8 ? '搜索短链或标题' : '', empty: '没有匹配的短链', minWidth: 260, maxWidth: 340,

          ${SHARE_SECTIONS.map(([k, t, desc]) => `<label class="ai-chk"><input type="checkbox" data-sec="${k}" ${opt.sections.has(k) ? 'checked' : ''}><div><b>${t}</b><span>${desc}</span></div></label>`).join('')}
          <div class="ai-l">有效期</div>
          <div class="seg" id="ai-exp">${SHARE_EXP.map(([v, l]) => `<button type="button" data-v="${v}" class="${v === opt.exp ? 'on' : ''}">${l}</button>`).join('')}</div>
          <label class="ai-chk ai-hide"><input type="checkbox" id="ai-hide" ${opt.hide ? 'checked' : ''}><div><b>隐藏敏感信息</b><span>不含账号邮箱、媒体资源 ID 和资源名</span></div></label>
          <input class="input ai-label" id="ai-label" maxlength="100" placeholder="备注（可选），如：10 月 SEO 复盘" autocomplete="off" aria-label="备注">
        </div>
      </div>
      <div class="err" role="alert"></div>
      <div class="row"><button type="button" class="btn" data-no>取消</button><button type="button" class="btn primary" data-ok>${ic('link', 15)}生成链接</button></div>`;
    d.querySelector('[data-no]').onclick = close;
    const count = () => { d.querySelector('#ai-n').textContent = sel.size; d.querySelector('#ai-cmp').classList.toggle('on', sel.size > COMPACT); };
    d.querySelectorAll('.ai-site input').forEach((c) => (c.onchange = () => {
      if (c.checked && sel.size >= MAX) { c.checked = false; toast(`一个链接最多包含 ${MAX} 个站点`, 'bad'); return; }
      c.checked ? sel.add(c.value) : sel.delete(c.value); count();
    }));
    // 有选中的就清空（搜索时只清空搜索结果里的），一个都没选就全选（最多 30 个）
    d.querySelector('[data-all]').onclick = () => {
      const any = list.some((x) => sel.has(x.host));
      for (const x of list) { if (any) sel.delete(x.host); else if (sel.size < MAX) sel.add(x.host); }
      form();
    };
    const qi = d.querySelector('.ai-q input');
    if (qi) qi.oninput = () => { q = qi.value.trim().toLowerCase(); const pos = qi.selectionStart; form(); const n = d.querySelector('.ai-q input'); n.focus(); n.setSelectionRange(pos, pos); };
    for (const [id, key] of [['ai-days', 'days'], ['ai-exp', 'exp']]) {
      const seg = d.querySelector('#' + id);
      segThumb(seg);
      seg.querySelectorAll('button').forEach((b) => (b.onclick = () => {
        opt[key] = Number(b.dataset.v);
        seg.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); segThumb(seg);
      }));
    }
    d.querySelectorAll('[data-sec]').forEach((c) => (c.onchange = () => { c.checked ? opt.sections.add(c.dataset.sec) : opt.sections.delete(c.dataset.sec); }));
    d.querySelector('#ai-hide').onchange = (e) => { opt.hide = e.target.checked; };
    const li = d.querySelector('#ai-label');
    li.value = opt.label; li.oninput = () => { opt.label = li.value; };
    d.querySelector('[data-ok]').onclick = async (e) => {
      const btn = e.currentTarget, err = d.querySelector('.err');
      if (!sel.size) { err.textContent = '请至少选择一个站点'; return; }
      if (!opt.sections.size) { err.textContent = '请至少选择一项内容'; return; }
      btn.disabled = true; err.textContent = '';
      try {
        const s = await api('/shares', { method: 'POST', body: { hosts: [...sel], days: opt.days, sections: [...opt.sections], expires: opt.exp, hide: opt.hide, label: opt.label.trim() } });
        done(s);
      } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
    };
  };

  // 生成后：链接 + 复制提示词 / 下载 / 预览
  const done = (s) => {
    d.innerHTML = `<h3>${ic('check', 18)}链接已生成</h3>
      <p>${esc(shareName(s))} · ${SHARE_RANGES.find(([v]) => v === s.days)?.[1]} · ${shareExpText(s)}。拿到链接的人都能查看这份报告，可随时在 设置 → AI 分析链接 撤销。</p>
      <div class="ai-url"><input class="input mono" readonly value="${esc(s.url)}" aria-label="分析链接">${copyBtn(s.url, 'btn icon', '')}</div>
      <div class="ai-acts">
        <button type="button" class="btn primary" data-prompt>${ic('copy', 15)}复制给 AI 的提示词</button>
        <a class="btn" href="${esc(s.url)}?download=1">${ic('dl', 15)}下载 Markdown</a>
        <a class="btn ghost" href="${esc(s.url)}" target="_blank" rel="noopener">${ic('ext', 15)}预览</a></div>
      <div class="ai-warm" id="ai-warm">${ic('refresh', 14)}<span>正在生成报告，完成后 AI 打开链接会更快…</span></div>
      <div class="tipbox sm" style="margin-top:14px">${ic('info', 15)}<div>提示词里已经带上链接，粘贴给 AI 即可。有些 AI 不能打开链接（如免费版或没有联网功能时），可以下载 Markdown 文件后上传给它。</div></div>
      <div class="row"><button type="button" class="btn" data-no>完成</button></div>`;
    d.querySelector('[data-no]').onclick = close;
    d.querySelector('[data-prompt]').onclick = (e) => copy(sharePrompt(s), '提示词已复制', e.currentTarget);
    d.querySelector('.ai-url input').onclick = (e) => e.target.select();
    const w = d.querySelector('#ai-warm');
    api(`/shares/${s.token}/warm`, { method: 'POST' })
      .then(() => { w.classList.add('ok'); w.innerHTML = `${ic('check', 14)}<span>报告已生成，可以发给 AI 了</span>`; })
      .catch(() => { w.classList.add('bad'); w.innerHTML = `${ic('alert', 14)}<span>报告生成失败，AI 打开链接时会重新生成</span>`; });
  };

  form();
  document.body.append(ov, d);
}

// 设置 → AI 分析链接：列表、复制、撤销
// 分析链接包含的站点：最多列 3 个，其余折叠成 +N（鼠标停留看全部）
function shareHosts(s) {
  const hs = s.hosts || [];
  if (!s.label && hs.length === 1) return '';
  const MAX = 3, shown = hs.slice(0, MAX), rest = hs.length - shown.length;
  return `<span class="ai-hs">${shown.map((h) => `<i class="mono">${esc(h)}</i>`).join('')}${rest > 0
    ? `<i class="more" data-tipf-always data-tipf="${esc(`共 ${hs.length} 个站点：\n${hs.join('\n')}`)}">+${rest}</i>` : ''}</span>`;
}
function renderShares(box, list, onState) {
  const items = list.items || [];
  box.innerHTML = items.length ? `<div class="ai-sl">${items.map((s) => `<div class="ai-si${s.expired ? ' off' : ''}">
      <div class="ai-st"><div class="ai-sh"><b>${esc(s.label || (s.hosts.length === 1 ? s.hosts[0] : `${s.hosts.length} 个站点`))}</b>${shareHosts(s)}</div>
        <span>${SHARE_RANGES.find(([v]) => v === s.days)?.[1] || ''} · 创建于 ${fmtTime(s.createdAt)} · ${shareExpText(s)} ·
          ${s.views ? `<button type="button" class="hr-more" data-views="${esc(s.token)}">打开 ${num(s.views)} 次${s.lastView ? `（最近 ${ago(s.lastView)}）` : ''}</button>` : '还没有被打开'}
          ${s.agents?.length ? `<span class="ai-ag">${s.agents.slice(0, 4).map((a) => `<i>${esc(a.agent)} ${a.n}</i>`).join('')}</span>` : ''}</span></div>
      ${s.expired ? '' : `<button type="button" class="btn sm ghost" data-prompt="${esc(s.token)}">${ic('copy', 14)}提示词</button>${copyBtn(s.url, 'btn sm ghost icon', '')}`}
      <button type="button" class="btn sm ghost icon danger-t" data-del="${esc(s.token)}" data-tip="${s.expired ? '删除' : '撤销'}" aria-label="撤销">${ic('trash', 15)}</button></div>`).join('')}</div>
    <p class="hint" style="margin-top:10px">撤销后链接立即失效。新链接在 <a href="#/sites">站点</a> 页或站点详情页右上角的“AI 分析”生成。</p>`
    : `<p class="set-p">还没有生成过分析链接。到 <a href="#/sites">站点</a> 页点右上角的“AI 分析”，选择站点后生成一个链接，发给 AI 就能让它分析这些站点的 SEO。</p>`;
  box.querySelectorAll('[data-prompt]').forEach((b) => (b.onclick = () => copy(sharePrompt(items.find((s) => s.token === b.dataset.prompt)), '提示词已复制', b)));
  box.querySelectorAll('[data-views]').forEach((b) => (b.onclick = () => shareViewsDialog(items.find((s) => s.token === b.dataset.views))));
  box.querySelectorAll('[data-del]').forEach((b) => (b.onclick = async () => {
    const s = items.find((x) => x.token === b.dataset.del);
    const ok = await confirmDialog({ title: s.expired ? '删除这个链接？' : '撤销这个分析链接？', text: `${shareName(s)}：撤销后链接立即失效，已经拿到链接的人（包括 AI）将无法再打开。`, ok: s.expired ? '删除' : '撤销', danger: true });
    if (!ok) return;
    try {
      await api('/shares/' + s.token, { method: 'DELETE' });
      const next = { items: items.filter((x) => x.token !== s.token) };
      toast('已撤销'); onState(next); renderShares(box, next, onState);
    } catch (ex) { toast(ex.message, 'bad'); }
  }));
}

function tagDialog({ title, text, tags = [], ok = '确定', value = '' }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'ov';
    const d = document.createElement('form'); d.className = 'dialog tag-d'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = `<h3>${esc(title)}</h3>${text ? `<p>${text}</p>` : ''}
      <input class="input" id="tg-in" maxlength="40" placeholder="分组名，如：交易所、新闻站、主力站" value="${esc(value)}" autocomplete="off" required>
      ${tags.length ? `<div class="tg-sug">${tags.map((t) => `<button type="button" class="gtg" data-t="${esc(t.tag)}">${esc(t.tag)}<small>${t.n}</small></button>`).join('')}</div>` : ''}
      <div class="row"><button type="button" class="btn" data-no>取消</button><button class="btn primary">${esc(ok)}</button></div>`;
    const done = (v) => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = (e) => { if (e.key === 'Escape') done(null); };
    ov.onclick = () => done(null);
    d.querySelector('[data-no]').onclick = () => done(null);
    d.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { d.querySelector('#tg-in').value = b.dataset.t; d.querySelector('#tg-in').focus(); }));
    d.onsubmit = (e) => { e.preventDefault(); const v = d.querySelector('#tg-in').value.trim(); if (v) done(v); };
    document.addEventListener('keydown', onKey);
    document.body.append(ov, d);
    setTimeout(() => d.querySelector('#tg-in').select(), 30);
  });
}

// 列表上方的分组筛选；底部是“给当前筛选的站点加分组”和“管理分组”
function googleTagFilter(root, items, onFilter, getRows) {
  const count = new Map();
  for (const x of items) for (const t of x.tags) count.set(t, (count.get(t) || 0) + 1);
  const tags = [...count.keys()].sort();
  const none = items.filter((x) => !x.tags.length).length;
  // 选中的分组已经不存在（被删除或改名）：恢复成全部，并重新筛选
  if (gState.tag && (gState.tag === '+none' ? false : !count.has(gState.tag))) { gState.tag = ''; onFilter(); }
  const ADD = '+add', MANAGE = '+manage';
  const init = () => dropdown(root, {
    value: gState.tag, aria: '按分组筛选', search: tags.length > 8 ? '搜索分组' : '', empty: '没有匹配的分组', minWidth: 240, maxWidth: 320,
    groups: (q) => q ? [['', tags.filter((t) => t.toLowerCase().includes(q))]]
      : [['', ['']], ...(tags.length ? [['分组', [...tags, '+none']]] : []), ['', [ADD, ...(tags.length ? [MANAGE] : [])]]],
    button: (v) => `${ic('tag', 14)}<span class="nm">${!v ? '全部分组' : v === '+none' ? '未分组' : esc(v)}</span>`,
    option: (v, q) => v === ADD ? `<span class="ot g-op g-sep">${ic('plus', 14)}给当前筛选的 ${getRows().length} 个站点加分组…</span>`
      : v === MANAGE ? `<span class="ot g-op">${ic('edit', 14)}管理分组…</span>`
      : !v ? `<span class="ot">全部分组<small>${items.length} 个站点</small></span>`
      : v === '+none' ? `<span class="ot">未分组<small>${none} 个</small></span>`
      : `<span class="ot">${hl(v, q)}<small>${count.get(v)} 个</small></span>`,
    onChange: async (v) => {
      if (v === ADD || v === MANAGE) {
        init();
        if (v === MANAGE) return tagManageDialog(() => renderSites(routeToken));
        const rows = getRows();
        if (!rows.length) return toast('当前筛选没有站点', 'bad');
        const tag = await tagDialog({ title: '加到分组', text: `把当前筛选的 <b>${rows.length}</b> 个站点加到分组（已在分组里的不受影响）。可以先搜索或用其他筛选条件选出站点。`,
          tags: tags.map((t) => ({ tag: t, n: count.get(t) })), ok: '加入分组' });
        if (!tag) return;
        try {
          await api('/google/tags', { method: 'PUT', body: { tag, hosts: rows.map((x) => x.host) } });
          toast(`已把 ${rows.length} 个站点加到“${tag}”`); renderSites(routeToken);
        } catch (ex) { toast(ex.message, 'bad'); }
        return;
      }
      gState.tag = v; onFilter();
    },
  });
  init();
}

// 标题后面的账号下拉：按账号筛选站点；底部是添加账号、管理账号
function googleAcctPicker(root, accts, items, onFilter) {

      : v === MANAGE ? `<span class="ot g-op">${ic('gear', 14)}管理账号</span>`
      : !v ? `<span class="ot">全部账号<small>${items.length} 个站点${split && accts.length > 1 ? `<i class="ot-i" data-tipf-always data-tipf="${esc(`其中 ${split} 个站点的 GA4 和 Search Console 来自不同账号，在两个账号下各算一次，所以各账号的站点数相加会多出 ${split} 个`)}">${ic('info', 12)}</i>` : ''}</small></span>`
      : `<span class="ot">${by.get(v).error ? ic('alert', 13) : ''}${mailTip(by.get(v).email)}<small>${by.get(v).error ? '需要重新连接' : `${count(v)} 个站点`}</small></span>`,
    onChange: (v) => {
      if (v === ADD || v === MANAGE) { init(); return v === ADD ? googleConnect(null) : goSettings('goo'); }
      gState.acct = v; onFilter();
    },
  });
  init();
}

// 导出站点列表（当前的筛选和排序），带 BOM 方便 Excel 打开中文
function exportSitesCsv(rows, d) {
  const cell = (v) => { const t = v == null ? '' : String(v); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const r2 = (v) => (v == null ? '' : Math.round(v * 100) / 100);
  const head = ['站点', 'GA4 媒体资源', 'Search Console', '用户', '上期用户', '会话', '上期会话', '关键事件', '互动率',
    '搜索点击', '上期搜索点击', '展示', '上期展示', '点击率', '平均排名', '短链点击（真人）', '短链访客', '点出率', '已编入', '已检查网址', '网址数', 'Bing 点击', '上期 Bing 点击', 'Bing 展示', 'Bing 已收录', 'Bing 索引中网页'].map(T);
  const lines = [head.map(cell).join(',')];
  for (const x of rows) {
    const ga = x.cur.ga, pg = x.prev.ga, sc = x.cur.gsc, ps = x.prev.gsc;
    const lh = x.linksFrom.reduce((a, l) => a + l.human, 0);
    lines.push([x.host, x.ga4?.name || '', x.gsc || '', x.users, x.prevUsers, ga?.sessions, pg?.sessions, ga?.keyEvents, ga ? r2(ga.engagement * 100) + '%' : '',
      sc?.clicks, ps?.clicks, sc?.impressions, ps?.impressions, sc ? r2(sc.ctr * 100) + '%' : '', sc?.impressions ? r2(sc.position) : '',
      lh || '', x.linksFromVisitors ?? '', ga?.sessions && lh ? r2((lh / ga.sessions) * 100) + '%' : '',
      x.index?.done ? x.index.yes : '', x.index?.done ?? '', x.index?.urls ?? '',
      x.cur.bing?.clicks ?? '', x.prev.bing?.clicks ?? '', x.cur.bing?.impressions ?? '', x.index?.bdone ? x.index.byes : '', x.bing ? x.bingInIndex : ''].map(cell).join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sites-${d.ranges.from}_${d.ranges.to}.csv`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`已导出 ${rows.length} 个站点`);
}

// ---------------------------------------------------------------- 系统状态
// 每一项：ok / warn / bad + 说明；定时任务超过 3 小时没跑算异常
function sysChecks(st) {
  const H = 3600000, now = st.now, c = st.cron;
  const out = [];
  const steps = c?.steps || {};
  const failed = Object.entries(steps).filter(([, v]) => !v.ok);
  const NAME = { schema: '建表', aggregate: '访问汇总', backfill: '访客回填', prune: '清理明细', cleanup: '清理缓存', google: 'Google 同步', bing: 'Bing 同步', gindex: '网页索引检查', notify: '推送通知', usage: '用量预警', health: '目标页检查' };
  out.push(!c ? { lv: 'warn', t: '定时任务', d: '还没有运行记录（部署后每小时整点运行一次）' }
    : now - c.at > 3 * H ? { lv: 'bad', t: '定时任务', d: `上次运行在 ${ago(c.at)}，超过 3 小时没有运行，请检查 wrangler.toml 里的 [triggers] crons` }
    : failed.length ? { lv: 'bad', t: '定时任务', d: `${ago(c.at)}运行，${failed.map(([k, v]) => `${NAME[k] || k}失败：${v.error}`).join('；')}` }
    : { lv: 'ok', t: '定时任务', d: `${ago(c.at)}运行，耗时 ${(c.ms / 1000).toFixed(1)} 秒，${Object.keys(steps).length} 个步骤都正常` });
  out.push(!st.aggMark ? { lv: 'warn', t: '访问汇总', d: '还没有汇总过（有访问后自动开始）' }
    : now - st.aggMark > 3 * H ? { lv: 'warn', t: '访问汇总', d: `汇总到 ${fmtTime(st.aggMark)}，落后 ${Math.round((now - st.aggMark) / H)} 小时（之后的访问实时读取，统计不受影响）` }
    : { lv: 'ok', t: '访问汇总', d: `已汇总到 ${fmtTime(st.aggMark)}，之后的访问实时读取` });
  const g = st.google;
  if (g.accounts) {
    out.push(g.accountErrors.length ? { lv: 'bad', t: 'Google 账号', d: g.accountErrors.map((a) => `${maskEmail(a.email)}：${a.error}`).join('；') }
      : { lv: 'ok', t: 'Google 账号', d: `${g.accounts} 个账号授权正常` });
    out.push(g.pending ? { lv: 'warn', t: 'Google 同步', d: `${g.sites} 个站点，还有 ${g.pending} 个在同步中（每小时同步 10 个，也可以在“站点”页立即同步）` }
      : g.siteErrors ? { lv: 'warn', t: 'Google 同步', d: `${g.siteErrors} 个站点上次同步出错，到“站点”页查看` }
      : { lv: 'ok', t: 'Google 同步', d: `${g.sites} 个站点，最近同步于 ${g.lastSync ? ago(g.lastSync) : '—'}` });
  }
  const n = st.notify;
  out.push(!n.channels.length ? { lv: 'warn', t: '推送通知', d: '没有开启推送渠道，报告和提醒不会发送' }
    : n.last && !n.last.ok ? { lv: 'bad', t: '推送通知', d: `上次推送失败：${n.last.error}` }
    : { lv: 'ok', t: '推送通知', d: `渠道：${n.channels.join('、')}${n.last ? `，上次推送 ${ago(n.last.at)}` : ''}` });
  if (st.health) out.push(!st.health.urls ? { lv: 'warn', t: '目标页检查', d: '还没有检查过（定时任务每小时检查一批）' }
    : st.health.down ? { lv: 'bad', t: '目标页检查', d: `${st.health.down} 个目标地址打不开，到“短链”页查看标红的短链` }
    : { lv: 'ok', t: '目标页检查', d: `${st.health.urls} 个目标地址都能打开，最近检查于 ${ago(st.health.last)}` });
  out.push(st.usage.configured ? { lv: 'ok', t: 'Cloudflare 用量', d: st.usage.alert ? '已配置，用量预警已开启' : '已配置（用量预警未开启，可以在“通知”页开启）' }
    : { lv: 'warn', t: 'Cloudflare 用量', d: '没有填写凭据，看不到账户用量' });
  if (!st.backfillDone && st.aggMark) out.push({ lv: 'warn', t: '访客回填', d: '按来源的独立访客正在回填旧数据，几个小时内完成' });
  return out;
}
const sysLevel = (st) => { const c = sysChecks(st); return c.some((x) => x.lv === 'bad') ? 'bad' : c.some((x) => x.lv === 'warn') ? 'warn' : 'ok'; };
const sysPill = (st) => ({ ok: '<span class="pill on">正常</span>', warn: '<span class="pill exp">注意</span>', bad: '<span class="pill bad-p">异常</span>' }[sysLevel(st)]);
const sysSummary = (st) => {
  const c = sysChecks(st), bad = c.filter((x) => x.lv === 'bad'), warn = c.filter((x) => x.lv === 'warn');
  return bad.length ? `${bad.map((x) => x.t).join('、')}异常` : warn.length ? `${warn.length} 项需要注意：${warn.map((x) => x.t).join('、')}` : `定时任务、汇总${st.google.accounts ? '、Google 同步' : ''}都正常`;
};
const sysBody = (st) => `<div class="sys-l">${sysChecks(st).map((x) => `<div class="sys-r ${x.lv}"><span class="sys-i">${ic(x.lv === 'ok' ? 'check' : 'alert', 13)}</span><b>${x.t}</b><span>${esc(x.d)}</span></div>`).join('')}</div>
  ${st.cron ? `<details class="wz-more" style="margin-top:12px"><summary>上次定时任务的各个步骤</summary>${cronSteps(st.cron)}</details>` : ''}
  ${st.cronManual ? `<details class="wz-more" style="margin-top:8px"><summary>最近一次手动运行（${ago(st.cronManual.at)}，耗时 ${(st.cronManual.ms / 1000).toFixed(1)} 秒）</summary>${cronSteps(st.cronManual)}</details>` : ''}
  <div class="sys-run"><button type="button" class="btn sm" id="sys-run" data-tipf-always data-tipf="按定时任务的步骤立即跑一遍：访问汇总、Google / Bing 同步、网页索引检查、目标页检查。不发推送通知、不自动提交网址给 Bing，每步比整点那次少做一些。请求从你当前访问的 Cloudflare 节点发出">${ic('refresh', 14)}立即运行一次</button></div>`;
// 定时任务各步骤的耗时 / 错误
const cronSteps = (c) => `<div class="sys-steps">${Object.entries(c.steps).map(([k, v]) => `<span class="${v.ok ? '' : 'bad'}">${esc(k)} · ${v.ok ? `${v.ms} ms` : esc(v.error)}</span>`).join('')}</div>`;

// 打开设置页并展开某一项
function goSettings(id) { store.set('set:open', id); location.hash = '#/settings'; }

// 设置 → Google 集成：OAuth 客户端 + 已连接的账号（添加账号在“站点”页）
function googleSummary(st) {
  if (!st.configured) return '未配置，用于“站点”页的 GA4 / Search Console 数据';
  const n = (st.accounts || []).length;
  return `客户端 ${esc(st.config.clientId.split('-')[0])}… · ${n ? `已连接 ${n} 个账号` : '还没有连接账号'}${st.error ? ' · 有账号需要重新连接' : ''}`;
}
const googlePill = (st) => !st.configured ? '<span class="pill off">未配置</span>'
  : st.error ? '<span class="pill off">需重新连接</span>' : '<span class="pill on">已配置</span>';

function renderGoogleSettings(box, st, onState) {
  const reload = async () => {
    try { const d = await api('/google/status'); onState(d); renderGoogleSettings(box, d, onState); } catch (err) { toast(err.message, 'bad'); }
  };
  const accts = st.accounts || [];
  const n = (v, l) => (v == null ? '' : `${l} ${v} 个`);
  box.innerHTML = `
    <h4 class="set-h">OAuth 客户端</h4>
    ${st.configured
      ? `${googleConfigBox(st)}
        <details class="wz-more" style="margin-top:12px"><summary>创建步骤和重定向 URI</summary>${googleSteps()}</details>`
      : `<p class="set-p">连接 Google 账号之前，需要先在 Google Cloud 创建一个 OAuth 客户端：</p>${googleSteps()}<div style="margin-top:18px">${googleConfigBox(st)}</div>`}
    ${st.configured ? `<h4 class="set-h" style="margin-top:26px">已连接的账号</h4>
      ${accts.length ? `<div class="g-acc-l">${accts.map((a) => `<div class="g-acc-r${a.error ? ' bad' : ''}">
        <span class="g-acc-i">${ic(a.error ? 'alert' : 'check', 14)}</span>
        <div class="g-acc-t"><b>${a.email ? mailTip(a.email) : esc(a.id)}</b>
          <span>${a.error ? esc(a.error) : [n(a.ga4, 'GA4'), n(a.gsc, 'GSC'), `连接于 ${fmtTime(a.connectedAt)}`].filter(Boolean).join(' · ')}</span></div>
        ${a.error ? '<button type="button" class="btn sm" data-re>重新连接</button>'
          : !a.canSubmit && a.gsc ? '<button type="button" class="btn sm" data-re data-tipf-always data-tipf="早先只授予了 Search Console 只读权限；重新授权一次后，才能在后台提交站点地图">重新授权</button>' : ''}
        <button type="button" class="btn sm ghost danger-t" data-off="${esc(a.id)}" data-mail="${esc(a.email)}">断开</button></div>`).join('')}</div>
        <p class="hint" style="margin-top:10px">所有账号的站点按域名合并显示；多个账号都能看到同一个站点时，用最早连接的账号的数据。添加账号请到 <a href="#/sites">站点</a> 页。</p>`
      : `<p class="set-p">还没有连接账号，到 <a href="#/sites">站点</a> 页连接 Google 账号。</p>`}` : ''}`;
  bindGoogleConfig(box, st, reload);
  box.querySelectorAll('[data-re]').forEach((b) => (b.onclick = () => googleConnect(b)));
  box.querySelectorAll('[data-off]').forEach((b) => (b.onclick = async () => {
    const last = accts.length === 1;
    const ok = await confirmDialog({ title: `断开 ${maskEmail(b.dataset.mail)}？`,
      text: last ? '会撤销授权，并删除已同步的 GA4 / Search Console 数据。之后可以随时重新连接。'
        : '会撤销这个账号的授权；只来自这个账号的站点和数据会删除，其他账号的站点不受影响。', ok: '断开', danger: true });
    if (!ok) return;
    try { const d = await api('/google/disconnect', { method: 'POST', body: { id: b.dataset.off } }); toast(`已断开 ${maskEmail(b.dataset.mail)}`); onState(d); renderGoogleSettings(box, d, onState); }
    catch (err) { toast(err.message, 'bad'); }
  }));
}

async function mountSiteIndex(host) {
  const el = document.getElementById('g-idx');
  if (!el) return;
  const body = el.querySelector('.card-b');
  let d, f = store.get('ix:f', 'all'), reason = '', tab = store.get('ix:tab', 0);
  const draw = () => {
    el.querySelectorAll('.tabs button').forEach((b, i) => b.classList.toggle('on', i === tab));
    body.innerHTML = tab ? idxSitemapsView(d) : idxUrlsView(d, f, reason);
  };
  try { d = await api(`/google/index?host=${encodeURIComponent(host)}`); }
  catch (err) { body.innerHTML = `<div class="empty">${ic('alert')}${esc(err.message)}</div>`; return; }
  if (!document.body.contains(el)) return;
  draw();
  el.querySelectorAll('.tabs button').forEach((b, i) => (b.onclick = () => { tab = i; store.set('ix:tab', i); draw(); }));
  const run = async (btn, path, payload, ok) => {
    btn.disabled = true; btn.classList.add('busy');
    try { const r = await api(`/google/index/${path}`, { method: 'POST', body: { host, ...payload } }); d = r.index; draw(); toast(ok(r)); }
    catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.classList.remove('busy'); }
  };
  el.querySelector('#ix-chk').onclick = (e) => run(e.currentTarget, 'check', {}, (r) => [r.done || !r.failed ? `已检查 ${r.done} 个网址` : '', r.failed ? `${r.failed} 个检查失败` : '', r.left ? `还有 ${r.left} 个待检查` : ''].filter(Boolean).join('，'));
  body.addEventListener('click', (e) => {
    const b = e.target.closest('[data-ixf],[data-ixr],[data-ixi],[data-ixs],[data-ixb],[data-ixbs],#ix-re,#ix-bsub');
    if (!b || b.disabled) return;
    if (b.id === 'ix-re') return googleConnect(b);
    if (b.dataset.ixf) { f = b.dataset.ixf; reason = ''; store.set('ix:f', f); return draw(); }
    if (b.dataset.ixr) { reason = reason === b.dataset.ixr ? '' : b.dataset.ixr; return draw(); }
    if (b.dataset.ixi) {

      if (d.google && d.bing) return run(b, 'inspect', { url: b.dataset.ixi }, () => '已重新检查').then(() => api('/google/index/inspect', { method: 'POST', body: { host, url: b.dataset.ixi, which: 'bing' } }).then((r) => { d = r.index; draw(); }).catch(() => {}));
      return run(b, 'inspect', { url: b.dataset.ixi, which: d.google ? 'google' : 'bing' }, () => '已重新检查');
    }
    if (b.dataset.ixb) return run(b, 'bing-submit', { url: b.dataset.ixb }, (r) => `已提交到 Bing${r.quota != null ? `，今天还能提交 ${r.quota} 个` : ''}`);
    if (b.id === 'ix-bsub') return run(b, 'bing-submit', {}, (r) => `已提交 ${r.submitted} 个网址到 Bing${r.quota != null ? `，今天还能提交 ${r.quota} 个` : ''}`);

      ${d.gsc || d.bingSite ? `<section class="card rv" id="g-idx"><div class="card-h"><h3>${d.gsc && d.bingSite ? '网页索引' : d.gsc ? '网页索引 · Search Console' : '网页索引 · Bing'}</h3><span class="sp"></span>

// ---------------------------------------------------------------- 设置（修改密码 / 两步验证）
async function renderSettings(token) {
  const head = `<header class="ph"><div><div class="kicker">设置</div><h1>账号与安全</h1><div class="sub">管理后台登录密码、两步验证、来源追踪和第三方集成</div></div></header>`;
  shell('settings', `${head}<div class="acc">${skel(76, 3)}</div>`);
  const [mfa, trk, ret, use, goo, shr, sys, ses, bst] = await Promise.all([api('/2fa'), api('/tracking'), api('/retention'),
    api('/usage').catch((e) => ({ configured: true, errors: [e.message], days: [] })), api('/google/status').catch(() => ({ configured: false })), api('/shares').catch(() => ({ items: [] })), api('/status').catch(() => null),
    api('/sessions').catch(() => ({ items: [] })), api('/bing/status').catch(() => ({ configured: false }))]);
  if (token !== routeToken) return;
  const item = (id, icon, cls, title, sub, status, body) => `
    <section class="card rv fold acc-i" data-acc="${id}">
      <button type="button" class="card-h fold-h" aria-expanded="false">
        <span class="chi ${cls}">${BRAND[icon] ? BRAND[icon](18) : ic(icon, 17)}</span>
        <div class="acc-t"><h3>${title}</h3><span class="sub" data-sub="${id}">${sub}</span></div>
        <span class="sp"></span><span class="acc-s" data-st="${id}">${status}</span>${ic('chev', 16)}</button>
      <div class="fold-b"><div class="card-b" id="acc-${id}">${body}</div></div>
    </section>`;
  const pill = (on) => `<span class="pill ${on ? 'on' : 'off'}">${on ? '已开启' : '未开启'}</span>`;
  document.getElementById('page').innerHTML = `${head}
    <div class="acc">
      ${item('use', 'cloudflare', 'use brand', 'Cloudflare 用量', usageSummary(use), usagePill(use), '')}
      ${item('pw', 'key', 'pw', '修改密码', '修改后，其他设备上的登录会自动退出', '', `
        <form class="set-form" id="pwf">
          ${passwordFields('')}
          <div class="err" style="margin:4px 0 12px" role="alert"></div>
          <button class="btn primary">保存新密码</button>
        </form>`)}
      ${item('mfa', 'shield', 'mfa', '两步验证', '登录时还需要输入手机验证器上的 6 位动态码', pill(mfa.enabled), `
        <p class="set-p">${mfa.enabled
          ? `开启于 ${fmtTime(mfa.since)}。登录时除了密码，还需要输入手机验证器 App 上的 6 位动态码。`
          : '开启后，登录时除了密码，还需要输入手机验证器 App 上的 6 位动态码。即使密码泄露，别人也登不进后台、改不了跳转地址。'}</p>
        <ul class="set-list">
          <li>${ic('check', 14)}支持 Google Authenticator、Microsoft Authenticator、1Password 等</li>
          <li>${ic('check', 14)}动态码连续输错 5 次锁定 15 分钟</li>
          <li>${ic('check', 14)}手机丢失可在 Cloudflare 账号下用命令关闭（见 README）</li>
        </ul>
        <button class="btn ${mfa.enabled ? 'danger' : 'primary'}" id="mfa-btn">${ic('shield', 15)}${mfa.enabled ? '关闭两步验证' : '开启两步验证'}</button>`)}
      ${item('dev', 'desk', 'dev', '登录设备', sessionsSummary(ses), sessionsPill(ses), '')}
      ${item('trk', 'search', 'trk', '来源追踪', '识别访客从哪个搜索引擎进入推广页', pill(trk.enabled), '')}
      ${item('goo', 'google', 'goo brand', 'Google 集成', googleSummary(goo), googlePill(goo), '')}
      ${item('bing', 'bing', 'bing brand', 'Bing Webmaster', bingSummary(bst), bingPill(bst), '')}
      ${goo.connected || shr.items.length ? item('ai', 'ai', 'ai', 'AI 分析链接', sharesSummary(shr), sharesPill(shr), '') : ''}
      ${sys ? item('sys', 'pulse', 'sys', '系统状态', sysSummary(sys), sysPill(sys), sysBody(sys)) : ''}
      ${item('ret', 'inbox', 'ret', '数据保留', '访问明细保存多久；统计数据长期保留', `<span class="pill on">${ret.days ? ret.days + ' 天' : '永久'}</span>`, '')}
      ${item('lang', 'globe', 'lang', '界面语言', '后台显示的语言，默认跟随浏览器', `<span class="pill on notranslate">${EN ? 'English' : '中文'}</span>`, `
        <div class="seg notranslate" id="lang-seg"><button type="button" data-l="zh">中文</button><button type="button" data-l="en">English</button></div>
        <p class="set-p" style="margin-top:12px">只影响后台界面；统计报告、推送和 AI 分析报告仍是中文。</p>`)}
    </div>`;
  const page = document.getElementById('page');
  reveal(page);

  // 风琴：同一时间只展开一项，记住上次展开的
  const items = [...page.querySelectorAll('.acc-i')];
  const open = (id) => {
    items.forEach((el) => {
      const on = el.dataset.acc === id && !el.classList.contains('open');
      el.classList.toggle('open', on);
      el.querySelector('.fold-h').setAttribute('aria-expanded', on);
    });
    store.set('set:open', page.querySelector('.acc-i.open')?.dataset.acc || '');
  };
  items.forEach((el) => (el.querySelector('.fold-h').onclick = () => open(el.dataset.acc)));
  const last = store.get('set:open', '');
  if (last) open(last);

  const pwf = document.getElementById('pwf');
  bindPasswordForm(pwf, '', () => { pwf.reset(); pwf.querySelector('.pwm').dataset.n = ''; pwf.querySelector('#p-tip').textContent = '至少 8 位，建议混合字母、数字和符号'; pwf.querySelector('button.primary').disabled = false; });
  document.getElementById('mfa-btn').onclick = () => openMfaDialog(() => route());
  renderSessions(document.getElementById('acc-dev'), ses, (d) => {
    page.querySelector('[data-st="dev"]').innerHTML = sessionsPill(d);
    page.querySelector('[data-sub="dev"]').innerHTML = sessionsSummary(d);
  });
  renderTracking(document.getElementById('acc-trk'), trk, (on) => { page.querySelector('[data-st="trk"]').innerHTML = pill(on); });
  const sysBox = document.getElementById('acc-sys');
  if (sysBox) sysBox.addEventListener('click', async (e) => {
    const btn = e.target.closest('#sys-run');
    if (!btn || btn.disabled) return;
    btn.disabled = true; btn.classList.add('busy');
    const label = btn.lastChild; label.textContent = '运行中…（约 1–2 分钟）';
    try {
      const d = await api('/cron/run', { method: 'POST' });
      const bad = Object.entries(d.result.steps).filter(([, v]) => !v.ok);
      sysBox.innerHTML = sysBody(d.status);
      page.querySelector('[data-st="sys"]').innerHTML = sysPill(d.status);
      page.querySelector('[data-sub="sys"]').innerHTML = sysSummary(d.status);
      toast(bad.length ? `运行完成，${bad.length} 个步骤出错：${bad.map(([k]) => k).join('、')}` : `运行完成，用时 ${(d.result.ms / 1000).toFixed(1)} 秒`, bad.length ? 'bad' : 'ok');
    } catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.classList.remove('busy'); label.textContent = '立即运行一次'; }
  });
  renderGoogleSettings(document.getElementById('acc-goo'), goo, (g) => {
    page.querySelector('[data-st="goo"]').innerHTML = googlePill(g);
    page.querySelector('[data-sub="goo"]').innerHTML = googleSummary(g);
  });
  renderBingSettings(document.getElementById('acc-bing'), bst, (b) => {
    page.querySelector('[data-st="bing"]').innerHTML = bingPill(b);
    page.querySelector('[data-sub="bing"]').innerHTML = bingSummary(b);
  });
  const shBox = document.getElementById('acc-ai');
  if (shBox) renderShares(shBox, shr, (l) => {
    page.querySelector('[data-st="ai"]').innerHTML = sharesPill(l);
    page.querySelector('[data-sub="ai"]').innerHTML = sharesSummary(l);
  });
  renderUsage(document.getElementById('acc-use'), use, (u) => {
    page.querySelector('[data-st="use"]').innerHTML = usagePill(u);
    page.querySelector('[data-sub="use"]').innerHTML = usageSummary(u);
  });
  const ls = document.getElementById('lang-seg');
  ls.querySelectorAll('button').forEach((b) => { b.classList.toggle('on', b.dataset.l === (EN ? 'en' : 'zh')); b.onclick = () => b.dataset.l !== (EN ? 'en' : 'zh') && setLang(b.dataset.l); });
  setTimeout(() => segThumb(ls), 0);
  renderRetention(document.getElementById('acc-ret'), ret, (days) => { page.querySelector('[data-st="ret"]').innerHTML = `<span class="pill on">${days ? days + ' 天' : '永久'}</span>`; });
}

// ---------------------------------------------------------------- 登录设备
const sessionsPill = (d) => `<span class="pill ${d.items.length > 1 ? 'on' : 'off'}">${d.items.length} 台</span>`;
const sessionsSummary = (d) => {
  const others = d.items.filter((x) => !x.current);
  if (!others.length) return '只有当前设备登录着';
  const last = others[0];
  return `另有 ${others.length} 台设备登录着，最近一台 ${esc(ago(last.seen_at))}使用`;
};
function renderSessions(box, d, onState) {
  const name = (x) => [x.browser, x.os].filter((v) => v && v !== 'Other' && v !== 'Unknown').join(' · ') || '未知设备';
  const where = (x) => [x.ip, [x.country ? country(x.country) : '', x.city].filter(Boolean).join(' ')].filter(Boolean).join(' · ');
  const draw = () => {
    const others = d.items.filter((x) => !x.current);
    box.innerHTML = `<p class="set-p">每次登录记一台设备，登录有效期 7 天。发现不认识的设备，可以让它退出，并尽快修改密码。</p>
      <div class="ses">${d.items.map((x) => `<div class="ses-r${x.current ? ' cur' : ''}">
        <span class="ses-i">${ic(x.device === 'Mobile' ? 'phone' : x.device === 'Tablet' ? 'tab' : 'desk', 17)}</span>
        <div class="ses-b"><div class="ses-n"><b>${esc(name(x))}</b>${x.current ? '<span class="pill on">当前设备</span>' : ''}</div>
          <div class="ses-m"><span data-tipf-always data-tipf="${esc(x.ua || '')}">${esc(where(x)) || '—'}</span></div>
          <div class="ses-m"><span data-tipf-always data-tipf="${esc(fmtTime(x.created_at))}">登录于 ${esc(ago(x.created_at))}</span> · ${x.current ? '正在使用' : `<span data-tipf-always data-tipf="${esc(fmtTime(x.seen_at))}">最近使用 ${esc(ago(x.seen_at))}</span>`}</div></div>
        ${x.current ? '' : `<button type="button" class="btn sm" data-out="${esc(x.id)}">${ic('out', 14)}退出</button>`}
      </div>`).join('')}</div>
      ${others.length ? `<button type="button" class="btn danger" id="ses-all">${ic('out', 15)}退出其他所有设备</button>` : ''}`;
    box.querySelectorAll('[data-out]').forEach((b) => (b.onclick = async () => {
      b.disabled = true;
      try {
        await api(`/sessions/${b.dataset.out}`, { method: 'DELETE' });
        d = { items: d.items.filter((x) => x.id !== b.dataset.out) }; draw(); onState(d); toast('这台设备已退出登录');
      } catch (ex) { toast(ex.message, 'bad'); b.disabled = false; }
    }));
    const all = box.querySelector('#ses-all');
    if (all) all.onclick = async () => {

// ---------------------------------------------------------------- Cloudflare 用量
const FREE_LIMITS = { rowsRead: 5e6, rowsWritten: 1e5, requests: 1e5, storage: 5e9 };
const wan = (n) => (EN ? (n >= 1e9 ? `${+(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : n >= 1e4 ? `${+(n / 1e3).toFixed(1)}K` : num(n))
  : n >= 1e8 ? `${+(n / 1e8).toFixed(2)} 亿` : n >= 1e4 ? `${+(n / 1e4).toFixed(1)} 万` : num(n));
const bytes = (b) => (b >= 1e9 ? `${+(b / 1e9).toFixed(2)} GB` : b >= 1e6 ? `${+(b / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1e3))} kB`);
const usagePill = (u) => !u.configured ? '<span class="pill off">未配置</span>'
  : u.plan === 'paid' ? '<span class="pill on">付费版</span>' : u.plan === 'free' ? '<span class="pill on">免费版</span>' : '<span class="pill off">套餐未知</span>';

// 用量是否足够：按目前速度推算到月底（付费版）或今天结束（免费版），取最紧的一项
function usageHealth(u) {
  if (!u.configured || !(u.days || []).length) return null;
  if (u.forecast) {
    const NAME = { rowsRead: '读取', rowsWritten: '写入', requests: '请求' };
    const items = u.forecast.items.map((x) => ({ k: x.k, name: NAME[x.k], used: x.ratio, proj: x.projRatio, runOut: x.runOut }));
    const worst = items.reduce((a, b) => (b.proj > a.proj ? b : a));
    return { paid: u.forecast.paid, items, worst, level: worst.proj >= 1 ? 'bad' : worst.proj >= 0.8 ? 'warn' : 'ok' };
  }
  const paid = u.plan === 'paid';
  const cur = paid ? u.month : (u.days || []).find((d) => d.date === u.today);
  if (!cur) return null;
  const L = paid ? { rowsRead: 25e9, rowsWritten: 5e7, requests: 1e7 } : { rowsRead: 5e6, rowsWritten: 1e5, requests: 1e5 };
  const now = new Date();
  // 已过去的比例：付费版按本月天数，免费版按今天的小时（UTC）
  const dim = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0)).getUTCDate();
  const elapsed = paid
    ? (now.getUTCDate() - 1 + (now.getUTCHours() * 60 + now.getUTCMinutes()) / 1440) / dim
    : (now.getUTCHours() * 60 + now.getUTCMinutes()) / 1440;
  const NAME = { rowsRead: '读取', rowsWritten: '写入', requests: '请求' };
  const items = Object.keys(L).map((k) => {
    const used = cur[k] / L[k];
    return { k, name: NAME[k], used, proj: elapsed > 0.02 ? used / elapsed : used };
  });
  const worst = items.reduce((a, b) => (b.proj > a.proj ? b : a));
  const level = worst.proj >= 1 ? 'bad' : worst.proj >= 0.8 ? 'warn' : 'ok';
  return { paid, items, worst, level };
}
const pctText = (x) => (x > 0 && x < 0.01 ? '<1%' : `${Math.round(x * 100)}%`);

// 收起时标题下的一句话摘要
function usageSummary(u) {
  if (!u.configured) return '未配置，展开填写账户 ID 和 API 令牌';
  if (u.errors?.length && !(u.days || []).some((d) => d.rowsRead)) return '读取用量失败，展开查看原因';
  const h = usageHealth(u);
  if (!h) return '暂无数据';
  const label = { ok: '充足', warn: '偏紧', bad: '将超出' }[h.level];
  const tip = h.level === 'bad' ? (h.paid ? '，超出部分按量计费' : '，超出后当天请求会失败') : '';
  const sentence = `${label}：${h.paid ? '本月' : '今天'}已用 ${h.items.map((x) => `${x.name} ${pctText(x.used)}`).join('、')}，`
    + `按目前速度${h.paid ? '月底' : '今天结束时'}${h.items.map((x) => `${x.name}约 ${pctText(x.proj)}`).join('、')}${tip}`;
  // 每项一个小进度条：实色为已用，浅色为按目前速度推算到期末
  const bar = (x) => {
    const lv = x.proj >= 1 ? 'bad' : x.proj >= 0.8 ? 'warn' : 'ok';
    return `<span class="us-i"><em>${x.name}</em><i class="us-b ${lv}"><s style="width:${Math.min(100, x.proj * 100)}%"></s><u style="width:${Math.max(x.used ? 2 : 0, Math.min(100, x.used * 100))}%"></u></i><em class="us-p">${pctText(x.used)}</em></span>`;
  };
  return `<span class="use-sum" data-tipf-always data-tipf="${esc(sentence)}"><b class="use-lv ${h.level}">${label}</b>${h.items.map(bar).join('')}</span>`;
}

function bindCfForm(box, u, onState) {

function renderUsage(box, u, onState) {

        <li>打开 Cloudflare 控制台 → 右上角头像 → <b>我的个人资料 → API 令牌 → 创建令牌 → 创建自定义令牌</b>。</li>

      <button type="button" class="btn sm icon" data-cfg-edit aria-label="修改凭据" data-tipf-always data-tipf="${esc(['凭据已加密保存在数据库', `账户 ${u.config?.accountId || ''}`, `令牌 ••••${u.config?.tokenTail || ''}`,

// 数据保留：访问明细超过期限自动删除；统计读汇总数据，不受影响
function renderRetention(box, r, onState) {
  const opts = [[0, '永久'], [365, '365 天'], [180, '180 天'], [90, '90 天'], [60, '60 天']];
  box.innerHTML = `
    <p class="set-p">每次访问都会记录一条明细（IP、来源、设备……），用于“访问明细”列表、导出 CSV 和定时报告。
      统计页面读的是按小时 / 按天汇总的数据，明细删除后，趋势、来源、地区等统计照常显示。</p>
    <div class="seg" id="ret-seg">${opts.map(([d, l]) => `<button type="button" data-d="${d}" class="${d === r.days ? 'on' : ''}">${l}</button>`).join('')}</div>
    <ul class="set-list" style="margin-top:16px">

    </ul>`;
  segThumb(box.querySelector('#ret-seg'));
  box.querySelectorAll('#ret-seg button').forEach((b) => (b.onclick = async () => {

      const ok = await confirmDialog({ title: `只保留最近 ${days} 天的访问明细？`, text: `超过 ${days} 天的访问明细会在下一个整点删除，无法恢复。趋势、来源、地区等统计不受影响。`, ok: '确认' });
      if (!ok) return;

  }));

const bingForm = (b) => `<form class="set-form cfg-f" id="bing-f">

  };
  const hourBox = dropdown(document.getElementById('n-hour'), {

          <span class="hint">每小时检查一次，推送到下方已开启的渠道${anyCh ? '' : '（目前没有开启的渠道）'}</span><span class="sp" style="flex:1"></span>
          <button type="button" class="btn sm ghost" id="u-test" ${anyCh ? '' : 'disabled'}>${ic('send', 14)}发送测试预警</button>`}</div>`;
    const go = box.querySelector('[data-goto-use]');
    if (go) go.onclick = (e) => { e.preventDefault(); goSettings('use'); };
    if (!st.cfConfigured) return;
    box.querySelector('#u-on').onchange = async (e) => {
      try { await persist({ usage: { enabled: e.target.checked } }); toast(e.target.checked ? '用量预警已开启' : '用量预警已关闭'); }
      catch (ex) { e.target.checked = !e.target.checked; toast(ex.message, 'bad'); }
    };
    const seg = box.querySelector('#u-th');
    segThumb(seg);
    seg.querySelectorAll('button').forEach((b) => (b.onclick = async () => {
      try { await persist({ usage: { threshold: Number(b.dataset.t) } }); toast('已保存'); } catch (ex) { toast(ex.message, 'bad'); }

// ---------------------------------------------------------------- router
let routeToken = 0, lastLinkId = null;
// 浏览器标签页标题
const setTitle = (name) => { document.title = name ? `${name} · cligc` : 'cligc 短链'; };

async function route() {
  const token = ++routeToken;
  const h0 = location.hash || '#/';
  const gs0 = h0.match(/^#\/site\/([^?]+)/);
  setTitle(h0.startsWith('#/link/') ? '短链' : gs0 ? decodeURIComponent(gs0[1]) : h0.startsWith('#/notify') ? '统计通知' : h0.startsWith('#/sites') ? '站点'
    : h0.startsWith('#/settings') ? '设置' : h0.startsWith('#/links') ? '短链' : '概览');
  clearInterval(liveTimer);
  document.querySelectorAll('.pop').forEach((p) => p.remove());
  const h = location.hash || '#/';
  try {
    const m = h.match(/^#\/link\/(\d+)/);
    if (m) {
      if (lastLinkId !== m[1]) { clickState.page = 1; lastLinkId = m[1]; }
      return await renderLink(token, m[1]);
    }
    lastLinkId = null;
    if (h.startsWith('#/notify')) return await renderNotify(token);
    const gs = h.match(/^#\/site\/([^?]+)/);
    if (gs) return await renderSite(token, decodeURIComponent(gs[1]));
    if (h.startsWith('#/sites')) return await renderSites(token);
    if (h.startsWith('#/settings')) return await renderSettings(token);
    if (h.startsWith('#/links')) {
      const openNew = h.includes('?new');
      if (openNew) history.replaceState(null, '', '#/links');
      return await renderLinks(token, { openNew });
    }
    return await renderHome(token);
  } catch (err) {
    if (err.message === 'unauthorized') return;
    // 短链 / 站点不存在（被删除、链接写错）：显示空状态而不是一直停在加载中
    if (token === routeToken && /not found|不存在/.test(err.message) && /^#\/(link|site)\//.test(location.hash)) {
      const isLink = location.hash.startsWith('#/link/');
      const page = document.getElementById('page');
      if (page) page.innerHTML = `<a class="back" href="${isLink ? '#/links' : '#/sites'}">${ic('back', 14)}${isLink ? '全部短链' : '全部站点'}</a>
        <section class="card rv"><div class="empty" style="padding:64px 24px;flex-direction:column;gap:6px">${ic('search')}<b>${isLink ? '这个短链不存在' : '这个站点不存在'}</b>
          <span>可能已被删除，或链接地址有误</span><a class="btn sm" href="${isLink ? '#/links' : '#/sites'}" style="margin-top:8px">返回列表</a></div></section>`;
      setTitle(isLink ? '短链不存在' : '站点不存在');
      return;
    }
    console.error(err); toast('加载失败：' + err.message, 'bad');
  }
}

// 手机端：向下滚动隐藏顶栏，向上滚动出现
{
  let lastY = scrollY, ticking = false;
  addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const side = document.querySelector('.side');
      if (!side || innerWidth > 900) return;
      const y = Math.max(0, scrollY), dy = y - lastY;
      if (y < 64 || document.querySelector('.menu, .drawer, .dialog')) side.classList.remove('hide');
      else if (dy > 6) side.classList.add('hide');
      else if (dy < -6) side.classList.remove('hide');
      side.classList.toggle('stuck', y > 4);
      if (Math.abs(dy) > 6 || y < 64) lastY = y;
    });
  }, { passive: true });
}

  let items = [], sel = 0, seq = 0, linkHits = [];

    { g: '页面', icon: 'home', t: '概览', k: 'overview home gailan', run: () => (location.hash = '#/') },
    { g: '页面', icon: 'link', t: '短链', k: 'links duanlian', run: () => (location.hash = '#/links') },
    { g: '页面', icon: 'globe', t: '站点', k: 'sites seo google zhandian', run: () => (location.hash = '#/sites') },
    { g: '页面', icon: 'bell', t: '通知', k: 'notify telegram email tongzhi', run: () => (location.hash = '#/notify') },
    { g: '页面', icon: 'gear', t: '设置', k: 'settings shezhi', run: () => (location.hash = '#/settings') },

    ...KBAR_SETTINGS.map(([id, icon, t]) => ({ g: '设置', icon, t, k: id, run: () => { store.set('set:open', id); location.hash === '#/settings' ? route() : (location.hash = '#/settings'); } })),
  ];
  const match = (it, q) => !q || it.t.toLowerCase().includes(q) || (it.k || '').includes(q) || (it.sub || '').toLowerCase().includes(q);
  const draw = () => {
    const q = input.value.trim().toLowerCase();

    items = [...linkHits, ...sites, ...pageCmds.filter((it) => match(it, q))];
    sel = Math.min(sel, Math.max(0, items.length - 1));
    let lastG = '';
    list.innerHTML = items.length ? items.map((it, i) => {
      const head = it.g !== lastG ? `<div class="kbar-g">${it.g}</div>` : '';
      lastG = it.g;
      return `${head}<div class="kbar-i${i === sel ? ' on' : ''}" role="option" aria-selected="${i === sel}" data-i="${i}">${ic(it.icon, 15)}<span class="kbar-t">${hl(it.t, q)}</span>${it.sub ? `<span class="kbar-s">${hl(it.sub, q)}</span>` : ''}${it.badge || ''}</div>`;
    }).join('') : `<div class="kbar-e">没有找到“${esc(input.value.trim())}”</div>`;
    list.querySelectorAll('[data-i]').forEach((el) => {
      el.onmousemove = () => { if (sel !== Number(el.dataset.i)) { sel = Number(el.dataset.i); list.querySelectorAll('.kbar-i').forEach((x) => x.classList.toggle('on', x === el)); } };
      el.onclick = () => go(items[Number(el.dataset.i)]);
    });
    list.querySelector('.kbar-i.on')?.scrollIntoView({ block: 'nearest' });
  };
  // 短链：输入时按后缀、标题、地址搜索；没输入时显示最近访问的
  let timer;
  const searchLinks = () => {
    clearTimeout(timer);
    const my = ++seq, q = input.value.trim();
    timer = setTimeout(async () => {
      const r = await api(`/links?size=6&${q ? 'q=' + encodeURIComponent(q) : 'sort=last_click'}`).catch(() => ({ items: [] }));
      if (my !== seq || !d.isConnected) return;
      linkHits = r.items.map((l) => ({ g: q ? '短链' : '最近访问的短链', icon: 'link', t: '/' + l.slug, sub: l.title || bareUrl(l.target_url),
        badge: l.enabled ? '' : '<span class="pill off">已停用</span>', run: () => (location.hash = '#/link/' + l.id) }));
      draw();
    }, q ? 140 : 0);
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length);
      draw();
    } else if (e.key === 'Enter' && items[sel]) { e.preventDefault(); go(items[sel]); }
  };
  input.oninput = () => { sel = 0; draw(); searchLinks(); };
  ov.onclick = close;
  document.addEventListener('keydown', onKey, true);
  document.body.append(ov, d);
  input.focus();
  draw(); searchLinks();
  if (!kbarSites) api('/google/hosts').then((r) => { kbarSites = r.items || []; if (d.isConnected) draw(); }).catch(() => { kbarSites = []; });
}
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k' && document.querySelector('.shell')) {
    e.preventDefault();
    document.querySelector('.kbar') ? document.querySelector('.kbar-ov').click() : openKbar();
  }
});

// 列表页的 "/" 快捷键聚焦搜索
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.getElementById('q')) {
    e.preventDefault(); document.getElementById('q').focus();
  }
});

window.addEventListener('hashchange', route);
api('/me').then((d) => (d.mustChange ? renderSetPassword() : route())).catch(() => {});
</script>
</body>
