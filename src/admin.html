/* ================================================================ base */

/* 细滚动条：卡片、抽屉、表格等内部滚动区域平时隐藏，鼠标移上去才出现；页面主滚动条始终显示 */

/* ================================================================ cards & grids */

.stack { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }

.grid2 { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }

.kpi { position: relative; padding: 18px 20px 16px; overflow: hidden; display: flex; flex-direction: column; }

.kpi .v.sm { font-size: 20px; margin-top: 14px; }

.kpi .meter i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--violet)); transform-origin: left; animation: grow 1s var(--ease-out) both .2s; }
@media (max-width: 480px) { .kpi { padding: 14px 14px 12px; } .kpi .v { font-size: 26px; } .kpi .ks { margin: auto -14px -12px; } }
/* 概览：紧凑数据条 */
#home { gap: 16px; }
#home .g-main, #home .g3 { gap: 16px; }
.kstrip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }

/* 概览实时访问：高度跟左侧趋势图一致，列表在卡片内滚动 */

  -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }

}
/* 列表会滚动，标签提示改到左侧显示，避免被上下边缘裁掉 */

.delta { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 7px; border-radius: 999px; font-weight: 600; font-size: 12px; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ================================================================ chart */

  font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .12s, left .08s linear, top .08s linear; box-shadow: var(--shadow-3); }

.legend { display: flex; gap: 2px; flex-wrap: wrap; }

/* ================================================================ ranked lists */

.tabs button:hover { color: var(--text); }

.rank { display: flex; flex-direction: column; gap: 6px; }

.rank .r .bg { position: absolute; inset: 0; right: auto; background: var(--accent-2); border-radius: 8px; z-index: 0; transform-origin: left; animation: grow .8s var(--ease-out) both; animation-delay: calc(var(--j, 0) * 40ms + 100ms); }
.rank .r > *:not(.bg) { position: relative; z-index: 1; }

.empty { color: var(--muted); text-align: center; padding: 32px 12px; font-size: 13px; }

.heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }

.heat-ax { display: grid; grid-template-columns: repeat(4, 1fr); color: var(--muted); font-size: 11px; margin-top: 6px; }

/* 星期 × 小时热力图 */
.wk { display: grid; grid-template-columns: 22px repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center; }
.wk .dl { font-size: 11px; color: var(--muted); }
.wk .c { aspect-ratio: 1; border-radius: 3px; background: var(--sunken); position: relative; transition: transform .15s var(--ease); animation: fade .5s var(--ease) both; animation-delay: calc(var(--j, 0) * 3ms); }

/* 实时访问流 */

async function api(path, opts = {}) {
  const quiet = path.startsWith('/recent');
  if (!quiet) busy(1);
  let res;
  try {
    res = await fetch('/api' + path, {
      ...opts,
      headers: { 'content-type': 'application/json', ...(opts.headers || {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: 'same-origin',
    });
  } finally { if (!quiet) busy(-1); }
  if (res.status === 401 && path !== '/login') { renderLogin(); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 403 && data.mustChange) { renderSetPassword(); throw new Error('unauthorized'); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// 浮动提示：挂在 body 上，不会被表格、省略号文本等裁剪溢出的容器截掉；样式与 data-tip 一致。

{
  let tip = null, cur = null, timer = 0;

  };

    document.addEventListener('click', (e) => {
      const el = e.target.closest && e.target.closest('[data-tipf], [data-tip]');
      if (!el) {

        return;

  }

const fmtCount = (el, v) => (el.dataset.fmt === 'wan' && v >= 1e5 ? wan(v) : num(v));

    const t0 = performance.now(), dur = 900;
    const step = (t) => {

// 数字太长放不下时逐步缩小字号（最小 13px）。按最终显示的文字测量（临时换上最终文字量一下再换回），数字滚动动画不会让字号跳动。
// 适用于：环形图中间的总数、指标卡片的数值
function fitNums(root = document) {
  root.querySelectorAll('.donut .ctr b, .kc-v > b').forEach((el) => {
    if (!el.isConnected || !el.offsetParent) return;
    let avail;
    if (el.closest('.donut')) avail = el.closest('.donut').clientWidth * 0.6;   // 圆环内径
    else {
      const box = el.parentElement, gap = parseFloat(getComputedStyle(box).columnGap) || 0;
      let others = 0;
      for (const sib of box.children) {

        others += (sib.classList.contains('kc-sp') ? 44 : sib.offsetWidth) + gap;
      }
      avail = box.clientWidth - others;
    }
    // 有滚动动画的先换上最终文字再量；其他的（可能带 <small> 等标记）直接量
    const anim = el.dataset.count != null, cur = anim ? el.textContent : null;
    el.style.fontSize = '';
    if (anim) el.textContent = fmtCount(el, Number(el.dataset.count) || 0);
    let size = parseFloat(getComputedStyle(el).fontSize);
    const base = size;
    while (size > 13 && el.getBoundingClientRect().width > avail) { size -= 1; el.style.fontSize = size + 'px'; }
    if (size === base) el.style.fontSize = '';
    if (anim) el.textContent = cur;
  });
}
{ let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => fitNums(), 150); }); }

function buckets(rows, prevRows) {
  const map = new Map(rows.map((r) => [r.k, r]));

  const out = [];

      out.push({ k, t: `${d.getMonth() + 1} 月 ${d.getDate()} 日 ${pad(d.getHours())}:00`, label: `${pad(d.getHours())}:00`, n: map.get(k)?.n || 0, u: map.get(k)?.u || 0, p: pm.get(k) || 0 });

function niceMax(m) {
  if (m <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(m)));
  for (const s of [1, 2, 2.5, 5, 10]) if (s * p >= m) return s * p;
  return 10 * p;
}

// 平滑曲线（单调三次插值，不会冲出数据范围）
function smooth(pts) {
  if (pts.length < 3) return pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join('');
  const n = pts.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  let s = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], h = (x1 - x0) / 3;
    s += `C${(x0 + h).toFixed(1)},${(y0 + m[i] * h).toFixed(1)} ${(x1 - h).toFixed(1)},${(y1 - m[i + 1] * h).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return s;
}

/**
 * 多序列趋势图
 * series: [{ id, label, color, key, type: 'area' | 'line' | 'dash' }]
 */
function mountChart(el, data, series, legendEl) {
  const hidden = new Set(store.get('hide:' + el.id, []));
  let animate = !REDUCED;
  const draw = () => {
    if (!el.isConnected) return ro.disconnect();
    const W = el.clientWidth, H = el.clientHeight;
    if (!W) return;
    const L = 40, R = 8, T = 16, B = 30;
    const vis = series.filter((s) => !hidden.has(s.id));
    const max = niceMax(Math.max(1, ...vis.flatMap((s) => data.map((d) => d[s.key]))));
    const iw = W - L - R, ih = H - T - B;
    const x = (i) => L + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
    const y = (v) => T + ih - (v / max) * ih;
    const step = Math.max(1, Math.ceil(data.length / Math.max(2, Math.floor(iw / 72))));
    const uid = Math.random().toString(36).slice(2, 8);
    const lines = Object.fromEntries(vis.map((s) => [s.id, smooth(data.map((d, i) => [x(i), y(d[s.key])]))]));
    const layer = (t) => vis.filter((s) => s.type === t);
    const paths =
      layer('area').map((s) => `<defs><linearGradient id="g${uid}${s.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".2"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
        <path class="ar" d="${lines[s.id]}L${x(data.length - 1)},${T + ih}L${x(0)},${T + ih}Z" fill="url(#g${uid}${s.id})"/>`).join('') +
      layer('dash').map((s) => `<path d="${lines[s.id]}" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="4 4"/>`).join('') +
      [...layer('line'), ...layer('area')].map((s) => `<path class="ln" d="${lines[s.id]}" fill="none" stroke="${s.color}" stroke-width="${s.type === 'area' ? 2.2 : 1.6}" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="趋势图">
      ${[0, 1, 2, 3, 4].map((i) => `<line class="gl ${i ? '' : 'base'}" x1="${L}" x2="${W - R}" y1="${y((max / 4) * i)}" y2="${y((max / 4) * i)}"/>`).join('')}
      ${[0, 1, 2, 3, 4].map((i) => `<text class="ax" x="${L - 10}" y="${y((max / 4) * i) + 4}" text-anchor="end">${num((max / 4) * i)}</text>`).join('')}
      ${data.map((d, i) => (i % step === 0 || i === data.length - 1) && !(i !== data.length - 1 && data.length - 1 - i < step / 2)
        ? `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>` : '').join('')}
      ${paths}
      <line class="cur" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--faint)" stroke-dasharray="3 3" visibility="hidden"/>
      ${vis.filter((s) => s.type !== 'dash').map((s) => `<circle class="dot" data-s="${s.id}" r="4.5" fill="var(--panel)" stroke="${s.color}" stroke-width="2.2" visibility="hidden"/>`).join('')}
      <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/>
    </svg><div class="tip"></div>`;
    if (animate) {
      el.querySelectorAll('path.ln').forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
        requestAnimationFrame(() => requestAnimationFrame(() => { p.style.strokeDashoffset = 0; }));
      });
      animate = false;
    }
    const svg = el.querySelector('svg'), cur = el.querySelector('.cur'), tip = el.querySelector('.tip');
    const hit = svg.querySelector('.hit');
    const hide = () => { cur.setAttribute('visibility', 'hidden'); el.querySelectorAll('.dot').forEach((c) => c.setAttribute('visibility', 'hidden')); tip.style.opacity = 0; };
    const show = (clientX) => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(data.length - 1, Math.round(((clientX - r.left - L) / iw) * (data.length - 1))));
      const px = x(i), d = data[i];
      cur.setAttribute('x1', px); cur.setAttribute('x2', px); cur.setAttribute('visibility', 'visible');
      let top = T + ih;
      el.querySelectorAll('.dot').forEach((c) => {
        const s = series.find((z) => z.id === c.dataset.s), py = y(d[s.key]);
        top = Math.min(top, py);
        c.setAttribute('cx', px); c.setAttribute('cy', py); c.setAttribute('visibility', 'visible');
      });
      tip.innerHTML = `<div class="t">${esc(d.t || d.k)}</div>` + vis.map((s) =>
        `<div class="r"><i style="background:${s.type === 'dash' ? 'var(--faint)' : s.color}"></i>${s.label}<b>${num(d[s.key])}</b></div>`).join('');
      tip.style.left = Math.max(90, Math.min(W - 90, px)) + 'px'; tip.style.top = Math.max(top, 76) + 'px'; tip.style.opacity = 1;
    };
    hit.onmousemove = (e) => show(e.clientX);
    hit.ontouchstart = hit.ontouchmove = (e) => show(e.touches[0].clientX);
    hit.onmouseleave = hit.ontouchend = hide;
  };
  const ro = new ResizeObserver(draw);
  ro.observe(el);
  if (legendEl) {
    legendEl.innerHTML = series.map((s) => `<button data-s="${s.id}" class="${hidden.has(s.id) ? 'off' : ''}" aria-pressed="${!hidden.has(s.id)}">
      <i class="${s.type === 'dash' ? 'dash' : ''}" style="${s.type === 'dash' ? '' : `background:${s.color}`}"></i>${s.label}</button>`).join('');
    legendEl.querySelectorAll('button').forEach((b) => (b.onclick = () => {
      const id = b.dataset.s;
      if (hidden.has(id)) hidden.delete(id);
      else { if (series.length - hidden.size <= 1) return; hidden.add(id); }
      store.set('hide:' + el.id, [...hidden]);
      b.classList.toggle('off', hidden.has(id)); b.setAttribute('aria-pressed', !hidden.has(id));
      animate = !REDUCED; draw();
    }));
  }
}

// KPI 卡片底部的小面积图
// prev：可选的上一周期数据，画成浅色虚线（与本期同一纵轴）
function kpiSpark(values, color, prev) {
  const W = 300, H = 44, n = values.length;
  if (n < 2) return '';
  const max = Math.max(1, ...values, ...(prev || []));
  const pt = (v, i, len) => [(i / (len - 1)) * W, H - 4 - (v / max) * (H - 10)];
  const line = smooth(values.map((v, i) => pt(v, i, n)));
  const pl = prev?.length > 1 && prev.some(Boolean) ? smooth(prev.map((v, i) => pt(v, i, prev.length))) : '';
  const id = 'k' + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${W},${H}L0,${H}Z" fill="url(#${id})" style="animation:fade 1s var(--ease) both .3s"/>
    ${pl ? `<path d="${pl}" fill="none" stroke="var(--faint)" stroke-width="1.3" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}

function sparkline(rows) {
  const map = new Map((rows || []).map((r) => [r.k, r.n]));
  const vals = [];
  for (let i = 13; i >= 0; i--) vals.push(map.get(ymd(new Date(Date.now() - i * 86400000))) || 0);
  const max = Math.max(1, ...vals);
  const W = 100, H = 28;
  const pts = vals.map((v, i) => [(i / 13) * (W - 4) + 2, H - 4 - (v / max) * (H - 8)]);
  const line = smooth(pts);
  const has = vals.some(Boolean);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    ${has ? `<path d="${line}L${W - 2},${H}L2,${H}Z" fill="currentColor" fill-opacity=".1"/>` : ''}
    <path d="${line}" fill="none" stroke="currentColor" stroke-opacity="${has ? 1 : .2}" stroke-width="1.6" stroke-linecap="round"/>
    ${has ? `<circle cx="${pts[13][0]}" cy="${pts[13][1]}" r="2.4" fill="currentColor"/>` : ''}</svg>`;
}

function rankList(items, { fmt = (k) => k || '(空)', head = ['名称', '访问'], href } = {}) {
  if (!items || !items.length) return `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`;
  const max = Math.max(...items.map((i) => i.n));
  const sum = items.reduce((a, b) => a + b.n, 0);
  return `<div class="rank"><div class="hd"><span>${head[0]}</span><span>${head[1]}</span></div>
    ${items.map((i, j) => {
      const tag = href ? 'a' : 'div';
      return `<${tag} class="r" ${href ? `href="${href(i)}"` : ''} title="${esc(fmt(i.k))}" style="--j:${j}">
        <div class="bg" style="width:${Math.max(2, (i.n / max) * 100)}%"></div>
        <span class="k">${esc(fmt(i.k))}</span><span class="n">${num(i.n)}</span><span class="p">${Math.round((i.n / sum) * 100)}%</span>
      </${tag}>`;
    }).join('')}</div>`;
}

// 设备环形图
// o.unit 中心的单位，o.name 图例名称；超过 5 项时前 4 项 + “其他”
function donut(items, o = {}) {
  const COLORS = ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--amber)', 'var(--faint)'];
  const unit = o.unit || '次访问', name = o.name || devName;
  const sum = items.reduce((a, b) => a + b.n, 0);
  if (items.length > 5) {
    const top = items.slice(0, 4);
    items = [...top, { k: '其他', n: sum - top.reduce((a, b) => a + b.n, 0), other: true }];
  }
  if (!sum) return `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`;
  const r = 54, C = 2 * Math.PI * r, gap = items.length > 1 ? 3 : 0;
  let off = 0;
  const segs = items.slice(0, 5).map((it, i) => {
    const len = Math.max(0, (it.n / sum) * C - gap);
    const seg = `<circle cx="68" cy="68" r="${r}" stroke="${COLORS[i]}" stroke-dasharray="${REDUCED ? len : 0} ${C}" data-len="${len}" data-c="${C}" stroke-dashoffset="${-off}"/>`;
    off += (it.n / sum) * C;
    return seg;
  }).join('');
  setTimeout(() => document.querySelectorAll('.donut circle[data-len]').forEach((c) => c.setAttribute('stroke-dasharray', `${c.dataset.len} ${C}`)), 80);
  return `<div class="donut-w"><div class="donut"><svg viewBox="0 0 136 136" aria-hidden="true"><circle cx="68" cy="68" r="${r}" stroke="var(--sunken)"/>${segs}</svg>
      <div class="ctr" data-tipf-always data-tipf="${num(sum)} ${unit}"><b data-count="${sum}" data-fmt="wan">0</b><span>${unit}</span></div></div>
    <div class="dlg">${items.slice(0, 5).map((it, i) => `<div class="x"${it.tip ? ` data-tipf-always data-tipf="${esc(it.tip)}"` : ''}><i style="background:${COLORS[i]}"></i><span>${esc(it.other ? '其他' : name(it.k))}</span><b>${num(it.n)}</b><em>${Math.round((it.n / sum) * 100)}%</em></div>`).join('')}</div></div>`;
}

// 浏览器 / 系统占比：分段条 + 图例（前 4 个，其余合并为“其他”）
function shareMix(label, items) {
  const COLORS = ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--amber)', 'var(--faint)'];
  const sum = (items || []).reduce((a, b) => a + b.n, 0);
  if (!sum) return '';
  const top = items.slice(0, 4).map((i) => ({ k: i.k || '未知', n: i.n }));
  const rest = sum - top.reduce((a, b) => a + b.n, 0);
  if (rest) top.push({ k: '其他', n: rest });
  return `<div class="bmix"><div class="bmix-h"><span>${label}</span><span>${top.length > 1 ? `${esc(top[0].k)} 占 ${Math.round((top[0].n / sum) * 100)}%` : ''}</span></div>
    <div class="bmix-bar">${top.map((it, i) => `<i style="flex:${it.n};background:${COLORS[i]};--j:${i}" title="${esc(it.k)} · ${num(it.n)} 次"></i>`).join('')}</div>
    <div class="bmix-l">${top.map((it, i) => `<div class="x"><i style="background:${COLORS[i]}"></i><span>${esc(it.k)}</span><em>${Math.round((it.n / sum) * 100)}%</em></div>`).join('')}</div></div>`;
}

// 星期 × 小时热力图
function weekHeat(cells) {
  if (!cells.length) return `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`;
  const map = new Map(cells.map((c) => [`${c.d}-${c.h}`, c.n]));
  const max = Math.max(1, ...cells.map((c) => c.n));
  const peak = cells.reduce((a, b) => (b.n > a.n ? b : a));
  let j = 0;
  const rows = [1, 2, 3, 4, 5, 6, 0].map((d) => `<span class="dl">${WEEK[d].slice(1)}</span>` + Array.from({ length: 24 }, (_, h) => {
    const n = map.get(`${d}-${h}`) || 0;
    return `<div class="c" style="--j:${j++}" title="${WEEK[d]} ${h}:00–${h + 1}:00 · ${n} 次">${n ? `<b style="opacity:${(0.18 + (n / max) * 0.82).toFixed(2)}"></b>` : ''}</div>`;
  }).join('')).join('');
  return `<div class="wk">${rows}<span></span>${[0, 6, 12, 18].map((h) => `<span class="hx">${h} 时</span>`).join('')}</div>
    <div class="wk-f" style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px;flex-wrap:wrap">
      <span class="hint">高峰：${WEEK[peak.d]} ${peak.h}:00 – ${peak.h + 1}:00</span>
      <span class="scale">少<i style="opacity:.18"></i><i style="opacity:.45"></i><i style="opacity:.72"></i><i></i>多</span></div>`;
}

// 新密码表单：新密码 + 确认 + 强度提示；当前密码可预填（刚用默认密码登录时）
function passwordFields(current) {
  return `${current ? '' : `<div class="field"><label for="p-cur">当前密码</label><input class="input lg" type="password" id="p-cur" autocomplete="current-password" required></div>`}
    <div class="field"><label for="p-new">新密码</label><input class="input lg" type="password" id="p-new" autocomplete="new-password" minlength="8" required>
      <div class="pwm" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="hint" id="p-tip">至少 8 位，建议混合字母、数字和符号</div></div>
    <div class="field"><label for="p-rep">再次输入新密码</label><input class="input lg" type="password" id="p-rep" autocomplete="new-password" required></div>`;
}

function strength(pw) {
  if (pw.length < 8) return 0;
  let n = 1;
  if (pw.length >= 12) n++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) n++;
  if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) n++;
  return Math.min(4, n);
}

function bindPasswordForm(root, current, onDone) {
  const nw = root.querySelector('#p-new'), rp = root.querySelector('#p-rep'), tip = root.querySelector('#p-tip'), err = root.querySelector('.err');
  const meter = root.querySelector('.pwm');
  nw.oninput = () => {
    const n = strength(nw.value);
    meter.dataset.n = nw.value ? n : '';
    tip.textContent = !nw.value ? '至少 8 位，建议混合字母、数字和符号'
      : nw.value.length < 8 ? `还差 ${8 - nw.value.length} 位` : ['', '强度：弱', '强度：一般', '强度：好', '强度：很强'][n];
  };
  root.onsubmit = async (e) => {
    e.preventDefault();
    const cur = current || root.querySelector('#p-cur').value;
    if (nw.value.length < 8) { err.textContent = '新密码至少 8 位'; nw.focus(); return; }
    if (nw.value !== rp.value) { err.textContent = '两次输入的新密码不一致'; rp.select(); return; }
    const btn = root.querySelector('button.primary'); btn.disabled = true;
    try {
      await api('/password', { method: 'POST', body: { current: cur, next: nw.value } });
      toast('密码已更新，其他设备上的登录已失效');
      onDone();
    } catch (ex) { if (ex.message !== 'unauthorized') err.textContent = ex.message; btn.disabled = false; }
  };
}

function codeInput(id = 'otp') {
  return `<input class="input lg otp" id="${id}" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\\d{6}" placeholder="000000" aria-label="6 位动态码" required>`;
}
function bindCodeInput(el, onFull) {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '').slice(0, 6);

// 侧栏“两步验证”：开启（验证密码 → 扫码 → 输入动态码确认）/ 关闭
async function openMfaDialog(onDone = () => {}) {
  const st = await api('/2fa');
  const ov = document.createElement('div'); ov.className = 'ov';
  const d = document.createElement('form'); d.className = 'dialog pw-dialog mfa-dialog'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  const close = () => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  ov.onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.append(ov, d);
  const err = () => d.querySelector('.err');

  if (st.enabled) {
    d.innerHTML = `<h3>两步验证</h3>
      <div class="mfa-on">${ic('shield', 18)}<div><b>已开启</b><span>开启于 ${fmtTime(st.since)}。登录时需要密码和验证器 App 上的动态码。</span></div></div>

    d.querySelector('#m-pw').focus();
    d.onsubmit = async (e) => {
      e.preventDefault();
      const btn = d.querySelector('.primary'); btn.disabled = true;
      try {
        await api('/2fa/disable', { method: 'POST', body: { password: d.querySelector('#m-pw').value, code: d.querySelector('#otp').value } });
        close(); toast('两步验证已关闭'); onDone();
      } catch (ex) { err().textContent = ex.message; btn.disabled = false; }
    };
    return;
  }

  // 第 1 步：验证密码
  d.innerHTML = `<h3>开启两步验证</h3>
    <p>开启后登录需要再输入手机验证器 App 上的 6 位动态码，即使密码泄露，别人也登不进后台。支持 Google Authenticator、Microsoft Authenticator、1Password 等。</p>
    <div class="field"><label for="m-pw">先输入当前密码</label><input class="input lg" type="password" id="m-pw" autocomplete="current-password" required></div>
    <div class="err" style="margin:4px 0 12px" role="alert"></div>

  d.querySelector('[data-no]').onclick = close;
  d.querySelector('#m-pw').focus();
  d.onsubmit = async (e) => {
    e.preventDefault();
    const btn = d.querySelector('.primary'); btn.disabled = true;
    let setup;
    try { setup = await api('/2fa/setup', { method: 'POST', body: { password: d.querySelector('#m-pw').value } }); }
    catch (ex) { err().textContent = ex.message; btn.disabled = false; return; }

    // 第 2 步：扫码并输入动态码确认
    d.innerHTML = `<h3>扫码绑定验证器</h3>
      <div class="mfa-qr">${setup.svg}</div>
      <p class="mfa-tip">用验证器 App 扫描二维码。无法扫码时，可手动输入密钥：</p>
      <div class="mfa-key"><code>${esc(setup.secret.match(/.{1,4}/g).join(' '))}</code>${copyBtn(setup.secret, 'btn sm ghost icon')}</div>
      <div class="field" style="margin-top:16px"><label for="otp">输入 App 显示的 6 位动态码</label>${codeInput()}</div>
      <div class="err" style="margin:4px 0 12px" role="alert"></div>
      <div class="row"><button type="button" class="btn" data-no>取消</button><button class="btn primary">确认开启</button></div>`;

    const confirm = async () => {
      const b = d.querySelector('.primary'); b.disabled = true;
      try {
        await api('/2fa/enable', { method: 'POST', body: { code: otp.value } });
        close(); toast('两步验证已开启，其他设备上的登录已失效'); onDone();
      } catch (ex) { err().textContent = ex.message; b.disabled = false; otp.value = ''; otp.focus(); }
    };
    bindCodeInput(otp, confirm);
    d.onsubmit = (ev) => { ev.preventDefault(); confirm(); };
  };
}

// Cloudflare Turnstile 站点密钥，由服务端在返回页面时注入；为空则不启用
const TS_KEY = '__TURNSTILE_SITEKEY__';
const TS_ON = TS_KEY && !TS_KEY.startsWith('__');
let tsLoading = null;
function loadTurnstile() {
  if (window.turnstile) return Promise.resolve(window.turnstile);
  if (!tsLoading) {
    tsLoading = new Promise((resolve, reject) => {
      const sc = document.createElement('script');
      sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      sc.async = true;
      sc.onload = () => resolve(window.turnstile);
      sc.onerror = () => { tsLoading = null; reject(new Error('人机验证加载失败，请检查网络后刷新页面')); };
      document.head.appendChild(sc);
    });
  }
  return tsLoading;
}

function renderLogin() {
  clearInterval(liveTimer);
  $app.innerHTML = `<div class="login"><form class="card" id="f">
    <div class="brand">${mark(34)}<span class="wordmark">cligc</span></div>
    <h1>欢迎回来</h1>
    <p>登录后管理短链和查看访问数据</p>
    <div class="field"><label for="pw">管理密码</label><input class="input lg" type="password" id="pw" autocomplete="current-password" required></div>
    ${TS_ON ? '<div class="ts" id="ts"><div class="ts-ph">' + ic('pulse', 14) + '正在加载人机验证…</div></div>' : ''}
    <div class="err" id="err" style="margin:8px 0" role="alert"></div>
    <button class="btn primary" style="width:100%;height:46px;font-size:15px">登录</button>
    <button type="button" class="lang-t notranslate" id="lang-t">${ic('globe', 13)}${EN ? '中文' : 'English'}</button>
  </form></div>`;
  document.getElementById('lang-t').onclick = () => setLang(EN ? 'zh' : 'en');
  const pw = document.getElementById('pw'), err = document.getElementById('err');
  pw.focus();

  let token = '', widget = null;
  if (TS_ON) {
    loadTurnstile().then((ts) => {
      const box = document.getElementById('ts');
      if (!box) return;
      box.innerHTML = '';
      widget = ts.render(box, {
        sitekey: TS_KEY, theme: 'auto', language: EN ? 'en' : 'zh-cn', size: 'flexible',
        callback: (t) => { token = t; err.textContent = ''; },
        'expired-callback': () => { token = ''; },
        'error-callback': () => { token = ''; err.textContent = '人机验证出错，请刷新页面重试'; },
      });
    }).catch((e) => { err.textContent = e.message; });
  }
  const resetTs = () => { token = ''; if (widget !== null && window.turnstile) window.turnstile.reset(widget); };

  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    if (TS_ON && !token) { err.textContent = '请先完成下方的人机验证'; return; }
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = '登录中…';
    try {
      const r = await api('/login', { method: 'POST', body: { password: pw.value, turnstile: token } });
      if (r.need2fa) return renderCodeStep(r.ticket);
      r.mustChange ? renderSetPassword(pw.value) : route();
    }
    catch (ex) { err.textContent = ex.message; btn.disabled = false; btn.textContent = '登录'; pw.select(); resetTs(); }
  };
}

// ---------------------------------------------------------------- overview
const KIND = { human: ['真人', 'var(--good)'], bot: ['爬虫', 'var(--faint)'], suspect: ['可疑', 'var(--amber)'] };
const kindTag = (r, tip = true) => {
  // 真人只在经代理时打标签；爬虫 / 可疑总是打标签
  const k = r.kind === 'human' ? (r.proxy ? 'proxy' : '') : r.kind;
  if (!k) return '';
  return `<span class="kt ${k}" ${tip && r.reason ? `data-tip="${esc(r.reason)}" tabindex="0"` : ''}>${k === 'proxy' ? '代理' : KIND[k][0]}</span>`;
};
// 访客类型占比：分段条 + 图例
const proxyCount = (kinds) => (kinds || []).filter((x) => (x.k || 'human') === 'human' && x.p).reduce((a, b) => a + b.n, 0);
function kindMix(items) {
  const m = new Map();
  for (const x of items || []) m.set(x.k || 'human', (m.get(x.k || 'human') || 0) + x.n);
  const sum = [...m.values()].reduce((a, b) => a + b, 0);
  if (!sum) return '';
  const rows = ['human', 'suspect', 'bot'].map((k) => ({ k, n: m.get(k) || 0 }));
  return `<div class="kmix"><div class="bmix-bar">${rows.filter((r) => r.n).map((r, i) => `<i style="flex:${r.n};background:${KIND[r.k][1]};--j:${i}" title="${KIND[r.k][0]} · ${num(r.n)} 次"></i>`).join('')}</div>
    <div class="kmix-l">${rows.map((r) => `<div class="x"><i style="background:${KIND[r.k][1]}"></i><span>${KIND[r.k][0]}</span><b>${num(r.n)}</b><em>${Math.round((r.n / sum) * 100)}%</em></div>`).join('')}</div>
    ${proxyCount(items) ? `<div class="kmix-p">${ic('globe', 13)}其中 <b>${num(proxyCount(items))}</b> 次真人访问经 VPN / 代理（占真人 ${Math.round((proxyCount(items) / Math.max(1, m.get('human') || 0)) * 100)}%）</div>` : ''}</div>`;
}

function feedItems(items, newIds = new Set()) {
  if (!items.length) return `<div class="empty">${ic('pulse')}还没有访问，分享短链后这里会实时出现</div>`;
  return items.map((r) => `<a class="fi ${newIds.has(r.id) ? 'new' : ''}" href="#/link/${r.link_id}">
      <span class="av">${ic((DEV[r.device] || [, 'desk'])[1])}</span>
      <div class="m"><div class="a"><b>/${esc(r.slug)}</b> <span>· ${esc(r.source)}</span></div>
        <div class="s">${esc([country(r.country), r.city].filter(Boolean).join(' · '))} · ${esc(r.os)} ${esc(r.browser)}</div></div>
      <div class="fi-r">${kindTag(r)}<time datetime="${new Date(r.ts).toISOString()}" data-ts="${r.ts}">${ago(r.ts)}</time></div></a>`).join('');
}


// 概览的短链切换：默认全部，可搜索
function linkPicker(root, items) {
  const by = new Map(items.map((l) => [String(l.id), l]));
  if (state.link && !by.has(state.link)) by.set(state.link, { id: state.link, slug: '…', title: '' });

    value: state.link, aria: '选择短链', search: '搜索短链或标题', empty: '没有匹配的短链', minWidth: 260, maxWidth: 320,
    groups: (q) => {
      const hit = ids.filter((v) => !q || by.get(v).slug.toLowerCase().includes(q) || (by.get(v).title || '').toLowerCase().includes(q));
      return q ? [['', hit]] : [['', ['']], [`短链 · 按访问量`, hit]];

const kindCount = (kinds, k) => (kinds || []).filter((x) => (x.k || 'human') === k).reduce((a, b) => a + b.n, 0);
const humanPct = (kinds) => {
  const sum = (kinds || []).reduce((a, b) => a + b.n, 0);
  return sum ? Math.round((kindCount(kinds, 'human') / sum) * 100) : '—';
};
// 真人占比小环形图：直连的真人 / 经代理的真人 / 可疑 / 爬虫，中间是真人占比
function kindDonut(kinds) {
  const sum = (kinds || []).reduce((a, b) => a + b.n, 0);
  if (!sum) return '<div class="kc-v"><b>—</b></div>';
  const px = proxyCount(kinds), hu = kindCount(kinds, 'human');
  const parts = [
    ['真人', hu - px, 'var(--good)', '直接访问的真人'], ['经代理', px, 'var(--accent)', '真人中经 VPN / 代理访问的'],
    ['可疑', kindCount(kinds, 'suspect'), 'var(--amber)', '机房 IP、缺少浏览器特征、高频访问等'], ['爬虫', kindCount(kinds, 'bot'), 'var(--faint)', '自报身份的爬虫、链接预览和脚本'],
  ].filter((x) => x[1] > 0);
  const r = 22, C = 2 * Math.PI * r;
  let off = 0;
  const segs = parts.map(([, n, c]) => { const len = (n / sum) * C; const el = `<circle cx="28" cy="28" r="${r}" stroke="${c}" stroke-dasharray="${Math.max(0, len - (parts.length > 1 ? 1.5 : 0))} ${C}" stroke-dashoffset="${-off}"/>`; off += len; return el; }).join('');
  return `<div class="chm kd"><div class="kd-c"><svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" stroke="var(--sunken)"/>${segs}</svg>
      <b data-tipf-always data-tipf="${esc(`真人 ${num(hu)} 次，占 ${pctText(hu / sum)}（含经代理 ${num(px)} 次）`)}">${humanPct(kinds)}<small>%</small></b></div>
    <div class="chm-l">${parts.map(([l, n, c, tip]) => `<span data-tipf-always data-tipf="${esc(`${tip} · ${num(n)} 次`)}"><i style="background:${c}"></i><em>${l}</em><b>${pctText(n / sum)}</b></span>`).join('')}</div></div>`;
}

async function homeSitesCard(root, token) {
  if (state.link) return;   // 只看单个短链时不显示全部站点的摘要
  const days = state.days <= 7 ? 7 : state.days;
  const d = await api('/google/sites?days=' + days).catch(() => null);
  if (!d?.items?.length || token !== routeToken) return;
  const S = (f) => d.items.reduce((a, x) => a + (f(x) || 0), 0);
  const ses = S((x) => x.cur.ga?.sessions), pses = S((x) => x.prev.ga?.sessions);
  const clk = S((x) => x.cur.gsc?.clicks), pclk = S((x) => x.prev.gsc?.clicks);
  const imp = S((x) => x.cur.gsc?.impressions), pimp = S((x) => x.prev.gsc?.impressions);
  const lk = S((x) => x.linksFrom.reduce((a, l) => a + l.human, 0)), plk = S((x) => x.linksFrom.reduce((a, l) => a + l.prevHuman, 0));
  const hasP = days !== 365;
  const top = d.items.filter((x) => x.cur.ga?.sessions).sort((a, b) => b.cur.ga.sessions - a.cur.ga.sessions).slice(0, 3);
  const label = G_RANGES.find(([v]) => v === days)?.[1] || '';
  const kc = (l, v, dl) => `<div class="hs-k"><span>${l}</span><div><b>${num(v)}</b>${hasP ? dl : ''}</div></div>`;
  const el = document.createElement('section');
  el.className = 'card rv home-sites';
  el.innerHTML = `<div class="card-h"><h3>站点</h3><span class="sub">${d.items.length} 个站点 · ${label}（截至 ${d.ranges.to}）</span><span class="sp"></span><a class="kc-a" href="#/sites">查看全部站点 →</a></div>
    <div class="hs-b">
      <div class="hs-ks">${kc('会话', ses, gDelta(ses, pses))}${kc('搜索点击', clk, gDelta(clk, pclk))}${kc('搜索展示', imp, gDelta(imp, pimp))}${kc('短链点击', lk, gDelta(lk, plk))}</div>
      <div class="hs-top">${top.map((x) => `<a class="hs-r" href="#/site/${encodeURIComponent(x.host)}"><span class="mono">${esc(x.host)}</span>
        <span class="hs-sp">${kpiSpark(x.spark.map((p) => p.n), 'var(--accent)')}</span><b>${num(x.cur.ga.sessions)}</b>${x.prev.ga ? gDelta(x.cur.ga.sessions, x.prev.ga.sessions) : '<span></span>'}</a>`).join('')}</div>
    </div>`;
  // 放在指标卡片下面
  const strip = root.querySelector('.kstrip');
  strip ? strip.after(el) : root.prepend(el);
}

// 概览页顶部的“开始使用”清单：全部完成或点了“不再显示”后不再出现
// 概览页：定时任务超过 3 小时没运行（汇总、同步、通知都会停）时在顶部提示
async function cronBanner(root, token) {
  const st = await api('/status').catch(() => null);
  if (!st?.cron || token !== routeToken || st.now - st.cron.at < 3 * 3600000) return;
  const el = document.createElement('div');
  el.className = 'nstat bad rv';
  el.innerHTML = `${ic('alert', 15)}<span>定时任务已经 ${ago(st.cron.at).replace('前', '')}没有运行了：访问汇总、Google 同步和通知都会暂停。</span><span class="sp" style="flex:1"></span><a class="btn sm" href="#/settings" data-acc="sys">查看系统状态</a>`;
  el.querySelector('a').onclick = () => store.set('set:open', 'sys');
  root.prepend(el);
}

async function setupCard(root, token) {
  if (store.get('setup:hide', false)) return;
  const st = await api('/setup').catch(() => null);
  if (!st || token !== routeToken) return;
  const steps = [
    ['link', '创建第一个短链', '把推广链接变成短链，统计每次访问', '#/links?new'],
    ['mfa', '开启两步验证', '密码泄露也登不进后台', '#/settings', 'mfa'],
    ['google', st.googleClient ? '连接 Google 账号' : '接入 Google Analytics / Search Console', '看清每个站点的访问和搜索表现', st.googleClient ? '#/sites' : '#/settings', st.googleClient ? '' : 'goo'],
    ['notify', '配置推送渠道', '日报、每周 SEO 变化和用量预警推送到 Telegram 或邮箱', '#/notify'],
    ['cloudflare', '填写 Cloudflare 凭据', '在后台看账户用量，快超出时提醒', '#/settings', 'use'],
  ];
  const done = steps.filter(([k]) => st[k]).length;
  if (done === steps.length) return;
  const el = document.createElement('section');
  el.className = 'card rv setup';
  // 只给没完成的步骤卡片；完成的收成标题里的一行“✓ …”
  const todo = steps.filter(([k]) => !st[k]), ok = steps.filter(([k]) => st[k]);
  el.innerHTML = `<div class="card-h"><h3>开始使用</h3><span class="sub">已完成 ${done} / ${steps.length}</span>
      ${ok.length ? `<span class="setup-ok">${ok.map(([, t]) => `<i>${ic('check', 11)}${t}</i>`).join('')}</span>` : ''}<span class="sp"></span>
      <div class="setup-p"><i style="width:${(done / steps.length) * 100}%"></i></div>
      <button type="button" class="hr-more" data-hide>不再显示</button></div>
    <div class="setup-l" style="--n:${todo.length}">${todo.map(([k, t, d, href, acc]) => `<a class="setup-i" href="${href}"${acc ? ` data-acc="${acc}"` : ''}>
      <span class="setup-c"></span><div><b>${t}</b><span>${d}</span></div>${ic('chev', 14)}</a>`).join('')}</div>`;
  el.querySelector('[data-hide]').onclick = () => { store.set('setup:hide', true); el.remove(); };
  el.querySelectorAll('[data-acc]').forEach((a) => (a.onclick = () => store.set('set:open', a.dataset.acc)));
  root.prepend(el);
}

async function renderLinks(token, opts = {}) {
  const page = document.getElementById('lpage');
  if (!page) {
    shell('links', `<header class="ph"><div><div class="kicker">链接管理</div><h1>短链</h1><div class="sub">先创建短链，再设置默认推广地址和按国家 / 地区跳转的规则</div></div></header>
      <div class="stack">
        <section class="rv">
          <form class="quick" id="quick">
            <div class="slug"><span>${esc(HOST)}/</span><input name="slug" placeholder="后缀（可选）" autocomplete="off" aria-label="短链后缀"></div>
            <input class="input" name="target_url" placeholder="默认推广地址（可选，之后也能设置）" autocomplete="off" aria-label="默认推广地址">
            <button class="btn primary">${ic('plus')}创建短链</button>
          </form>
          <div id="qres"></div>
        </section>

            <div class="combo g-lf" id="ltag"></div>
            <span class="sp"></span>
            <div class="seg" id="sort">${[['created', '最新创建'], ['clicks', '访问最多'], ['last_click', '最近访问']]
              .map(([k, l]) => `<button data-s="${k}" class="${k === listState.sort ? 'on' : ''}">${l}</button>`).join('')}</div>
            <button class="btn" id="bulk" aria-label="批量替换目标地址">${ic('swap')}<span class="hide-m">批量替换</span></button>
            <button class="btn" id="add">${ic('plus')}<span class="hide-m">高级创建</span></button>
          </div>
          <div id="lbody">${skel(280)}</div>
          <div class="lbulk" id="lbulk" hidden></div>
        </section>
      </div>`);

  }
  const d = await api(`/links?q=${encodeURIComponent(listState.q)}&page=${listState.page}&size=20&sort=${listState.sort}&tz=${TZ}&tag=${encodeURIComponent(listState.tag)}`);
  if (token !== routeToken) return;
  // 选中的分组被删除 / 改名后不存在了：恢复成全部
  if (listState.tag && listState.tag !== '+none' && !(d.tags || []).some((t) => t.tag === listState.tag)) { listState.tag = ''; return renderLinks(token, opts); }
  linkTagFilter(document.getElementById('ltag'), d.tags || []);
  // 选择只针对当前页
  const pageIds = new Set(d.items.map((l) => l.id));
  for (const id of [...listState.sel]) if (!pageIds.has(id)) listState.sel.delete(id);
  const pages = Math.max(1, Math.ceil(d.total / d.size));
  const body = document.getElementById('lbody');
  body.innerHTML = d.items.length ? `
    <div class="lrow hd"><span class="c-main"><label class="lck" aria-label="全选本页"><input type="checkbox" id="lall" ${d.items.length && d.items.every((l) => listState.sel.has(l.id)) ? 'checked' : ''}></label>短链 / 目标地址</span><span class="c-spark">近 14 天</span><span style="text-align:right">累计访问</span><span>最后访问</span><span>状态</span><span></span></div>
    ${d.items.map((l) => `
    <div class="lrow ${listState.flash === l.id ? 'flash' : ''}${listState.sel.has(l.id) ? ' sel-r' : ''}" data-go="${l.id}" tabindex="0">
      <div class="c-main"><label class="lck" aria-label="选择 ${esc(l.slug)}"><input type="checkbox" data-sel="${l.id}" ${listState.sel.has(l.id) ? 'checked' : ''}></label><div style="min-width:0">
        <div class="su">${esc(shortDisp(l.slug))}${l.title ? `<span class="tt">· ${esc(l.title)}</span>` : ''}${(l.tags || []).map((t) => `<span class="gtg sm-t">${esc(t)}</span>`).join('')}</div>
        <div class="tg">${l.rules ? `<span class="rb has-pop" tabindex="0">${ic('route')}${l.rules} 条跳转规则${rulePop(l)}</span>` : ''}${l.arms ? `<span class="rb ab-rb" data-tipf-always data-tipf="${esc(`按比例分到 ${l.arms} 个额外版本（A/B 测试）`)}">${ic('split')}A/B</span>` : ''}<span>${l.target_url ? esc(l.target_url) : `<span class="warn">${l.rules ? '未设置默认地址' : '未设置推广地址'}</span>`}</span></div>
      </div></div>
      <div class="c-spark">${sparkline(l.spark)}</div>
      <div class="num c-clicks">${num(l.clicks)}</div>
      <div class="tm c-last" title="${esc(fmtTime(l.last_click))}">${ago(l.last_click)}</div>
      <div class="c-status">${statusPill(l)}${l.down?.length ? `<span class="pill bad-p hc-p" data-tipf-always data-tipf="${esc(l.down.map((x) => `${x.url}：${x.error}`).join('\n'))}">目标异常</span>` : ''}</div>
      <div class="acts">
        ${copyBtn(shortUrl(l.slug))}
        <button class="btn ghost icon" data-tip="复制短链" aria-label="复制短链" data-dup="${l.id}">${ic('dup')}</button>
        <button class="btn ghost icon" data-tip="编辑" aria-label="编辑" data-edit="${l.id}">${ic('edit')}</button>
        <a class="btn ghost icon" data-tip="访问统计" aria-label="访问统计" href="#/link/${l.id}">${ic('chart')}</a>
      </div>
    </div>`).join('')}
    ${d.total > 0 ? `<div class="pager"><span>共 ${num(d.total)} 条</span>
      ${pages > 1 ? `<div class="g"><button class="btn sm" id="prev" ${listState.page <= 1 ? 'disabled' : ''}>上一页</button>
      <span class="tnum">${listState.page} / ${pages}</span>
      <button class="btn sm" id="next" ${listState.page >= pages ? 'disabled' : ''}>下一页</button></div>` : ''}</div>` : ''}`
    : `<div class="empty" style="padding:56px">${ic(listState.q || listState.tag ? 'search' : 'link')}${listState.q ? `没有找到包含 “${esc(listState.q)}” 的短链` : listState.tag ? '这个分组里没有短链' : '还没有短链，在上方粘贴一个推广链接试试'}</div>`;
  listState.flash = null;

  // 勾选 / 全选 / 批量操作栏
  body.querySelectorAll('[data-sel]').forEach((c) => (c.onchange = () => {
    const id = Number(c.dataset.sel);
    c.checked ? listState.sel.add(id) : listState.sel.delete(id);
    c.closest('.lrow').classList.toggle('sel-r', c.checked);
    const all = document.getElementById('lall');
    if (all) all.checked = d.items.every((l) => listState.sel.has(l.id));
    bulkBar(d);
  }));
  const lall = document.getElementById('lall');
  if (lall) lall.onchange = () => {
    for (const l of d.items) lall.checked ? listState.sel.add(l.id) : listState.sel.delete(l.id);
    body.querySelectorAll('[data-sel]').forEach((c) => { c.checked = lall.checked; c.closest('.lrow').classList.toggle('sel-r', lall.checked); });
    bulkBar(d);
  };
  bulkBar(d);
  body.querySelectorAll('[data-go]').forEach((r) => {
    r.onclick = (e) => { if (!e.target.closest('button, a, label')) location.hash = '#/link/' + r.dataset.go; };
    r.onkeydown = (e) => { if (e.key === 'Enter' && e.target === r) location.hash = '#/link/' + r.dataset.go; };
  });
  body.querySelectorAll('[data-edit]').forEach((b) => (b.onclick = (e) => {
    e.stopPropagation();
    openDrawer(d.items.find((l) => l.id == b.dataset.edit), () => renderLinks(routeToken));
  }));
  body.querySelectorAll('[data-dup]').forEach((b) => (b.onclick = (e) => {
    e.stopPropagation();
    duplicateDialog(d.items.find((l) => l.id == b.dataset.dup), (link) => {
      listState.flash = link.id; listState.page = 1;
      renderLinks(routeToken);
    });
  }));
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  if (prev) prev.onclick = () => { listState.page--; renderLinks(routeToken); };
  if (next) next.onclick = () => { listState.page++; renderLinks(routeToken); };
  if (opts.openNew) openDrawer(null, () => renderLinks(routeToken));
}

// 短链列表的分组筛选
function linkTagFilter(root, tags) {
  if (!root) return;
  const MANAGE = '+manage';
  dropdown(root, {
    value: listState.tag, aria: '按分组筛选', search: tags.length > 8 ? '搜索分组' : '', empty: '没有匹配的分组', minWidth: 220, maxWidth: 300,
    groups: (q) => q ? [['', tags.map((t) => t.tag).filter((t) => t.toLowerCase().includes(q))]]
      : [['', ['']], ...(tags.length ? [['分组', [...tags.map((t) => t.tag), '+none']], ['', [MANAGE]]] : [])],
    button: (v) => `${ic('tag', 14)}<span class="nm">${!v ? '全部分组' : v === '+none' ? '未分组' : esc(v)}</span>`,
    option: (v, q) => v === MANAGE ? `<span class="ot g-op g-sep">${ic('edit', 14)}管理分组…</span>`
      : !v ? '<span class="ot">全部分组</span>' : v === '+none' ? '<span class="ot">未分组</span>'
      : `<span class="ot">${hl(v, q)}<small>${tags.find((t) => t.tag === v)?.n || 0} 个</small></span>`,
    onChange: (v) => {
      if (v === MANAGE) { linkTagFilter(root, tags); return tagManageDialog(() => renderLinks(routeToken), LINK_TAGS); }
      listState.tag = v; listState.page = 1; listState.sel.clear(); renderLinks(routeToken);
    },
  });
}

// 批量操作栏：选中短链后出现
function bulkBar(d) {
  const bar = document.getElementById('lbulk');
  if (!bar) return;
  const ids = [...listState.sel];
  bar.hidden = !ids.length;
  if (!ids.length) { bar.innerHTML = ''; return; }
  const chosen = d.items.filter((l) => listState.sel.has(l.id));
  const run = async (action, extra = {}, msg = '已完成') => {
    try { await api('/links/bulk', { method: 'POST', body: { ids, action, ...extra } }); toast(msg); listState.sel.clear(); renderLinks(routeToken); }
    catch (ex) { toast(ex.message, 'bad'); }
  };
  bar.innerHTML = `<b>已选 ${ids.length} 个</b><span class="sp"></span>
    <button type="button" class="btn sm ghost" data-a="enable">启用</button>
    <button type="button" class="btn sm ghost" data-a="disable">停用</button>
    <button type="button" class="btn sm ghost" data-a="tag">${ic('tag', 14)}加到分组</button>
    ${chosen.some((l) => l.tags?.length) ? `<button type="button" class="btn sm ghost" data-a="untag">移出分组</button>` : ''}
    <button type="button" class="btn sm ghost danger-t" data-a="delete">${ic('trash', 14)}删除</button>
    <button type="button" class="btn sm" data-a="clear">取消选择</button>`;
  bar.querySelectorAll('[data-a]').forEach((b) => (b.onclick = async () => {
    const a = b.dataset.a;
    if (a === 'clear') { listState.sel.clear(); return renderLinks(routeToken); }
    if (a === 'enable') return run('enable', {}, `已启用 ${ids.length} 个短链`);
    if (a === 'disable') {
      const ok = await confirmDialog({ title: `停用 ${ids.length} 个短链？`, text: '停用后访问这些短链会返回 404，可以随时重新启用。', ok: '停用' });
      return ok && run('disable', {}, `已停用 ${ids.length} 个短链`);
    }
    if (a === 'tag') {
      const tag = await tagDialog({ title: `把 ${ids.length} 个短链加到分组`, tags: d.tags || [], ok: '加入分组' });
      return tag && run('tag', { tag }, `已加到“${tag}”`);
    }
    if (a === 'untag') {
      const own = [...new Set(chosen.flatMap((l) => l.tags || []))].map((t) => ({ tag: t, n: chosen.filter((l) => l.tags?.includes(t)).length }));
      const tag = await tagDialog({ title: `把 ${ids.length} 个短链移出分组`, text: '点下面的分组名，或输入要移出的分组。', tags: own, ok: '移出', value: own.length === 1 ? own[0].tag : '' });
      return tag && run('untag', { tag }, `已移出“${tag}”`);
    }
    if (a === 'delete') {
      const clicks = chosen.reduce((s2, l) => s2 + (l.clicks || 0), 0);
      const ok = await confirmDialog({ title: `删除 ${ids.length} 个短链？`, text: `会同时删除它们的跳转规则和 ${num(clicks)} 条访问记录，无法恢复。`, ok: '删除', danger: true });
      return ok && run('delete', {}, `已删除 ${ids.length} 个短链`);
    }
  }));
}

function bindLinksChrome() {
  const q = document.getElementById('q');
  let t;
  q.oninput = () => { clearTimeout(t); t = setTimeout(() => { listState.q = q.value.trim(); listState.page = 1; renderLinks(routeToken); }, 250); };
  const sort = document.getElementById('sort');
  segThumb(sort);
  sort.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    listState.sort = b.dataset.s; store.set('sort', listState.sort); listState.page = 1;
    sort.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    segThumb(sort);
    renderLinks(routeToken);
  }));
  document.getElementById('add').onclick = () => openDrawer(null, () => renderLinks(routeToken));
  document.getElementById('bulk').onclick = () => openBulkReplace(() => renderLinks(routeToken));

  const form = document.getElementById('quick');
  const qSlug = form.querySelector('[name=slug]'), qTarget = form.querySelector('[name=target_url]'), qBtn = form.querySelector('button');
  // 后缀和默认地址至少填一个才能创建
  const syncQuick = () => {
    const empty = !qSlug.value.trim() && !qTarget.value.trim();
    qBtn.disabled = empty;
    qBtn.title = empty ? '请填写短链后缀或默认推广地址' : '';
  };
  qSlug.oninput = qTarget.oninput = syncQuick;
  syncQuick();
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!qSlug.value.trim() && !qTarget.value.trim()) { toast('请填写短链后缀或默认推广地址', 'bad'); qSlug.focus(); return; }
    const f = new FormData(form);
    let target = String(f.get('target_url')).trim();
    if (target && !/^https?:\/\//i.test(target)) target = 'https://' + target;
    const btn = qBtn; btn.disabled = true;
    try {
      const link = await api('/links', { method: 'POST', body: { target_url: target, slug: String(f.get('slug')).trim() } });
      form.reset(); syncQuick();
      await copy(shortUrl(link.slug), '短链已创建并复制');
      // 没填地址：直接进入详情页设置跳转规则
      if (!link.target_url) { location.hash = '#/link/' + link.id; return; }
      document.getElementById('qres').innerHTML = `<div class="result">${ic('check')}
        <span class="u">${esc(shortDisp(link.slug))}</span><span class="hint" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">→ ${esc(link.target_url)}</span>
        ${copyBtn(shortUrl(link.slug), 'btn sm', '复制')}
        <button class="btn sm" id="qedit">${ic('edit', 14)}补充标题</button></div>`;
      document.getElementById('qedit').onclick = () => openDrawer(link, () => renderLinks(routeToken));
      listState.flash = link.id; listState.q = ''; listState.page = 1; q.value = '';
      if (listState.sort !== 'created') {
        listState.sort = 'created';
        sort.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.s === 'created'));
        segThumb(sort);
      }
      renderLinks(routeToken);
    } catch (err) { toast(err.message, 'bad'); }
    finally { syncQuick(); }
  };
}

// 列表里“N 条地区规则”的悬停浮层：每条规则的国家和跳转地址
function rulePop(l) {
  const list = (l.ruleList || []).filter((r) => !r.ab);
  if (!list.length) return '';
  const row = (r) => `<div class="rp-r"><div class="rp-c">${r.devices?.length ? `${esc(devText(r.devices))}${r.countries.length ? ' · ' : '（所有地区）'}` : ''}${r.countries.slice(0, 4).map((c) => `${flag(c)} ${esc(cname(c))}`.trim()).join('、')}${r.countries.length > 4 ? ` 等 ${r.countries.length} 个` : ''}</div>
    <div class="rp-u">${ic('arrow', 12)}<span>${esc(r.url)}</span></div></div>`;
  return `<span class="rb-pop" role="tooltip">${list.map(row).join('')}
    <div class="rp-r rp-def"><div class="rp-c">其他地区</div><div class="rp-u">${ic('arrow', 12)}<span>${l.target_url ? esc(l.target_url) : '未设置默认地址'}</span></div></div></span>`;
}

// 批量替换目标地址：先预览影响范围，确认后一次性替换
function openBulkReplace(onDone) {
  let mode = store.get('bulk:mode', 'exact'), last = null, timer, seq = 0;
  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('form'); dr.className = 'drawer bulk'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  dr.innerHTML = `
    <div class="dh"><h2>批量替换目标地址</h2><button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">
      <div class="field"><label>匹配方式</label>
        <div class="seg" id="b-mode">${[['exact', '完全匹配'], ['contains', '包含替换']].map(([k, l]) => `<button type="button" data-m="${k}" class="${k === mode ? 'on' : ''}">${l}</button>`).join('')}</div>
        <div class="hint" id="b-hint"></div></div>
      <div class="field"><label for="b-find">原始链接</label>
        <input class="input" id="b-find" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="b-to">替换为</label>
        <input class="input" id="b-to" autocomplete="off" spellcheck="false"></div>
      <div class="bulk-res" id="b-res"><div class="bulk-empty">${ic('search', 18)}填写原始链接后，这里会列出会被替换的地址</div></div>
    </div>
    <div class="df">
      <span class="hint" id="b-sum"></span><span class="sp"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary" id="b-go" disabled>替换</button>
    </div>`;
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dialog')) close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = close;
  dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
  document.body.append(ov, dr);

  const $ = (q) => dr.querySelector(q);
  const fi = $('#b-find'), ti = $('#b-to'), res = $('#b-res'), sum = $('#b-sum'), go = $('#b-go');
  const hint = () => {
    $('#b-hint').textContent = mode === 'exact'
      ? '地址与原始链接完全一致时，整条换成新链接。'
      : '把地址中出现的这一段换掉，其余部分不变。适合换域名、换推广码（如 ref=OLD → ref=NEW）。';
    fi.placeholder = mode === 'exact' ? 'https://old.example.com/register?ref=OLD' : '例如 ref=OLD 或 old.example.com';
    ti.placeholder = mode === 'exact' ? 'https://new.example.com/register?ref=NEW' : '例如 ref=NEW 或 new.example.com';
  };
  segThumb($('#b-mode'));
  $('#b-mode').querySelectorAll('button').forEach((b) => (b.onclick = () => {
    mode = b.dataset.m; store.set('bulk:mode', mode);
    $('#b-mode').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    segThumb($('#b-mode')); hint(); preview();
  }));
  hint();

  // 把原地址里匹配的部分 / 新地址里替换进去的部分标出来
  const mark = (u, part, cls) => {
    if (!part || mode === 'exact') return esc(u);
    return u.split(part).map(esc).join(`<mark class="${cls}">${esc(part)}</mark>`);
  };
  const render = (d) => {
    last = d;
    if (!d.total) {
      res.innerHTML = `<div class="bulk-empty">${ic('inbox', 18)}没有找到${mode === 'exact' ? '完全一致的' : '包含这段内容的'}地址</div>`;
      sum.textContent = ''; go.disabled = true; go.textContent = '替换'; return;
    }
    sum.innerHTML = `共 <b>${num(d.total)}</b> 处 · ${d.affected} 个短链`;
    go.textContent = `替换 ${num(d.total)} 处`;
    go.disabled = !ti.value.trim() || !!d.invalid;
    res.innerHTML = `
      <div class="bulk-stat"><div><b>${num(d.links)}</b><span>个默认地址</span></div><div><b>${num(d.rules)}</b><span>条规则 / 分流地址</span></div><div><b>${num(d.affected)}</b><span>个短链受影响</span></div></div>
      ${d.invalid ? `<div class="bulk-bad">${ic('info', 15)}替换后 /${esc(d.invalid.slug)} 的地址不合法：<code>${esc(d.invalid.to)}</code></div>` : ''}
      <div class="bulk-list">${d.items.map((x) => `<div class="bi">
        <div class="bi-h"><span class="mono">/${esc(x.slug)}</span><span class="bi-t">${x.type === 'link' ? '默认地址' : esc(ruleText(x))}</span></div>
        <div class="bi-u from" title="${esc(x.from)}">${mark(x.from, fi.value.trim(), 'del')}</div>
        <div class="bi-u to" title="${esc(x.to)}">${ic('arrow', 12)}<span>${ti.value.trim() ? mark(x.to, ti.value.trim(), 'add') : '<em>填写“替换为”后显示</em>'}</span></div>
      </div>`).join('')}</div>
      ${d.total > d.items.length ? `<div class="hint" style="margin-top:8px">只显示前 ${d.items.length} 处，执行时会全部替换。</div>` : ''}`;
  };
  const preview = () => {
    clearTimeout(timer);
    const find = fi.value.trim();
    if (!find) { res.innerHTML = `<div class="bulk-empty">${ic('search', 18)}填写原始链接后，这里会列出会被替换的地址</div>`; sum.textContent = ''; go.disabled = true; return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        let to = ti.value.trim();
        if (mode === 'exact' && to && !/^https?:\/\//i.test(to)) to = 'https://' + to;
        const d = await api('/links/replace', { method: 'POST', body: { mode, find, replace: to || (mode === 'exact' ? 'https://placeholder.invalid/' : find), dry: true } });
        if (my === seq) render(d);
      } catch (err) {
        if (my === seq) { res.innerHTML = `<div class="bulk-bad">${ic('info', 15)}${esc(err.message)}</div>`; go.disabled = true; }
      }
    }, 350);
  };
  fi.oninput = preview; ti.oninput = preview;
  fi.focus();

  dr.onsubmit = async (e) => {
    e.preventDefault();
    if (!last || !last.total) return;
    let to = ti.value.trim();
    if (mode === 'exact' && !/^https?:\/\//i.test(to)) to = 'https://' + to;
    const ok = await confirmDialog({
      title: `替换 ${num(last.total)} 处地址？`,
      text: `会修改 ${last.affected} 个短链：${last.links} 个默认地址、${last.rules} 条规则 / 分流地址。替换后立即生效，之后的访问都会跳到新地址。`,
      ok: '确认替换',
    });
    if (!ok) return;
    go.disabled = true;
    try {
      const d = await api('/links/replace', { method: 'POST', body: { mode, find: fi.value.trim(), replace: to, dry: false } });
      close(); toast(`已替换 ${num(d.total)} 处地址`); onDone();
    } catch (err) { toast(err.message, 'bad'); go.disabled = false; }
  };
}

function statusPill(l) {
  if (!l.enabled) return '<span class="pill off">已停用</span>';
  if (l.expires_at && l.expires_at < Date.now()) return '<span class="pill exp">已过期</span>';
  return '<span class="pill on">生效中</span>';
}

function toLocalInput(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

    try {

      close();
      if (isNew) { listState.flash = saved.id; await copy(shortUrl(saved.slug), '短链已创建并复制'); } else toast('已保存');
      onDone(saved);
    } catch (err) { dr.querySelector('.err').textContent = err.message; btn.disabled = false; syncDrawer(); }

}

// ---------------------------------------------------------------- 详情页侧边面板：跳转规则 / 投放链接
function openLinkPanel(kind, link, s) {
  document.querySelectorAll('.drawer[data-panel]').forEach((d) => d._close());
  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('div'); dr.className = 'drawer panel'; dr.dataset.panel = kind;
  dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  // 规则编辑抽屉、确认框叠在上面时，Esc 先关上层
  const onKey = (e) => { if (e.key === 'Escape' && [...document.querySelectorAll('.drawer')].pop() === dr && !document.querySelector('.dialog')) close(); };
  dr._close = close;
  document.addEventListener('keydown', onKey);
  ov.onclick = close;
  document.body.append(ov, dr);
  fillLinkPanel(dr, kind, link, s);
}

function fillLinkPanel(dr, kind, link, s) {
  if (kind === 'log') return fillLogPanel(dr, link);
  const isRules = kind === 'rules';
  dr.innerHTML = `
    <div class="dh"><div style="flex:1;min-width:0"><h2>${isRules ? '跳转规则' : '按站点生成投放链接'}</h2>
      <div class="hint">${isRules ? `按访问者所在国家 / 地区或设备跳到不同地址 · 命中数为最近 ${rangeLabel()}` : '每个站点用不同链接，来源统计更准'}</div></div>
      <button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">${isRules ? rulesCard(link, s) : `<div class="builder">
      <div>
        <div class="combo b-pick" id="b-pick" hidden></div>
        <textarea class="textarea" id="sites" rows="5" placeholder="每行一个站点名，例如：&#10;zhihu&#10;weibo&#10;forum-a" aria-label="站点名"></textarea>
        <div class="hint" style="margin-top:8px">会生成 <code>?src=站点名</code> 的链接，统计里“来源”会按它归类，不受对方网站设置影响。用站点域名（如 gaterar.com）时，“站点”页能自动把点击算到这个站点。</div>
      </div>
      <div class="blist" id="blist"></div>
      <div class="tipbox wide">${ic('info', 16)}<div>
        <b>放到网页上时，不要给链接加 <code>rel="noreferrer"</code></b>
        加了之后浏览器不会告诉我们访客从哪个网站来，“Referer”统计会记成直接访问。点 ${ic('code', 13)} 可以复制写法正确的 HTML：
        <code class="snip">&lt;a href="…?src=站点名" target="_blank" rel="noopener"&gt;…&lt;/a&gt;</code>
      </div></div></div>`}</div>`;
  dr.querySelector('[data-close]').onclick = dr._close;
  if (isRules) { bindRules(link); return; }
  const url = shortUrl(link.slug);
  // 投放链接生成
  const sites = document.getElementById('sites'), blist = document.getElementById('blist');
  const key = 'sites:' + link.id;
  sites.value = store.get(key, '');
  const build = () => {
    store.set(key, sites.value);
    const names = [...new Set(sites.value.split(/[\n,，]/).map((s) => s.trim()).filter(Boolean))];
    if (!names.length) { blist.innerHTML = `<div class="empty" style="padding:24px;border:1px dashed var(--line);border-radius:12px">在上方输入站点名，这里会生成对应的投放链接</div>`; return; }
    const urls = names.map((n) => `${url}?src=${encodeURIComponent(n)}`);
    const text = link.title || '点击访问';
    // noopener 保证安全，但不加 noreferrer，以便统计 Referer
    const html = (u) => `<a href="${u}" target="_blank" rel="noopener">${text}</a>`;
    blist.innerHTML = urls.map((u) => `<div class="b"><code title="${esc(u)}">${esc(u.replace(/^https?:\/\//, ''))}</code>
      <button class="btn sm ghost icon" data-tip="复制 HTML 代码" aria-label="复制 HTML 代码（不含 noreferrer）" data-copy="${esc(html(u))}"><span class="sw"><span class="no">${ic('code', 15)}</span><span class="ok">${ic('check', 15)}</span></span></button>
      ${copyBtn(u, 'btn sm ghost icon')}</div>`).join('')
      + (urls.length > 1 ? `<div style="margin-top:4px">${copyBtn(urls.join('\n'), 'btn sm', `复制全部 ${urls.length} 条`)}</div>` : '');
  };
  sites.oninput = build;
  build();
  setTimeout(() => sites.focus(), 250);
  // 从 Google 站点列表添加（连接了 Google 时才显示）
  const pick = document.getElementById('b-pick');
  api('/google/hosts').then((d) => {
    if (!d.items?.length || !pick.isConnected) return;
    pick.hidden = false;
    const hosts = d.items.map((x) => x.host), names = new Map(d.items.map((x) => [x.host, x.name]));
    const has = () => new Set(sites.value.split(/[\n,，]/).map((v) => v.trim()).filter(Boolean));
    dropdown(pick, {
      value: null, aria: '从站点列表添加', search: '搜索站点', empty: '没有匹配的站点', minWidth: 280, maxWidth: 360,
      groups: (q) => [[q ? '' : `站点 · 共 ${hosts.length} 个`, hosts.filter((h) => !q || h.includes(q) || (names.get(h) || '').toLowerCase().includes(q))]],
      button: () => `${ic('plus', 14)}<span class="nm">从站点列表添加</span>`,
      option: (h, q) => `<span class="ot"><span class="mono">${hl(h, q)}</span>${has().has(h) ? '<small>已添加</small>' : ''}</span>`,
      onChange: (h) => {
        if (!has().has(h)) sites.value = (sites.value.trim() ? sites.value.trim() + '\n' : '') + h;
        build();
      },
    });
  }).catch(() => {});
}
