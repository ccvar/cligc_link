// 点开页面：查 Bing 发现的来源网址（GetUrlLinks，按页翻）
function bindBlCard(host) {
  const card = document.getElementById('g-bl');
  if (!card) return;
  const load = async (tr, row, page) => {
    const box = row.querySelector('.bl-src');
    const more = box.querySelector('.bl-more');
    if (more) more.remove();
    box.insertAdjacentHTML('beforeend', '<div class="hint bl-ld">正在查询…</div>');
    try {
      const r = await api(`/backlinks/url?host=${encodeURIComponent(host)}&url=${encodeURIComponent(tr.dataset.blu)}&page=${page}`);
      box.querySelector('.bl-ld')?.remove();
      if (!r.items.length && !page) { box.innerHTML = '<div class="hint">Bing 暂时没有返回具体来源</div>'; return; }
      box.insertAdjacentHTML('beforeend', r.items.map((x) => `<div class="bl-si"><a class="ell" href="${esc(x.u)}" target="_blank" rel="noopener noreferrer" data-tipf="${esc(x.u)}">${esc(x.u.replace(/^https?:\/\//, ''))}</a>${x.a ? `<span class="hint ell">“${esc(x.a)}”</span>` : ''}</div>`).join('')
        + (r.page + 1 < r.pages ? `<button type="button" class="btn sm ghost bl-more" data-p="${r.page + 1}">加载更多</button>` : ''));
    } catch (ex) { box.querySelector('.bl-ld')?.remove(); box.insertAdjacentHTML('beforeend', `<div class="hint bad-t">${esc(ex.message)}</div>`); }
  };
  const toggle = (tr) => {
    const next = tr.nextElementSibling;
    if (next?.classList.contains('bl-x')) { next.remove(); tr.setAttribute('aria-expanded', 'false'); return; }
    tr.setAttribute('aria-expanded', 'true');
    tr.insertAdjacentHTML('afterend', '<tr class="bl-x"><td colspan="3"><div class="bl-src"></div></td></tr>');
    load(tr, tr.nextElementSibling, 0);
  };
  card.addEventListener('click', (e) => {
    const m = e.target.closest('.bl-more');
    if (m) { const row = m.closest('tr.bl-x'); load(row.previousElementSibling, row, Number(m.dataset.p)); return; }
    if (e.target.closest('a')) return;
    const tr = e.target.closest('tr[data-blu]');
    if (tr) toggle(tr);
  });
  card.addEventListener('keydown', (e) => {
    const tr = e.target.closest('tr[data-blu]');
    if (tr && e.key === 'Enter' && e.target === tr) toggle(tr);
  });
}

// ---------------------------------------------------------------- Cloudflare 用量
const wan = (n) => (EN ? (n >= 1e9 ? `${+(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : n >= 1e4 ? `${+(n / 1e3).toFixed(1)}K` : num(n))
  : n >= 1e8 ? `${+(n / 1e8).toFixed(2)} 亿` : n >= 1e4 ? `${+(n / 1e4).toFixed(1)} 万` : num(n));
const bytes = (b) => (b >= 1e9 ? `${+(b / 1e9).toFixed(2)} GB` : b >= 1e6 ? `${+(b / 1e6).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1e3))} kB`);
const usagePill = (u) => !u.configured ? '<span class="pill off">未配置</span>'
  : u.plan === 'paid' ? '<span class="pill on">付费版</span>' : u.plan === 'free' ? '<span class="pill on">免费版</span>' : '<span class="pill off">套餐未知</span>';

// 用量是否足够：按目前速度推算到月底（付费版）或今天结束（免费版），取最紧的一项
function usageHealth(u) {
  if (!u.configured || !(u.days || []).length) return null;
  if (u.forecast) {
    const NAME = { rowsRead: '读取', rowsWritten: '写入', requests: '请求' };
    const items = u.forecast.items.map((x) => ({ k: x.k, name: NAME[x.k], used: x.ratio, proj: x.projRatio, runOut: x.runOut }));
    const worst = items.reduce((a, b) => (b.proj > a.proj ? b : a));
    return { paid: u.forecast.paid, items, worst, level: worst.proj >= 1 ? 'bad' : worst.proj >= 0.8 ? 'warn' : 'ok' };
  }
  const paid = u.plan === 'paid';
  const cur = paid ? u.month : (u.days || []).find((d) => d.date === u.today);
  if (!cur) return null;
  const L = paid ? { rowsRead: 25e9, rowsWritten: 5e7, requests: 1e7 } : { rowsRead: 5e6, rowsWritten: 1e5, requests: 1e5 };
  const now = new Date();
  // 已过去的比例：付费版按本月天数，免费版按今天的小时（UTC）
  const dim = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 0)).getUTCDate();
  const elapsed = paid
    ? (now.getUTCDate() - 1 + (now.getUTCHours() * 60 + now.getUTCMinutes()) / 1440) / dim
    : (now.getUTCHours() * 60 + now.getUTCMinutes()) / 1440;
  const NAME = { rowsRead: '读取', rowsWritten: '写入', requests: '请求' };
  const items = Object.keys(L).map((k) => {
    const used = cur[k] / L[k];
    return { k, name: NAME[k], used, proj: elapsed > 0.02 ? used / elapsed : used };
  });
  const worst = items.reduce((a, b) => (b.proj > a.proj ? b : a));
  const level = worst.proj >= 1 ? 'bad' : worst.proj >= 0.8 ? 'warn' : 'ok';
  return { paid, items, worst, level };
}
const pctText = (x) => (x > 0 && x < 0.01 ? '<1%' : `${Math.round(x * 100)}%`);

// 收起时标题下的一句话摘要
function usageSummary(u) {
  if (!u.configured) return '未配置，展开填写账户 ID 和 API 令牌';
  if (u.errors?.length && !(u.days || []).some((d) => d.rowsRead)) return '读取用量失败，展开查看原因';
  const h = usageHealth(u);
  if (!h) return '暂无数据';
  const label = { ok: '充足', warn: '偏紧', bad: '将超出' }[h.level];
  const tip = h.level === 'bad' ? (h.paid ? '，超出部分按量计费' : '，超出后当天请求会失败') : '';
  const sentence = `${label}：${h.paid ? '本月' : '今天'}已用 ${h.items.map((x) => `${x.name} ${pctText(x.used)}`).join('、')}，`
    + `按目前速度${h.paid ? '月底' : '今天结束时'}${h.items.map((x) => `${x.name}约 ${pctText(x.proj)}`).join('、')}${tip}`;
  // 每项一个小进度条：实色为已用，浅色为按目前速度推算到期末
  const bar = (x) => {
    const lv = x.proj >= 1 ? 'bad' : x.proj >= 0.8 ? 'warn' : 'ok';
    return `<span class="us-i"><em>${x.name}</em><i class="us-b ${lv}"><s style="width:${Math.min(100, x.proj * 100)}%"></s><u style="width:${Math.max(x.used ? 2 : 0, Math.min(100, x.used * 100))}%"></u></i><em class="us-p">${pctText(x.used)}</em></span>`;
  };
  return `<span class="use-sum" data-tipf-always data-tipf="${esc(sentence)}"><b class="use-lv ${h.level}">${label}</b>${h.items.map(bar).join('')}</span>`;
}

    btn.disabled = true; err.textContent = ''; btn.textContent = '正在验证…';
    try {
      const d = await api('/usage/config', { method: 'PUT', body: {
        accountId: f.querySelector('#cf-acc').value.trim(), token: f.querySelector('#cf-tok').value.trim(),
        dbId: f.querySelector('#cf-db').value.trim(), worker: f.querySelector('#cf-wk').value.trim() } });
      toast('Cloudflare 凭据已保存'); done(d);
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; btn.textContent = '验证并保存'; }
  };
  const del = f.querySelector('[data-cfg-del]');
  if (del) del.onclick = async () => {
    const ok = await confirmDialog({ title: '删除 Cloudflare 凭据？', text: '删除后不再显示用量，可以随时重新填写。', ok: '删除', danger: true });
    if (!ok) return;
    try { done(await api('/usage/config', { method: 'DELETE' })); toast('已删除凭据'); } catch (ex) { toast(ex.message, 'bad'); }
  };
}

function renderUsage(box, u, onState) {
  if (!u.configured) {
    box.innerHTML = `
      <p class="set-p">在后台查看 Cloudflare 账号的用量，需要账户 ID 和一个只读的 API 令牌：</p>
      <ol class="use-steps" style="margin-bottom:18px">
        <li>打开 Cloudflare 控制台 → 右上角头像 → <b>我的个人资料 → API 令牌 → 创建令牌 → 创建自定义令牌</b>。</li>
        <li>权限添加 <b>帐户 · 帐户分析 · 读取</b>（英文界面是 Account Analytics · Read）；想显示套餐的话再加 <b>帐户 · 计费 · 读取</b>。帐户资源选你的账户。</li>
        <li>账户 ID 在控制台首页（Workers 和 Pages 概览）右侧可以找到，是一串 32 位字符。</li>
      </ol>
      ${cfForm(u.config || {})}`;
    bindCfForm(box, u, onState);
    return;
  }
  const zero = { rowsRead: 0, rowsWritten: 0, requests: 0, mine: { rowsRead: 0, rowsWritten: 0, requests: 0 } };
  const t = (u.days || []).find((d) => d.date === u.today) || zero;
  const paid = u.plan === 'paid';
  // 付费版：本月累计对比每月包含额度；免费版 / 未知：今天对比每天额度
  const L = paid ? { rowsRead: 25e9, rowsWritten: 5e7, requests: 1e7 } : { rowsRead: 5e6, rowsWritten: 1e5, requests: 1e5 };
  const cur = paid ? (u.month || zero) : t;
  const when = paid ? '本月' : '今天';
  const fc = new Map((u.forecast?.items || []).map((x) => [x.k, x]));
  const endName = paid ? '月底' : '今天结束时';
  const md = (ms) => { const d = new Date(ms); return paid ? `${d.getMonth() + 1} 月 ${d.getDate()} 日` : `${pad(d.getHours())}:00`; };
  const meter = (label, v, limit, mine, has, fmt = wan, unit = paid ? '每月包含' : '每天', key = '') => {
    const pct = limit ? Math.min(100, (v / limit) * 100) : 0;
    const f = fc.get(key);
    const pp = f ? Math.min(100, f.projRatio * 100) : 0;
    const lv = (f ? f.projRatio * 100 : pct) >= 100 ? 'bad' : (f ? f.projRatio * 100 : pct) >= 80 ? 'warn' : 'ok';
    return `<div class="use-m"><div class="use-l">${label}</div><div class="use-v">${fmt(v)}</div>
      <div class="use-s">${paid ? '付费版' : '免费版'}${unit} ${fmt(limit)} · 已用 ${pct < 1 && v ? '<1' : Math.round(pct)}%</div>
      <div class="use-bar ${lv}">${f ? `<s style="width:${Math.max(pp, pct)}%"></s>` : ''}<i style="width:${Math.max(pct, v ? 1 : 0)}%"></i></div>
      ${f ? `<div class="use-fc ${lv}">${endName}预计 <b>${fmt(f.proj)}</b>（${pctText(f.projRatio)}）· ${f.ratio >= 1 ? '已超出' : f.runOut ? `约 ${md(f.runOut)} 用完` : '够用'}</div>` : ''}
      ${has ? `<div class="use-mine">其中本项目 <b>${fmt(mine || 0)}</b></div>` : ''}${key ? topLine(key) : ''}</div>`;
  };
  const mine = cur.mine || zero.mine;
  const maxDay = Math.max(1, ...(u.days || []).map((d) => d.rowsRead));
  // 占用最多的数据库 / Worker：名称（拿不到名称时显示 ID 前 8 位），本项目加标记
  const dbName = (id) => (u.dbNames?.[id] || `${String(id).slice(0, 8)}…`) + (id && id === u.myDb ? '（本项目）' : '');
  const wkName = (n) => (n || '未知') + (n && n === u.myWorker ? '（本项目）' : '');
  const nameOf = (k) => (k === 'requests' ? wkName : dbName);
  // 颜色按最近 7 天的总排名分配，同一个数据库每天颜色一样
  const UCOL = ['var(--accent)', 'var(--violet)', 'var(--teal)'];
  const colorOf = new Map((u.top?.week?.rowsRead || []).map(([id], i) => [id, UCOL[i]]));
  // 写入多、读取少的数据库也给个颜色；Worker 按最近 7 天的请求量另配颜色
  for (const [id] of u.top?.week?.rowsWritten || []) if (!colorOf.has(id) && colorOf.size < 5) colorOf.set(id, ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--amber)', 'var(--rose)'][colorOf.size]);
  const wkColor = new Map((u.top?.week?.requests || []).map(([n], i) => [n, UCOL[i]]));
  // 写入 / 请求格子里：数字下面列出占用最多的两个
  const topCell = (list, total, k, d) => {
    const mineId = k === 'requests' ? u.myWorker : u.myDb, has = k === 'requests' ? u.hasMine?.worker : u.hasMine?.d1;
    const shown = (list || []).slice(0, 2);
    // 本项目不在前两名时，单独再列一行；在前两名里时也输出一行（.use-mine-m），手机上不列前两名时显示
    const inTop = shown.some(([id]) => id === mineId);
    const mine = has ? `<div class="sm${inTop ? ' use-mine-m' : ''}">本项目 ${wan(d.mine?.[k] || 0)}</div>` : '';
    if (!shown.length || !total) return mine;
    return `<div class="use-who r">${shown.map(([id, n]) =>
      `<span><i style="background:${(k === 'requests' ? wkColor : colorOf).get(id) || 'var(--faint)'}"></i><em>${esc(nameOf(k)(id))}</em>${pctText(n / total)}</span>`).join('')}</div>${mine}`;
  };
  const topTip = (list, total, k) => (list?.length ? list.map(([id, n]) => `${nameOf(k)(id)}：${wan(n)}（${pctText(total ? n / total : 0)}）`).join('\n') : '');
  const topLine = (k) => {
    const list = u.top?.[paid ? 'month' : 'today']?.[k], total = cur[k];
    if (!list?.length || !total) return '';
    const [id, n] = list[0];
    return `<div class="use-top" data-tipf-always data-tipf="${esc(`${when}占用最多：\n${topTip(list, total, k)}`)}"><span>占用最多</span><b>${esc(nameOf(k)(id))}</b><em>${pctText(n / total)}</em></div>`;
  };
  // 每天的 D1 读取：长度按最近 7 天最高的那天，按数据库分段着色；下面列出占用最多的几个
  const useBar = (d) => {
    const list = d.top?.rowsRead || [];
    if (!list.length || !d.rowsRead) return `<div class="use-mini"><i style="width:${(d.rowsRead / maxDay) * 100}%"></i></div>`;
    const rest = d.rowsRead - list.reduce((a, [, n]) => a + n, 0);
    const seg = (n, c, tip) => `<i style="width:${(n / maxDay) * 100}%;background:${c}" data-tipf-always data-tipf="${esc(tip)}"></i>`;
    return `<div class="use-mini seg">${list.map(([id, n]) => seg(n, colorOf.get(id) || 'var(--faint)', `${dbName(id)}：${wan(n)}（${pctText(n / d.rowsRead)}）`)).join('')}${rest > 0 ? seg(rest, 'var(--sunken-2, var(--line))', `其他：${wan(rest)}`) : ''}</div>
      <div class="use-who">${list.slice(0, 2).map(([id, n]) => `<span><i style="background:${colorOf.get(id) || 'var(--faint)'}"></i>${esc(dbName(id))} ${pctText(n / d.rowsRead)}</span>`).join('')}</div>`;
  };
  const plans = [['auto', '自动识别'], ['free', '免费版'], ['paid', '付费版']];
  box.innerHTML = `
    <div class="use-h"><div class="seg" id="use-plan">${plans.map(([k, l]) => `<button type="button" data-p="${k}" class="${k === (u.planSetting || 'auto') ? 'on' : ''}">${l}</button>`).join('')}</div>
      <span class="hint use-why">${u.planSetting === 'auto' || !u.planSetting
        ? (u.detected === 'paid' ? (u.detectedBy === 'usage' ? '自动识别为付费版：用量已超过免费版上限' : '自动识别为付费版') : '无法自动识别（按免费版额度对比），可手动指定')
        : '已手动指定'}${u.subscriptions?.length ? `<span data-tipf-always data-tipf="账户订阅（多为域名套餐，通常不包含 Workers 付费计划）：${esc(u.subscriptions.join('、'))}"> · 订阅 ${u.subscriptions.length} 项</span>` : ''}</span>
      <span class="sp"></span>
      <button type="button" class="btn sm icon" data-cfg-edit aria-label="修改凭据" data-tipf-always data-tipf="${esc(['凭据已加密保存在数据库', `账户 ${u.config?.accountId || ''}`, `令牌 ••••${u.config?.tokenTail || ''}`,
        u.config?.dbId ? `D1 数据库 ${u.config.dbId}` : '', u.config?.worker ? `Worker ${u.config.worker}` : '', '点击修改或删除'].filter(Boolean).join('\n'))}">${ic('key', 14)}</button>
      <button type="button" class="btn sm icon" id="use-re" aria-label="刷新用量" data-tipf-always data-tipf="刷新用量（结果缓存 5 分钟）">${ic('refresh', 14)}</button></div>
    <div data-cfg-form class="use-cfgf" hidden>${cfForm(u.config || {})}</div>
    ${u.errors?.length ? `<div class="bulk-bad">${ic('info', 15)}<div>${u.errors.map(esc).join('<br>')}<br>${u.errors.some((e) => /authentication/i.test(e))
      ? '“Authentication error”表示令牌无效：多半是粘贴的不是令牌值（如 Global API Key 或令牌 ID）、令牌已过期或被轮转，或者设置了客户端 IP 筛选。'
      : '请检查 API 令牌是否有“帐户分析（Account Analytics）· 读取”权限。'}</div></div>` : ''}
    ${(() => {
      const h = usageHealth(u);
      if (!h) return '';
      const over = h.items.filter((x) => x.proj >= 1);
      const msg = over.length
        ? `按目前速度，${over.map((x) => `${x.name}${x.used >= 1 ? '已超出' : x.runOut ? `约 ${md(x.runOut)} 用完` : `${endName}约 ${pctText(x.proj)}`}`).join('、')}${paid ? '，超出部分按量计费' : '，超出后当天请求会失败'}`
        : `按目前速度，${paid ? '本月' : '今天'}的包含额度够用：${endName}最多用到 ${pctText(h.worst.proj)}（${h.worst.name}）`;
      return `<div class="use-v-b ${h.level}">${ic(h.level === 'ok' ? 'check' : 'alert', 15)}<span>${msg}</span>
        <span class="hint">${paid ? '按最近 7 天的日均用量推算' : '按今天已过时间推算'}</span></div>`;
    })()}
    <div class="use-g">
      ${meter(`D1 读取行数（${when}·整个账户）`, cur.rowsRead, L.rowsRead, mine.rowsRead, u.hasMine?.d1, wan, undefined, 'rowsRead')}
      ${meter(`D1 写入行数（${when}·整个账户）`, cur.rowsWritten, L.rowsWritten, mine.rowsWritten, u.hasMine?.d1, wan, undefined, 'rowsWritten')}
      ${meter(`Worker 请求（${when}·整个账户）`, cur.requests, L.requests, mine.requests, u.hasMine?.worker, wan, undefined, 'requests')}
      ${u.storageBytes == null ? `<div class="use-m"><div class="use-l">D1 存储（整个账户）</div><div class="use-v">—</div><div class="use-s">暂无数据</div></div>`
        : meter('D1 存储（整个账户）', u.storageBytes, 5e9, u.myStorage, u.myStorage != null, bytes, '包含')}
    </div>
    <div class="hint" style="margin-top:10px">额度按整个 Cloudflare 账户计算，${paid ? '付费版按自然月累计，超出部分按量计费' : '免费版每天 UTC 0 点（北京时间 8 点）重置，超出后当天的请求会失败'}。按 UTC 日期统计${u.updatedAt ? ` · 更新于 ${fmtTime(u.updatedAt)}` : ''}。</div>
    <table class="tbl use-t"><thead><tr><th><span class="th-l">日期（UTC）</span><span class="th-s">日期</span></th><th style="text-align:right">D1 读取</th><th></th><th style="text-align:right">D1 写入</th><th style="text-align:right">Worker 请求</th></tr></thead>
      <tbody>${(u.days || []).slice().reverse().map((d) => `<tr>
        <td>${d.date.slice(5)}${d.date === u.today ? ' <span class="sm">今天</span>' : ''}</td>
        <td class="num">${wan(d.rowsRead)}${u.hasMine?.d1 ? `<div class="sm">本项目 ${wan(d.mine?.rowsRead || 0)}</div>` : ''}</td>
        <td>${useBar(d)}</td>
        <td class="num"${d.top?.rowsWritten?.length ? ` data-tipf-always data-tipf="${esc(`D1 写入最多：\n${topTip(d.top.rowsWritten, d.rowsWritten, 'rowsWritten')}`)}"` : ''}>${wan(d.rowsWritten)}${topCell(d.top?.rowsWritten, d.rowsWritten, 'rowsWritten', d)}</td>
        <td class="num"${d.top?.requests?.length ? ` data-tipf-always data-tipf="${esc(`Worker 请求最多：\n${topTip(d.top.requests, d.requests, 'requests')}`)}"` : ''}>${wan(d.requests)}${topCell(d.top?.requests, d.requests, 'requests', d)}</td></tr>`).join('')}</tbody></table>`;
  bindCfForm(box, u, onState);
  segThumb(box.querySelector('#use-plan'));
  box.querySelectorAll('#use-plan button').forEach((b) => (b.onclick = async () => {
    try { const d = await api('/usage/plan', { method: 'PUT', body: { plan: b.dataset.p } }); onState(d); renderUsage(box, d, onState); }
    catch (err) { toast(err.message, 'bad'); }
  }));
  box.querySelector('#use-re').onclick = async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.classList.add('busy');
    try { const d = await api('/usage?force=1'); onState(d); renderUsage(box, d, onState); toast('用量已刷新'); }
    catch (err) { toast(err.message, 'bad'); btn.disabled = false; btn.classList.remove('busy'); }
  };
}

// 数据保留：访问明细超过期限自动删除；统计读汇总数据，不受影响
function renderRetention(box, r, onState) {
  const opts = [[0, '永久'], [365, '365 天'], [180, '180 天'], [90, '90 天'], [60, '60 天']];
  box.innerHTML = `
    <p class="set-p">每次访问都会记录一条明细（IP、来源、设备……），用于“访问明细”列表、导出 CSV 和定时报告。
      统计页面读的是按小时 / 按天汇总的数据，明细删除后，趋势、来源、地区等统计照常显示。</p>
    <div class="seg" id="ret-seg">${opts.map(([d, l]) => `<button type="button" data-d="${d}" class="${d === r.days ? 'on' : ''}">${l}</button>`).join('')}</div>
    <ul class="set-list" style="margin-top:16px">
      <li>${ic('check', 14)}当前保存了 <b>${num(r.count)}</b> 条访问明细${r.first ? `，最早一条是 ${fmtTime(r.first)}` : ''}</li>
      <li>${ic('check', 14)}统计数据已汇总到 ${r.aggregated ? fmtTime(r.aggregated) : '—'}，之后的访问实时读取</li>
      <li>${ic('check', 14)}超过期限的明细由定时任务每小时清理一批（最多 ${num(r.perHour || 500)} 条，免得一次用完当天的写入额度）；最短 60 天，保证月报有完整数据</li>
      ${r.days && r.pending ? (() => {
        // 待清理条数一天统计一次：按统计之后过了几个整点估算还剩多少，再估一下要多久
        const per = r.perHour || 500, left = r.pending - Math.floor((Date.now() - (r.countedAt || Date.now())) / 3600000) * per;
        if (left <= 0) return `<li>${ic('check', 14)}旧明细应该已经清理完了（明天重新统计后更新）</li>`;
        const h = Math.ceil(left / per);
        return `<li>${ic('history', 14)}还有约 <b>${num(left)}</b> 条超过保留期的明细待清理，预计还要 ${h < 24 ? `${h} 小时` : `${Math.ceil(h / 24)} 天`}（访问多时会更久）</li>`;
      })() : ''}
    </ul>`;
  segThumb(box.querySelector('#ret-seg'));
  box.querySelectorAll('#ret-seg button').forEach((b) => (b.onclick = async () => {
    const days = Number(b.dataset.d);
    if (days && (!r.days || days < r.days)) {
      const ok = await confirmDialog({ title: `只保留最近 ${days} 天的访问明细？`, text: `超过 ${days} 天的访问明细会从下一个整点开始分批删除，无法恢复。趋势、来源、地区等统计不受影响。`, ok: '确认' });
      if (!ok) return;
    }
    try {
      const d = await api('/retention', { method: 'PUT', body: { days } });
      toast(days ? `访问明细保留 ${days} 天` : '访问明细永久保留');
      onState(d.days); renderRetention(box, d, onState);
    } catch (err) { toast(err.message, 'bad'); }
  }));
}

// 来源追踪：推广页上放一段代码，把访客来自的搜索引擎带到短链的 utm_source 上
// ---------------------------------------------------------------- Bing Webmaster 设置
// 出错时写明原因：限流是临时的（黄色，每小时自动重试），Key 无效、没有权限等需要处理（红色）
const bingThrottled = (b) => /限流/.test(b.error || '');
const bingErrShort = (b) => (bingThrottled(b) ? '暂时限流' : /Key 无效/.test(b.error) ? 'Key 无效' : /没有权限/.test(b.error) ? '没有权限' : '出错');
const bingSummary = (b) => (!b.configured ? '接入 Bing 搜索的点击、展示、搜索词，以及收录检查和网址提交'
  : `API Key ••••${esc(b.keyTail)} · ${b.sites} 个站点${b.lastSync ? ` · 同步于 ${ago(b.lastSync)}` : ''}${b.error ? ` · <span class="${bingThrottled(b) ? 'b-warn' : 'b-bad'}">${esc(bingThrottled(b) ? 'Bing 暂时限流，每小时自动重试' : b.error)}</span>` : ''}`);
const bingPill = (b) => (!b.configured ? '<span class="pill off">未配置</span>'
  : b.error ? `<span class="pill ${bingThrottled(b) ? 'exp' : 'bad-p'}" data-tipf-always data-tipf="${esc(`${b.error}${bingThrottled(b) ? '\n定时任务每小时会自动重试' : ''}`)}">${bingErrShort(b)}</span>`
  : '<span class="pill on">已连接</span>');
// 代理转发配置：把 <代理地址><方法> 转到 https://ssl.bing.com/webmaster/api.svc/json/<方法>
// 路径里的随机字符：已经设过代理就沿用它的路径，否则生成一串（记在本地，下次打开不变）
function bingProxyPath(b) {
  const m = /^https:\/\/[^/]+(\/.+\/)$/.exec(b?.proxy || '');
  if (m) return m[1];
  let t = store.get('bing:tok', '');
  if (!/^[a-z0-9]{20}$/.test(t)) {
    const a = crypto.getRandomValues(new Uint8Array(20));
    t = [...a].map((x) => 'abcdefghijklmnopqrstuvwxyz0123456789'[x % 36]).join('');
    store.set('bing:tok', t);
  }
  return `/bing-${t}/`;
}
// 完整的站点配置：域名取代理地址里填的，没填时用 bing.example.com 占位
const BING_HOST0 = 'bing.example.com';
const BING_CADDY = (host, path) => `${host} {
    handle_path ${path}* {
        rewrite * /webmaster/api.svc/json{uri}
        reverse_proxy https://ssl.bing.com {
            header_up Host ssl.bing.com
        }
    }
}`;
const BING_NGINX = (host, path) => `server {
    listen 443 ssl;
    server_name ${host};
    # 证书：可以用 certbot 申请（certbot --nginx -d ${host}）
    ssl_certificate     /etc/letsencrypt/live/${host}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${host}/privkey.pem;

    location ${path} {
        proxy_pass https://ssl.bing.com/webmaster/api.svc/json/;
        proxy_set_header Host ssl.bing.com;
        proxy_ssl_server_name on;
        proxy_ssl_name ssl.bing.com;
    }
}`;
const BING_TEST = (host, path) => `curl "https://${host}${path}GetUserSites?apikey=00000000000000000000000000000000"`;
const bingProxyHost = (v) => { try { const u = new URL(v); return u.protocol === 'https:' && u.hostname.includes('.') ? u.hostname : ''; } catch { return ''; } };
// 代码块（带复制按钮）；data-bp 标记哪一段，输入代理地址时按新域名重写
const bingCode = (k, title, text) => `<div class="trk-h" style="margin-top:10px"><b>${title}</b><span class="sp"></span>${copyBtn(text, 'btn sm', '复制')}</div><pre class="code" data-bp="${k}">${esc(text)}</pre>`;
const bingProxyHelp = (b) => {

// 输入代理地址时，示例配置里的域名跟着变
function bindBingProxyHelp(form, b) {
  const input = form.querySelector('#bing-proxy'), hostIn = form.querySelector('#bing-host');
  if (!input || !hostIn) return;
  const path0 = bingProxyPath(b);
  // 当前的域名和路径：以上面的代理地址为准；它没填或格式不对时用下面的域名框
  const cur = () => {
    const v = input.value.trim(), host = bingProxyHost(v);
    let path = path0;
    try { const p = new URL(v).pathname; if (host && p.length > 1) path = p.endsWith('/') ? p : `${p}/`; } catch {}
    return { host: host || hostIn.value.trim() || BING_HOST0, path };
  };
  const fit = () => { hostIn.style.width = `${Math.max(hostIn.value.length, BING_HOST0.length) + 1}ch`; };
  const render = (h0) => {
    const c = cur(), host = h0 || c.host, path = c.path;
    const texts = { caddy: BING_CADDY(host, path), nginx: BING_NGINX(host, path), test: BING_TEST(host, path), path };
    form.querySelectorAll('[data-bp]').forEach((el) => {
      el.textContent = texts[el.dataset.bp];
      const btn = el.previousElementSibling?.querySelector('[data-copy]');
      if (btn) btn.dataset.copy = texts[el.dataset.bp];
    });
    const cp = form.querySelector('[data-bp-copy]');
    if (cp) cp.dataset.copy = `https://${host}${path}`;
  };
  // 上面的代理地址改了：域名框跟着变
  input.addEventListener('input', () => {
    const h = bingProxyHost(input.value.trim());
    if (h && document.activeElement !== hostIn) { hostIn.value = h; fit(); }
    render();
  });
  // 域名框改了：上面的代理地址跟着变（域名里要有点才写回去，免得输入到一半把代理地址清掉）
  hostIn.addEventListener('input', () => {
    hostIn.value = hostIn.value.replace(/^https?:\/\//i, '').replace(/[/\s].*$/, '');
    fit();
    const h = hostIn.value.trim();
    if (h.includes('.')) input.value = `https://${h}${cur().path}`;
    render(h || BING_HOST0);
  });
  fit();
}

      <div class="trk-flow"><span>${ic('search', 14)}Google / 百度…</span>${ic('arrow', 14)}<span>${ic('globe', 14)}你的推广页</span>${ic('arrow', 14)}<span class="hl">${ic('link', 14)}${esc(HOST)}/xxx<b>?utm_source=google</b></span></div>
      <ul class="set-list">
        <li>${ic('check', 14)}识别 Google、Bing、百度、搜狗、360、神马等搜索引擎，以及 Google / Bing 广告点击</li>
        <li>${ic('check', 14)}只给指向 ${esc(HOST)} 的链接加 <code>utm_source</code>，不改动已有的 <code>src</code> 和 <code>utm_source</code></li>
        <li>${ic('check', 14)}记住访客的首次来源，在站内翻几页后再点短链也不会丢</li>
        <li>${ic('check', 14)}在短链详情页“来源 · utm_source”查看；链接没有 <code>src</code> 时也会直接计入“来源”</li>
      </ul>
      ${t.enabled ? `
      <div class="trk-code">
        <div class="trk-h"><div class="tabs" id="trk-tabs">${['完整代码（推荐）', 'Script 链接'].map((l, i) => `<button type="button" class="${i === tab ? 'on' : ''}">${l}</button>`).join('')}</div>
          <span class="sp"></span>${copyBtn(snippet[tab], 'btn sm', '复制代码')}</div>
        <pre class="code">${esc(snippet[tab])}</pre>
        <div class="hint">${tab === 0 ? '直接粘贴到推广页的 &lt;head&gt; 或 &lt;/body&gt; 前。在访客浏览器里运行，不占用 Worker 请求额度；以后识别规则有更新时，重新复制粘贴一次即可。' : '放到推广页的 &lt;head&gt; 或 &lt;/body&gt; 前。以后升级识别规则，页面不用改；但每个新访客加载脚本都会占用一次 Worker 请求额度（和短链跳转共用，免费版每天 10 万次），流量大的页面建议用完整代码。'}</div>
      </div>` : `<div class="trk-off">${ic('info', 15)}开启后显示安装代码。</div>`}
    </div>`;
  box.querySelector('#trk-on').onchange = async (e) => {
    try {
      const d = await api('/tracking', { method: 'PUT', body: { enabled: e.target.checked } });
      toast(d.enabled ? '来源追踪已开启' : '来源追踪已关闭');
      onState?.(d.enabled);
      renderTracking(box, d, onState);
    } catch (err) { e.target.checked = !e.target.checked; toast(err.message, 'bad'); }
  };
  box.querySelectorAll('#trk-tabs button').forEach((b, i) => (b.onclick = () => { store.set('trk:tab2', i); renderTracking(box, t, onState); }));
}

// ---------------------------------------------------------------- 通知
async function renderNotify(token) {
  const head = `<header class="ph"><div><div class="kicker">设置</div><h1>统计通知</h1><div class="sub">定期把访问统计推送到 Telegram 或邮箱</div></div></header>`;
  shell('notify', `${head}<div class="stack">${skel(160)}<div class="grid2">${skel(170, 2)}</div></div>`);
  let st = await api('/notify');
  if (token !== routeToken) return;
  const hours = Array.from({ length: 24 }, (_, i) => i);
  const tzLabel = (m) => `UTC${m >= 0 ? '+' : '−'}${Math.floor(Math.abs(m) / 60)}${Math.abs(m) % 60 ? ':' + pad(Math.abs(m) % 60) : ''}`;

  document.getElementById('page').innerHTML = `${head}
    <div class="stack" id="nf">
      <div id="nwarn"></div>
      <div id="nstat"></div>
      <section class="card rv">
        <div class="card-h"><h3>推送内容</h3><span class="sub">报告包含访问次数、独立访客、与上一周期对比、热门短链、来源与国家</span></div>
        <div class="card-b">
          <div class="kinds">
            ${[['daily', '日报', '每天发送昨天的数据'], ['weekly', '周报', '每周一发送上周的数据'], ['monthly', '月报', '每月 1 号发送上个月的数据']].map(([k, t, d]) => `
              <label class="kind"><input type="checkbox" name="r-${k}" ${st.reports[k] ? 'checked' : ''}><span class="kb">${ic('check', 13)}</span><div><b>${t}</b><span>${d}</span></div></label>`).join('')}
          </div>
          <div class="when">
            <label>发送时间</label><div class="combo" id="n-hour"></div>
            <span class="hint">时区 ${tzLabel(TZ)}（跟随当前浏览器）</span>
            <span class="sp" style="flex:1"></span>
            <span class="hint">预览报告：</span>
            ${['daily', 'weekly', 'monthly'].map((k, i) => `<a class="btn sm ghost" href="/api/notify/preview?kind=${k}" target="_blank" rel="noopener">${['日报', '周报', '月报'][i]}</a>`).join('')}
          </div>
        </div>
      </section>
      <section class="card rv" id="n-hc"></section>
      <section class="card rv" id="n-seo" hidden></section>
      <section class="card rv" id="n-use"></section>
      <div class="sec-row rv" id="n-chans"><h2 class="sec-t">推送渠道</h2><span class="hint">参数只需配置一次，之后用开关控制是否推送</span></div>
      <div class="grid2" id="chans"></div>
    </div>`;
  const page = document.getElementById('page');
  reveal(page);

  // 推送内容：改动后自动保存
  const hourLabel = (x) => `每天 ${pad(x)}:00`;
  let saveTimer;
  const autoSave = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => { try { await persist(); toast('已保存'); } catch (ex) { toast(ex.message, 'bad'); } }, 300);
  };
  const hourBox = dropdown(document.getElementById('n-hour'), {
    value: st.hour, aria: '发送时间', minWidth: 188, maxWidth: 220,
    groups: () => [['', hours]],
    button: (x) => `<span class="nm">${hourLabel(x)}</span>`,
    option: (x) => `<span class="ot">${hourLabel(x)}</span><span class="hint">${x < 6 ? '凌晨' : x < 12 ? '上午' : x < 13 ? '中午' : x < 18 ? '下午' : '晚上'}</span>`,
    onChange: autoSave,
  });
  page.querySelectorAll('.kind input').forEach((i) => (i.onchange = autoSave));

  // 保存整份配置（渠道参数取自 st，密钥为掩码时服务端保留原值）
  const persist = async (patch = {}) => {
    const body = {
      reports: Object.fromEntries(['daily', 'weekly', 'monthly'].map((k) => [k, page.querySelector(`[name=r-${k}]`).checked])),
      usage: { ...st.usage, ...(patch.usage || {}) },
      seo: { ...st.seo, ...(patch.seo || {}) },
      health: { ...st.health, ...(patch.health || {}) },
      hour: hourBox.value, tz: TZ,
      tg: { ...st.tg, ...(patch.tg || {}) },
      email: { ...st.email, ...(patch.email || {}) },
    };
    st = await api('/notify', { method: 'PUT', body });
    renderChannels();
    return st;
  };

  const ready = (k) => k === 'tg' ? !!(st.tg.token && st.tg.chat)
    : !!(st.email.from && st.email.to && (st.email.provider === 'cloudflare' ? st.cloudflareEmail : st.email.key));
  const maskMail = (v) => v.split(/[\s,，;；]+/).filter(Boolean).map((a) => a.replace(/^(.{3}).*(@.*)$/, '$1***$2')).join('、');

  // Cloudflare 用量预警
  const renderUse = () => {
    const box = document.getElementById('n-use'), u = st.usage;
    const anyCh = st.tg.enabled || st.email.enabled;
    box.innerHTML = `<div class="card-h"><span class="chi brand chi-sm">${BRAND.cloudflare(16)}</span><h3>Cloudflare 用量预警</h3>
        <span class="sub">已用达到阈值，或按目前速度到期末会超出包含额度时推送；同一周期每种情况只提醒一次</span><span class="sp"></span>
        <label class="switch"><input type="checkbox" id="u-on" ${u.enabled ? 'checked' : ''} ${st.cfConfigured ? '' : 'disabled'} aria-label="开启用量预警"><span class="t"></span></label></div>
      <div class="card-b n-use-b">${!st.cfConfigured
        ? `<div class="hint">${ic('info', 14)} 需要先在 <a href="#/settings" data-goto-use>设置 → Cloudflare 用量</a> 填写账户 ID 和 API 令牌。</div>`
        : `<label>提醒阈值</label><div class="seg" id="u-th">${[70, 80, 90].map((t) => `<button type="button" data-t="${t}" class="${t === u.threshold ? 'on' : ''}">已用 ${t}%</button>`).join('')}</div>
          <span class="hint">每小时检查一次，推送到下方已开启的渠道${anyCh ? '' : '（目前没有开启的渠道）'}</span><span class="sp" style="flex:1"></span>
          <button type="button" class="btn sm ghost" id="u-test" ${anyCh ? '' : 'disabled'}>${ic('send', 14)}发送测试预警</button>`}</div>`;
    const go = box.querySelector('[data-goto-use]');
    if (go) go.onclick = (e) => { e.preventDefault(); goSettings('use'); };
    if (!st.cfConfigured) return;
    box.querySelector('#u-on').onchange = async (e) => {
      try { await persist({ usage: { enabled: e.target.checked } }); toast(e.target.checked ? '用量预警已开启' : '用量预警已关闭'); }
      catch (ex) { e.target.checked = !e.target.checked; toast(ex.message, 'bad'); }
    };
    const seg = box.querySelector('#u-th');
    segThumb(seg);
    seg.querySelectorAll('button').forEach((b) => (b.onclick = async () => {
      try { await persist({ usage: { threshold: Number(b.dataset.t) } }); toast('已保存'); } catch (ex) { toast(ex.message, 'bad'); }
    }));
    box.querySelector('#u-test').onclick = async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      try {
        for (const ch of ['tg', 'email']) if (st[ch].enabled) await api('/notify/test', { method: 'POST', body: { channel: ch, kind: 'usage' } });
        toast('测试预警已发送');
      } catch (ex) { toast(ex.message, 'bad'); } finally { btn.disabled = false; }
    };
  };

  // 每周 SEO 变化（连接了 Google 才显示）
  const renderSeo = () => {
    const box = document.getElementById('n-seo'), g = st.seo;
    box.hidden = !st.googleConnected;
    if (!st.googleConnected) return;
    const anyCh = st.tg.enabled || st.email.enabled;
    box.innerHTML = `<div class="card-h"><span class="chi brand chi-sm">${BRAND.gsc(16)}</span><h3>每周 SEO 变化</h3>
        <span class="sub">每周一推送：点击涨跌最多的站点、跌出前 10 / 接近前 10 的搜索词</span><span class="sp"></span>
        <label class="switch"><input type="checkbox" id="s-on" ${g.enabled ? 'checked' : ''} aria-label="开启每周 SEO 变化"><span class="t"></span></label></div>
      <div class="card-b n-use-b"><label>范围</label><div class="combo" id="s-tag"></div>
        <span class="hint">在“发送时间”推送；Search Console 数据延迟约 3 天，搜索对比用 3–9 天前的一周${anyCh ? '' : '（目前没有开启的渠道）'}</span><span class="sp" style="flex:1"></span>
        <a class="btn sm ghost" href="/api/notify/preview?kind=seo" target="_blank" rel="noopener">${ic('ext', 14)}预览</a>
        <button type="button" class="btn sm ghost" id="s-test" ${anyCh ? '' : 'disabled'}>${ic('send', 14)}发送测试</button></div>`;
    box.querySelector('#s-on').onchange = async (e) => {
      try { await persist({ seo: { enabled: e.target.checked } }); toast(e.target.checked ? '每周 SEO 变化已开启' : '每周 SEO 变化已关闭'); }
      catch (ex) { e.target.checked = !e.target.checked; toast(ex.message, 'bad'); }
    };
    const tags = st.tags || [];
    dropdown(box.querySelector('#s-tag'), {
      value: g.tag || '', aria: '范围', minWidth: 200,
      groups: () => [['', ['', ...tags.map((t) => t.tag)]]],
      button: (v) => `${ic('tag', 14)}<span class="nm">${v ? esc(v) : '全部站点'}</span>`,
      option: (v) => `<span class="ot">${v ? esc(v) : '全部站点'}${v ? `<small>${tags.find((t) => t.tag === v)?.n || 0} 个</small>` : ''}</span>`,
      onChange: async (v) => { try { await persist({ seo: { tag: v } }); toast('已保存'); } catch (ex) { toast(ex.message, 'bad'); } },
    });
    box.querySelector('#s-test').onclick = async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      try {
        for (const ch of ['tg', 'email']) if (st[ch].enabled) await api('/notify/test', { method: 'POST', body: { channel: ch, kind: 'seo' } });
        toast('测试已发送');
      } catch (ex) { toast(ex.message, 'bad'); } finally { btn.disabled = false; }
    };
  };

  const renderHc = () => {
    const box = document.getElementById('n-hc');
    box.innerHTML = `<div class="card-h"><span class="chi chi-sm hc-i">${ic('pulse', 16)}</span><h3>目标页异常提醒</h3>
        <span class="sub">每小时检查一批短链的目标地址，连续 2 次打不开或恢复时推送；对方拦截自动访问（403 / 人机验证）不算打不开</span><span class="sp"></span>
        <label class="switch"><input type="checkbox" id="h-on" ${st.health?.enabled !== false ? 'checked' : ''} aria-label="开启目标页异常提醒"><span class="t"></span></label></div>
      <div class="card-b n-use-b"><span class="hint">检查从 Cloudflare 节点发出，只对部分地区开放的地址可能误报。短链列表里会标出“目标异常”，详情页可以手动检查。</span></div>`;
    box.querySelector('#h-on').onchange = async (e) => {
      try { await persist({ health: { enabled: e.target.checked } }); toast(e.target.checked ? '目标页异常提醒已开启' : '目标页异常提醒已关闭'); }
      catch (ex) { e.target.checked = !e.target.checked; toast(ex.message, 'bad'); }
    };
  };

  const renderStatus = () => {
    renderUse();
    renderSeo();
    renderHc();
    // 没有开启任何渠道时，上面的开关都不会真的发送：在顶部提示
    const w = document.getElementById('nwarn');
    w.innerHTML = st.tg.enabled || st.email.enabled ? '' : `<div class="nstat warn">${ic('alert', 15)}<span>还没有开启推送渠道，下面的报告和提醒都不会发送。</span>
      <span class="sp" style="flex:1"></span><button type="button" class="btn sm" id="n-go">${ic('send', 14)}去配置渠道</button></div>`;
    const go = document.getElementById('n-go');
    if (go) go.onclick = () => document.getElementById('n-chans').scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('nstat').innerHTML = st.status ? `<div class="nstat ${st.status.ok ? 'ok' : 'bad'}">${ic(st.status.ok ? 'check' : 'alert', 15)}
      上次推送：${fmtTime(st.status.at)} · ${{ daily: '日报', weekly: '周报', monthly: '月报', usage: '用量预警', seo: '每周 SEO 变化', health: '目标页提醒' }[st.status.kind] || ''}${st.status.ok ? ' · 发送成功' : ` · 失败：${esc(st.status.error)}`}</div>` : '';
  };

  function renderChannels() {
    renderStatus();
    const card = (k) => {
      const on = k === 'tg' ? st.tg.enabled : st.email.enabled, ok = ready(k);
      const pill = !ok ? '<span class="pill off">未配置</span>' : on ? '<span class="pill on">已启用</span>' : '<span class="pill off">已停用</span>';
      const sum = k === 'tg'
        ? (ok ? `<span>Bot Token ${esc(st.tg.token)}</span><span>Chat ID <code>${esc(st.tg.chat)}</code></span>` : '<span>填写 Bot Token 和 Chat ID 后即可推送到个人或群组</span>')
        : (ok ? `<span>发送到 ${esc(maskMail(st.email.to))}</span><span>${st.email.provider === 'cloudflare' ? 'Cloudflare 邮件路由' : 'Resend'} · ${esc(st.email.from)}</span>`
          : '<span>通过 Resend 或 Cloudflare 邮件路由发送 HTML 报告</span>');
      return `<section class="card chcard ${on && ok ? 'is-on' : ''}">
        <div class="chtop"><span class="chi ${k === 'tg' ? 'tg' : 'mail'}">${ic(k === 'tg' ? 'send' : 'mail', 18)}</span>
          <div class="chname"><b>${k === 'tg' ? 'Telegram' : '邮件'}</b>${pill}</div>
          <label class="switch" title="${ok ? '启用 / 停用推送' : '先完成配置'}"><input type="checkbox" data-on="${k}" ${on && ok ? 'checked' : ''}><span class="t"></span></label></div>
        <div class="chsum">${sum}</div>
        <div class="chact">
          <button type="button" class="btn sm" data-cfg="${k}">${ic('gear', 14)}${ok ? '修改配置' : '去配置'}</button>
          <button type="button" class="btn sm ghost" data-test="${k}" ${ok ? '' : 'disabled'}>${ic('send', 14)}发送测试</button>
          <span class="hint" data-res="${k}"></span>
        </div>
      </section>`;
    };
    const box = document.getElementById('chans');
    box.innerHTML = card('tg') + card('email');
    box.querySelectorAll('[data-on]').forEach((i) => (i.onchange = async () => {
      const k = i.dataset.on;
      if (!ready(k)) { i.checked = false; return openChannel(k); }
      try {
        await persist({ [k]: { enabled: i.checked } });
        toast(i.checked ? '已启用推送' : '已停用推送');
      } catch (ex) { i.checked = !i.checked; toast(ex.message, 'bad'); }
    }));
    box.querySelectorAll('[data-cfg]').forEach((b) => (b.onclick = () => openChannel(b.dataset.cfg)));
    box.querySelectorAll('[data-test]').forEach((b) => (b.onclick = () => sendTest(b.dataset.test, box.querySelector(`[data-res="${b.dataset.test}"]`), b)));
  }

  const sendTest = async (k, res, btn) => {
    btn.disabled = true; res.className = 'hint'; res.textContent = '正在发送…';
    try {
      await api('/notify/test', { method: 'POST', body: { channel: k === 'tg' ? 'tg' : 'email', kind: 'daily' } });
      res.className = 'hint ok'; res.textContent = '已发送，请查收（标题带“测试”）';
    } catch (ex) { res.className = 'hint bad'; res.textContent = ex.message; }
    btn.disabled = false;
  };

  // 渠道配置面板
  function openChannel(k) {
    const isTg = k === 'tg';
    let provider = st.email.provider === 'cloudflare' ? 'cloudflare' : 'resend';
    const ov = document.createElement('div'); ov.className = 'ov';
    const dr = document.createElement('form'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
    dr.innerHTML = `
      <div class="dh"><span class="chi ${isTg ? 'tg' : 'mail'}" style="margin-right:10px">${ic(isTg ? 'send' : 'mail', 17)}</span><h2>${isTg ? 'Telegram 配置' : '邮件配置'}</h2>
        <button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
      <div class="db">${isTg ? `
        <div class="field"><label for="tg-token">Bot Token</label><input class="input mono" id="tg-token" placeholder="123456789:AAH…" value="${esc(st.tg.token)}" autocomplete="off" spellcheck="false">
          <div class="hint">已保存的 Token 只显示末 4 位，不修改就保持原值</div></div>
        <div class="field"><label for="tg-chat">Chat ID</label><input class="input mono" id="tg-chat" placeholder="例如 123456789 或 -100…" value="${esc(st.tg.chat)}" autocomplete="off"></div>
        <div class="tipbox">${ic('info', 16)}<div><b>如何获取？</b>
          1. 在 Telegram 里找 <b style="display:inline">@BotFather</b>，发送 <code>/newbot</code> 创建机器人，得到 Bot Token。<br>
          2. 给机器人发一条任意消息（推送到群组的话，把机器人拉进群并在群里发一条消息）。<br>
          3. 打开 <code>https://api.telegram.org/bot&lt;Token&gt;/getUpdates</code>，返回内容里 <code>"chat":{"id":…}</code> 的数字就是 Chat ID。</div></div>` : `
        <div class="field"><label>发送方式</label>
          <div class="seg" id="prov"><button type="button" data-p="resend">Resend</button><button type="button" data-p="cloudflare">Cloudflare 邮件路由</button></div>
          <div class="hint" data-for="resend" style="margin-top:8px">在 <a href="https://resend.com" target="_blank" rel="noopener" style="color:var(--accent-ink)">resend.com</a> 验证发件域名并创建 API Key，免费额度每月 3000 封。</div>
          <div class="hint" data-for="cloudflare" style="margin-top:8px">${st.cloudflareEmail
            ? '发件人需是已开通邮件路由的域名下的地址；收件人需在 Cloudflare 邮件路由中验证过。'
            : '<span class="warn">当前部署没有配置 <code>send_email</code> 绑定，暂时无法使用，见 README。</span>'}</div></div>
        <div class="field" data-for="resend"><label for="m-key">API Key</label><input class="input mono" id="m-key" placeholder="re_…" value="${esc(st.email.key)}" autocomplete="off" spellcheck="false">
          <div class="hint">已保存的 Key 只显示末 4 位，不修改就保持原值</div></div>
        <div class="field"><label for="m-from">发件人</label><input class="input" id="m-from" placeholder="cligc 报告 &lt;report@example.com&gt;" value="${esc(st.email.from)}"></div>
        <div class="field"><label for="m-to">收件人</label><input class="input" id="m-to" placeholder="you@example.com，多个用逗号分隔" value="${esc(st.email.to)}"></div>`}
        <label class="opt"><div class="tx"><b>启用推送</b><span class="hint">关闭后保留配置，只是不再发送</span></div>
          <span class="switch"><input type="checkbox" id="ch-on" ${(isTg ? st.tg.enabled : st.email.enabled) || !ready(k) ? 'checked' : ''}><span class="t"></span></span></label>
        <div class="err" role="alert"></div>
      </div>
      <div class="df">
        <button type="button" class="btn" data-test2>${ic('send', 14)}保存并测试</button>
        <span class="sp"></span>
        <button type="button" class="btn" data-close>取消</button>
        <button class="btn primary">保存</button>
      </div>`;
    const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.pop')) close(); };
    document.addEventListener('keydown', onKey);
    ov.onclick = close;
    dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
    document.body.append(ov, dr);
    if (!isTg) {
      const prov = dr.querySelector('#prov');
      const sync = () => {
        prov.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.p === provider));
        dr.querySelectorAll('[data-for]').forEach((el) => { el.hidden = el.dataset.for !== provider; });
        segThumb(prov);
      };
      prov.querySelectorAll('button').forEach((b) => (b.onclick = () => { provider = b.dataset.p; sync(); }));
      sync();
    }
    dr.querySelector('input').focus();
    const err = dr.querySelector('.err');
    const save = async () => {
      const enabled = dr.querySelector('#ch-on').checked;
      const patch = isTg
        ? { tg: { enabled, token: dr.querySelector('#tg-token').value, chat: dr.querySelector('#tg-chat').value } }
        : { email: { enabled, provider, key: dr.querySelector('#m-key').value, from: dr.querySelector('#m-from').value, to: dr.querySelector('#m-to').value } };
      await persist(patch);
    };
    dr.onsubmit = async (e) => {
      e.preventDefault();
      const b = dr.querySelector('.df .primary'); b.disabled = true;
      try { await save(); close(); toast('配置已保存'); } catch (ex) { err.textContent = ex.message; b.disabled = false; }
    };
    dr.querySelector('[data-test2]').onclick = async () => {
      const b = dr.querySelector('[data-test2]'); b.disabled = true; err.textContent = '';
      try {
        await save();
        await api('/notify/test', { method: 'POST', body: { channel: isTg ? 'tg' : 'email', kind: 'daily' } });
        close(); toast('配置已保存，测试报告已发送');
      } catch (ex) { err.textContent = ex.message; b.disabled = false; }
    };
  }

  renderChannels();
}

// ---------------------------------------------------------------- router
let routeToken = 0, lastLinkId = null;
// 浏览器标签页标题
const setTitle = (name) => { document.title = name ? `${name} · cligc` : 'cligc 短链'; };

async function route() {
  const token = ++routeToken;
  const h0 = location.hash || '#/';
  const gs0 = h0.match(/^#\/site\/([^?]+)/);
  setTitle(h0.startsWith('#/link/') ? '短链' : gs0 ? decodeURIComponent(gs0[1]) : h0.startsWith('#/notify') ? '统计通知' : h0.startsWith('#/sites') ? '站点'
    : h0.startsWith('#/settings') ? '设置' : h0.startsWith('#/links') ? '短链' : '概览');
  clearInterval(liveTimer);
  document.querySelectorAll('.pop').forEach((p) => p.remove());
  const h = location.hash || '#/';
  try {
    const m = h.match(/^#\/link\/(\d+)/);
    if (m) {
      if (lastLinkId !== m[1]) { clickState.page = 1; lastLinkId = m[1]; }
      return await renderLink(token, m[1]);
    }
    lastLinkId = null;
    if (h.startsWith('#/notify')) return await renderNotify(token);
    const gs = h.match(/^#\/site\/([^?]+)/);
    if (gs) return await renderSite(token, decodeURIComponent(gs[1]));
    if (h.startsWith('#/sites')) return await renderSites(token);
    if (h.startsWith('#/settings')) return await renderSettings(token);
    if (h.startsWith('#/links')) {
      const openNew = h.includes('?new');
      if (openNew) history.replaceState(null, '', '#/links');
      return await renderLinks(token, { openNew });
    }
    return await renderHome(token);
  } catch (err) {
    if (err.message === 'unauthorized') return;
    // 短链 / 站点不存在（被删除、链接写错）：显示空状态而不是一直停在加载中
    if (token === routeToken && /not found|不存在/.test(err.message) && /^#\/(link|site)\//.test(location.hash)) {
      const isLink = location.hash.startsWith('#/link/');
      const page = document.getElementById('page');
      if (page) page.innerHTML = `<a class="back" href="${isLink ? '#/links' : '#/sites'}">${ic('back', 14)}${isLink ? '全部短链' : '全部站点'}</a>
        <section class="card rv"><div class="empty" style="padding:64px 24px;flex-direction:column;gap:6px">${ic('search')}<b>${isLink ? '这个短链不存在' : '这个站点不存在'}</b>
          <span>可能已被删除，或链接地址有误</span><a class="btn sm" href="${isLink ? '#/links' : '#/sites'}" style="margin-top:8px">返回列表</a></div></section>`;
      setTitle(isLink ? '短链不存在' : '站点不存在');
      return;
    }
    console.error(err); toast('加载失败：' + err.message, 'bad');
  }
}

// 相对时间每分钟刷新一次
setInterval(() => document.querySelectorAll('time[data-ts]').forEach((t) => { t.textContent = ago(Number(t.dataset.ts)); }), 60000);
// 窗口尺寸变化时，分段控件滑块重新定位
addEventListener('resize', () => document.querySelectorAll('.seg').forEach(segThumb));

// 手机端：向下滚动隐藏顶栏，向上滚动出现
{
  let lastY = scrollY, ticking = false;
  addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const side = document.querySelector('.side');
      if (!side || innerWidth > 900) return;
      const y = Math.max(0, scrollY), dy = y - lastY;
      if (y < 64 || document.querySelector('.menu, .drawer, .dialog')) side.classList.remove('hide');
      else if (dy > 6) side.classList.add('hide');
      else if (dy < -6) side.classList.remove('hide');
      side.classList.toggle('stuck', y > 4);
      if (Math.abs(dy) > 6 || y < 64) lastY = y;
    });
  }, { passive: true });
}

// ---------------------------------------------------------------- ⌘K：搜索短链、站点、设置，快速跳转
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const KBAR_SETTINGS = [['pw', 'key', '修改密码'], ['mfa', 'shield', '两步验证'], ['dev', 'desk', '登录设备'], ['trk', 'search', '来源追踪'], ['goo', 'globe', 'Google 集成'],
  ['bing', 'search', 'Bing Webmaster'], ['bl', 'link', '外链与权重'], ['ai', 'ai', 'AI 分析链接'], ['use', 'chart', 'Cloudflare 用量'], ['sys', 'pulse', '系统状态'], ['ret', 'inbox', '数据保留']];
let kbarSites = null;
function openKbar() {
  if (document.querySelector('.kbar')) return;
  const ov = document.createElement('div'); ov.className = 'ov kbar-ov';
  const d = document.createElement('div'); d.className = 'kbar'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', '搜索和快速跳转');
  d.innerHTML = `<div class="kbar-q">${ic('search', 17)}<input id="kbar-in" placeholder="搜索短链、站点、设置，或输入命令" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="kbar-l"><kbd>Esc</kbd></div>
    <div class="kbar-l" id="kbar-l" role="listbox"></div>
    <div class="kbar-f"><span><kbd>↑</kbd><kbd>↓</kbd>选择</span><span><kbd>↵</kbd>打开</span><span><kbd>Esc</kbd>关闭</span></div>`;
  const close = () => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey, true); };
  d._dismiss = close;   // 换页 / 回到登录页时关掉，并把捕获阶段的按键监听一起去掉
  const input = d.querySelector('input'), list = d.querySelector('#kbar-l');
  let items = [], sel = 0, seq = 0, linkHits = [];
  const go = (it) => { close(); it.run(); };
  const pageCmds = [
    { g: '页面', icon: 'home', t: '概览', k: 'overview home gailan', run: () => (location.hash = '#/') },
    { g: '页面', icon: 'link', t: '短链', k: 'links duanlian', run: () => (location.hash = '#/links') },
    { g: '页面', icon: 'globe', t: '站点', k: 'sites seo google zhandian', run: () => (location.hash = '#/sites') },
    { g: '页面', icon: 'bell', t: '通知', k: 'notify telegram email tongzhi', run: () => (location.hash = '#/notify') },
    { g: '页面', icon: 'gear', t: '设置', k: 'settings shezhi', run: () => (location.hash = '#/settings') },
    { g: '操作', icon: 'plus', t: '新建短链', k: 'new create xinjian', run: () => (location.hash = '#/links?new') },
    { g: '操作', icon: 'globe', t: EN ? '中文界面' : 'English', sub: EN ? 'Switch to Chinese' : '切换到英文界面', k: 'language lang yuyan english chinese zhongwen', run: () => setLang(EN ? 'zh' : 'en') },
    { g: '操作', icon: 'out', t: '退出登录', k: 'logout signout tuichu', run: () => document.getElementById('logout')?.click() },
    ...KBAR_SETTINGS.map(([id, icon, t]) => ({ g: '设置', icon, t, k: id, run: () => { store.set('set:open', id); location.hash === '#/settings' ? route() : (location.hash = '#/settings'); } })),
  ];
  const match = (it, q) => !q || it.t.toLowerCase().includes(q) || (it.k || '').includes(q) || (it.sub || '').toLowerCase().includes(q);
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    const sites = (kbarSites || []).filter((x) => q && (x.host.includes(q) || (x.name || '').toLowerCase().includes(q))).slice(0, 6)
      .map((x) => ({ g: '站点', icon: 'globe', t: x.host, sub: x.name && x.name !== x.host ? x.name : '', run: () => (location.hash = '#/site/' + encodeURIComponent(x.host)) }));
    items = [...linkHits, ...sites, ...pageCmds.filter((it) => match(it, q))];
    sel = Math.min(sel, Math.max(0, items.length - 1));
    let lastG = '';
    list.innerHTML = items.length ? items.map((it, i) => {
      const head = it.g !== lastG ? `<div class="kbar-g">${it.g}</div>` : '';
      lastG = it.g;
      return `${head}<div class="kbar-i${i === sel ? ' on' : ''}" role="option" aria-selected="${i === sel}" data-i="${i}">${ic(it.icon, 15)}<span class="kbar-t">${hl(it.t, q)}</span>${it.sub ? `<span class="kbar-s">${hl(it.sub, q)}</span>` : ''}${it.badge || ''}</div>`;
    }).join('') : `<div class="kbar-e">没有找到“${esc(input.value.trim())}”</div>`;
    list.querySelectorAll('[data-i]').forEach((el) => {
      el.onmousemove = () => { if (sel !== Number(el.dataset.i)) { sel = Number(el.dataset.i); list.querySelectorAll('.kbar-i').forEach((x) => x.classList.toggle('on', x === el)); } };
      el.onclick = () => go(items[Number(el.dataset.i)]);
    });
    list.querySelector('.kbar-i.on')?.scrollIntoView({ block: 'nearest' });
  };
  // 短链：输入时按后缀、标题、地址搜索；没输入时显示最近访问的
  let timer;
  const searchLinks = () => {
    clearTimeout(timer);
    const my = ++seq, q = input.value.trim();
    timer = setTimeout(async () => {
      const r = await api(`/links?size=6&lite=1&${q ? 'q=' + encodeURIComponent(q) : 'sort=last_click'}`).catch(() => ({ items: [] }));
      if (my !== seq || !d.isConnected) return;
      linkHits = r.items.map((l) => ({ g: q ? '短链' : '最近访问的短链', icon: 'link', t: '/' + l.slug, sub: l.title || bareUrl(l.target_url),
        badge: l.enabled ? '' : '<span class="pill off">已停用</span>', run: () => (location.hash = '#/link/' + l.id) }));
      draw();
    }, q ? 140 : 0);
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length);
      draw();
    } else if (e.key === 'Enter' && items[sel]) { e.preventDefault(); go(items[sel]); }
  };
  input.oninput = () => { sel = 0; draw(); searchLinks(); };
  ov.onclick = close;
  document.addEventListener('keydown', onKey, true);
  document.body.append(ov, d);
  input.focus();
  draw(); searchLinks();
  if (!kbarSites) api('/google/hosts').then((r) => { kbarSites = r.items || []; if (d.isConnected) draw(); }).catch(() => { kbarSites = []; });
}
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k' && document.querySelector('.shell')) {
    e.preventDefault();
    document.querySelector('.kbar') ? document.querySelector('.kbar-ov').click() : openKbar();
  }
});

// 列表页的 "/" 快捷键聚焦搜索（开着抽屉、对话框时不跳到被遮住的搜索框）
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.getElementById('q') && !document.querySelector('.drawer, .dialog, .kbar')) {
    e.preventDefault(); document.getElementById('q').focus();
  }
});

// 换到别的页面（或回到登录页）时，把还开着的抽屉、对话框、菜单一起关掉，免得留在新页面上面
function closeOverlays() {
  document.querySelectorAll('.drawer, .dialog, .kbar, .menu, .pop').forEach((x) => (x._dismiss ? x._dismiss() : x.remove()));
  document.querySelectorAll('body > .ov').forEach((x) => x.remove());
}
let lastPath = location.hash.split('?')[0];
window.addEventListener('hashchange', () => {
  const p = location.hash.split('?')[0];
  if (p !== lastPath) closeOverlays();
  lastPath = p;
});
window.addEventListener('hashchange', route);
api('/me').then((d) => (d.mustChange ? renderSetPassword() : route())).catch((e) => {
  if (e.message === 'unauthorized') return;
  // 打不开（比如 D1 当天额度用完、断网）：把原因留在加载页上，并给一个重试按钮，不要一直转圈
  toast(e.message, 'bad');
  const b = $app.querySelector('.boot');
  if (b) b.innerHTML = `<div class="boot-t" style="max-width:min(420px,calc(100vw - 48px));text-align:center">${esc(e.message)}</div><button class="btn sm" onclick="location.reload()">重试</button>`;
});
</script>
