<style>
/* ================================================================ tokens */
:root {
  --app-max: 1440px;
  --side: #f4f5f7; --main: #ffffff;
  --panel: #ffffff; --panel-2: #f8f9fb; --sunken: #f2f4f7;
  /* --muted 用于大量 12–13px 的说明文字：在白底、侧栏灰底和 --sunken 上都要有 4.5:1 的对比度（WCAG AA） */
  --text: #0d1321; --text-2: #4a5263; --muted: #687082; --faint: #b8bec9;
  --line: #e9ebf0; --line-2: #f1f2f5;
  --accent: #2f6bff; --accent-2: #edf2ff; --accent-3: #d9e4ff; --accent-ink: #1d4fd8;
  --violet: #7c5cff; --teal: #12b5a5; --amber: #f2a93b; --rose: #e26d9c; --sky: #0ea5e9;
  --good: #0f9f5a; --good-bg: #e8f7ef; --bad: #e5484d; --bad-bg: #fdeeee; --warn: #a76b00; --warn-bg: #fff5df;
  --shadow-1: 0 1px 2px rgba(13,19,33,.04);
  --shadow-2: 0 1px 2px rgba(13,19,33,.04), 0 6px 20px -6px rgba(13,19,33,.08);
  --shadow-3: 0 24px 48px -12px rgba(13,19,33,.22);
  --r-lg: 16px;
  --sk-hi: rgba(255,255,255,.9);   /* 加载占位扫过的亮光 */
  --ease: cubic-bezier(.2,.7,.2,1); --ease-out: cubic-bezier(.16,1,.3,1);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --side: #0a0c10; --main: #111318;
    --panel: #16191f; --panel-2: #1a1e25; --sunken: #1d2129;
    /* --muted 略提亮：在 --sunken 上（分段按钮、未配置标签等）也够 4.5:1 */
    --text: #edeff3; --text-2: #b4bac6; --muted: #808898; --faint: #4c5361;
    --line: #242831; --line-2: #1e222a;
    --accent: #5f8fff; --accent-2: #18223a; --accent-3: #22325a; --accent-ink: #94b4ff;
    --violet: #9d85ff; --teal: #2fd0bf;
    --good: #3cc985; --good-bg: #122a1e; --bad: #ff6f74; --bad-bg: #331b1d; --warn: #e5ad48; --warn-bg: #2d2411;
    --shadow-1: 0 1px 2px rgba(0,0,0,.3); --shadow-2: 0 1px 2px rgba(0,0,0,.3); --shadow-3: 0 24px 48px -12px rgba(0,0,0,.6);
    --sk-hi: rgba(255,255,255,.06);
    color-scheme: dark;
  }
}

/* ================================================================ base */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* 首次加载：稍后才出现，网络快时不闪 */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; background: var(--main); animation: fade .3s ease both .25s; }
.boot-m svg { width: 44px; height: 44px; display: block; border-radius: 12px; animation: bootPulse 1.6s var(--ease-out) infinite; }
.boot-b { width: 120px; height: 3px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.boot-b i { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--accent); animation: bootBar 1.1s ease-in-out infinite; }
.boot-t { font-size: 12.5px; color: var(--muted); }
@keyframes fade { from { opacity: 0; } }
@keyframes bootPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 35%, transparent); } 50% { transform: scale(.94); box-shadow: 0 0 0 10px transparent; } }
@keyframes bootBar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
/* 页面内请求较慢时，顶部细进度条 */
.topbar { position: fixed; z-index: 60; top: 0; left: 0; right: 0; height: 2px; pointer-events: none; opacity: 0; transition: opacity .3s; overflow: hidden; }
.topbar::before { content: ""; position: absolute; inset: 0; width: 35%; background: linear-gradient(90deg, transparent, var(--accent), var(--violet)); animation: bootBar 1s ease-in-out infinite; }
.topbar.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .boot-m svg, .boot-b i, .topbar::before { animation-duration: 3s; } }
.sp { flex: 1; }
body { font: 14px/1.55 var(--sans); background: var(--side); color: var(--text);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
::selection { background: var(--accent-3); }
/* 细滚动条：卡片、抽屉、表格等内部滚动区域平时隐藏，鼠标移上去才出现；页面主滚动条始终显示 */
* { scrollbar-width: thin; scrollbar-color: transparent transparent; }
*:hover, html { scrollbar-color: color-mix(in srgb, var(--text) 18%, transparent) transparent; }
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 2px; }
:hover::-webkit-scrollbar-thumb, html::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 16%, transparent); }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text) 32%, transparent); }
::-webkit-scrollbar-corner { background: transparent; }
/* 触屏没有悬停，保持显示 */
@media (hover: none) { * { scrollbar-color: color-mix(in srgb, var(--text) 18%, transparent) transparent; } ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 16%, transparent); } }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.tnum { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.mark { flex: none; display: block; }
code { font-family: var(--mono); font-size: .92em; background: var(--sunken); padding: 1px 6px; border-radius: 5px; }

/* 入场：内容依次浮现 */
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(15,159,90,.45); } 100% { box-shadow: 0 0 0 8px rgba(15,159,90,0); } }
@keyframes flash { from { background: var(--accent-2); } to { background: transparent; } }
.rv { animation: rise .35s var(--ease-out) both; animation-delay: calc(min(var(--i, 0), 8) * 30ms); }   /* 只错开前 8 个，长页面也能很快显示完整 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}

/* ================================================================ shell：左侧灰色侧栏 + 右侧白色主区 */
:root { --side-w: 224px; --cp: 18px; }   /* --cp：卡片左右内边距（与指标卡片一致） */
.shell { display: grid; grid-template-columns: max(var(--side-w), calc((100% - var(--app-max)) / 2 + var(--side-w))) minmax(0, 1fr); min-height: 100vh; }
/* 兜底：贴右边的按钮，平时隐藏（opacity: 0）的提示气泡也会伸出页面、撑出整页横向滚动条。
   clip 不会变成滚动容器，侧栏等 sticky 照常；裁在 .shell（视口两侧）而不是 .main，侧栏上方的气泡不受影响 */
.shell { overflow-x: clip; }
.side { position: sticky; z-index: 6; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 14px 20px calc(100% - var(--side-w) + 16px); }
.side-head { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.wordmark { font-weight: 720; font-size: 18px; letter-spacing: -.025em; }
.collapse { margin-left: auto; width: 28px; height: 28px; border: 0; background: none; color: var(--faint); cursor: pointer; border-radius: 8px; display: grid; place-items: center; transition: color .15s, background .15s; }
/* 悬停底色用文字色混出来：深色模式下自动变成浅色叠层，不再是看不见的深色 rgba */
.collapse:hover { color: var(--text); background: color-mix(in srgb, var(--text) 5%, transparent); }
.product { margin: 18px 8px 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.product b { display: block; font-size: 13px; font-weight: 600; }
.product span { color: var(--muted); font-size: 12px; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--faint); padding: 0 12px 8px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { position: relative; display: flex; align-items: center; gap: 11px; height: 42px; padding: 0 12px; border-radius: 10px; color: var(--text-2); font-size: 14px; font-weight: 500;
  transition: color .15s, background .15s; }
.nav a svg.i { width: 18px; height: 18px; stroke-width: 1.8; transition: transform .2s var(--ease); }
.nav a:hover { color: var(--text); background: color-mix(in srgb, var(--text) 5%, transparent); }
.nav a:hover svg.i { transform: translateX(1px); }
.nav a.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(13,19,33,.06), 0 6px 16px -8px rgba(13,19,33,.12); }
.nav a.on svg.i { color: var(--accent); }
.nav a.on::before { content: ''; position: absolute; right: 14px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.side .foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.side .acct { display: none; }
.nav .nav-s { display: none; }   /* 手机端顶部导航的搜索（宽屏侧栏有“搜索 ⌘K”） */
.menu { position: fixed; z-index: 60; min-width: 188px; padding: 6px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-3);
  animation: popin .18s var(--ease-out) both; transform-origin: top right; }
.menu-h { padding: 6px 10px 8px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-size: 14px; text-align: left; color: var(--text); }
.menu button:hover, .menu button:focus-visible { background: var(--sunken); outline: none; }
.menu button svg { color: var(--muted); }
.menu button.danger { color: var(--bad); }
.menu button.danger svg { color: var(--bad); }
.menu hr { border: 0; border-top: 1px solid var(--line-2); margin: 6px 4px; }
.side .foot .btn { justify-content: flex-start; height: 34px; padding: 0 12px; gap: 11px; font-size: 13.5px; }
.side .foot .btn.on { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(13,19,33,.06), 0 6px 16px -8px rgba(13,19,33,.12); }
.side .foot .btn.on svg.i { color: var(--accent); }
.side .foot .host { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; padding: 6px 2px 0 12px; border-top: 1px solid var(--line); margin-top: 4px; font-family: var(--mono); white-space: nowrap; }
.side .foot .host .hn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.side .foot .host .ver { flex: none; font-size: 11px; color: var(--faint); }
.side .foot .host .out { position: relative; flex: none; width: 28px; height: 28px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center;
  transition: color .15s, background .15s; }
.side .foot .host .out:hover, .side .foot .host .out:focus-visible { color: var(--bad); background: var(--bad-bg); }
[data-tip] { position: relative; }
.ftip { position: fixed; z-index: 80; max-width: min(380px, calc(100vw - 16px)); padding: 5px 9px; border-radius: 7px; background: var(--text); color: var(--panel);
  font: 500 12px/1.5 var(--sans); white-space: pre-line; overflow-wrap: anywhere; pointer-events: none; box-shadow: var(--shadow-3);
  opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .2s var(--ease-out); }
.ftip.on { opacity: 1; transform: none; }
[data-tip]::after { content: attr(data-tip); position: absolute; z-index: 30; left: 50%; bottom: calc(100% + 8px); transform: translate(-50%, 4px); padding: 5px 9px; border-radius: 7px;
  background: var(--text); color: var(--panel); font: 500 12px/1.4 var(--sans); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s, transform .2s var(--ease-out); box-shadow: var(--shadow-3); }
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
[data-tip-at="bottom"]::after { bottom: auto; top: calc(100% + 8px); transform: translate(-50%, -4px); }
[data-tip-at="right"]::after { left: calc(100% + 10px); bottom: auto; top: 50%; transform: translate(-4px, -50%); }
[data-tip-at="right"]:hover::after, [data-tip-at="right"]:focus-visible::after { transform: translate(0, -50%); }
[data-tip][aria-expanded="true"]::after, [data-tip]:active::after { opacity: 0; }
@media (hover: none) { [data-tip]::after { display: none; } }   /* 触屏用点按显示的浮动提示 */
/* 侧栏导航只在收起时提示 */
.shell:not(.mini) .side [data-tip-at="right"]::after { display: none; }
.side .foot .host i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
.main { min-width: 0; background: var(--main); min-height: 100vh; box-shadow: -1px 0 0 var(--line); }
.wrap { max-width: calc(var(--app-max) - var(--side-w)); padding: 36px 44px 96px; }

.shell.mini { grid-template-columns: max(72px, calc((100% - var(--app-max)) / 2 + 72px)) minmax(0, 1fr); }
.shell.mini .side { padding-left: calc(100% - 58px); padding-right: 14px; align-items: center; }
.shell.mini .wrap { max-width: calc(var(--app-max) - 72px); }
.shell.mini .wordmark, .shell.mini .product, .shell.mini .nav span, .shell.mini .foot .btn span, .shell.mini .nav-label { display: none; }
.shell.mini .side .foot .host { justify-content: center; padding: 6px 0 0; }
.shell.mini .side .foot .host i, .shell.mini .side .foot .host .hn, .shell.mini .side .foot .host .ver { display: none; }
.shell.mini .side-head { flex-direction: column; gap: 14px; padding: 0; }
.shell.mini .collapse { margin: 0; }
.shell.mini .collapse svg { transform: rotate(180deg); }
.shell.mini .nav { margin-top: 28px; }
.shell.mini .nav a, .shell.mini .foot .btn { width: 42px; padding: 0; justify-content: center; }
.shell.mini .nav a.on::before { right: 5px; top: 7px; }

@media (max-width: 900px) {
  .shell, .shell.mini { grid-template-columns: 1fr; }
  .side, .shell.mini .side { position: sticky; z-index: 5; height: auto; flex-direction: row; align-items: center; padding: 10px 14px; gap: 10px;
    background: color-mix(in srgb, var(--side) 88%, transparent); backdrop-filter: saturate(1.6) blur(12px); -webkit-backdrop-filter: saturate(1.6) blur(12px); border-bottom: 1px solid var(--line); }
  .side-head { padding: 0; }
  .collapse, .product, .side .foot .host, .nav-label { display: none !important; }
  .wordmark { font-size: 17px; }
  .nav, .shell.mini .nav { flex-direction: row; margin: 0 0 0 auto; gap: 2px; }
  .nav a, .shell.mini .nav a { height: 36px; padding: 0 12px; width: auto; gap: 7px; font-size: 14px; }
  .nav a svg.i { width: 17px; height: 17px; }
  /* 手机端导航只显示图标，当前页用蓝色 + 底部短横线表示 */
  .nav span { display: none !important; }
  .nav a, .shell.mini .nav a { width: 42px; padding: 0; justify-content: center; }
  .nav a.on, .shell.mini .nav a.on { background: none; box-shadow: none; color: var(--accent-ink); }
  .nav a.on::before { display: block; top: auto; bottom: 2px; right: auto; left: 50%; width: 16px; height: 2.5px; border-radius: 2px; transform: translateX(-50%); }
  .side, .shell.mini .side { transition: transform .35s var(--ease-out), box-shadow .3s; will-change: transform; }
  .side.hide { transform: translateY(-100%); }
  .side.stuck { box-shadow: 0 6px 20px -12px rgba(13,19,33,.18); }
  .side .foot { display: none; }
  .side .acct { display: grid; flex: none; width: 38px; height: 38px; border-radius: 11px; }
  .side .acct.on { color: var(--accent-ink); }   /* 通知、设置页在账号菜单里 */
  /* 顶部导航：搜索放在外面，通知收进账号菜单 */
  .nav .nav-n { display: none !important; }
  .nav .nav-s { display: flex !important; }
  .main { box-shadow: none; }
  .wrap, .shell.mini .wrap { max-width: none; padding: 22px 16px 64px; }
}
@media (max-width: 520px) {
  .wordmark { display: none; }
}

/* ================================================================ page header */
.ph { display: flex; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 28px; }
.ph .kicker { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.ph h1 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 680; letter-spacing: -.025em; }
.ph .sub { color: var(--muted); margin-top: 6px; }
.ph .sp { flex: 1; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; margin-bottom: 14px; transition: color .15s, transform .2s var(--ease); }
.back:hover { color: var(--text); transform: translateX(-2px); }

/* ================================================================ controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); cursor: pointer; white-space: nowrap; font-weight: 500; box-shadow: var(--shadow-1);
  transition: background .15s, border-color .15s, color .15s, transform .12s var(--ease), box-shadow .15s; }
.btn:hover { background: var(--panel-2); border-color: color-mix(in srgb, var(--line) 60%, var(--text) 12%); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 1px 2px rgba(47,107,255,.25), inset 0 1px 0 rgba(255,255,255,.18); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 90%, #000); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--text); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 32px; height: 32px; padding: 0; }
.btn.sm.icon { width: 30px; height: 30px; }
/* 和普通按钮放在同一行的图标按钮、下拉也是 36px */
.hero .acts .btn.icon, .ph-acts .btn.icon { width: 36px; height: 36px; }
.when .btn.sm { height: 36px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn .sw { display: grid; }
.btn .sw > * { grid-area: 1 / 1; display: grid; transition: opacity .15s, transform .25s var(--ease); }
.btn .sw .ok { opacity: 0; transform: scale(.5); color: var(--good); }
.btn.done .sw .ok { opacity: 1; transform: none; }
.btn.done .sw .no { opacity: 0; transform: scale(.5); }
.input, .textarea { width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  color: var(--text); font: inherit; outline: none; transition: border-color .15s, box-shadow .15s; }
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.textarea { height: auto; padding: 10px 12px; resize: vertical; }
.input:hover, .textarea:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--text) 12%); }
.input:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-2); }
.input.lg { height: 46px; font-size: 15px; }
.seg { position: relative; display: inline-flex; background: var(--sunken); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { position: relative; z-index: 1; border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500; transition: color .2s; }
.seg button:hover { color: var(--text); }
.seg button.on { color: var(--text); }
.seg .thumb { position: absolute; z-index: 0; top: 3px; bottom: 3px; border-radius: 7px; background: var(--panel); box-shadow: 0 1px 2px rgba(13,19,33,.08), 0 2px 6px -2px rgba(13,19,33,.08); transition: left .3s var(--ease-out), width .3s var(--ease-out); }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-2); font-size: 13px; user-select: none; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .t { width: 32px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .2s; flex: none; }
.switch .t::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease-out); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.switch input:checked + .t { background: var(--accent); }
.switch input:checked + .t::after { transform: translateX(12px); }
.switch input:focus-visible + .t { outline: 2px solid var(--accent); outline-offset: 2px; }
.toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
@media (max-width: 520px) {
  .ph .toolbar, .toolbar.rv, .toolbar.rv > .toolbar { width: 100%; gap: 10px; flex-direction: row-reverse; justify-content: space-between; flex-wrap: nowrap; }
  /* 时间范围 7 档：手机上单独占一行，放不下时可以左右滑动 */
  .toolbar:has(#range) { flex-wrap: wrap; flex-direction: row; justify-content: flex-end; }
  .toolbar #range { order: 2; width: 100%; overflow-x: auto; scrollbar-width: none; justify-content: space-between; }
  .toolbar #range::-webkit-scrollbar { display: none; }
  .toolbar .seg button { padding: 0 8px; }
  .toolbar #range button { flex: 1 0 auto; padding: 0 5px; font-size: 12.5px; }
  .toolbar .switch { gap: 6px; font-size: 12.5px; white-space: nowrap; }
}

/* ================================================================ cards & grids */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px var(--cp) 0; min-height: 0; flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.005em; }
.card-h .sub { color: var(--muted); font-size: 12.5px; }
.card-h .sp { flex: 1; }
.card-b { padding: 14px var(--cp) 18px; }
.stack { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.stack > *, .grid2 > *, .kpis > *, .g-main > *, .g3 > * { min-width: 0; }
.grid2 { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-main { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.85fr) minmax(300px, 1fr); }
.g3 { display: grid; gap: 20px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 1180px) { .g-main { grid-template-columns: 1fr; } .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 > :last-child { grid-column: 1 / -1; } }
@media (max-width: 960px) { .grid2, .g3 { grid-template-columns: 1fr; } .g3 > :last-child { grid-column: auto; } }
/* .grid2.fit：左边卡片的高度跟着右边——左边的表格不参与撑高这一排（height: 0，最少留 200px，约 5 行），卡片再拉伸到整排的高度，
   表格多出来的行在卡片里滚动。表格以外的内容（筛选按钮、说明、“暂无数据”）照常撑高：右边比它们还矮时整排变高，
   不会溢出卡片（以前整张左边卡片 height: 0，右边很矮时内容会压到下面的卡片上）。只在两列并排时生效（单列时各自按内容高度） */
@media (min-width: 961px) {
  .grid2.fit > .card:first-child { display: flex; flex-direction: column; }
  .grid2.fit > .card:first-child > .card-b { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .grid2.fit > .card:first-child > .card-b > .g-scr { flex: 1 1 0; height: 0; min-height: 200px; max-height: none; }
}

/* KPI */
.kpis { display: grid; gap: 20px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .kpis { gap: 12px; } }
/* 概览：紧凑数据条 */
#home { gap: 16px; }
#home .g-main, #home .g3 { gap: 16px; }
.kstrip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kc { padding: 14px 18px 13px; min-width: 0; }
.kc + .kc { border-left: 1px solid var(--line-2); }
.kc-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 22px; }
.kc-h .l { color: var(--text-2); font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.kc-h .l .dot { width: 7px; height: 7px; border-radius: 2px; }
.kc-h .delta { height: 20px; padding: 0 6px; font-size: 11.5px; }
.kc-v { display: flex; align-items: flex-end; gap: 6px; margin-top: 6px; min-height: 32px; }
.kc-v b { font-size: 26px; line-height: 1.1; font-weight: 680; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kc-v small { font-size: 12.5px; color: var(--muted); font-weight: 500; white-space: nowrap; padding-bottom: 3px; }
.kc-sp { flex: 1; min-width: 36px; height: 30px; margin-left: 8px; }
.kc-sp svg { display: block; width: 100%; height: 100%; }
/* 趋势图在下面的卡片：竖向排列，趋势图贴底，同一排卡片的趋势图对齐 */
.kc:has(> .kc-sb) { display: flex; flex-direction: column; }
.kc-sb { margin-top: auto; padding-top: 10px; height: 40px; flex: none; }
.kc-sb svg { display: block; width: 100%; height: 100%; }
.kc-d { margin-top: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kc-a { font-size: 12px; color: var(--accent-ink); font-weight: 550; white-space: nowrap; }
.kc-m { height: 4px; border-radius: 2px; background: var(--sunken); margin-top: 12px; overflow: hidden; }
.kc-m i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--violet)); transform-origin: left; animation: grow 1s var(--ease-out) both .2s; }
@media (max-width: 1280px) {
  .kstrip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kc:nth-child(3n+1) { border-left: 0; }
  .kc:nth-child(n+4) { border-top: 1px solid var(--line-2); }
}
@media (max-width: 640px) {
  .kstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kc + .kc { border-left: 0; }
  .kc:nth-child(even) { border-left: 1px solid var(--line-2); }
  .kc:nth-child(n+3) { border-top: 1px solid var(--line-2); }
  .kc { padding: 12px 14px; }
  .kc-v b { font-size: 22px; }
}
.chart.sm { height: 228px; }
#home .g-main.top > .card:first-child { display: flex; flex-direction: column; }
#home .g-main.top > .card:first-child .card-b { flex: 1; display: flex; flex-direction: column; }
#home .g-main.top .chart.sm { flex: none; }
/* 概览实时访问：高度跟左侧趋势图一致，列表在卡片内滚动 */
.home-feed { display: flex; flex-direction: column; }
.home-feed .feed { flex: 1; min-height: 0; max-height: 360px; overflow: auto; padding-bottom: 10px; scrollbar-width: thin;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
@media (min-width: 1181px) {
  #home .g-main.top { align-items: stretch; }
  .home-feed { height: 0; min-height: 100%; }
  .home-feed .feed { max-height: none; }
}
/* 列表会滚动，标签提示改到左侧显示，避免被上下边缘裁掉 */
.home-feed .fi-r .kt[data-tip]::after { left: auto; right: calc(100% + 8px); bottom: auto; top: 50%; transform: translate(4px, -50%); }
.home-feed .fi-r .kt[data-tip]:hover::after, .home-feed .fi-r .kt[data-tip]:focus-visible::after { transform: translate(0, -50%); }
.delta { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 7px; border-radius: 999px; font-weight: 600; font-size: 12px; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta svg { width: 12px; height: 12px; stroke-width: 2.4; }
.delta.up { color: var(--good); background: var(--good-bg); }
.delta.down { color: var(--bad); background: var(--bad-bg); }

/* ================================================================ chart */
.chart { position: relative; height: 288px; color: var(--accent); }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .gl { stroke: var(--line-2); }
.chart .gl.base { stroke: var(--line); }
.chart .ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart path.ln { transition: stroke-dashoffset 1.2s var(--ease-out); }
.chart path.ar { animation: fade 1s var(--ease) both .25s; }
.chart .tip { position: absolute; z-index: 2; pointer-events: none; background: var(--text); color: var(--panel); border-radius: 10px; padding: 8px 12px; min-width: 140px;
  font-size: 12px; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .12s, left .08s linear, top .08s linear; box-shadow: var(--shadow-3); }
.chart .tip .t { opacity: .65; margin-bottom: 4px; }
.chart .tip .r { display: flex; align-items: center; gap: 8px; line-height: 1.8; }
.chart .tip .r i { width: 8px; height: 8px; border-radius: 2px; }
.chart .tip .r b { margin-left: auto; padding-left: 16px; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 2px; flex-wrap: wrap; }
.legend button { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--text-2); font-size: 12.5px; transition: background .15s, opacity .2s; }
.legend button:hover { background: var(--sunken); }
.legend button i { width: 10px; height: 10px; border-radius: 3px; }
.legend button i.dash { height: 0; width: 14px; border-top: 2px dashed var(--faint); border-radius: 0; }
.legend button.off { opacity: .4; }

/* ================================================================ ranked lists */
.tabs { display: flex; gap: 2px; background: var(--sunken); padding: 3px; border-radius: 9px; }
.tabs button { border: 0; background: none; height: 26px; padding: 0 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 500; transition: color .15s, background .15s; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--text); background: var(--panel); box-shadow: 0 1px 2px rgba(13,19,33,.08); }
.rank { display: flex; flex-direction: column; gap: 6px; }
.rank .hd { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; padding: 0 10px 6px; }
.rank .r { position: relative; display: flex; align-items: center; gap: 10px; height: 30px; flex: none; padding: 0 10px; border-radius: 8px; font-size: 13px; }
.rank .r .bg { position: absolute; inset: 0; right: auto; background: var(--accent-2); border-radius: 8px; z-index: 0; transform-origin: left; animation: grow .8s var(--ease-out) both; animation-delay: calc(var(--j, 0) * 40ms + 100ms); }
.rank .r > *:not(.bg) { position: relative; z-index: 1; }
.rank .r .k { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .r .n { font-variant-numeric: tabular-nums; font-weight: 600; }
.rank .r .p { width: 40px; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.rank a.r { transition: background .15s; }
.rank a.r:hover { background: var(--sunken); }
.rank a.r:hover .k { color: var(--accent-ink); }
.empty { color: var(--muted); text-align: center; padding: 32px 12px; font-size: 13px; }
.empty svg.i { width: 28px; height: 28px; color: var(--faint); display: block; margin: 0 auto 10px; stroke-width: 1.5; }
.heat { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.heat div { aspect-ratio: 1 / 1.6; border-radius: 4px; background: var(--accent); }
.heat-ax { display: grid; grid-template-columns: repeat(4, 1fr); color: var(--muted); font-size: 11px; margin-top: 6px; }

/* 星期 × 小时热力图 */
.wk { display: grid; grid-template-columns: 22px repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center; }
.wk .dl { font-size: 11px; color: var(--muted); }
.wk .c { aspect-ratio: 1; border-radius: 3px; background: var(--sunken); position: relative; transition: transform .15s var(--ease); animation: fade .5s var(--ease) both; animation-delay: calc(var(--j, 0) * 3ms); }
.wk .c b { position: absolute; inset: 0; border-radius: inherit; background: var(--accent); }
.wk .c:hover { transform: scale(1.4); z-index: 1; }
.wk .hx { font-size: 10.5px; color: var(--muted); grid-column: span 6; padding-top: 4px; }
.scale { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.scale i { width: 11px; height: 11px; border-radius: 3px; background: var(--accent); }

/* 环形图 */
.donut-w { display: flex; align-items: center; gap: 20px; }
.donut { position: relative; width: 92px; height: 92px; flex: none; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut circle { fill: none; stroke-width: 14; transition: stroke-dasharray 1s var(--ease-out); }
.donut .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .ctr b { font-size: 20px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.donut .ctr span { font-size: 11.5px; color: var(--muted); }
.dlg { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.dlg .x { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.dlg .x i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.dlg .x span { flex: 1; }
.dlg .x b { font-variant-numeric: tabular-nums; font-weight: 600; }
.dlg .x em { font-style: normal; color: var(--muted); width: 38px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
.kt { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; margin-left: 6px; border-radius: 5px; font-size: 11px; font-weight: 600; vertical-align: 1px; cursor: help; white-space: nowrap; font-family: var(--sans); }
.kt.suspect { color: var(--warn); background: var(--warn-bg); }
.kt.proxy { color: var(--accent-ink); background: var(--accent-2); }
.kt[data-tip] { cursor: default; }
.kt[data-tip]::after { white-space: normal; width: max-content; max-width: 280px; text-align: left; line-height: 1.5; font-weight: 500; }
.tbl .kr { max-width: 240px; margin-top: 3px; font-size: 11.5px; color: var(--warn); }
.tbl .kr.bot { color: var(--muted); }
.tbl .kr.proxy { color: var(--accent-ink); }
.kmix-p { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12.5px; color: var(--text-2); }
.kmix-p svg { color: var(--accent); flex: none; }
.kmix-p b { font-variant-numeric: tabular-nums; }
/* 说明文字整句包在一个 span 里：flex 下散开的文字节点会各自成为一列，被挤成竖排 */
.kmix-p > span, .rp-pr > span { min-width: 0; }
.rp-pr span svg { vertical-align: -2px; }
.mtbl td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.mtbl .kt { margin-left: 0; }
.kt.bot { color: var(--muted); background: var(--sunken); }
.kmix .bmix-bar { margin-top: 4px; }
.kmix-l { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.kmix-l .x { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.kmix-l .x i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.kmix-l .x b { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 650; }
.kmix-l .x em { font-style: normal; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.kmix-r { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
.kc-px { display: inline-flex; align-items: center; height: 18px; margin-left: 8px; padding: 0 6px; border-radius: 5px; font-size: 11px; font-weight: 600;
  color: var(--accent-ink); background: var(--accent-2); white-space: nowrap; vertical-align: 2px; }
.bmix { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.bmix-h { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.bmix-h span:first-child { color: var(--text-2); font-weight: 600; }
.bmix-bar { display: flex; gap: 3px; height: 8px; }
.bmix-bar i { min-width: 4px; border-radius: 3px; transform-origin: left; animation: grow .8s var(--ease-out) both; animation-delay: calc(.15s + var(--j) * 60ms); }
/* 每格至少 100px，放不下 3 列就自动换成 2 列，避免“Chrome / Windows”被截成 Chr… */
.bmix-l { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px 12px; margin-top: 10px; }
.bmix-l .x { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; }
.bmix-l .x i { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.bmix-l .x span { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bmix-l .x em { font-style: normal; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }
@media (max-width: 400px) { .donut-w { flex-direction: column; align-items: stretch; } .donut { margin: 0 auto; } }

/* 实时访问流 */
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--good); font-weight: 600; }
.live::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 1.8s infinite; }
.feed { display: flex; flex-direction: column; padding: 8px 10px 24px; flex: 1; min-height: 0; max-height: 440px; overflow: auto; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(#000 calc(100% - 40px), transparent); mask-image: linear-gradient(#000 calc(100% - 40px), transparent); }
.feed::-webkit-scrollbar { display: none; }
.fi { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 10px; transition: background .15s; }
.fi:hover { background: var(--panel-2); }
.fi.new { animation: flash 2.4s var(--ease) both; }
.fi .av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--sunken); color: var(--text-2); transition: background .15s, color .15s; }
.fi:hover .av { background: var(--accent-2); color: var(--accent-ink); }
.fi .av svg { width: 17px; height: 17px; }
.fi .m { min-width: 0; }
.fi .m div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fi .m .a { font-size: 13px; }
.fi .m .a b { font-family: var(--mono); font-weight: 600; }
.fi .m .a span { color: var(--muted); }
.fi .m .s { color: var(--muted); font-size: 12px; margin-top: 1px; }
.fi-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.fi-r .kt { margin-left: 0; }
.fi-r .kt[data-tip]::after { left: auto; right: 0; transform: translate(0, 4px); }
.fi-r .kt[data-tip]:hover::after, .fi-r .kt[data-tip]:focus-visible::after { transform: none; }
.fi time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* 热门短链表 */
.tl { display: flex; flex-direction: column; padding-top: 8px; }
.tl .tr { display: grid; grid-template-columns: 24px minmax(0, 1fr) minmax(80px, 150px) 60px 52px 72px; gap: 16px; align-items: center; padding: 12px var(--cp); border-top: 1px solid var(--line-2); transition: background .15s; }
.tl .tr.th { border-top: 0; color: var(--muted); font-size: 12px; padding-top: 4px; padding-bottom: 10px; }
.tl a.tr:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.tl a.tr:hover { background: var(--panel-2); }
.tl a.tr:hover .sl { color: var(--accent-ink); }
.tl .rk { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11.5px; font-weight: 650; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; }
.tl .tr:nth-child(2) .rk { background: var(--accent); color: #fff; }

.input.mono { font-family: var(--mono); font-size: 13px; }
.hint.ok { color: var(--good); } .hint.bad { color: var(--bad); }
#prov { margin-top: 2px; }
.savebar { position: sticky; bottom: 16px; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 18px; border-radius: 14px;
  background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); box-shadow: var(--shadow-2); backdrop-filter: blur(10px); flex-wrap: wrap; }

.home-sites .card-h { padding-bottom: 6px; }

/* 窄屏上单独一行：行的左右内边距（悬停背景用）往外扩掉，文字和上面的数字左右对齐 */

.setup-ok { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--good); }

.nstat .sp { flex: 1; }
.nstat.warn { background: color-mix(in srgb, var(--amber) 13%, transparent); color: color-mix(in srgb, var(--amber) 70%, var(--text)); }

/* 渠道卡片 */
.sec-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 -6px; }
.sec-t { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }

/* 提示框 */

/* 可折叠卡片 */

.rules-bar { display: flex; align-items: center; gap: 12px; padding: 12px var(--cp) 14px; }

.drawer.panel { width: min(760px, calc(100vw - 16px)); }

}
#range button { white-space: nowrap; }
.hr-u { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hr-a { display: flex; align-items: center; min-width: 0; }

.hr-u a { min-width: 0; }

.fold-b .card-b { transition: padding .35s var(--ease-out); }

/* 可搜索的下拉框 */
.combo { position: relative; }
.combo-btn { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 136px; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  cursor: pointer; font-size: 13px; text-align: left; transition: border-color .15s, box-shadow .15s; }
.combo-btn:hover { border-color: color-mix(in srgb, var(--line) 60%, var(--text) 12%); }
.combo-btn[aria-expanded="true"] { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-2); }
.combo-btn .nm { flex: 1; min-width: 0; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.combo-btn code, .pop code { background: none; padding: 0; color: var(--muted); font-size: 11.5px; }
.combo-btn > svg { color: var(--muted); transition: transform .2s var(--ease); }

.f { width: 20px; text-align: center; font-size: 15px; line-height: 1; flex: none; }
.pop { position: fixed; z-index: 45; width: 240px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-3);

.pop .ps { position: relative; padding: 6px; border-bottom: 1px solid var(--line-2); }

  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .06); }

.pop .oi .f { width: 18px; font-size: 14px; }
.pop .oi > svg { width: 13px; height: 13px; }
.pop .oi .ot { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.pop .opts:focus { outline: none; }
.pop.plain .opts { padding-top: 4px; max-height: 280px; }
.pop .oi.act { background: var(--sunken); }
.pop .oi.sel { color: var(--accent-ink); font-weight: 600; min-height: 0; padding: 0 8px; border: 0; flex-wrap: nowrap; gap: 8px; }   /* 覆盖通用的 .sel 样式 */

.pop .oi mark { background: none; color: var(--accent-ink); font-weight: 650; }
.sim .res { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.sim .res b { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sim .res .tag { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex-shrink: 3; }

@media (max-width: 760px) {
  .rule { grid-template-columns: 38px minmax(0, 1fr) auto; padding: 14px 16px; } .rule .rh { display: none; }
  /* 下拉按钮本身至少 136px：容器不能比它窄，否则按钮会压住后面的“，用”和设备分段 */
  .sim { padding: 14px 16px; } .sim .combo { flex: 1 1 140px; min-width: 136px; } .sim .res { flex-basis: 100%; }
}

/* 国家选择器 */
.groups { display: flex; flex-wrap: wrap; gap: 6px; }
.groups button { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px dashed var(--line); background: none; cursor: pointer; font-size: 12.5px; color: var(--text-2); transition: border-color .15s, color .15s, background .15s; }
.groups button:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-2); }
.sel { display: flex; flex-wrap: wrap; gap: 6px; min-height: 42px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; align-items: center; }
.sel .ph0 { color: var(--faint); font-size: 13px; padding: 0 4px; }
.sel .chip { background: var(--accent-2); color: var(--accent-ink); animation: rise .25s var(--ease-out) both; padding-right: 4px; }
.sel .chip button { border: 0; background: none; padding: 0; width: 18px; height: 18px; border-radius: 5px; cursor: pointer; color: inherit; display: grid; place-items: center; opacity: .7; }
.sel .chip button:hover { opacity: 1; background: var(--accent-3); }
.sel .chip button svg { width: 12px; height: 12px; }
.psearch { position: relative; margin-top: 10px; }
.psearch svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
.psearch .input { padding-left: 34px; }
.plist { max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
.plist .grp { padding: 6px 12px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--muted); background: var(--panel-2); position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--line-2); }
.field .plist label { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin: 0; cursor: pointer; font-size: 13px; font-weight: 400; transition: background .12s; }
.field .plist label:hover { background: var(--panel-2); }
.field .plist label.dis { opacity: .45; cursor: not-allowed; }
.field .plist label .f { font-size: 16px; line-height: 1; width: 20px; text-align: center; flex: none; }
.field .plist label code { margin-left: auto; background: none; padding: 0; color: var(--muted); font-size: 11.5px; }
.field .plist label em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.plist input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.warn { color: var(--warn); }
.rb.has-pop { position: relative; cursor: default; outline: none; }
.rb-pop { position: absolute; z-index: 30; top: calc(100% + 8px); left: 0; width: max-content; max-width: min(420px, calc(100vw - 48px)); padding: 6px; border-radius: 12px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-3); color: var(--text); font-weight: 400; white-space: normal;
  opacity: 0; visibility: hidden; transform: translateY(-4px); transition: opacity .15s, transform .2s var(--ease-out), visibility 0s .2s; pointer-events: none; }
.rb.has-pop:hover .rb-pop, .rb.has-pop:focus-visible .rb-pop { opacity: 1; visibility: visible; transform: none; transition-delay: .12s, .12s, 0s; }
.rp-r { padding: 7px 9px; border-radius: 8px; }
.rp-r + .rp-r { border-top: 1px dashed var(--line-2); border-radius: 0; }
.rp-c { font-size: 12.5px; font-weight: 550; color: var(--text); }
.rp-u { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.rp-u svg { flex: none; }
.rp-u span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rp-def .rp-c { color: var(--text-2); }
.rb { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--accent-2); color: var(--accent-ink); font-size: 11.5px; font-weight: 550; white-space: nowrap; flex: none; font-family: var(--sans); }
.rb.ab-rb { background: color-mix(in srgb, var(--violet) 12%, transparent); color: color-mix(in srgb, var(--violet) 80%, var(--text)); }
.rb svg { width: 12px; height: 12px; }
.rb[hidden] { display: none; }

/* ================================================================ overlay */
.ov { position: fixed; inset: 0; background: rgba(13,19,33,.32); backdrop-filter: blur(2px); z-index: 31; animation: fade .2s var(--ease) both; }
/* 深色模式下深蓝灰遮罩叠在深色页面上几乎不变暗，抽屉、对话框和页面分不开 */
@media (prefers-color-scheme: dark) { .ov { background: rgba(0,0,0,.5); } }
/* ⌘K */
.kbar-b { display: flex; align-items: center; gap: 11px; height: 42px; margin: 0 0 14px; padding: 0 10px 0 12px; border: 0; border-radius: 10px; background: none;
  color: var(--text-2); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s, color .15s; width: 100%; }
.kbar-b svg.i { width: 18px; height: 18px; stroke-width: 1.8; }
.kbar-b:hover { color: var(--text); background: color-mix(in srgb, var(--text) 5%, transparent); }
.kbar-b kbd { opacity: .7; transition: opacity .15s; }
.kbar-b:hover kbd { opacity: 1; }
.kbar-b span { flex: 1; text-align: left; }
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2);
  font: 600 11px/1 var(--sans); color: var(--muted); }
.shell.mini .kbar-b { width: 42px; height: 42px; padding: 0; justify-content: center; margin: 22px 0 -14px; }
.shell.mini .kbar-b span, .shell.mini .kbar-b kbd { display: none; }
.kbar-ov { z-index: 60; }
.kbar { position: fixed; z-index: 61; top: 14vh; left: 50%; width: min(620px, calc(100vw - 32px)); transform: translateX(-50%); background: var(--panel); border-radius: 16px;
  box-shadow: 0 0 0 1px var(--line), 0 30px 80px -20px rgba(13,19,33,.45); overflow: hidden; animation: kbar-in .18s var(--ease-out) both; }
@keyframes kbar-in { from { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(.985); } }
.kbar-q { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 56px; border-bottom: 1px solid var(--line-2); color: var(--muted); }
.kbar-q input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15.5px; color: var(--text); }

<script>

  get(k, d) { try { const v = localStorage.getItem('sl:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

// 开启后，页面上所有域名（文字、图表、提示）显示为 bl•••.com；只改显示，不改数据。刷新后保持。
const MASK = { on: store.get('mask', false) };
// 最后一段是 TLD；文件名（sitemap.xml、robots.txt 之类）不算域名
// 前面不能紧挨着 • . - 或字母数字：已经遮过的（bl•••.co.uk）不会被再遮一次
const MASK_RE = /(?<![•\w.-])((?:[a-z0-9-]+\.)*)([a-z0-9][a-z0-9-]*)\.((?!(?:xml|txt|html?|js|mjs|ts|css|json|toml|ya?ml|lock|log|sql|sh|rss|aspx?|png|jpe?g|gif|svg|webp|ico|gz|php|md|csv|pdf|zip)\b)[a-z]{2,24})(?![•\w-])/gi;

  return t.replace(MASK_RE, (m, sub, name, tld) => {
    if (SLD.has(name.toLowerCase()) && sub) {
      const parts = sub.slice(0, -1).split('.'), main = parts.pop();
      return `${parts.length ? parts.join('.') + '.' : ''}${main.slice(0, 2)}•••.${name}.${tld}`;

  data-tip="${MASK.on ? '已脱敏：域名只显示前两个字符，点击恢复' : '脱敏：隐藏域名，方便截图分享'}">${ic(MASK.on ? 'eyeoff' : 'eye', 17)}</button>`;

      ...opts,
      headers: { 'content-type': 'application/json', ...(opts.headers || {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: 'same-origin',
    });
  } finally { if (!quiet) busy(-1); }
  // 登录和两步验证本身返回 401 是“密码 / 动态码不对”，要把错误显示在当前步骤，不能踢回登录页
  if (res.status === 401 && path !== '/login' && path !== '/login/2fa') { renderLogin(); throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 403 && data.mustChange) { renderSetPassword(); throw new Error('unauthorized'); }
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { data, status: res.status });
  return data;
}

// kind：ok / warn / bad。停留时间按文字长度加长，出错和警告至少 5 秒，免得长的错误信息还没看完就消失
function toast(msg, kind = 'ok') {
  if (msg === 'unauthorized') return;   // 登录过期：已经回到登录页，不用再弹英文的内部标记
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'bad' ? ' bad' : kind === 'warn' ? ' warn' : '');
  el.setAttribute('role', kind === 'ok' ? 'status' : 'alert');
  el.innerHTML = `${ic(kind === 'ok' ? 'check' : 'alert', 15)}<span>${esc(msg)}</span>`;
  document.getElementById('toasts').appendChild(el);
  const ms = Math.min(9000, Math.max(kind === 'ok' ? 2200 : 5000, String(msg).length * 70));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 250); }, ms);
}

async function copy(text, label = '已复制', btn) {
  let ok = true;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
  }
  // 浏览器不让复制（比如 Safari 在网络请求之后自动复制）：别假装成功
  if (!ok) {
    if (/并复制$/.test(label)) toast(`${label.replace(/并复制$/, '')}，浏览器不允许自动复制，请点“复制”按钮`, 'warn');
    else manualCopy(text);
    return false;
  }
  if (btn) {
    const tip = btn.dataset.tip;
    btn.classList.add('done'); clearTimeout(btn._t);
    if (tip) { btn._tip = btn._tip || tip; btn.dataset.tip = '已复制'; }
    btn._t = setTimeout(() => { btn.classList.remove('done'); if (btn._tip) btn.dataset.tip = btn._tip; }, 1400);
  }
  toast(`${label}  ${text.length > 60 ? text.slice(0, 60) + '…' : text}`);
  return true;
}

// 浏览器不让写剪贴板时：把完整内容放进一个已选中的文本框，让用户自己按 ⌘C / 长按复制
function manualCopy(text) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'dialog');
  d.innerHTML = `<h3>请手动复制</h3><p>浏览器不允许自动复制，内容已经选中，按 ⌘C / Ctrl+C（手机上长按）复制。</p>
    <textarea class="textarea" readonly rows="${Math.min(10, Math.max(2, Math.ceil(text.length / 40)))}" style="width:100%;font-size:12.5px"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-no>关闭</button></div>`;
  const ta = d.querySelector('textarea'); ta.value = text;
  const done = () => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') done(); };
  d._dismiss = done; ov.onclick = done; d.querySelector('[data-no]').onclick = done;
  document.addEventListener('keydown', onKey);
  document.body.append(ov, d);
  ta.focus(); ta.select();
}

function confirmDialog({ title, text, ok = '确定', danger = false }) {
  return new Promise((resolve) => {
    const ov = document.createElement('div'); ov.className = 'ov';
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'alertdialog');
    d.innerHTML = `<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="row">
      <button class="btn" data-no>取消</button><button class="btn primary" ${danger ? 'style="background:var(--bad)"' : ''} data-ok>${esc(ok)}</button></div>`;
    const done = (v) => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    d._dismiss = () => done(false);
    const onKey = (e) => { if (e.key === 'Escape') done(false); };
    ov.onclick = () => done(false);
    d.querySelector('[data-no]').onclick = () => done(false);
    d.querySelector('[data-ok]').onclick = () => done(true);
    document.addEventListener('keydown', onKey);
    document.body.append(ov, d);
    // 危险操作默认聚焦“取消”：回车按久了自动连发，也不会直接确认删除
    d.querySelector(danger ? '[data-no]' : '[data-ok]').focus();
  });
}

// 弹层（抽屉、对话框、搜索面板）共用的焦点管理，不用每个弹层各写一遍：
// 打开时记住是从哪个按钮打开的，关掉后把焦点还回去（键盘和读屏用户不用从页面开头重新找）；
// 打开期间 Tab / Shift+Tab 只在最上面一层里循环，不会跑到被遮住的页面上。Esc 仍由各弹层自己处理
{
  const MODAL = '.drawer, .dialog, .kbar';
  const topModal = () => [...document.querySelectorAll(`body > :is(${MODAL})`)].pop() || null;
  // 最近获得焦点或被点到的元素（Safari 点按钮不会让按钮获得焦点，所以按下时也记一下）
  const recent = [];
  const note = (el) => {
    if (!el || el === document.body) return;
    const i = recent.indexOf(el);
    if (i >= 0) recent.splice(i, 1);
    recent.push(el);
    if (recent.length > 8) recent.shift();
  };
  document.addEventListener('focusin', (e) => note(e.target), true);
  document.addEventListener('pointerdown', (e) => note(e.target.closest?.('button, a[href], input, select, textarea, [tabindex]')), true);
  let hid = 0;
  new MutationObserver((muts) => {
    for (const m of muts) {
      for (const n of m.addedNodes) {
        if (n.nodeType !== 1 || !n.matches(MODAL)) continue;
        // 打开它之前的焦点：最近一个还在页面上、又不在这个弹层里的元素
        n._ret = [...recent].reverse().find((el) => el.isConnected && !n.contains(el)) || null;
        if (n.matches('[role=dialog], [role=alertdialog]') && !n.hasAttribute('aria-modal')) n.setAttribute('aria-modal', 'true');
        const h = !n.hasAttribute('aria-label') && !n.hasAttribute('aria-labelledby') && n.querySelector('h2, h3');
        if (h) { h.id = h.id || `mh${++hid}`; n.setAttribute('aria-labelledby', h.id); }
      }
      for (const n of m.removedNodes) {
        const ret = n.nodeType === 1 && n._ret;
        if (!ret || !ret.isConnected) continue;
        // 关闭时如果代码已经把焦点放到别处（或又打开了新的弹层），就不抢
        const a = document.activeElement, t = topModal();
        if ((!a || a === document.body || !a.isConnected) && (!t || t.contains(ret))) ret.focus({ preventScroll: true });
      }
    }
  }).observe(document.body, { childList: true });
  const TABBABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab' || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    const m = topModal();
    if (!m) return;
    const a = document.activeElement;
    // 挂在 body 上的下拉选项、浮层自己处理按键
    if (a && !m.contains(a) && a.closest('.menu, .pop')) return;
    // 看得见的可聚焦元素；同一组单选框只算选中的那个（和浏览器的 Tab 顺序一致）
    const list = [...m.querySelectorAll(TABBABLE)].filter((el) => el.getClientRects().length
      && !(el.type === 'radio' && !el.checked && el.name && m.querySelector(`input[type=radio][name="${CSS.escape(el.name)}"]:checked`)));
    if (!list.length) { e.preventDefault(); return; }
    const first = list[0], last = list[list.length - 1];
    if (!m.contains(a) || a === m || (e.shiftKey ? a === first : a === last)) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
  });
}

// Y 轴上限：画 5 条刻度（0、¼、½、¾、满），所以按“每格”取整，保证每个刻度都是整数
// （以前按上限取整，50 会出现 12.5 / 37.5，显示成 13 / 38）。m ≤ 4 时仍是 4
function niceMax(m) {
  const raw = Math.max(1, m / 4), p = 10 ** Math.floor(Math.log10(raw));
  const s = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find((s) => Number.isInteger(s * p) && s * p >= raw);
  return 4 * s * p;
}

// 平滑曲线（单调三次插值，不会冲出数据范围）
function smooth(pts) {
  if (pts.length < 3) return pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join('');
  const n = pts.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  let s = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < n - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], h = (x1 - x0) / 3;
    s += `C${(x0 + h).toFixed(1)},${(y0 + m[i] * h).toFixed(1)} ${(x1 - h).toFixed(1)},${(y1 - m[i + 1] * h).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return s;
}

/**

    const iw = W - L - R, ih = H - T - B;

    const y = (v) => T + ih - (v / max) * ih;

    const uid = Math.random().toString(36).slice(2, 8);

        <path class="ar" d="${lines[s.id]}L${x(data.length - 1)},${T + ih}L${x(0)},${T + ih}Z" fill="url(#g${uid}${s.id})"/>`).join('') +
      layer('dash').map((s) => `<path d="${lines[s.id]}" fill="none" stroke="var(--faint)" stroke-width="1.6" stroke-dasharray="4 4"/>`).join('') +

      ${[0, 1, 2, 3, 4].map((i) => `<text class="ax" x="${L - 10}" y="${y((max / 4) * i) + 4}" text-anchor="end">${num((max / 4) * i)}</text>`).join('')}
      ${data.map((d, i) => (i % step === 0 || i === data.length - 1) && !(i !== data.length - 1 && data.length - 1 - i < step / 2)

      <rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/>
    </svg><div class="tip"></div>`;
    if (animate) {
      el.querySelectorAll('path.ln').forEach((p) => {
        const len = p.getTotalLength();

    }

    const hit = svg.querySelector('.hit');
    const hide = () => { cur.setAttribute('visibility', 'hidden'); el.querySelectorAll('.dot').forEach((c) => c.setAttribute('visibility', 'hidden')); tip.style.opacity = 0; };
    const show = (clientX) => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(data.length - 1, Math.round(((clientX - r.left - L) / iw) * (data.length - 1))));

        c.setAttribute('cx', px); c.setAttribute('cy', py); c.setAttribute('visibility', 'visible');
      });
      tip.innerHTML = `<div class="t">${esc(d.t || d.k)}</div>` + vis.map((s) =>
        `<div class="r"><i style="background:${s.type === 'dash' ? 'var(--faint)' : s.color}"></i>${s.label}<b>${num(d[s.key])}</b></div>`).join('');
      tip.style.left = Math.max(90, Math.min(W - 90, px)) + 'px'; tip.style.top = Math.max(top, 76) + 'px'; tip.style.opacity = 1;
    };
    hit.onmousemove = (e) => show(e.clientX);
    hit.ontouchstart = hit.ontouchmove = (e) => show(e.touches[0].clientX);
    hit.onmouseleave = hit.ontouchend = hide;
  };
  const ro = new ResizeObserver(draw);
  ro.observe(el);
  if (legendEl) {
    legendEl.innerHTML = series.map((s) => `<button data-s="${s.id}" class="${hidden.has(s.id) ? 'off' : ''}" aria-pressed="${!hidden.has(s.id)}">
      <i class="${s.type === 'dash' ? 'dash' : ''}" style="${s.type === 'dash' ? '' : `background:${s.color}`}"></i>${s.label}</button>`).join('');
    legendEl.querySelectorAll('button').forEach((b) => (b.onclick = () => {
      const id = b.dataset.s;
      if (hidden.has(id)) hidden.delete(id);
      else { if (series.length - hidden.size <= 1) return; hidden.add(id); }
      store.set('hide:' + el.id, [...hidden]);
      b.classList.toggle('off', hidden.has(id)); b.setAttribute('aria-pressed', !hidden.has(id));
      animate = !REDUCED; draw();
    }));
  }
}

// KPI 卡片底部的小面积图
// prev：可选的上一周期数据，画成浅色虚线（与本期同一纵轴）
function kpiSpark(values, color, prev) {
  const W = 300, H = 44, n = values.length;
  if (n < 2) return '';
  const max = Math.max(1, ...values, ...(prev || []));
  const pt = (v, i, len) => [(i / (len - 1)) * W, H - 4 - (v / max) * (H - 10)];
  const line = smooth(values.map((v, i) => pt(v, i, n)));
  const pl = prev?.length > 1 && prev.some(Boolean) ? smooth(prev.map((v, i) => pt(v, i, prev.length))) : '';
  const id = 'k' + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".18"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${W},${H}L0,${H}Z" fill="url(#${id})" style="animation:fade 1s var(--ease) both .3s"/>
    ${pl ? `<path d="${pl}" fill="none" stroke="var(--faint)" stroke-width="1.3" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>` : ''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
}

// 按段取平均，把很长的序列压到 m 个点（表格里 110px 宽的小趋势图画 365 段曲线既看不出区别，又拖慢搜索）
const downsample = (a, m = 60) => (a.length <= m ? a : Array.from({ length: m }, (_, i) => {
  const s = Math.floor((i * a.length) / m), e = Math.floor(((i + 1) * a.length) / m);
  let t = 0;
  for (let j = s; j < e; j++) t += a[j];
  return t / (e - s);
}));

function sparkline(rows) {
  const map = new Map((rows || []).map((r) => [r.k, r.n]));
  const vals = [];
  for (let i = 13; i >= 0; i--) vals.push(map.get(ymd(new Date(Date.now() - i * 86400000))) || 0);
  const max = Math.max(1, ...vals);
  const W = 100, H = 28;
  const pts = vals.map((v, i) => [(i / 13) * (W - 4) + 2, H - 4 - (v / max) * (H - 8)]);
  const line = smooth(pts);
  const has = vals.some(Boolean);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    ${has ? `<path d="${line}L${W - 2},${H}L2,${H}Z" fill="currentColor" fill-opacity=".1"/>` : ''}
    <path d="${line}" fill="none" stroke="currentColor" stroke-opacity="${has ? 1 : .2}" stroke-width="1.6" stroke-linecap="round"/>
    ${has ? `<circle cx="${pts[13][0]}" cy="${pts[13][1]}" r="2.4" fill="currentColor"/>` : ''}</svg>`;
}

function rankList(items, { fmt = (k) => k || '(空)', head = ['名称', '访问'], href } = {}) {
  if (!items || !items.length) return `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`;
  const max = Math.max(...items.map((i) => i.n));
  const sum = items.reduce((a, b) => a + b.n, 0);
  return `<div class="rank"><div class="hd"><span>${head[0]}</span><span>${head[1]}</span></div>
    ${items.map((i, j) => {
      const tag = href ? 'a' : 'div';
      return `<${tag} class="r" ${href ? `href="${href(i)}"` : ''} title="${esc(fmt(i.k))}" style="--j:${j}">
        <div class="bg" style="width:${Math.max(2, (i.n / max) * 100)}%"></div>
        <span class="k">${esc(fmt(i.k))}</span><span class="n">${num(i.n)}</span><span class="p">${Math.round((i.n / sum) * 100)}%</span>
      </${tag}>`;
    }).join('')}</div>`;
}

// 设备环形图
// o.unit 中心的单位，o.name 图例名称；超过 5 项时前 4 项 + “其他”
function donut(items, o = {}) {
  const COLORS = ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--amber)', 'var(--faint)'];
  const unit = o.unit || '次访问', name = o.name || devName;
  const sum = items.reduce((a, b) => a + b.n, 0);
  if (items.length > 5) {
    const top = items.slice(0, 4);
    items = [...top, { k: '其他', n: sum - top.reduce((a, b) => a + b.n, 0), other: true }];
  }
  if (!sum) return `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`;
  const r = 54, C = 2 * Math.PI * r, gap = items.length > 1 ? 3 : 0;
  let off = 0;
  const segs = items.slice(0, 5).map((it, i) => {
    const len = Math.max(0, (it.n / sum) * C - gap);
    const seg = `<circle cx="68" cy="68" r="${r}" stroke="${COLORS[i]}" stroke-dasharray="${REDUCED ? len : 0} ${C}" data-len="${len}" data-c="${C}" stroke-dashoffset="${-off}"/>`;
    off += (it.n / sum) * C;
    return seg;
  }).join('');
  setTimeout(() => document.querySelectorAll('.donut circle[data-len]').forEach((c) => c.setAttribute('stroke-dasharray', `${c.dataset.len} ${C}`)), 80);
  return `<div class="donut-w"><div class="donut"><svg viewBox="0 0 136 136" aria-hidden="true"><circle cx="68" cy="68" r="${r}" stroke="var(--sunken)"/>${segs}</svg>
      <div class="ctr" data-tipf-always data-tipf="${num(sum)} ${unit}"><b data-count="${sum}" data-fmt="wan">0</b><span>${unit}</span></div></div>
    <div class="dlg">${items.slice(0, 5).map((it, i) => `<div class="x"${it.tip ? ` data-tipf-always data-tipf="${esc(it.tip)}"` : ''}><i style="background:${COLORS[i]}"></i><span>${esc(it.other ? '其他' : name(it.k))}</span><b>${num(it.n)}</b><em>${Math.round((it.n / sum) * 100)}%</em></div>`).join('')}</div></div>`;
}

// 浏览器 / 系统占比：分段条 + 图例（前 4 个，其余合并为“其他”）
function shareMix(label, items) {
  const COLORS = ['var(--accent)', 'var(--violet)', 'var(--teal)', 'var(--amber)', 'var(--faint)'];
  const sum = (items || []).reduce((a, b) => a + b.n, 0);
  if (!sum) return '';
  const top = items.slice(0, 4).map((i) => ({ k: i.k || '未知', n: i.n }));
  const rest = sum - top.reduce((a, b) => a + b.n, 0);
  if (rest) top.push({ k: '其他', n: rest });
  return `<div class="bmix"><div class="bmix-h"><span>${label}</span><span>${top.length > 1 ? `${esc(top[0].k)} 占 ${Math.round((top[0].n / sum) * 100)}%` : ''}</span></div>
    <div class="bmix-bar">${top.map((it, i) => `<i style="flex:${it.n};background:${COLORS[i]};--j:${i}" title="${esc(it.k)} · ${num(it.n)} 次"></i>`).join('')}</div>
    <div class="bmix-l">${top.map((it, i) => `<div class="x"><i style="background:${COLORS[i]}"></i><span>${esc(it.k)}</span><em>${Math.round((it.n / sum) * 100)}%</em></div>`).join('')}</div></div>`;
}

// 星期 × 小时热力图
function weekHeat(cells) {
  if (!cells.length) return `<div class="empty">${ic('inbox')}该时间段内暂无数据</div>`;
  const map = new Map(cells.map((c) => [`${c.d}-${c.h}`, c.n]));
  const max = Math.max(1, ...cells.map((c) => c.n));
  const peak = cells.reduce((a, b) => (b.n > a.n ? b : a));
  let j = 0;
  const rows = [1, 2, 3, 4, 5, 6, 0].map((d) => `<span class="dl">${WEEK[d].slice(1)}</span>` + Array.from({ length: 24 }, (_, h) => {
    const n = map.get(`${d}-${h}`) || 0;
    return `<div class="c" style="--j:${j++}" title="${WEEK[d]} ${h}:00–${h + 1}:00 · ${n} 次">${n ? `<b style="opacity:${(0.18 + (n / max) * 0.82).toFixed(2)}"></b>` : ''}</div>`;
  }).join('')).join('');
  return `<div class="wk">${rows}<span></span>${[0, 6, 12, 18].map((h) => `<span class="hx">${h} 时</span>`).join('')}</div>
    <div class="wk-f" style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px;flex-wrap:wrap">
      <span class="hint">高峰：${WEEK[peak.d]} ${peak.h}:00 – ${peak.h + 1}:00</span>
      <span class="scale">少<i style="opacity:.18"></i><i style="opacity:.45"></i><i style="opacity:.72"></i><i></i>多</span></div>`;
}

// 新密码表单：新密码 + 确认 + 强度提示；当前密码可预填（刚用默认密码登录时）
function passwordFields(current) {
  return `${current ? '' : `<div class="field"><label for="p-cur">当前密码</label><input class="input lg" type="password" id="p-cur" autocomplete="current-password" required></div>`}
    <div class="field"><label for="p-new">新密码</label><input class="input lg" type="password" id="p-new" autocomplete="new-password" minlength="8" required>
      <div class="pwm" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div class="hint" id="p-tip">至少 8 位，建议混合字母、数字和符号</div></div>
    <div class="field"><label for="p-rep">再次输入新密码</label><input class="input lg" type="password" id="p-rep" autocomplete="new-password" required></div>`;
}

function strength(pw) {
  if (pw.length < 8) return 0;
  let n = 1;
  if (pw.length >= 12) n++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) n++;
  if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) n++;
  return Math.min(4, n);
}

function bindPasswordForm(root, current, onDone) {
  const nw = root.querySelector('#p-new'), rp = root.querySelector('#p-rep'), tip = root.querySelector('#p-tip'), err = root.querySelector('.err');
  const meter = root.querySelector('.pwm');
  nw.oninput = () => {
    const n = strength(nw.value);
    meter.dataset.n = nw.value ? n : '';
    tip.textContent = !nw.value ? '至少 8 位，建议混合字母、数字和符号'
      : nw.value.length < 8 ? `还差 ${8 - nw.value.length} 位` : ['', '强度：弱', '强度：一般', '强度：好', '强度：很强'][n];
  };
  root.onsubmit = async (e) => {
    e.preventDefault();
    const cur = current || root.querySelector('#p-cur').value;
    if (nw.value.length < 8) { err.textContent = '新密码至少 8 位'; nw.focus(); return; }
    if (nw.value !== rp.value) { err.textContent = '两次输入的新密码不一致'; rp.select(); return; }
    const btn = root.querySelector('button.primary'); btn.disabled = true;
    try {
      await api('/password', { method: 'POST', body: { current: cur, next: nw.value } });
      toast('密码已更新，其他设备上的登录已失效');
      onDone();
    } catch (ex) { if (ex.message !== 'unauthorized') err.textContent = ex.message; btn.disabled = false; }
  };
}

// 6 位动态码输入框：只允许数字，输满 6 位自动提交
function codeInput(id = 'otp') {

}
function bindCodeInput(el, onFull) {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '').slice(0, 6);

// 侧栏“两步验证”：开启（验证密码 → 扫码 → 输入动态码确认）/ 关闭
async function openMfaDialog(onDone = () => {}) {
  // 读取状态失败时提示出来，不然点了按钮没有任何反应
  const st = await api('/2fa').catch((ex) => { toast(ex.message, 'bad'); return null; });
  if (!st) return;
  const ov = document.createElement('div'); ov.className = 'ov';
  const d = document.createElement('form'); d.className = 'dialog pw-dialog mfa-dialog'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
  const close = () => { ov.remove(); d.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  ov.onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.append(ov, d);
  const err = () => d.querySelector('.err');

  if (st.enabled) {
    d.innerHTML = `<h3>两步验证</h3>
      <div class="mfa-on">${ic('shield', 18)}<div><b>已开启</b><span>开启于 ${fmtTime(st.since)}。登录时需要密码和验证器 App 上的动态码。</span></div></div>
      <p style="margin-top:18px">如需关闭，请输入密码和当前动态码：</p>
      <div class="field"><label for="m-pw">密码</label><input class="input lg" type="password" id="m-pw" autocomplete="current-password" required></div>
      <div class="field"><label for="otp">动态码</label>${codeInput()}</div>
      <div class="err" style="margin:4px 0 12px" role="alert"></div>
      <div class="row"><button type="button" class="btn" data-no>取消</button><button class="btn primary" style="background:var(--bad)">关闭两步验证</button></div>`;
    d.querySelector('[data-no]').onclick = close;
    d.querySelector('#m-pw').focus();
    d.onsubmit = async (e) => {
      e.preventDefault();
      const btn = d.querySelector('.primary'); btn.disabled = true;
      try {
        await api('/2fa/disable', { method: 'POST', body: { password: d.querySelector('#m-pw').value, code: d.querySelector('#otp').value } });
        close(); toast('两步验证已关闭'); onDone();
      } catch (ex) { err().textContent = ex.message; btn.disabled = false; }
    };
    return;
  }

  // 第 1 步：验证密码
  d.innerHTML = `<h3>开启两步验证</h3>
    <p>开启后登录需要再输入手机验证器 App 上的 6 位动态码，即使密码泄露，别人也登不进后台。支持 Google Authenticator、Microsoft Authenticator、1Password 等。</p>
    <div class="field"><label for="m-pw">先输入当前密码</label><input class="input lg" type="password" id="m-pw" autocomplete="current-password" required></div>
    <div class="err" style="margin:4px 0 12px" role="alert"></div>
    <div class="row"><button type="button" class="btn" data-no>取消</button><button class="btn primary">下一步</button></div>`;
  d.querySelector('[data-no]').onclick = close;
  d.querySelector('#m-pw').focus();
  d.onsubmit = async (e) => {
    e.preventDefault();
    const btn = d.querySelector('.primary'); btn.disabled = true;
    let setup;
    try { setup = await api('/2fa/setup', { method: 'POST', body: { password: d.querySelector('#m-pw').value } }); }
    catch (ex) { err().textContent = ex.message; btn.disabled = false; return; }

    // 第 2 步：扫码并输入动态码确认
    d.innerHTML = `<h3>扫码绑定验证器</h3>
      <div class="mfa-qr">${setup.svg}</div>
      <p class="mfa-tip">用验证器 App 扫描二维码。无法扫码时，可手动输入密钥：</p>
      <div class="mfa-key"><code>${esc(setup.secret.match(/.{1,4}/g).join(' '))}</code>${copyBtn(setup.secret, 'btn sm ghost icon')}</div>
      <div class="field" style="margin-top:16px"><label for="otp">输入 App 显示的 6 位动态码</label>${codeInput()}</div>
      <div class="err" style="margin:4px 0 12px" role="alert"></div>
      <div class="row"><button type="button" class="btn" data-no>取消</button><button class="btn primary">确认开启</button></div>`;
    d.querySelector('[data-no]').onclick = close;
    const otp = d.querySelector('#otp');
    otp.focus();
    const confirm = async () => {
      const b = d.querySelector('.primary'); b.disabled = true;
      try {
        await api('/2fa/enable', { method: 'POST', body: { code: otp.value } });
        close(); toast('两步验证已开启，其他设备上的登录已失效'); onDone();
      } catch (ex) { err().textContent = ex.message; b.disabled = false; otp.value = ''; otp.focus(); }
    };
    bindCodeInput(otp, confirm);
    d.onsubmit = (ev) => { ev.preventDefault(); confirm(); };
  };
}

const TS_KEY = '__TURNSTILE_SITEKEY__';
const TS_ON = TS_KEY && !TS_KEY.startsWith('__');
let tsLoading = null;
function loadTurnstile() {
  if (window.turnstile) return Promise.resolve(window.turnstile);
  if (!tsLoading) {
    tsLoading = new Promise((resolve, reject) => {
      const sc = document.createElement('script');

      sc.onerror = () => { tsLoading = null; reject(new Error('人机验证加载失败，请检查网络后刷新页面')); };

    });
  }
  return tsLoading;
}

// ---------------------------------------------------------------- overview
const KIND = { human: ['真人', 'var(--good)'], bot: ['爬虫', 'var(--faint)'], suspect: ['可疑', 'var(--amber)'] };
const kindTag = (r, tip = true) => {
  // 真人只在经代理时打标签；爬虫 / 可疑总是打标签
  const k = r.kind === 'human' ? (r.proxy ? 'proxy' : '') : r.kind;
  if (!k) return '';
  return `<span class="kt ${k}" ${tip && r.reason ? `data-tip="${esc(r.reason)}" tabindex="0"` : ''}>${k === 'proxy' ? '代理' : KIND[k][0]}</span>`;
};
// 访客类型占比：分段条 + 图例
const proxyCount = (kinds) => (kinds || []).filter((x) => (x.k || 'human') === 'human' && x.p).reduce((a, b) => a + b.n, 0);
function kindMix(items) {
  const m = new Map();
  for (const x of items || []) m.set(x.k || 'human', (m.get(x.k || 'human') || 0) + x.n);
  const sum = [...m.values()].reduce((a, b) => a + b, 0);
  if (!sum) return '';
  const rows = ['human', 'suspect', 'bot'].map((k) => ({ k, n: m.get(k) || 0 }));
  return `<div class="kmix"><div class="bmix-bar">${rows.filter((r) => r.n).map((r, i) => `<i style="flex:${r.n};background:${KIND[r.k][1]};--j:${i}" title="${KIND[r.k][0]} · ${num(r.n)} 次"></i>`).join('')}</div>
    <div class="kmix-l">${rows.map((r) => `<div class="x"><i style="background:${KIND[r.k][1]}"></i><span>${KIND[r.k][0]}</span><b>${num(r.n)}</b><em>${Math.round((r.n / sum) * 100)}%</em></div>`).join('')}</div>
    ${proxyCount(items) ? `<div class="kmix-p">${ic('globe', 13)}<span>其中 <b>${num(proxyCount(items))}</b> 次真人访问经 VPN / 代理（占真人 ${Math.round((proxyCount(items) / Math.max(1, m.get('human') || 0)) * 100)}%）</span></div>` : ''}</div>`;
}

function feedItems(items, newIds = new Set()) {
  if (!items.length) return `<div class="empty">${ic('pulse')}还没有访问，分享短链后这里会实时出现</div>`;
  return items.map((r) => `<a class="fi ${newIds.has(r.id) ? 'new' : ''}" href="#/link/${r.link_id}">
      <span class="av">${ic((DEV[r.device] || [, 'desk'])[1])}</span>
      <div class="m"><div class="a"><b>/${esc(r.slug)}</b> <span>· ${esc(r.source)}</span></div>
        <div class="s">${esc([country(r.country), r.city].filter(Boolean).join(' · '))} · ${esc(r.os)} ${esc(r.browser)}</div></div>
      <div class="fi-r">${kindTag(r)}<time datetime="${new Date(r.ts).toISOString()}" data-ts="${r.ts}">${ago(r.ts)}</time></div></a>`).join('');
}


// 概览的短链切换：默认全部，可搜索
function linkPicker(root, items) {

    value: state.link, aria: '选择短链', search: '搜索短链或标题', empty: '没有匹配的短链', minWidth: 260, maxWidth: 320,
    groups: (q) => {

      return q ? [['', hit]] : [['', ['']], [`短链 · 按访问量`, hit]];

function routesCard(d) {
  const sum = d.routes.reduce((a, b) => a + b.n, 0);

  const max = Math.max(1, ...d.routes.map((r) => r.n));

}
const kindCount = (kinds, k) => (kinds || []).filter((x) => (x.k || 'human') === k).reduce((a, b) => a + b.n, 0);
const humanPct = (kinds) => {
  const sum = (kinds || []).reduce((a, b) => a + b.n, 0);
  return sum ? Math.round((kindCount(kinds, 'human') / sum) * 100) : '—';
};
// 真人占比小环形图：直连的真人 / 经代理的真人 / 可疑 / 爬虫，中间是真人占比
function kindDonut(kinds) {
  const sum = (kinds || []).reduce((a, b) => a + b.n, 0);
  if (!sum) return '<div class="kc-v"><b>—</b></div>';
  const px = proxyCount(kinds), hu = kindCount(kinds, 'human');
  const parts = [
    ['真人', hu - px, 'var(--good)', '直接访问的真人'], ['经代理', px, 'var(--accent)', '真人中经 VPN / 代理访问的'],
    ['可疑', kindCount(kinds, 'suspect'), 'var(--amber)', '机房 IP、缺少浏览器特征、高频访问等'], ['爬虫', kindCount(kinds, 'bot'), 'var(--faint)', '自报身份的爬虫、链接预览和脚本'],
  ].filter((x) => x[1] > 0);
  const r = 22, C = 2 * Math.PI * r;
  let off = 0;
  const segs = parts.map(([, n, c]) => { const len = (n / sum) * C; const el = `<circle cx="28" cy="28" r="${r}" stroke="${c}" stroke-dasharray="${Math.max(0, len - (parts.length > 1 ? 1.5 : 0))} ${C}" stroke-dashoffset="${-off}"/>`; off += len; return el; }).join('');
  return `<div class="chm kd"><div class="kd-c"><svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" stroke="var(--sunken)"/>${segs}</svg>
      <b data-tipf-always data-tipf="${esc(`真人 ${num(hu)} 次，占 ${pctText(hu / sum)}（含经代理 ${num(px)} 次）`)}">${humanPct(kinds)}<small>%</small></b></div>
    <div class="chm-l">${parts.map(([l, n, c, tip]) => `<span data-tipf-always data-tipf="${esc(`${tip} · ${num(n)} 次`)}"><i style="background:${c}"></i><em>${l}</em><b>${pctText(n / sum)}</b></span>`).join('')}</div></div>`;
}
