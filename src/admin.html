    <div class="field"><label for="pw">管理密码</label><input class="input lg" type="password" id="pw" autocomplete="current-password" required></div>
    ${TS_ON ? '<div class="ts" id="ts"><div class="ts-ph">' + ic('pulse', 14) + '正在加载人机验证…</div></div>' : ''}
    <div class="err" id="err" style="margin:8px 0" role="alert"></div>
    <button class="btn primary" style="width:100%;height:46px;font-size:15px">登录</button>
  </form></div>`;
  const pw = document.getElementById('pw'), err = document.getElementById('err');
  pw.focus();

  let token = '', widget = null;
  if (TS_ON) {
    loadTurnstile().then((ts) => {
      const box = document.getElementById('ts');
      if (!box) return;
      box.innerHTML = '';
      widget = ts.render(box, {
        sitekey: TS_KEY, theme: 'auto', language: 'zh-cn', size: 'flexible',
        callback: (t) => { token = t; err.textContent = ''; },
        'expired-callback': () => { token = ''; },
        'error-callback': () => { token = ''; err.textContent = '人机验证出错，请刷新页面重试'; },
      });
    }).catch((e) => { err.textContent = e.message; });
  }
  const resetTs = () => { token = ''; if (widget !== null && window.turnstile) window.turnstile.reset(widget); };

  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault();
    if (TS_ON && !token) { err.textContent = '请先完成下方的人机验证'; return; }
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = '登录中…';
    try {
      const r = await api('/login', { method: 'POST', body: { password: pw.value, turnstile: token } });
      if (r.need2fa) return renderCodeStep(r.ticket);
      r.mustChange ? renderSetPassword(pw.value) : route();
    }
    catch (ex) { err.textContent = ex.message; btn.disabled = false; btn.textContent = '登录'; pw.select(); resetTs(); }
  };
}

  // 实时访问：默认显示 5 条，可展开；每 30 秒刷新，新出现的记录高亮

  const more = document.getElementById('feed-more');

    feedAll = !feedAll;
    document.getElementById('feed').innerHTML = feedItems(latest.slice(0, feedAll ? latest.length : FEED_N));
    more.classList.toggle('open', feedAll);
    more.firstChild.textContent = feedAll ? '收起 ' : '查看更多 ';
  };
  let seen = new Set(d.recent.map((r) => r.id));
  clearInterval(liveTimer);
  liveTimer = setInterval(async () => {
    const feed = document.getElementById('feed');
    if (!feed || document.hidden) return;
    try {
      const { items } = await api('/recent?bots=' + (state.bots ? 1 : 0));
      const fresh = new Set(items.filter((r) => !seen.has(r.id)).map((r) => r.id));
      seen = new Set(items.map((r) => r.id));
      latest = items;
      feed.innerHTML = feedItems(items.slice(0, feedAll ? items.length : FEED_N), fresh);
    } catch {}
  }, 30000);
}

      </div>

}

function bindLinksChrome() {
  const q = document.getElementById('q');
  let t;
  q.oninput = () => { clearTimeout(t); t = setTimeout(() => { listState.q = q.value.trim(); listState.page = 1; renderLinks(routeToken); }, 250); };
  const sort = document.getElementById('sort');
  segThumb(sort);
  sort.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    listState.sort = b.dataset.s; store.set('sort', listState.sort); listState.page = 1;
    sort.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    segThumb(sort);
    renderLinks(routeToken);
  }));
  document.getElementById('add').onclick = () => openDrawer(null, () => renderLinks(routeToken));

  const form = document.getElementById('quick');
  const qSlug = form.querySelector('[name=slug]'), qTarget = form.querySelector('[name=target_url]'), qBtn = form.querySelector('button');
  // 后缀和默认地址至少填一个才能创建
  const syncQuick = () => {
    const empty = !qSlug.value.trim() && !qTarget.value.trim();
    qBtn.disabled = empty;
    qBtn.title = empty ? '请填写短链后缀或默认推广地址' : '';
  };
  qSlug.oninput = qTarget.oninput = syncQuick;
  syncQuick();
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!qSlug.value.trim() && !qTarget.value.trim()) { toast('请填写短链后缀或默认推广地址', 'bad'); qSlug.focus(); return; }
    const f = new FormData(form);
    let target = String(f.get('target_url')).trim();
    if (target && !/^https?:\/\//i.test(target)) target = 'https://' + target;
    const btn = qBtn; btn.disabled = true;
    try {
      const link = await api('/links', { method: 'POST', body: { target_url: target, slug: String(f.get('slug')).trim() } });
      form.reset(); syncQuick();
      await copy(shortUrl(link.slug), '短链已创建并复制');
      // 没填地址：直接进入详情页设置跳转规则
      if (!link.target_url) { location.hash = '#/link/' + link.id; return; }
      document.getElementById('qres').innerHTML = `<div class="result">${ic('check')}
        <span class="u">${esc(shortDisp(link.slug))}</span><span class="hint" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">→ ${esc(link.target_url)}</span>
        ${copyBtn(shortUrl(link.slug), 'btn sm', '复制')}
        <button class="btn sm" id="qedit">${ic('edit', 14)}补充标题</button></div>`;
      document.getElementById('qedit').onclick = () => openDrawer(link, () => renderLinks(routeToken));
      listState.flash = link.id; listState.q = ''; listState.page = 1; q.value = '';
      if (listState.sort !== 'created') {
        listState.sort = 'created';
        sort.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.s === 'created'));
        segThumb(sort);
      }
      renderLinks(routeToken);
    } catch (err) { toast(err.message, 'bad'); }
    finally { syncQuick(); }
  };
}

// 列表里“N 条地区规则”的悬停浮层：每条规则的国家和跳转地址
function rulePop(l) {
  const list = l.ruleList || [];
  if (!list.length) return '';
  const row = (r) => `<div class="rp-r"><div class="rp-c">${r.countries.slice(0, 4).map((c) => `${flag(c)} ${esc(cname(c))}`.trim()).join('、')}${r.countries.length > 4 ? ` 等 ${r.countries.length} 个` : ''}</div>
    <div class="rp-u">${ic('arrow', 12)}<span>${esc(r.url)}</span></div></div>`;
  return `<span class="rb-pop" role="tooltip">${list.map(row).join('')}
    <div class="rp-r rp-def"><div class="rp-c">其他地区</div><div class="rp-u">${ic('arrow', 12)}<span>${l.target_url ? esc(l.target_url) : '未设置默认地址'}</span></div></div></span>`;
}

function statusPill(l) {
  if (!l.enabled) return '<span class="pill off">已停用</span>';
  if (l.expires_at && l.expires_at < Date.now()) return '<span class="pill exp">已过期</span>';
  return '<span class="pill on">生效中</span>';
}

function toLocalInput(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function openDrawer(link, onDone) {
  const isNew = !link;
  link = link || { slug: '', target_url: '', title: '', note: '', enabled: 1, pass_query: 0, expires_at: null };
  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('form'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  dr.innerHTML = `
    <div class="dh"><h2>${isNew ? '新建短链' : '编辑短链'}</h2><button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">
      <div class="field"><label for="f-s">短链后缀</label>
        <div class="pre"><span>${esc(HOST)}/</span><input class="input" id="f-s" name="slug" placeholder="${isNew ? '留空自动生成' : ''}" value="${esc(link.slug)}"></div>
        <div class="hint">字母、数字、- 或 _${isNew ? '' : '。修改后旧短链会失效'}</div></div>
      <div class="field"><label for="f-t">默认推广地址 <span class="hint" style="font-weight:400">可选</span></label>
        <input class="input" id="f-t" name="target_url" placeholder="https://b.com/promo?id=123" value="${esc(link.target_url)}">
        <div class="hint">没有命中任何地区规则的访问会跳到这里；留空则这些访问显示“链接暂不可用”</div></div>
      <div class="field"><label for="f-ti">标题</label><input class="input" id="f-ti" name="title" placeholder="方便自己辨认，例如：B 站双十一推广" value="${esc(link.title)}"></div>
      <div class="field"><label for="f-n">备注</label><textarea class="textarea" id="f-n" name="note" rows="2">${esc(link.note)}</textarea></div>
      <div class="field"><label for="f-e">过期时间</label><input class="input" id="f-e" type="datetime-local" name="expires_at" value="${toLocalInput(link.expires_at)}">
        <div class="hint">留空则永久有效；过期后访问返回 410</div></div>
      <label class="opt"><div class="tx"><b>启用</b><span class="hint">关闭后访问短链返回 404</span></div>
        <span class="switch"><input type="checkbox" name="enabled" ${link.enabled ? 'checked' : ''}><span class="t"></span></span></label>
      <label class="opt"><div class="tx"><b>透传参数</b><span class="hint">把短链上的 ?xxx 参数带到目标地址（src 除外）</span></div>
        <span class="switch"><input type="checkbox" name="pass_query" ${link.pass_query ? 'checked' : ''}><span class="t"></span></span></label>
      <div class="err" role="alert"></div>
    </div>
    <div class="df">
      ${isNew ? '' : `<button type="button" class="btn danger" data-del>删除</button>`}
      <span class="sp"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary">${isNew ? '创建' : '保存'}</button>
    </div>`;
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dialog')) close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = close;
  dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
  document.body.append(ov, dr);
  dr.querySelector(isNew ? '[name=slug]' : '[name=target_url]').focus();

  // 新建时，后缀和默认推广地址至少填一个
  const dSlug = dr.querySelector('[name=slug]'), dTarget = dr.querySelector('[name=target_url]'), dBtn = dr.querySelector('.df .primary');
  const bothEmpty = () => !dSlug.value.trim() && !dTarget.value.trim();
  const syncDrawer = () => {
    if (!isNew) return;
    dBtn.disabled = bothEmpty();
    dBtn.title = dBtn.disabled ? '请填写短链后缀或默认推广地址' : '';
  };
  dSlug.addEventListener('input', syncDrawer);
  dTarget.addEventListener('input', syncDrawer);
  syncDrawer();

  const del = dr.querySelector('[data-del]');
  if (del) del.onclick = async () => {
    const ok = await confirmDialog({ title: `删除 /${link.slug}？`, text: '短链和它的全部访问记录都会被删除，无法恢复。', ok: '删除', danger: true });
    if (!ok) return;
    await api('/links/' + link.id, { method: 'DELETE' });
    close(); toast('已删除');
    if (location.hash.startsWith('#/link/')) location.hash = '#/links'; else onDone();
  };

  dr.onsubmit = async (e) => {
    e.preventDefault();
    const f = new FormData(dr);
    let target = String(f.get('target_url')).trim();
    if (target && !/^https?:\/\//i.test(target)) target = 'https://' + target;
    const body = {
      target_url: target, slug: String(f.get('slug')).trim(), title: f.get('title'), note: f.get('note'),
      enabled: f.get('enabled') === 'on', pass_query: f.get('pass_query') === 'on',
      expires_at: f.get('expires_at') ? new Date(f.get('expires_at')).getTime() : null,
    };
    if (isNew && bothEmpty()) { dr.querySelector('.err').textContent = '请填写短链后缀或默认推广地址'; dSlug.focus(); return; }
    if (!isNew && !body.slug) delete body.slug;
    const btn = dBtn; btn.disabled = true;
    try {
      const saved = await api(isNew ? '/links' : '/links/' + link.id, { method: isNew ? 'POST' : 'PUT', body });
      close();
      if (isNew) { listState.flash = saved.id; await copy(shortUrl(saved.slug), '短链已创建并复制'); } else toast('已保存');
      onDone(saved);
    } catch (err) { dr.querySelector('.err').textContent = err.message; btn.disabled = false; syncDrawer(); }
  };
}

  };

// 搜索关键字高亮
function hl(text, q) {
  const i = q ? text.toLowerCase().indexOf(q) : -1;
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + `<mark>${esc(text.slice(i, i + q.length))}</mark>` + esc(text.slice(i + q.length));
}

/**
 * 通用下拉框（替代原生 select）
 * o.value       当前值
 * o.groups(q)   返回 [[分组标题, 值数组], ...]；q 为搜索词（无搜索框时为空）
 * o.button(v)   按钮里显示的内容（HTML）
 * o.option(v,q) 选项内容（HTML）
 * o.search      搜索框占位文字；不传则不显示搜索框
 * o.onChange(v) 选中后回调
 * 键盘：↑ ↓ 移动，Enter 选择，Esc 关闭
 */
function dropdown(root, o) {
  let value = o.value;
  root.innerHTML = `<button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(o.aria || '')}"></button>`;
  const btn = root.firstElementChild;
  const paint = () => { btn.innerHTML = o.button(value) + ic('chev', 14); };
  paint();

  let pop = null, input = null, opts, items = [], act = 0;
  const place = () => {
    const r = btn.getBoundingClientRect(), h = pop.offsetHeight;
    const w = Math.min(o.maxWidth || 260, Math.max(r.width, o.minWidth || 220), innerWidth - 16);
    pop.style.width = w + 'px';
    pop.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
    const up = innerHeight - r.bottom < h + 12 && r.top > innerHeight - r.bottom;
    pop.classList.toggle('up', up);
    pop.style.top = (up ? r.top - h - 6 : r.bottom + 6) + 'px';
  };
  const mark = (scroll) => {
    const els = opts.querySelectorAll('.oi');
    els.forEach((el, i) => { el.classList.toggle('act', i === act); if (i === act) opts.setAttribute('aria-activedescendant', el.id); });
    if (scroll && els[act]) els[act].scrollIntoView({ block: 'nearest' });
  };
  const render = () => {
    const q = input ? input.value.trim().toLowerCase() : '';
    const groups = o.groups(q);
    items = groups.flatMap((g) => g[1]);
    act = q ? 0 : Math.max(0, items.indexOf(value));
    let n = 0;
    opts.innerHTML = items.length
      ? groups.map(([t, vs]) => (t ? `<div class="og">${t}</div>` : '') + vs.map((v) => {
        const i = n++;
        return `<div class="oi ${v === value ? 'sel' : ''}" id="oi-${i}" role="option" aria-selected="${v === value}" data-i="${i}">${o.option(v, q)}${v === value ? ic('check', 14) : ''}</div>`;
      }).join('')).join('')
      : `<div class="empty" style="padding:24px 12px">${o.empty || '没有匹配的选项'}</div>`;
    mark(true);
  };
  const choose = (v) => {
    close();
    btn.focus();
    if (v === value) return;
    value = v; paint(); o.onChange && o.onChange(v);
  };
  const onKey = (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (items.length) { act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; mark(true); }
    } else if (e.key === 'Enter' || (!input && e.key === ' ')) { e.preventDefault(); if (items.length) choose(items[act]); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); btn.focus(); }
    else if (e.key === 'Tab') close();
  };
  const outside = (e) => { if (pop && !pop.contains(e.target) && !root.contains(e.target)) close(); };
  const onScroll = (e) => { if (pop && !pop.contains(e.target)) place(); };
  function close() {
    if (!pop) return;
    pop.remove(); pop = null; input = null;
    btn.setAttribute('aria-expanded', 'false');
    document.removeEventListener('mousedown', outside, true);
    document.removeEventListener('scroll', onScroll, true);
    removeEventListener('resize', close);
  }
  const open = () => {
    document.querySelectorAll('.pop').forEach((x) => x.remove());
    pop = document.createElement('div');
    pop.className = 'pop' + (o.search ? '' : ' plain');
    pop.innerHTML = (o.search ? `<div class="ps">${ic('search', 15)}<input placeholder="${esc(o.search)}" autocomplete="off" aria-label="${esc(o.search)}"></div>` : '')
      + '<div class="opts" role="listbox" tabindex="-1"></div>';
    document.body.appendChild(pop);
    input = pop.querySelector('input'); opts = pop.querySelector('.opts');
    btn.setAttribute('aria-expanded', 'true');
    render(); place();
    (input || opts).focus();
    if (input) input.oninput = () => { render(); place(); };
    (input || opts).onkeydown = onKey;
    opts.onmousemove = (e) => {
      const el = e.target.closest('.oi');
      if (!el) return;
      const i = Number(el.dataset.i);
      if (i !== act) { act = i; mark(false); }
    };
    opts.onclick = (e) => { const el = e.target.closest('.oi'); if (el) choose(items[Number(el.dataset.i)]); };
    document.addEventListener('mousedown', outside, true);
    document.addEventListener('scroll', onScroll, true);
    addEventListener('resize', close);
  };
  btn.onclick = () => (pop ? close() : open());
  btn.onkeydown = (e) => { if ((e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') && !pop) { e.preventDefault(); open(); } };
  return { get value() { return value; } };
}

// 国家 / 地区下拉框（可搜索中文名或代码）
function countryCombo(root, value, onChange) {
  const rest = ISO.filter((c) => !COMMON.includes(c)).sort((a, b) => cname(a).localeCompare(cname(b), 'zh'));
  return dropdown(root, {
    value, onChange, aria: '选择国家或地区', search: '搜索国家或代码', empty: '没有匹配的国家 / 地区',
    groups: (q) => (q ? [['', ISO.filter((c) => c.toLowerCase().includes(q) || cname(c).toLowerCase().includes(q))]] : [['常用', COMMON], ['全部', rest]]),
    button: (c) => `<span class="f">${flag(c)}</span><span class="nm">${esc(cname(c))}</span><code>${c}</code>`,
    option: (c, q) => `<span class="f">${flag(c)}</span><span class="ot">${hl(cname(c), q)}</span><code>${hl(c, q)}</code>`,
  });
}

function rulesCard(link, s) {
  const hits = new Map((s.targets || []).map((x) => [x.k, x.n]));
  const total = Math.max(1, s.summary.total);
  const max = Math.max(1, ...(s.targets || []).map((x) => x.n));
  const hitCell = (id, fallbacks) => {
    const n = hits.get(id) || 0;
    return `<div class="rh"><b>${num(n)}</b>次 · ${Math.round((n / total) * 100)}%<div class="bar"><i style="width:${(n / max) * 100}%"></i></div>${
      fallbacks != null ? `<div class="fbn ${fallbacks ? 'has' : ''}" title="累计回退到默认地址的次数">已回退 ${num(fallbacks)} 次</div>` : ''}</div>`;
  };
  const rows = link.targets.map((t) => `
    <div class="rule">
      <span class="ri">${(t.countries.length === 1 && flag(t.countries[0])) || ic('globe', 18)}</span>
      <div style="min-width:0">
        <div class="rc">${countryChips(t.countries)}${t.note ? `<span class="rn" title="备注">${esc(t.note)}</span>` : ''}${t.fallback
          ? `<span class="tag-fb" title="访客打不开这个地址时，自动改去默认地址">${ic('undo', 12)}打不开时回退</span>` : ''}</div>
        <div class="ru">${ic('arrow', 13)}<a href="${esc(t.url)}" target="_blank" rel="noopener noreferrer" title="${esc(t.url)}">${esc(t.url)}</a></div>
      </div>
      ${hitCell(t.id, t.fallback ? t.fallbacks : null)}
      <div class="acts"><button class="btn ghost icon" data-tip="编辑规则" aria-label="编辑规则" data-rule="${t.id}">${ic('edit')}</button>
        <button class="btn ghost icon" data-tip="删除规则" aria-label="删除规则" data-rdel="${t.id}">${ic('trash')}</button></div>
    </div>`).join('');
  const def = `
    <div class="rule def">
      <span class="ri">${ic('globe', 18)}</span>
      <div style="min-width:0">
        <div class="rc"><span class="chip def">${link.targets.length ? '其他所有地区' : '所有地区'}</span><span class="tag-def">默认</span></div>
        <div class="ru">${ic('arrow', 13)}${link.target_url
          ? `<a href="${esc(link.target_url)}" target="_blank" rel="noopener noreferrer" title="${esc(link.target_url)}">${esc(link.target_url)}</a>`
          : `<span class="warn">未设置，${link.targets.length ? '未命中规则的' : '所有'}访问会显示“链接暂不可用”</span>`}</div>
      </div>
      ${hitCell(0)}
      <div class="acts"><button class="btn ${link.target_url ? 'ghost icon' : 'sm'}" ${link.target_url ? 'data-tip="设置默认地址" aria-label="设置默认地址"' : ''} data-rdef>${link.target_url ? ic('edit') : `${ic('plus', 14)}设置`}</button></div>
    </div>`;
  return `<section class="card rv" id="rules">
    <div class="card-h"><h3>跳转规则</h3><span class="sub">按访问者所在国家 / 地区跳到不同地址 · 命中数为最近 ${rangeLabel()}</span><span class="sp"></span>
      <button class="btn sm primary" id="radd">${ic('plus', 14)}添加地区规则</button></div>
    <div class="rules">${rows || `<div class="none">${ic('route', 18)}还没有地区规则，所有访问都会跳到默认地址。可以为中国、港澳台、北美等地区分别设置推广地址。</div>`}${def}</div>
    <div class="sim"><span>如果访客来自</span>
      <div class="combo" id="sim"></div>
      <span class="res" id="simres"></span></div>
  </section>`;
}

function bindRules(link) {
  const card = document.getElementById('rules');
  if (!card) return;
  const res = card.querySelector('#simres');
  const simulate = (c) => {
    const t = link.targets.find((x) => x.countries.includes(c));
    const url = t ? t.url : link.target_url;
    res.innerHTML = url
      ? `<span>会跳到</span><b title="${esc(url)}">${esc(url)}</b><span class="tag">${!t ? '（默认地址）' : t.fallback && link.target_url ? '（命中地区规则，打不开时回退到默认地址）' : '（命中地区规则）'}</span>`
      : '<span>会看到</span><b class="warn">“链接暂不可用”</b><span class="tag">（未设置默认地址）</span>';
  };
  const start = store.get('sim', 'CN');
  countryCombo(card.querySelector('#sim'), start, (c) => { store.set('sim', c); simulate(c); });
  simulate(start);
  card.querySelector('#radd').onclick = () => openRuleDrawer(link, null);
  card.querySelector('[data-rdef]').onclick = () => openDrawer(link, (saved) => saved ? route() : null);
  card.querySelectorAll('[data-rule]').forEach((b) => (b.onclick = () => openRuleDrawer(link, link.targets.find((t) => t.id == b.dataset.rule))));
  card.querySelectorAll('[data-rdel]').forEach((b) => (b.onclick = async () => {
    const t = link.targets.find((x) => x.id == b.dataset.rdel);
    const ok = await confirmDialog({ title: '删除这条规则？', text: `${ruleText(t)} 的访问之后会跳到默认地址。已有的访问记录会保留。`, ok: '删除', danger: true });
    if (!ok) return;
    await api(`/links/${link.id}/targets/${t.id}`, { method: 'DELETE' });
    toast('规则已删除');
    route();
  }));
}

function openRuleDrawer(link, rule) {
  const isNew = !rule;
  const selected = new Set(rule ? rule.countries : []);
  // 其他规则已占用的国家
  const taken = new Map();
  link.targets.forEach((t, i) => { if (!rule || t.id !== rule.id) t.countries.forEach((c) => taken.set(c, `规则 ${i + 1}`)); });

  const ov = document.createElement('div'); ov.className = 'ov';
  const dr = document.createElement('form'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
  dr.innerHTML = `
    <div class="dh"><h2>${isNew ? '添加地区规则' : '编辑地区规则'}</h2><button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
    <div class="db">
      <div class="field"><label>国家 / 地区</label>
        <div class="sel" id="sel"></div>
        <div class="groups" style="margin-top:10px">${GROUPS.map(([n, cs], i) => `<button type="button" data-g="${i}">+ ${n}</button>`).join('')}</div>
        <div class="psearch">${ic('search')}<input class="input" id="ps" placeholder="搜索国家、地区或代码，如 日本 / JP" autocomplete="off"></div>
        <div class="plist" id="pl"></div>
        <div class="hint" style="margin-top:6px">按访问者 IP 所在的国家 / 地区匹配。同一个国家只能属于一条规则。</div></div>
      <div class="field"><label for="r-u">跳转到</label>
        <input class="input" id="r-u" name="url" required placeholder="https://b.com/promo-cn" value="${esc(rule ? rule.url : '')}"></div>
      <div class="field"><label for="r-n">备注 <span class="hint" style="font-weight:400">可选</span></label>
        <input class="input" id="r-n" name="note" placeholder="例如：国内渠道落地页" value="${esc(rule ? rule.note : '')}"></div>
      <label class="opt"><div class="tx"><b>打不开时回退到默认地址</b>
        <span class="hint">跳转前先在访客的网络里检测这个地址能否打开，打不开就改去默认地址。能打开时只多约 0.2–1 秒，打不开时最多等 2.5 秒。仅支持 https 地址。</span>
        ${link.target_url ? '' : '<span class="hint warn" style="display:block;margin-top:4px">当前短链还没有默认地址，设置后这个开关才会生效。</span>'}</div>
        <span class="switch"><input type="checkbox" id="r-fb" ${rule ? (rule.fallback ? 'checked' : '') : 'checked'}><span class="t"></span></span></label>
      <div class="err" role="alert"></div>
    </div>
    <div class="df">
      <span class="hint" id="cnt"></span><span class="sp"></span>
      <button type="button" class="btn" data-close>取消</button>
      <button class="btn primary">${isNew ? '添加' : '保存'}</button>
    </div>`;
  const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.dialog')) close(); };
  document.addEventListener('keydown', onKey);
  ov.onclick = close;
  dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
  document.body.append(ov, dr);

  const sel = dr.querySelector('#sel'), pl = dr.querySelector('#pl'), ps = dr.querySelector('#ps'), cnt = dr.querySelector('#cnt');
  const renderSel = () => {
    sel.innerHTML = selected.size ? [...selected].map((c) => `<span class="chip">${`${flag(c)} ${esc(cname(c))}`.trim()}<button type="button" data-rm="${c}" aria-label="移除 ${esc(cname(c))}">${ic('x')}</button></span>`).join('')
      : '<span class="ph0">从下方选择，或点击快捷分组</span>';
    cnt.textContent = selected.size ? `已选 ${selected.size} 个国家 / 地区` : '';
    sel.querySelectorAll('[data-rm]').forEach((b) => (b.onclick = () => { selected.delete(b.dataset.rm); renderSel(); renderList(); }));
  };
  const row = (c) => {
    const t = taken.get(c);
    return `<label class="${t ? 'dis' : ''}"><input type="checkbox" value="${c}" ${selected.has(c) ? 'checked' : ''} ${t ? 'disabled' : ''}>
      <span class="f">${flag(c)}</span><span>${esc(cname(c))}</span>${t ? `<em>已在${t}</em>` : ''}<code>${c}</code></label>`;
  };
  const renderList = () => {
    const q = ps.value.trim().toLowerCase();
    if (q) {
      const hit = ISO.filter((c) => c.toLowerCase().includes(q) || cname(c).toLowerCase().includes(q));
      pl.innerHTML = hit.length ? hit.map(row).join('') : '<div class="empty" style="padding:20px">没有匹配的国家 / 地区</div>';
    } else {
      const rest = ISO.filter((c) => !COMMON.includes(c)).sort((a, b) => cname(a).localeCompare(cname(b), 'zh'));
      pl.innerHTML = `<div class="grp">常用</div>${COMMON.map(row).join('')}<div class="grp">全部</div>${rest.map(row).join('')}`;
    }
    pl.querySelectorAll('input').forEach((i) => (i.onchange = () => { i.checked ? selected.add(i.value) : selected.delete(i.value); renderSel(); }));
  };
  dr.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => {
    const skipped = GROUPS[b.dataset.g][1].filter((c) => taken.has(c));
    GROUPS[b.dataset.g][1].forEach((c) => { if (!taken.has(c)) selected.add(c); });
    if (skipped.length) toast(`已跳过其他规则中的：${skipped.map(cname).join('、')}`);
    renderSel(); renderList();
  }));
  ps.oninput = renderList;
  renderSel(); renderList();
  (isNew ? ps : dr.querySelector('#r-u')).focus();

  dr.onsubmit = async (e) => {
    e.preventDefault();
    const err = dr.querySelector('.err');
    if (!selected.size) { err.textContent = '请至少选择一个国家 / 地区'; return; }
    let url = dr.querySelector('#r-u').value.trim();
    if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
    const btn = dr.querySelector('.df .primary'); btn.disabled = true;
    try {
      await api(`/links/${link.id}/targets${isNew ? '' : '/' + rule.id}`, {
        method: isNew ? 'POST' : 'PUT', body: { countries: [...selected], url, note: dr.querySelector('#r-n').value, fallback: dr.querySelector('#r-fb').checked },
      });
      close(); toast(isNew ? '规则已添加' : '规则已保存');
      route();
    } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
  };
}

// ---------------------------------------------------------------- 设置（修改密码 / 两步验证）
async function renderSettings(token) {
  const head = `<header class="ph"><div><div class="kicker">设置</div><h1>账号与安全</h1><div class="sub">管理后台登录密码、两步验证和来源追踪</div></div></header>`;
  shell('settings', `${head}<div class="acc">${skel(76, 3)}</div>`);
  const [mfa, trk] = await Promise.all([api('/2fa'), api('/tracking')]);
  if (token !== routeToken) return;
  const item = (id, icon, cls, title, sub, status, body) => `
    <section class="card rv fold acc-i" data-acc="${id}">
      <button type="button" class="card-h fold-h" aria-expanded="false">
        <span class="chi ${cls}">${ic(icon, 17)}</span>
        <div class="acc-t"><h3>${title}</h3><span class="sub">${sub}</span></div>
        <span class="sp"></span><span class="acc-s" data-st="${id}">${status}</span>${ic('chev', 16)}</button>
      <div class="fold-b"><div class="card-b" id="acc-${id}">${body}</div></div>
    </section>`;
  const pill = (on) => `<span class="pill ${on ? 'on' : 'off'}">${on ? '已开启' : '未开启'}</span>`;
  document.getElementById('page').innerHTML = `${head}
    <div class="acc">
      ${item('pw', 'key', 'pw', '修改密码', '修改后，其他设备上的登录会自动退出', '', `
        <form class="set-form" id="pwf">
          ${passwordFields('')}
          <div class="err" style="margin:4px 0 12px" role="alert"></div>
          <button class="btn primary">保存新密码</button>
        </form>`)}
      ${item('mfa', 'shield', 'mfa', '两步验证', '登录时还需要输入手机验证器上的 6 位动态码', pill(mfa.enabled), `
        <p class="set-p">${mfa.enabled
          ? `开启于 ${fmtTime(mfa.since)}。登录时除了密码，还需要输入手机验证器 App 上的 6 位动态码。`
          : '开启后，登录时除了密码，还需要输入手机验证器 App 上的 6 位动态码。即使密码泄露，别人也登不进后台、改不了跳转地址。'}</p>
        <ul class="set-list">
          <li>${ic('check', 14)}支持 Google Authenticator、Microsoft Authenticator、1Password 等</li>
          <li>${ic('check', 14)}动态码连续输错 5 次锁定 15 分钟</li>
          <li>${ic('check', 14)}手机丢失可在 Cloudflare 账号下用命令关闭（见 README）</li>
        </ul>
        <button class="btn ${mfa.enabled ? 'danger' : 'primary'}" id="mfa-btn">${ic('shield', 15)}${mfa.enabled ? '关闭两步验证' : '开启两步验证'}</button>`)}
      ${item('trk', 'search', 'trk', '来源追踪', '识别访客从哪个搜索引擎进入推广页', pill(trk.enabled), '')}
    </div>`;
  const page = document.getElementById('page');
  reveal(page);

  // 风琴：同一时间只展开一项，记住上次展开的
  const items = [...page.querySelectorAll('.acc-i')];
  const open = (id) => {
    items.forEach((el) => {
      const on = el.dataset.acc === id && !el.classList.contains('open');
      el.classList.toggle('open', on);
      el.querySelector('.fold-h').setAttribute('aria-expanded', on);
    });
    store.set('set:open', page.querySelector('.acc-i.open')?.dataset.acc || '');
  };
  items.forEach((el) => (el.querySelector('.fold-h').onclick = () => open(el.dataset.acc)));
  const last = store.get('set:open', '');
  if (last) open(last);

  const pwf = document.getElementById('pwf');
  bindPasswordForm(pwf, '', () => { pwf.reset(); pwf.querySelector('.pwm').dataset.n = ''; pwf.querySelector('#p-tip').textContent = '至少 8 位，建议混合字母、数字和符号'; pwf.querySelector('button.primary').disabled = false; });
  document.getElementById('mfa-btn').onclick = () => openMfaDialog(() => route());
  renderTracking(document.getElementById('acc-trk'), trk, (on) => { page.querySelector('[data-st="trk"]').innerHTML = pill(on); });
}

// 来源追踪：推广页上放一段代码，把访客来自的搜索引擎带到短链的 utm_source 上
function renderTracking(box, t, onState) {
  const tab = store.get('trk:tab', 0);
  const snippet = [t.script, t.code];
  box.innerHTML = `
    <div class="trk">
      <label class="opt trk-sw"><div class="tx"><b>开启来源追踪</b>
        <span class="hint">关闭后，Script 链接不再生效；已粘贴到页面的完整代码不受影响。</span></div>
        <span class="switch"><input type="checkbox" id="trk-on" ${t.enabled ? 'checked' : ''}><span class="t"></span></span></label>
      <div class="trk-flow"><span>${ic('search', 14)}Google / 百度…</span>${ic('arrow', 14)}<span>${ic('globe', 14)}你的推广页</span>${ic('arrow', 14)}<span class="hl">${ic('link', 14)}${esc(HOST)}/xxx<b>?utm_source=google</b></span></div>
      <ul class="set-list">
        <li>${ic('check', 14)}识别 Google、Bing、百度、搜狗、360、神马等搜索引擎，以及 Google / Bing 广告点击</li>
        <li>${ic('check', 14)}只给指向 ${esc(HOST)} 的链接加 <code>utm_source</code>，不改动已有的 <code>src</code> 和 <code>utm_source</code></li>
        <li>${ic('check', 14)}记住访客的首次来源，在站内翻几页后再点短链也不会丢</li>
        <li>${ic('check', 14)}在短链详情页“来源 · utm_source”查看；链接没有 <code>src</code> 时也会直接计入“来源”</li>
      </ul>
      ${t.enabled ? `
      <div class="trk-code">
        <div class="trk-h"><div class="tabs" id="trk-tabs">${['Script 链接（推荐）', '完整代码'].map((l, i) => `<button type="button" class="${i === tab ? 'on' : ''}">${l}</button>`).join('')}</div>
          <span class="sp"></span>${copyBtn(snippet[tab], 'btn sm', '复制代码')}</div>
        <pre class="code">${esc(snippet[tab])}</pre>
        <div class="hint">${tab === 0 ? '放到推广页的 &lt;head&gt; 或 &lt;/body&gt; 前。以后升级识别规则，页面不用改。' : '直接粘贴到推广页里，不依赖短链服务加载脚本。'}</div>
      </div>` : `<div class="trk-off">${ic('info', 15)}开启后显示安装代码。</div>`}
    </div>`;
  box.querySelector('#trk-on').onchange = async (e) => {
    try {
      const d = await api('/tracking', { method: 'PUT', body: { enabled: e.target.checked } });
      toast(d.enabled ? '来源追踪已开启' : '来源追踪已关闭');
      onState?.(d.enabled);
      renderTracking(box, d, onState);
    } catch (err) { e.target.checked = !e.target.checked; toast(err.message, 'bad'); }
  };
  box.querySelectorAll('#trk-tabs button').forEach((b, i) => (b.onclick = () => { store.set('trk:tab', i); renderTracking(box, t, onState); }));
}

// ---------------------------------------------------------------- 通知
async function renderNotify(token) {
  const head = `<header class="ph"><div><div class="kicker">设置</div><h1>统计通知</h1><div class="sub">定期把访问统计推送到 Telegram 或邮箱</div></div></header>`;
  shell('notify', `${head}<div class="stack">${skel(160)}<div class="grid2">${skel(170, 2)}</div></div>`);
  let st = await api('/notify');
  if (token !== routeToken) return;
  const hours = Array.from({ length: 24 }, (_, i) => i);
  const tzLabel = (m) => `UTC${m >= 0 ? '+' : '−'}${Math.floor(Math.abs(m) / 60)}${Math.abs(m) % 60 ? ':' + pad(Math.abs(m) % 60) : ''}`;

  document.getElementById('page').innerHTML = `${head}
    <div class="stack" id="nf">
      <div id="nstat"></div>
      <section class="card rv">
        <div class="card-h"><h3>推送内容</h3><span class="sub">报告包含访问次数、独立访客、与上一周期对比、热门短链、来源与国家</span></div>
        <div class="card-b">
          <div class="kinds">
            ${[['daily', '日报', '每天发送昨天的数据'], ['weekly', '周报', '每周一发送上周的数据'], ['monthly', '月报', '每月 1 号发送上个月的数据']].map(([k, t, d]) => `
              <label class="kind"><input type="checkbox" name="r-${k}" ${st.reports[k] ? 'checked' : ''}><span class="kb">${ic('check', 13)}</span><div><b>${t}</b><span>${d}</span></div></label>`).join('')}
          </div>
          <div class="when">
            <label>发送时间</label><div class="combo" id="n-hour"></div>
            <span class="hint">时区 ${tzLabel(TZ)}（跟随当前浏览器）</span>
            <span class="sp" style="flex:1"></span>
            <span class="hint">预览报告：</span>
            ${['daily', 'weekly', 'monthly'].map((k, i) => `<a class="btn sm ghost" href="/api/notify/preview?kind=${k}" target="_blank" rel="noopener">${['日报', '周报', '月报'][i]}</a>`).join('')}
          </div>
        </div>
      </section>
      <div class="sec-row rv"><h2 class="sec-t">推送渠道</h2><span class="hint">参数只需配置一次，之后用开关控制是否推送</span></div>
      <div class="grid2" id="chans"></div>
    </div>`;
  const page = document.getElementById('page');
  reveal(page);

  // 推送内容：改动后自动保存
  const hourLabel = (x) => `每天 ${pad(x)}:00`;
  let saveTimer;
  const autoSave = () => {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => { try { await persist(); toast('已保存'); } catch (ex) { toast(ex.message, 'bad'); } }, 300);
  };
  const hourBox = dropdown(document.getElementById('n-hour'), {
    value: st.hour, aria: '发送时间', minWidth: 188, maxWidth: 220,
    groups: () => [['', hours]],
    button: (x) => `<span class="nm">${hourLabel(x)}</span>`,
    option: (x) => `<span class="ot">${hourLabel(x)}</span><span class="hint">${x < 6 ? '凌晨' : x < 12 ? '上午' : x < 13 ? '中午' : x < 18 ? '下午' : '晚上'}</span>`,
    onChange: autoSave,
  });
  page.querySelectorAll('.kind input').forEach((i) => (i.onchange = autoSave));

  // 保存整份配置（渠道参数取自 st，密钥为掩码时服务端保留原值）
  const persist = async (patch = {}) => {
    const body = {
      reports: Object.fromEntries(['daily', 'weekly', 'monthly'].map((k) => [k, page.querySelector(`[name=r-${k}]`).checked])),
      hour: hourBox.value, tz: TZ,
      tg: { ...st.tg, ...(patch.tg || {}) },
      email: { ...st.email, ...(patch.email || {}) },
    };
    st = await api('/notify', { method: 'PUT', body });
    renderChannels();
    return st;
  };

  const ready = (k) => k === 'tg' ? !!(st.tg.token && st.tg.chat)
    : !!(st.email.from && st.email.to && (st.email.provider === 'cloudflare' ? st.cloudflareEmail : st.email.key));
  const maskMail = (v) => v.split(/[\s,，;；]+/).filter(Boolean).map((a) => a.replace(/^(.{3}).*(@.*)$/, '$1***$2')).join('、');

  const renderStatus = () => {
    document.getElementById('nstat').innerHTML = st.status ? `<div class="nstat ${st.status.ok ? 'ok' : 'bad'}">${ic(st.status.ok ? 'check' : 'alert', 15)}
      上次推送：${fmtTime(st.status.at)} · ${{ daily: '日报', weekly: '周报', monthly: '月报' }[st.status.kind] || ''}${st.status.ok ? ' · 发送成功' : ` · 失败：${esc(st.status.error)}`}</div>` : '';
  };

  function renderChannels() {
    renderStatus();
    const card = (k) => {
      const on = k === 'tg' ? st.tg.enabled : st.email.enabled, ok = ready(k);
      const pill = !ok ? '<span class="pill off">未配置</span>' : on ? '<span class="pill on">已启用</span>' : '<span class="pill off">已停用</span>';
      const sum = k === 'tg'
        ? (ok ? `<span>Bot Token ${esc(st.tg.token)}</span><span>Chat ID <code>${esc(st.tg.chat)}</code></span>` : '<span>填写 Bot Token 和 Chat ID 后即可推送到个人或群组</span>')
        : (ok ? `<span>发送到 ${esc(maskMail(st.email.to))}</span><span>${st.email.provider === 'cloudflare' ? 'Cloudflare 邮件路由' : 'Resend'} · ${esc(st.email.from)}</span>`
          : '<span>通过 Resend 或 Cloudflare 邮件路由发送 HTML 报告</span>');
      return `<section class="card chcard ${on && ok ? 'is-on' : ''}">
        <div class="chtop"><span class="chi ${k === 'tg' ? 'tg' : 'mail'}">${ic(k === 'tg' ? 'send' : 'mail', 18)}</span>
          <div class="chname"><b>${k === 'tg' ? 'Telegram' : '邮件'}</b>${pill}</div>
          <label class="switch" title="${ok ? '启用 / 停用推送' : '先完成配置'}"><input type="checkbox" data-on="${k}" ${on && ok ? 'checked' : ''}><span class="t"></span></label></div>
        <div class="chsum">${sum}</div>
        <div class="chact">
          <button type="button" class="btn sm" data-cfg="${k}">${ic('gear', 14)}${ok ? '修改配置' : '去配置'}</button>
          <button type="button" class="btn sm ghost" data-test="${k}" ${ok ? '' : 'disabled'}>${ic('send', 14)}发送测试</button>
          <span class="hint" data-res="${k}"></span>
        </div>
      </section>`;
    };
    const box = document.getElementById('chans');
    box.innerHTML = card('tg') + card('email');
    box.querySelectorAll('[data-on]').forEach((i) => (i.onchange = async () => {
      const k = i.dataset.on;
      if (!ready(k)) { i.checked = false; return openChannel(k); }
      try {
        await persist({ [k]: { enabled: i.checked } });
        toast(i.checked ? '已启用推送' : '已停用推送');
      } catch (ex) { i.checked = !i.checked; toast(ex.message, 'bad'); }
    }));
    box.querySelectorAll('[data-cfg]').forEach((b) => (b.onclick = () => openChannel(b.dataset.cfg)));
    box.querySelectorAll('[data-test]').forEach((b) => (b.onclick = () => sendTest(b.dataset.test, box.querySelector(`[data-res="${b.dataset.test}"]`), b)));
  }

  const sendTest = async (k, res, btn) => {
    btn.disabled = true; res.className = 'hint'; res.textContent = '正在发送…';
    try {
      await api('/notify/test', { method: 'POST', body: { channel: k === 'tg' ? 'tg' : 'email', kind: 'daily' } });
      res.className = 'hint ok'; res.textContent = '已发送，请查收（标题带“测试”）';
    } catch (ex) { res.className = 'hint bad'; res.textContent = ex.message; }
    btn.disabled = false;
  };

  // 渠道配置面板
  function openChannel(k) {
    const isTg = k === 'tg';
    let provider = st.email.provider === 'cloudflare' ? 'cloudflare' : 'resend';
    const ov = document.createElement('div'); ov.className = 'ov';
    const dr = document.createElement('form'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-modal', 'true');
    dr.innerHTML = `
      <div class="dh"><span class="chi ${isTg ? 'tg' : 'mail'}" style="margin-right:10px">${ic(isTg ? 'send' : 'mail', 17)}</span><h2>${isTg ? 'Telegram 配置' : '邮件配置'}</h2>
        <button type="button" class="btn ghost icon" data-close aria-label="关闭">${ic('x')}</button></div>
      <div class="db">${isTg ? `
        <div class="field"><label for="tg-token">Bot Token</label><input class="input mono" id="tg-token" placeholder="123456789:AAH…" value="${esc(st.tg.token)}" autocomplete="off" spellcheck="false">
          <div class="hint">已保存的 Token 只显示末 4 位，不修改就保持原值</div></div>
        <div class="field"><label for="tg-chat">Chat ID</label><input class="input mono" id="tg-chat" placeholder="例如 123456789 或 -100…" value="${esc(st.tg.chat)}" autocomplete="off"></div>
        <div class="tipbox">${ic('info', 16)}<div><b>如何获取？</b>
          1. 在 Telegram 里找 <b style="display:inline">@BotFather</b>，发送 <code>/newbot</code> 创建机器人，得到 Bot Token。<br>
          2. 给机器人发一条任意消息（推送到群组的话，把机器人拉进群并在群里发一条消息）。<br>
          3. 打开 <code>https://api.telegram.org/bot&lt;Token&gt;/getUpdates</code>，返回内容里 <code>"chat":{"id":…}</code> 的数字就是 Chat ID。</div></div>` : `
        <div class="field"><label>发送方式</label>
          <div class="seg" id="prov"><button type="button" data-p="resend">Resend</button><button type="button" data-p="cloudflare">Cloudflare 邮件路由</button></div>
          <div class="hint" data-for="resend" style="margin-top:8px">在 <a href="https://resend.com" target="_blank" rel="noopener" style="color:var(--accent-ink)">resend.com</a> 验证发件域名并创建 API Key，免费额度每月 3000 封。</div>
          <div class="hint" data-for="cloudflare" style="margin-top:8px">${st.cloudflareEmail
            ? '发件人需是已开通邮件路由的域名下的地址；收件人需在 Cloudflare 邮件路由中验证过。'
            : '<span class="warn">当前部署没有配置 <code>send_email</code> 绑定，暂时无法使用，见 README。</span>'}</div></div>
        <div class="field" data-for="resend"><label for="m-key">API Key</label><input class="input mono" id="m-key" placeholder="re_…" value="${esc(st.email.key)}" autocomplete="off" spellcheck="false">
          <div class="hint">已保存的 Key 只显示末 4 位，不修改就保持原值</div></div>
        <div class="field"><label for="m-from">发件人</label><input class="input" id="m-from" placeholder="cligc 报告 &lt;report@example.com&gt;" value="${esc(st.email.from)}"></div>
        <div class="field"><label for="m-to">收件人</label><input class="input" id="m-to" placeholder="you@example.com，多个用逗号分隔" value="${esc(st.email.to)}"></div>`}
        <label class="opt"><div class="tx"><b>启用推送</b><span class="hint">关闭后保留配置，只是不再发送</span></div>
          <span class="switch"><input type="checkbox" id="ch-on" ${(isTg ? st.tg.enabled : st.email.enabled) || !ready(k) ? 'checked' : ''}><span class="t"></span></span></label>
        <div class="err" role="alert"></div>
      </div>
      <div class="df">
        <button type="button" class="btn" data-test2>${ic('send', 14)}保存并测试</button>
        <span class="sp"></span>
        <button type="button" class="btn" data-close>取消</button>
        <button class="btn primary">保存</button>
      </div>`;
    const close = () => { ov.remove(); dr.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = (e) => { if (e.key === 'Escape' && !document.querySelector('.pop')) close(); };
    document.addEventListener('keydown', onKey);
    ov.onclick = close;
    dr.querySelectorAll('[data-close]').forEach((b) => (b.onclick = close));
    document.body.append(ov, dr);
    if (!isTg) {
      const prov = dr.querySelector('#prov');
      const sync = () => {
        prov.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.p === provider));
        dr.querySelectorAll('[data-for]').forEach((el) => { el.hidden = el.dataset.for !== provider; });
        segThumb(prov);
      };
      prov.querySelectorAll('button').forEach((b) => (b.onclick = () => { provider = b.dataset.p; sync(); }));
      sync();
    }
    dr.querySelector('input').focus();
    const err = dr.querySelector('.err');
    const save = async () => {
      const enabled = dr.querySelector('#ch-on').checked;
      const patch = isTg
        ? { tg: { enabled, token: dr.querySelector('#tg-token').value, chat: dr.querySelector('#tg-chat').value } }
        : { email: { enabled, provider, key: dr.querySelector('#m-key').value, from: dr.querySelector('#m-from').value, to: dr.querySelector('#m-to').value } };
      await persist(patch);
    };
    dr.onsubmit = async (e) => {
      e.preventDefault();
      const b = dr.querySelector('.df .primary'); b.disabled = true;
      try { await save(); close(); toast('配置已保存'); } catch (ex) { err.textContent = ex.message; b.disabled = false; }
    };
    dr.querySelector('[data-test2]').onclick = async () => {
      const b = dr.querySelector('[data-test2]'); b.disabled = true; err.textContent = '';
      try {
        await save();
        await api('/notify/test', { method: 'POST', body: { channel: isTg ? 'tg' : 'email', kind: 'daily' } });
        close(); toast('配置已保存，测试报告已发送');
      } catch (ex) { err.textContent = ex.message; b.disabled = false; }
    };
  }

  renderChannels();
}

// ---------------------------------------------------------------- router
let routeToken = 0, lastLinkId = null;
async function route() {
  const token = ++routeToken;
  clearInterval(liveTimer);
  document.querySelectorAll('.pop').forEach((p) => p.remove());
  const h = location.hash || '#/';
  try {
    const m = h.match(/^#\/link\/(\d+)/);
    if (m) {
      if (lastLinkId !== m[1]) { clickState.page = 1; lastLinkId = m[1]; }
      return await renderLink(token, m[1]);
    }
    lastLinkId = null;
    if (h.startsWith('#/notify')) return await renderNotify(token);
    if (h.startsWith('#/settings')) return await renderSettings(token);
    if (h.startsWith('#/links')) {
      const openNew = h.includes('?new');
      if (openNew) history.replaceState(null, '', '#/links');
      return await renderLinks(token, { openNew });
    }
    return await renderHome(token);
  } catch (err) {
    if (err.message !== 'unauthorized') { console.error(err); toast('加载失败：' + err.message, 'bad'); }
  }
}

// 相对时间每分钟刷新一次
setInterval(() => document.querySelectorAll('time[data-ts]').forEach((t) => { t.textContent = ago(Number(t.dataset.ts)); }), 60000);
// 窗口尺寸变化时，分段控件滑块重新定位
addEventListener('resize', () => document.querySelectorAll('.seg').forEach(segThumb));

// 手机端：向下滚动隐藏顶栏，向上滚动出现
{
  let lastY = scrollY, ticking = false;
  addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => {
      ticking = false;
      const side = document.querySelector('.side');
      if (!side || innerWidth > 900) return;
      const y = Math.max(0, scrollY), dy = y - lastY;
      if (y < 64 || document.querySelector('.menu, .drawer, .dialog')) side.classList.remove('hide');
      else if (dy > 6) side.classList.add('hide');
      else if (dy < -6) side.classList.remove('hide');
      side.classList.toggle('stuck', y > 4);
      if (Math.abs(dy) > 6 || y < 64) lastY = y;
    });
  }, { passive: true });
}

// 列表页的 "/" 快捷键聚焦搜索
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName) && document.getElementById('q')) {
    e.preventDefault(); document.getElementById('q').focus();
  }
});

window.addEventListener('hashchange', route);
api('/me').then((d) => (d.mustChange ? renderSetPassword() : route())).catch(() => {});
