# 同步上游新版本：把 ccvar/cligc_link 最新发布的版本合并进你自己的仓库，Cloudflare 会自动重新部署。
# 适用于用“Deploy to Cloudflare”按钮部署的仓库（或自己 fork 的仓库）。
# 在仓库的 Actions 页面选“同步上游新版本”→ Run workflow 手动运行。
# 想每周自动升级，把下面 schedule 那两行前面的 # 去掉（自动部署的新代码能访问你保存的 Google / Bing 凭据，默认不开）。
# 你在 wrangler.toml 里的 Worker 名称、域名、D1 数据库、[vars] 会保留。
name: 同步上游新版本

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: write

jobs:
  sync:
    # 上游仓库自己不运行
    if: github.repository != 'ccvar/cligc_link'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 升级到最新版本
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/upgrade.mjs --ci
